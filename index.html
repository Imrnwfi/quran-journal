function juzForPage(page) {
  let j = 1;
  for (let i = 0; i < JUZ_START_PAGES.length; i++) {
    if (page >= JUZ_START_PAGES[i]) j = i + 1;
  }
  return j;
}

function todayStr() {
  return new Date().toISOString().slice(0, 10);
}

function fmtDate(iso) {
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });

function loadEntries() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : SEED_ENTRIES;
  } catch (e) {
    return SEED_ENTRIES;
  }
}

function saveEntries(entries) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
    return true;
  } catch (e) {
    return false;
  }
}

const KHATAM_KEY = "quran-journal-khatams";

function loadKhatams() {
  try {
    const raw = localStorage.getItem(KHATAM_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
}

function saveKhatams(list) {
  try {
    localStorage.setItem(KHATAM_KEY, JSON.stringify(list));
    return true;
  } catch (e) {
    return false;
  }
}

function fmtLongDate(iso) {
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short", year: "numeric" });
}

// Khatams in the order they happened (oldest first).
function sortKhatams(list) {
  return [...list].sort((a, b) => (a.date === b.date ? a.ts - b.ts : a.date.localeCompare(b.date)));
}

// An entry belongs to the current round if it was logged after the latest khatam.
function isAfterKhatam(entry, k) {
  if (!k) return true;
  if (entry.date !== k.date) return entry.date > k.date;
  return entry.ts > k.ts;
}

function QuranTracker() {
  const [entries, setEntries] = useState(() => loadEntries());
  const [saveError, setSaveError] = useState("");
  const [page, setPage] = useState("");
  const [note, setNote] = useState("");
  const [date, setDate] = useState(todayStr());
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);
  const [khatams, setKhatams] = useState(() => loadKhatams());
  const [showKhatamForm, setShowKhatamForm] = useState(false);
  const [khatamDate, setKhatamDate] = useState(todayStr());
  const [khatamNote, setKhatamNote] = useState("");
  const [confirmKhatamId, setConfirmKhatamId] = useState(null);
  const [khatamFlash, setKhatamFlash] = useState("");

  function persist(next) {
    setEntries(next);
    const ok = saveEntries(next);
    setSaveError(ok ? "" : "Couldn't save — your browser storage may be full or disabled.");
  }

  function persistKhatams(next) {
    setKhatams(next);
    const ok = saveKhatams(next);
    setSaveError(ok ? "" : "Couldn't save — your browser storage may be full or disabled.");
  }

  function addKhatam(kDate, kNote, ts) {
    const k = {
      id: `k-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
      date: kDate,
      note: (kNote || "").trim(),
      ts,
    };
    const next = [...khatams, k];
    persistKhatams(next);
    const n = sortKhatams(next).findIndex((x) => x.id === k.id) + 1;
    setKhatamFlash(`Alhamdulillah — khatam #${n} recorded for ${fmtLongDate(kDate)}.`);
  }

  function submitKhatam(e) {
    e.preventDefault();
    if (!khatamDate) return;
    addKhatam(khatamDate, khatamNote, Date.now());
    setKhatamNote("");
    setShowKhatamForm(false);
  }

  function deleteKhatam(id) {
    persistKhatams(khatams.filter((k) => k.id !== id));
    setConfirmKhatamId(null);
    setKhatamFlash("");
  }

  function addEntry(e) {
    e.preventDefault();
    const p = parseInt(page, 10);
    if (!p || p < 1 || p > TOTAL_PAGES) return;
    const entry = {
      id: `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
      page: p,
      note: note.trim(),
      date,
      ts: Date.now(),
    };
    persist([entry, ...entries]);
    if (p === TOTAL_PAGES) addKhatam(date, "", entry.ts + 1);
    setPage("");
    setNote("");
  }

  function deleteEntry(id) {
    persist(entries.filter((en) => en.id !== id));
    setConfirmDeleteId(null);
  }

  const sorted = useMemo(
    () => [...entries].sort((a, b) => (a.date === b.date ? b.ts - a.ts : b.date.localeCompare(a.date))),
    [entries]
  );

  const grouped = useMemo(() => {
    const map = new Map();
    for (const en of sorted) {
      if (!map.has(en.date)) map.set(en.date, []);
      map.get(en.date).push(en);
    }
    return [...map.entries()];
  }, [sorted]);

  const khatamsAsc = useMemo(() => sortKhatams(khatams), [khatams]);
  const khatamCount = khatamsAsc.length;
  const lastKhatam = khatamsAsc[khatamCount - 1] || null;
  const roundEntries = useMemo(
    () => entries.filter((en) => isAfterKhatam(en, lastKhatam)),
    [entries, lastKhatam]
  );

  const uniquePages = useMemo(() => new Set(roundEntries.map((e) => e.page)).size, [roundEntries]);
  const progressPct = Math.min(100, Math.round((uniquePages / TOTAL_PAGES) * 100));
  const lastEntry = sorted[0] || null;
  const currentJuz = lastEntry ? juzForPage(lastEntry.page) : 0;
  const reachedJuz = useMemo(() => {
    const s = new Set();
    for (const en of roundEntries) s.add(juzForPage(en.page));
    return s;
  }, [roundEntries]);

  const streak = useMemo(() => {
    const days = new Set(entries.map((e) => e.date));
    let count = 0;
    let cursor = new Date();
    if (!days.has(todayStr())) cursor.setDate(cursor.getDate() - 1);
    while (true) {
      const iso = cursor.toISOString().slice(0, 10);
      if (days.has(iso)) {
        count++;
        cursor.setDate(cursor.getDate() - 1);
      } else break;
    }
    return count;
  }, [entries]);

  return (
    <div style={styles.page}>
      <div style={styles.bgPattern} />
      <div style={styles.container}>
        <header style={styles.header}>
          <div style={styles.eyebrow}>وِرْد القُرْآن</div>
          <h1 style={styles.title}>Qur'an Reading Journal</h1>
          <p style={styles.subtitle}>Mark your page, keep your rhythm.</p>
        </header>

        <div style={styles.mihrabWrap}>
          <div style={styles.mihrab}>
            <div style={styles.mihrabInner}>
              {lastEntry ? (
                <>
                  <div style={styles.mihrabLabel}>Last read</div>
                  <div style={styles.mihrabPage}><span style={styles.mono}>p. {lastEntry.page}</span></div>
                  <div style={styles.mihrabMeta}>Juz' {currentJuz} · {fmtDate(lastEntry.date)}</div>
                </>
              ) : (
                <>
                  <div style={styles.mihrabLabel}>No entries yet</div>
                  <div style={styles.mihrabMeta}>Log today's page below to begin</div>
                </>
              )}
              <div style={styles.streakRow}>
                <div style={styles.streakChip}><span style={styles.mono}>{streak}</span> day{streak === 1 ? "" : "s"} streak</div>
                <div style={styles.streakChip}><span style={styles.mono}>{uniquePages}</span>/{TOTAL_PAGES} pages</div>
                <div style={styles.streakChip}><span style={styles.mono}>{khatamCount}</span>× khatam</div>
              </div>
            </div>
          </div>
        </div>

        <div style={styles.progressSection}>
          <div style={styles.progressTrack}>
            <div style={{ ...styles.progressFill, width: `${progressPct}%` }} />
          </div>
          <div style={styles.progressLabel}>
            {progressPct}% through the Mushaf{khatamCount > 0 ? ` · round ${khatamCount + 1}` : ""}
          </div>
        </div>

        <div style={styles.juzGrid}>
          {JUZ_START_PAGES.map((_, i) => {
            const num = i + 1;
            const reached = reachedJuz.has(num);
            return (
              <div key={num} title={`Juz' ${num}`} style={{ ...styles.juzMark, ...(reached ? styles.juzMarkFilled : {}) }}>
                <span style={{ ...styles.mono, fontSize: 10 }}>{num}</span>
              </div>
            );
          })}
        </div>

        <form onSubmit={addEntry} style={styles.form}>
          <h2 style={styles.formTitle}>Log today's reading</h2>
          <div style={styles.formRow}>
            <label style={styles.label}>
              Page
              <input className="qt-input" type="number" min="1" max={TOTAL_PAGES} value={page}
                onChange={(e) => setPage(e.target.value)} placeholder="1–604" style={styles.input} required />
            </label>
            <label style={styles.label}>
              Date
              <input className="qt-input" type="date" value={date}
                onChange={(e) => setDate(e.target.value)} style={styles.input} max={todayStr()} required />
            </label>
          </div>
          <label style={styles.label}>
            Note <span style={{ fontWeight: 400, opacity: 0.6 }}>(optional)</span>
            <textarea className="qt-textarea" value={note} onChange={(e) => setNote(e.target.value)}
              placeholder="A reflection, a verse that struck you, how it felt…" style={styles.textarea} rows={2} />
          </label>
          <button className="qt-btn" type="submit" style={styles.submitBtn}>Save entry</button>
          {saveError && <div style={styles.errorText}>{saveError}</div>}
        </form>

        <section style={styles.form}>
          <div style={styles.khatamHead}>
            <h2 style={{ ...styles.formTitle, marginBottom: 0 }}>Khatam</h2>
            <div style={styles.khatamCount}>
              <span style={styles.khatamNum}>{khatamCount}</span>
              <span style={styles.khatamCountLabel}>{khatamCount === 1 ? "time" : "times"}</span>
            </div>
          </div>

          {khatamFlash && <div className="qt-fade" style={styles.khatamFlash}>{khatamFlash}</div>}

          {khatamCount === 0 ? (
            <div style={{ ...styles.emptyState, padding: "12px 4px" }}>
              No khatam yet. Logging page {TOTAL_PAGES} records one automatically, or add a past khatam below.
            </div>
          ) : (
            <div style={{ marginTop: 12 }}>
              {[...khatamsAsc].reverse().map((k) => {
                const n = khatamsAsc.indexOf(k) + 1;
                return (
                  <div key={k.id} style={styles.khatamRow}>
                    <div style={styles.khatamBadge}><span style={styles.mono}>{n}</span></div>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={styles.khatamDate}>Khatam #{n} · {fmtLongDate(k.date)}</div>
                      {k.note && <div style={styles.entryNote}>{k.note}</div>}
                      {confirmKhatamId === k.id && (
                        <div style={styles.confirmRow}>
                          <span style={{ fontSize: 12, opacity: 0.75 }}>Remove this khatam?</span>
                          <button className="qt-btn" type="button" onClick={() => deleteKhatam(k.id)} style={styles.confirmBtn}>Yes, remove</button>
                          <button className="qt-btn" type="button" onClick={() => setConfirmKhatamId(null)} style={styles.cancelBtn}>Cancel</button>
                        </div>
                      )}
                    </div>
                    {confirmKhatamId !== k.id && (
                      <button className="qt-btn" type="button" onClick={() => setConfirmKhatamId(k.id)}
                        style={{ ...styles.deleteBtn, position: "static" }} aria-label={`Delete khatam ${n}`}>×</button>
                    )}
                  </div>
                );
              })}
            </div>
          )}

          {showKhatamForm ? (
            <form onSubmit={submitKhatam} style={{ marginTop: 14 }}>
              <label style={styles.label}>
                Date completed
                <input className="qt-input" type="date" value={khatamDate} max={todayStr()} required
                  onChange={(e) => setKhatamDate(e.target.value)} style={styles.input} />
              </label>
              <label style={styles.label}>
                Note <span style={{ fontWeight: 400, opacity: 0.6 }}>(optional)</span>
                <input className="qt-input" type="text" value={khatamNote} onChange={(e) => setKhatamNote(e.target.value)}
                  placeholder="e.g. Ramadan 1447" style={{ ...styles.input, fontFamily: "'Lora', serif" }} />
              </label>
              <div style={{ display: "flex", gap: 8 }}>
                <button className="qt-btn" type="submit" style={{ ...styles.submitBtn, flex: 1 }}>Save khatam</button>
                <button className="qt-btn" type="button" onClick={() => setShowKhatamForm(false)} style={{ ...styles.cancelBtn, padding: "0 14px", fontSize: 13.5 }}>Cancel</button>
              </div>
            </form>
          ) : (
            <button className="qt-btn" type="button" onClick={() => { setShowKhatamForm(true); setKhatamDate(todayStr()); }}
              style={styles.khatamAddBtn}>+ Record a khatam</button>
          )}
        </section>

        <div style={styles.historySection}>
          <h2 style={styles.formTitle}>History</h2>
          {grouped.length === 0 ? (
            <div style={styles.emptyState}>Nothing logged yet. Your first entry will appear here.</div>
          ) : (
            grouped.map(([d, list]) => (
              <div key={d} className="qt-fade" style={styles.dayGroup}>
                <div style={styles.dayHeader}>{fmtDate(d)}</div>
                {list.map((en) => (
                  <div key={en.id} style={styles.entryRow}>
                    <div style={styles.entryPage}>
                      <span style={styles.mono}>p.{en.page}</span>
                      <span style={styles.entryJuz}>Juz' {juzForPage(en.page)}</span>
                    </div>
                    {en.note && <div style={styles.entryNote}>{en.note}</div>}
                    {confirmDeleteId === en.id ? (
                      <div style={styles.confirmRow}>
                        <span style={{ fontSize: 12, opacity: 0.75 }}>Remove this entry?</span>
                        <button className="qt-btn" onClick={() => deleteEntry(en.id)} style={styles.confirmBtn}>Yes, remove</button>
                        <button className="qt-btn" onClick={() => setConfirmDeleteId(null)} style={styles.cancelBtn}>Cancel</button>
                      </div>
                    ) : (
                      <button className="qt-btn" onClick={() => setConfirmDeleteId(en.id)} style={styles.deleteBtn}
                        aria-label={`Delete entry for page ${en.page}`}>×</button>
                    )}
                  </div>
                ))}
              </div>
            ))
          )}
        </div>

        <footer style={styles.footer}>Saved privately in this browser · {TOTAL_PAGES}-page Mushaf reference</footer>
      </div>
    </div>
  );
}
