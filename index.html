function juzForPage(page) {
  let j = 1;
  for (let i = 0; i < JUZ_START_PAGES.length; i++) if (page >= JUZ_START_PAGES[i]) j = i + 1;
  return j;
}
function surahForPage(page) {
  let s = 0;
  for (let i = 0; i < SURAH_START_PAGES.length; i++) if (page >= SURAH_START_PAGES[i]) s = i;
  return SURAH_NAMES[s];
}
function juzRange(j) {
  return [JUZ_START_PAGES[j - 1], j === 30 ? TOTAL_PAGES : JUZ_START_PAGES[j] - 1];
}

/* ---------- Dates (always the device's local calendar day) ---------- */
function isoOf(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function todayStr() { return isoOf(new Date()); }
function parseIso(iso) { return new Date(iso + "T00:00:00"); }
function addDays(iso, n) { const d = parseIso(iso); d.setDate(d.getDate() + n); return isoOf(d); }
function daysBetween(a, b) { return Math.round((parseIso(b) - parseIso(a)) / 86400000); }

function readJson(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) {
    return fallback;
  }
}
function writeJson(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
    return true;
  } catch (e) {
    return false;
  }
}

function sortKhatams(list) {
  return [...list].sort((a, b) => (a.date === b.date ? a.ts - b.ts : a.date.localeCompare(b.date)));
}
function isAfterKhatam(entry, k) {
  if (!k) return true;
  if (entry.date !== k.date) return entry.date > k.date;
  return entry.ts > k.ts;
}
function cmpEntryAsc(a, b) { return a.date === b.date ? a.ts - b.ts : a.date.localeCompare(b.date); }

// Works out which pages each entry covers. An entry with an explicit "from" covers from–to.
// An entry without one continues from the previous entry's last page (bookmark style).
// Each khatam starts a fresh round.
function computeCoverage(entries, khatamsAsc) {
  const asc = [...entries].sort(cmpEntryAsc);
  const spans = {};
  let kIdx = 0;
  let prevEnd = 0;
  for (const en of asc) {
    while (kIdx < khatamsAsc.length && isAfterKhatam(en, khatamsAsc[kIdx])) { kIdx++; prevEnd = 0; }
    let start, end = en.page;
    if (en.from) start = en.from;
    else if (prevEnd + 1 <= en.page) start = prevEnd + 1;
    else start = en.page;
    if (start > end) [start, end] = [end, start];
    spans[en.id] = [start, end];
    prevEnd = Math.max(start, end);
  }
  return spans;
}

function makeId(prefix) { return `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`; }

function validEntry(e) {
  return e && typeof e.id === "string" && Number.isInteger(e.page) && e.page >= 1 && e.page <= TOTAL_PAGES &&
    typeof e.date === "string" && /^\d{4}-\d{2}-\d{2}$/.test(e.date) && typeof e.ts === "number" &&
    (e.from == null || (Number.isInteger(e.from) && e.from >= 1 && e.from <= TOTAL_PAGES));
}
function validKhatam(k) {
  return k && typeof k.id === "string" && typeof k.date === "string" && /^\d{4}-\d{2}-\d{2}$/.test(k.date) && typeof k.ts === "number";
}

/* ---------- App ---------- */
function QuranTracker() {
  const [entries, setEntries] = useState(() => readJson(STORAGE_KEY, SEED_ENTRIES));
  const [khatams, setKhatams] = useState(() => readJson(KHATAM_KEY, []));
  const [settings, setSettings] = useState(() => ({ lang: "ms", targetDate: "", ...readJson(SETTINGS_KEY, {}) }));
  const [saveError, setSaveError] = useState("");
  const T = TEXT[settings.lang] || TEXT.ms;

  // log form
  const [fromPage, setFromPage] = useState("");
  const [page, setPage] = useState("");
  const [note, setNote] = useState("");
  const [date, setDate] = useState(todayStr());
  const [formError, setFormError] = useState("");

  // list state
  const [tab, setTab] = useState("history");
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);
  const [editId, setEditId] = useState(null);
  const [editDraft, setEditDraft] = useState(null);

  // khatam state
  const [showKhatamForm, setShowKhatamForm] = useState(false);
  const [khatamDate, setKhatamDate] = useState(todayStr());
  const [khatamNote, setKhatamNote] = useState("");
  const [confirmKhatamId, setConfirmKhatamId] = useState(null);
  const [editKhatamId, setEditKhatamId] = useState(null);
  const [khatamDraft, setKhatamDraft] = useState(null);
  const [khatamFlash, setKhatamFlash] = useState("");

  // target / settings / backup
  const [editingTarget, setEditingTarget] = useState(false);
  const [targetDraft, setTargetDraft] = useState("");
  const [backupMsg, setBackupMsg] = useState("");
  const [pendingImport, setPendingImport] = useState(null);
  const [installEvt, setInstallEvt] = useState(null);
  const [isStandalone, setIsStandalone] = useState(false);
  const fileRef = useRef(null);

  // Keep "today" right if the page stays open past midnight.
  const [today, setToday] = useState(todayStr());
  useEffect(() => {
    const id = setInterval(() => setToday(todayStr()), 60000);
    return () => clearInterval(id);
  }, []);

  useEffect(() => { document.documentElement.lang = settings.lang; }, [settings.lang]);

  useEffect(() => {
    const onPrompt = (e) => { e.preventDefault(); setInstallEvt(e); };
    window.addEventListener("beforeinstallprompt", onPrompt);
    try {
      setIsStandalone(window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true);
    } catch (e) {}
    return () => window.removeEventListener("beforeinstallprompt", onPrompt);
  }, []);

  function flagSave(ok) { setSaveError(ok ? "" : T.saveErr); }
  function persist(next) { setEntries(next); flagSave(writeJson(STORAGE_KEY, next)); }
  function persistKhatams(next) { setKhatams(next); flagSave(writeJson(KHATAM_KEY, next)); }
  function persistSettings(patch) {
    const next = { ...settings, ...patch };
    setSettings(next);
    flagSave(writeJson(SETTINGS_KEY, next));
  }

  const fmtDate = (iso) => parseIso(iso).toLocaleDateString(T.locale, { weekday: "short", day: "numeric", month: "short" });
  const fmtLong = (iso) => parseIso(iso).toLocaleDateString(T.locale, { weekday: "short", day: "numeric", month: "short", year: "numeric" });

  /* ----- derived ----- */
  const khatamsAsc = useMemo(() => sortKhatams(khatams), [khatams]);
  const khatamCount = khatamsAsc.length;
  const lastKhatam = khatamsAsc[khatamCount - 1] || null;
  const spans = useMemo(() => computeCoverage(entries, khatamsAsc), [entries, khatamsAsc]);

  const sorted = useMemo(() => [...entries].sort((a, b) => -cmpEntryAsc(a, b)), [entries]);
  const grouped = useMemo(() => {
    const map = new Map();
    for (const en of sorted) {
      if (!map.has(en.date)) map.set(en.date, []);
      map.get(en.date).push(en);
    }
    return [...map.entries()];
  }, [sorted]);

  const coveredPages = useMemo(() => {
    const s = new Set();
    for (const en of entries) {
      if (!isAfterKhatam(en, lastKhatam)) continue;
      const [a, b] = spans[en.id] || [en.page, en.page];
      for (let p = a; p <= b; p++) s.add(p);
    }
    return s;
  }, [entries, spans, lastKhatam]);
  const coveredCount = coveredPages.size;
  const progressPct = Math.min(100, Math.round((coveredCount / TOTAL_PAGES) * 100));
  const remaining = TOTAL_PAGES - coveredCount;

  const juzFill = useMemo(() => JUZ_START_PAGES.map((_, i) => {
    const [a, b] = juzRange(i + 1);
    let c = 0;
    for (let p = a; p <= b; p++) if (coveredPages.has(p)) c++;
    return c / (b - a + 1);
  }), [coveredPages]);

  const lastEntry = sorted[0] || null;

  const pagesByDate = useMemo(() => {
    const m = {};
    for (const en of entries) {
      const [a, b] = spans[en.id] || [en.page, en.page];
      m[en.date] = (m[en.date] || 0) + (b - a + 1);
    }
    return m;
  }, [entries, spans]);

  const streak = useMemo(() => {
    const days = new Set(entries.map((e) => e.date));
    let count = 0;
    let cursor = days.has(today) ? today : addDays(today, -1);
    while (days.has(cursor)) { count++; cursor = addDays(cursor, -1); }
    return count;
  }, [entries, today]);

  const pace = useMemo(() => {
    const start = addDays(today, -29);
    let sum = 0;
    for (const [d, n] of Object.entries(pagesByDate)) if (d >= start && d <= today) sum += n;
    return sum / 30;
  }, [pagesByDate, today]);
  const etaIso = pace > 0 && remaining > 0 ? addDays(today, Math.ceil(remaining / pace)) : null;

  const target = settings.targetDate;
  const targetDaysLeft = target ? daysBetween(today, target) + 1 : null;
  const targetNeed = target && targetDaysLeft > 0 ? Math.ceil(remaining / targetDaysLeft) : null;

  const notesList = useMemo(() => sorted.filter((e) => e.note), [sorted]);

  /* ----- actions ----- */
  function addKhatam(kDate, kNote, ts) {
    const k = { id: makeId("k"), date: kDate, note: (kNote || "").trim(), ts };
    const next = [...khatams, k];
    persistKhatams(next);
    const n = sortKhatams(next).findIndex((x) => x.id === k.id) + 1;
    setKhatamFlash(T.flash(n, fmtLong(kDate)));
  }

  function parsePageInput(v) {
    if (v === "" || v == null) return null;
    const n = parseInt(v, 10);
    return Number.isInteger(n) && n >= 1 && n <= TOTAL_PAGES ? n : NaN;
  }

  function addEntry(e) {
    e.preventDefault();
    const to = parsePageInput(page);
    const from = parsePageInput(fromPage);
    if (to == null || Number.isNaN(to) || Number.isNaN(from)) { setFormError(T.invalidPage); return; }
    setFormError("");
    const entry = { id: makeId("e"), page: to, from: from && from !== to ? from : null, note: note.trim(), date, ts: Date.now() };
    persist([entry, ...entries]);
    if (to === TOTAL_PAGES) addKhatam(date, "", entry.ts + 1);
    setPage(""); setFromPage(""); setNote("");
  }

  function deleteEntry(id) {
    persist(entries.filter((en) => en.id !== id));
    setConfirmDeleteId(null);
  }

  function startEdit(en) {
    setConfirmDeleteId(null);
    setEditId(en.id);
    setEditDraft({ from: en.from ? String(en.from) : "", page: String(en.page), date: en.date, note: en.note || "", err: "" });
  }
  function saveEdit(e) {
    e.preventDefault();
    const to = parsePageInput(editDraft.page);
    const from = parsePageInput(editDraft.from);
    if (to == null || Number.isNaN(to) || Number.isNaN(from)) { setEditDraft({ ...editDraft, err: T.invalidPage }); return; }
    persist(entries.map((en) => en.id === editId
      ? { ...en, page: to, from: from && from !== to ? from : null, date: editDraft.date, note: editDraft.note.trim() }
      : en));
    setEditId(null); setEditDraft(null);
  }

  function submitKhatam(e) {
    e.preventDefault();
    if (!khatamDate) return;
    addKhatam(khatamDate, khatamNote, Date.now());
    setKhatamNote("");
    setShowKhatamForm(false);
  }
  function deleteKhatam(id) {
    persistKhatams(khatams.filter((k) => k.id !== id));
    setConfirmKhatamId(null);
    setKhatamFlash("");
  }
  function startEditKhatam(k) {
    setConfirmKhatamId(null);
    setEditKhatamId(k.id);
    setKhatamDraft({ date: k.date, note: k.note || "" });
  }
  function saveEditKhatam(e) {
    e.preventDefault();
    if (!khatamDraft.date) return;
    persistKhatams(khatams.map((k) => k.id === editKhatamId ? { ...k, date: khatamDraft.date, note: khatamDraft.note.trim() } : k));
    setEditKhatamId(null); setKhatamDraft(null); setKhatamFlash("");
  }

  function backupPayload() {
    return { app: "quran-journal", version: 2, exportedAt: new Date().toISOString(), entries, khatams, settings };
  }
  function exportBackup() {
    try {
      const blob = new Blob([JSON.stringify(backupPayload(), null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `quran-journal-backup-${today}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    } catch (e) {
      setBackupMsg(T.copyFail);
    }
  }
  async function copyBackup() {
    try {
      await navigator.clipboard.writeText(JSON.stringify(backupPayload()));
      setBackupMsg(T.copied);
    } catch (e) {
      setBackupMsg(T.copyFail);
    }
  }
  function onImportFile(ev) {
    const file = ev.target.files && ev.target.files[0];
    ev.target.value = "";
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(String(reader.result));
        const list = Array.isArray(data) ? data : data.entries;
        const ks = Array.isArray(data) ? [] : (data.khatams || []);
        if (!Array.isArray(list) || !list.every(validEntry) || !Array.isArray(ks) || !ks.every(validKhatam)) throw new Error("bad");
        setPendingImport({ entries: list, khatams: ks, settings: data.settings || null });
        setBackupMsg("");
      } catch (e) {
        setPendingImport(null);
        setBackupMsg(T.importBad);
      }
    };
    reader.readAsText(file);
  }
  function confirmImport() {
    persist(pendingImport.entries);
    persistKhatams(pendingImport.khatams);
    if (pendingImport.settings) persistSettings({ targetDate: pendingImport.settings.targetDate || "" });
    setPendingImport(null);
    setBackupMsg(T.importOk);
  }
  async function doInstall() {
    if (!installEvt) return;
    try {
      installEvt.prompt();
      const res = await installEvt.userChoice;
      if (res && res.outcome === "accepted") setIsStandalone(true);
    } catch (e) {}
    setInstallEvt(null);
  }

  /* ----- pieces ----- */
  const rangeLabel = (en) => {
    const [a, b] = en.from ? [Math.min(en.from, en.page), Math.max(en.from, en.page)] : [en.page, en.page];
    return a === b ? `p.${b}` : `p.${a}–${b}`;
  };

  function EntryEditor() {
    return (
      <form onSubmit={saveEdit} style={{ marginTop: 2 }}>
        <div style={styles.formRow3}>
          <label style={styles.label}>{T.from}
            <input className="qt-input" type="number" min="1" max={TOTAL_PAGES} value={editDraft.from} placeholder="—"
              onChange={(e) => setEditDraft({ ...editDraft, from: e.target.value })} style={styles.input} />
          </label>
          <label style={styles.label}>{T.to}
            <input className="qt-input" type="number" min="1" max={TOTAL_PAGES} value={editDraft.page} required
              onChange={(e) => setEditDraft({ ...editDraft, page: e.target.value })} style={styles.input} />
          </label>
          <label style={{ ...styles.label, flex: 1.6 }}>{T.date}
            <input className="qt-input" type="date" value={editDraft.date} max={today} required
              onChange={(e) => setEditDraft({ ...editDraft, date: e.target.value })} style={styles.input} />
          </label>
        </div>
        <label style={styles.label}>{T.note}
          <textarea className="qt-textarea" rows={2} value={editDraft.note}
            onChange={(e) => setEditDraft({ ...editDraft, note: e.target.value })} style={styles.textarea} />
        </label>
        {editDraft.err && <div style={{ ...styles.errorText, marginTop: -6, marginBottom: 8 }}>{editDraft.err}</div>}
        <div style={{ display: "flex", gap: 8 }}>
          <button className="qt-btn" type="submit" style={styles.smallPrimary}>{T.save}</button>
          <button className="qt-btn" type="button" onClick={() => { setEditId(null); setEditDraft(null); }} style={styles.cancelBtn}>{T.cancel}</button>
        </div>
      </form>
    );
  }

  function EntryCard({ en, showDate }) {
    if (editId === en.id) return <div style={styles.entryRow}>{EntryEditor()}</div>;
    return (
      <div style={styles.entryRow}>
        <div style={styles.entryPage}>
          <span style={styles.mono}>{rangeLabel(en)}</span>
          <span style={styles.entryJuz}>{surahForPage(en.page)} · Juz' {juzForPage(en.page)}</span>
        </div>
        {showDate && <div style={styles.entryDate}>{fmtLong(en.date)}</div>}
        {en.note && <div style={styles.entryNote}>{en.note}</div>}
        {confirmDeleteId === en.id ? (
          <div style={styles.confirmRow}>
            <span style={{ fontSize: 12, opacity: 0.75 }}>{T.removeEntryQ}</span>
            <button className="qt-btn" onClick={() => deleteEntry(en.id)} style={styles.confirmBtn}>{T.yesRemove}</button>
            <button className="qt-btn" onClick={() => setConfirmDeleteId(null)} style={styles.cancelBtn}>{T.cancel}</button>
          </div>
        ) : (
          <div style={styles.rowActions}>
            <button className="qt-btn" onClick={() => startEdit(en)} style={styles.iconBtn} aria-label={`${T.edit} ${rangeLabel(en)}`} title={T.edit}>✎</button>
            <button className="qt-btn" onClick={() => setConfirmDeleteId(en.id)} style={{ ...styles.iconBtn, color: "#8C3B2E" }}
              aria-label={`${T.del} ${rangeLabel(en)}`} title={T.del}>×</button>
          </div>
        )}
      </div>
    );
  }

  return (
    <div style={styles.page}>
      <div style={styles.bgPattern} />
      <div style={styles.container}>
        <div style={styles.langBar}>
          {["ms", "en"].map((l) => (
            <button key={l} className="qt-btn" onClick={() => persistSettings({ lang: l })}
              style={{ ...styles.langBtn, ...(settings.lang === l ? styles.langBtnOn : {}) }}>{l === "ms" ? "BM" : "EN"}</button>
          ))}
        </div>

        <header style={styles.header}>
          <div style={styles.eyebrow}>وِرْد القُرْآن</div>
          <h1 style={styles.title}>Qur'an Reading Journal</h1>
          <p style={styles.subtitle}>{T.subtitle}</p>
        </header>

        <div style={styles.mihrabWrap}>
          <div style={styles.mihrab}>
            <div style={styles.mihrabInner}>
              {lastEntry ? (
                <>
                  <div style={styles.mihrabLabel}>{T.lastRead}</div>
                  <div style={styles.mihrabPage}><span style={styles.mono}>p. {lastEntry.page}</span></div>
                  <div style={styles.mihrabSurah}>{surahForPage(lastEntry.page)}</div>
                  <div style={styles.mihrabMeta}>Juz' {juzForPage(lastEntry.page)} · {fmtDate(lastEntry.date)}</div>
                </>
              ) : (
                <>
                  <div style={styles.mihrabLabel}>{T.noEntries}</div>
                  <div style={styles.mihrabMeta}>{T.startHint}</div>
                </>
              )}
              <div style={styles.streakRow}>
                <div style={styles.streakChip}><span style={styles.mono}>{streak}</span> {T.streak(streak)}</div>
                <div style={styles.streakChip}><span style={styles.mono}>{coveredCount}</span>/{TOTAL_PAGES} {T.pages}</div>
                <div style={styles.streakChip}><span style={styles.mono}>{khatamCount}</span>{T.khatamChip}</div>
              </div>
            </div>
          </div>
        </div>

        <div style={styles.progressSection}>
          <div style={styles.progressTrack}>
            <div style={{ ...styles.progressFill, width: `${progressPct}%` }} />
          </div>
          <div style={styles.progressLabel}>
            {T.through(progressPct)}{khatamCount > 0 ? ` · ${T.round(khatamCount + 1)}` : ""}
          </div>
        </div>

        <div style={styles.juzGrid}>
          {juzFill.map((f, i) => {
            const num = i + 1;
            const pct = Math.round(f * 100);
            const fillStyle = f >= 1 ? styles.juzMarkFilled
              : f > 0 ? { background: `linear-gradient(0deg, #C9A94F ${pct}%, #E4D9B8 ${pct}%)`, color: "#16342B" } : {};
            return (
              <div key={num} title={`Juz' ${num} · ${pct}%`} style={{ ...styles.juzMark, ...fillStyle }}>
                <span style={{ ...styles.mono, fontSize: 10 }}>{num}</span>
              </div>
            );
          })}
        </div>

        <section style={styles.estCard}>
          <div style={styles.estRow}>
            <div style={{ flex: 1 }}>
              <div style={styles.estLabel}>{T.estTitle}</div>
              {etaIso ? (
                <>
                  <div style={styles.estValue}>{fmtLong(etaIso)}</div>
                  <div style={styles.estSub}>{T.estPace(pace.toFixed(1))} · {T.estLeft(remaining)}</div>
                </>
              ) : (
                <div style={styles.estSub}>{T.estNone}</div>
              )}
            </div>
          </div>
          <div style={styles.estDivider} />
          {editingTarget ? (
            <form onSubmit={(e) => { e.preventDefault(); persistSettings({ targetDate: targetDraft }); setEditingTarget(false); }}
              style={{ display: "flex", gap: 8, alignItems: "flex-end", flexWrap: "wrap" }}>
              <label style={{ ...styles.label, marginBottom: 0, minWidth: 150 }}>{T.target}
                <input className="qt-input" type="date" value={targetDraft} min={today} required
                  onChange={(e) => setTargetDraft(e.target.value)} style={styles.input} />
              </label>
              <button className="qt-btn" type="submit" style={styles.smallPrimary}>{T.save}</button>
              <button className="qt-btn" type="button" onClick={() => setEditingTarget(false)} style={styles.cancelBtn}>{T.cancel}</button>
            </form>
          ) : (
            <div style={styles.estRow}>
              <div style={{ flex: 1 }}>
                <div style={styles.estLabel}>{T.target}</div>
                {target ? (
                  <>
                    <div style={styles.estValueSm}>{fmtLong(target)}</div>
                    <div style={styles.estSub}>
                      {targetDaysLeft > 0 ? `${T.targetNeed(targetNeed)} · ${T.targetDays(targetDaysLeft)}` : T.targetPast}
                    </div>
                  </>
                ) : (
                  <div style={styles.estSub}>{T.targetNone}</div>
                )}
              </div>
              <div style={{ display: "flex", gap: 6 }}>
                <button className="qt-btn" type="button" onClick={() => { setTargetDraft(target || addDays(today, 90)); setEditingTarget(true); }}
                  style={styles.cancelBtn}>{target ? T.edit : T.targetSet}</button>
                {target && <button className="qt-btn" type="button" onClick={() => persistSettings({ targetDate: "" })} style={styles.cancelBtn}>{T.clear}</button>}

        <form onSubmit={addEntry} style={styles.form}>

/* ---------- Calendar heatmap ---------- */
function Heatmap({ pagesByDate, today, T, fmtLong }) {
  const [sel, setSel] = useState(null);
  const scrollRef = useRef(null);
  const WEEKS = 26;
  // Columns are weeks starting Monday; last column holds today.
  const todayDow = (parseIso(today).getDay() + 6) % 7; // 0 = Monday
  const start = addDays(today, -(todayDow + (WEEKS - 1) * 7));
  const weeks = [];
  for (let w = 0; w < WEEKS; w++) {
    const col = [];
    for (let d = 0; d < 7; d++) col.push(addDays(start, w * 7 + d));
    weeks.push(col);
  }
  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollLeft = scrollRef.current.scrollWidth;
  }, []);
  const level = (n) => (!n ? 0 : n <= 2 ? 1 : n <= 5 ? 2 : n <= 10 ? 3 : 4);
  const colors = ["#E4D9B8", "#A9CBB7", "#6FA58A", "#2E7558", "#0F4C3A"];
  const monthLabel = (iso) => parseIso(iso).toLocaleDateString(T.locale, { month: "short" });
  const readDays = Object.keys(pagesByDate).filter((d) => d >= start && d <= today).length;

  return (
    <div style={styles.historySection}>
      <div ref={scrollRef} className="qt-heat" style={styles.heatScroll}>
        <div style={{ display: "flex", gap: 3 }}>
          {weeks.map((col, wi) => {
            const first = col[0];
            const showMonth = wi === 0 || parseIso(first).getMonth() !== parseIso(weeks[wi - 1][0]).getMonth();
            return (
              <div key={wi} style={{ display: "flex", flexDirection: "column", gap: 3 }}>
                <div style={styles.heatMonth}>{showMonth ? monthLabel(first) : ""}</div>
                {col.map((d) => {
                  const future = d > today;
                  const n = pagesByDate[d] || 0;
                  return (
                    <button key={d} className="qt-btn" disabled={future} onClick={() => setSel(d)}
                      aria-label={T.calDay(fmtLong(d), n)}
                      style={{ ...styles.heatCell, background: future ? "transparent" : colors[level(n)],
                        outline: sel === d ? "2px solid #A8823C" : "none", cursor: future ? "default" : "pointer" }} />
                  );
                })}
              </div>
            );
          })}
        </div>
      </div>
      <div style={styles.heatLegend}>
        <span>{T.calLegend}</span>
        {colors.map((c) => <span key={c} style={{ ...styles.heatCell, width: 11, height: 11, background: c, display: "inline-block" }} />)}
        <span>{T.calMore}</span>
        <span style={{ marginLeft: "auto" }}><span style={styles.mono}>{readDays}</span>/{WEEKS * 7 - (6 - todayDow)}</span>
      </div>
      <div style={styles.heatInfo}>{sel ? T.calDay(fmtLong(sel), pagesByDate[sel] || 0) : T.calTap}</div>
    </div>
  );
}
