<script>
  // App shortcut "Sambung bacaan": jump straight to the next page on Quran.com.
  (function () {
    try {
      var q = new URLSearchParams(location.search);
      if (q.get("action") !== "read") return;
      var key = localStorage.getItem("quran-note-personal") === "1" ? "qn-personal-entries" : "quran-journal-entries";
      var e = JSON.parse(localStorage.getItem(key) || "[]"), last = null;
      for (var i = 0; i < e.length; i++) { var x = e[i]; if (!last || x.date > last.date || (x.date === last.date && x.ts > last.ts)) last = x; }
      if (last) location.replace("https://quran.com/page/" + (last.page >= 604 ? 1 : last.page + 1));
    } catch (err) {}
  })();
</script>

<script>
  // Opening scene: the full 3.5 s intro (with Bismillah) once a day; after that the app opens as soon as it is ready.
  (function () {
    var el = document.getElementById("splash"), minDone = false, ready = false, gone = false;
    var settings = {};
    try { settings = JSON.parse(localStorage.getItem("quran-journal-settings") || "{}"); } catch (e) {}
    // Decide "used this app before?" before this script writes anything.
    try { window.__returning = Object.keys(localStorage).some(function (k) { return /^(quran-journal|qn-|quran-note)/.test(k); }); } catch (e) { window.__returning = false; }
    var d = new Date(), day = d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(), full = true;
    try { full = settings.intro === "always" || localStorage.getItem("qn-intro-day") !== day; localStorage.setItem("qn-intro-day", day); } catch (e) {}
    window.__introFull = full;
    if (!full) el.classList.add("quick");
    function hide() {
      if (gone || !minDone || !ready) return;
      gone = true; el.classList.add("out");
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, full ? 320 : 180);
    }
    setTimeout(function () { minDone = true; hide(); }, full ? 3200 : 0);
    window.addEventListener("app-ready", function () { ready = true; hide(); });
    setTimeout(function () { ready = true; minDone = true; hide(); }, 8000);

    // Short, brisk Bismillah (Saud Al-Shuraim, 1:1; backups: Maher Al-Muaiqly, Alafasy) with the full intro. Can be turned off in Settings.
    if (!full || settings.sound === false) return;
    var SOURCES = [
      "https://everyayah.com/data/Saood_ash-Shuraym_128kbps/001001.mp3",
      "https://verses.quran.com/Shuraym/mp3/001001.mp3",
      "https://everyayah.com/data/Maher_AlMuaiqly_64kbps/001001.mp3",
      "https://verses.quran.foundation/Alafasy/mp3/001001.mp3"
    ];
    var VOLUME = 0.3, idx = 0, started = false;
    var audio = new Audio();
    audio.preload = "auto";
    audio.volume = 0;
    audio.src = SOURCES[0];
    audio.addEventListener("error", function () {
      if (++idx < SOURCES.length) { audio.src = SOURCES[idx]; if (started) play(); }
    });
    function fadeIn() {
      var v = 0;
      var t = setInterval(function () { v = Math.min(VOLUME, v + 0.06); try { audio.volume = v; } catch (e) {} if (v >= VOLUME) clearInterval(t); }, 50);
    }
    function play() {
      started = true;
      var p = audio.play();
      if (p && p.then) {
        p.then(function () { el.classList.remove("needs-tap"); fadeIn(); })
         .catch(function (err) { if (err && err.name === "NotAllowedError" && !gone) el.classList.add("needs-tap"); });
      }
    }
    el.querySelector(".sp-tap").addEventListener("click", function (e) { e.stopPropagation(); play(); });
    el.addEventListener("click", function () { if (el.classList.contains("needs-tap")) play(); });
    window.__bismillah = audio;
    play();
  })();
</script>

\u064E\u0671\u0644\u0651\u064E\u0630\u0650\u064A\u0646\u064E \u064A\u064E\u0642\u064F\u0648\u0644\u064F\u0648\u0646\u064E \u0631\u064E\u0628\u0651\u064E\u0646\u064E\u0627 \u0647\u064E\u0628\u0652 \u0644\u064E\u0646\u064E\u0627 \u0645\u0650\u0646\u0652 \u0623\u064E\u0632\u0652\u0648\u064E\u0670\u062C\u0650\u0646\u064E\u0627 \u0648\u064E\u0630\u064F\u0631\u0651\u0650\u064A\u0651\u064E\u0670\u062A\u0650\u0646\u064E\u0627 \u0642\u064F\u0631\u0651\u064E\u0629\u064E \u0623\u064E\u0639\u0652\u064A\u064F\u0646\u064D \u0648\u064E\u0671\u062C\u0652\u0639\u064E\u0644\u0652\u0646\u064E\u0627 \u0644\u0650\u0644\u0652\u0645\u064F\u062A\u0651\u064E\u0642\u0650\u064A\u0646\u064E \u0625\u0650\u0645\u064E\u0627\u0645\u064B\u0627",'Dan juga mereka (yang diredhai Allah itu ialah orang-orang) yang berdoa dengan berkata: "Wahai Tuhan kami, berilah kami beroleh dari isteri-isteri dan zuriat keturunan kami: perkara-perkara yang menyukakan hati melihatnya, dan jadikanlah kami imam ikutan bagi orang-orang yang (mahu) bertaqwa."','And those who say, "Our Lord, grant us from among our wives and offspring comfort to our eyes and make us an example for the righteous."',[[15,2,3],[14,34,36],[9,54,55],[9,71,72],[1,93,97],[15,97,98],[14,98,100]]],[103,2,"\u0625\u0650\u0646\u0651\u064E \u0671\u0644\u0652\u0625\u0650\u0646\u0633\u064E\u0670\u0646\u064E \u0644\u064E\u0641\u0650\u0649 \u062E\u064F\u0633\u0652\u0631\u064D","Sesungguhnya manusia itu dalam kerugian.","Indeed, mankind is in loss.",[[0,2,5],[15,6,7],[6,11,14],[9,14,15]]],[35,29,"\u0625\u0650\u0646\u0651\u064E \u0671\u0644\u0651\u064E\u0630\u0650\u064A\u0646\u064E \u064A\u064E\u062A\u0652\u0644\u064F\u0648\u0646\u064E \u0643\u0650\u062A\u064E\u0670\u0628\u064E \u0671\u0644\u0644\u0651\u064E\u0647\u0650 \u0648\u064E\u0623\u064E\u0642\u064E\u0627\u0645\u064F\u0648\u0627\u06DF \u0671\u0644\u0635\u0651\u064E\u0644\u064E\u0648\u0670\u0629\u064E \u0648\u064E\u0623\u064E\u0646\u0641\u064E\u0642\u064F\u0648\u0627\u06DF \u0645\u0650\u0645\u0651\u064E\u0627 \u0631\u064E\u0632\u064E\u0642\u0652\u0646\u064E\u0670\u0647\u064F\u0645\u0652 \u0633\u0650\u0631\u0651\u064B\u0627 \u0648\u064E\u0639\u064E\u0644\u064E\u0627\u0646\u0650\u064A\u064E\u0629\u064B \u064A\u064E\u0631\u0652\u062C\u064F\u0648\u0646\u064E \u062A\u0650\u062C\u064E\u0670\u0631\u064E\u0629\u064B \u0644\u0651\u064E\u0646 \u062A\u064E\u0628\u064F\u0648\u0631\u064E","Sesungguhnya orang-orang yang selalu membaca Kitab Allah dan tetap mendirikan sembahyang serta mendermakan dari apa yang Kami kurniakan kepada mereka, secara bersembunyi atau secara terbuka, mereka (dengan amalan yang demikian) mengharapkan sejenis perniagaan yang tidak akan mengalami kerugian.","Indeed, those who recite the Book of Allah and establish prayer and spend [in His cause] out of what We have provided them, secretly and publicly, [can] expect a profit that will never perish.",[[0,2,5],[15,6,7],[9,30,31],[15,34,35],[17,52,54],[15,55,56],[16,56,57],[17,62,63],[9,63,64],[6,71,74],[17,77,79],[0,82,85],[14,91,93],[9,95,96],[1,105,110],[1,120,124],[9,136,137],[2,140,145],[6,145,149],[10,151,152]]],[103,3,"\u0625\u0650\u0644\u0651\u064E\u0627 \u0671\u0644\u0651\u064E\u0630\u0650\u064A\u0646\u064E \u0621\u064E\u0627\u0645\u064E\u0646\u064F\u0648\u0627\u06DF \u0648\u064E\u0639\u064E\u0645\u0650\u0644\u064F\u0648\u0627\u06DF \u0671\u0644\u0635\u0651\u064E\u0670\u0644\u0650\u062D\u064E\u0670\u062A\u0650 \u0648\u064E\u062A\u064E\u0648\u064E\u0627\u0635\u064E\u0648\u0652\u0627\u06DF \u0628\u0650\u0671\u0644\u0652\u062D\u064E\u0642\u0651\u0650 \u0648\u064E\u062A\u064E\u0648\u064E\u0627\u0635\u064E\u0648\u0652\u0627\u06DF \u0628\u0650\u0671\u0644\u0635\u0651\u064E\u0628\u0652\u0631\u0650","Kecuali orang-orang yang beriman dan beramal soleh, dan mereka pula berpesan-pesan dengan kebenaran serta berpesan-pesan dengan sabar.","Except for those who have believed and done righteous deeds and advised each other to truth and advised each other to patience.",[[15,7,8],[17,25,27],[17,37,39],[15,40,41],[16,41,42],[9,45,46],[9,50,51],[17,65,67],[15,70,71],[17,90,92],[15,95,96],[16,96,97],[14,100,102]]],[54,17,"\u0648\u064E\u0644\u064E\u0642\u064E\u062F\u0652 \u064A\u064E\u0633\u0651\u064E\u0631\u0652\u0646\u064E\u0627 \u0671\u0644\u0652\u0642\u064F\u0631\u0652\u0621\u064E\u0627\u0646\u064E \u0644\u0650\u0644\u0630\u0651\u0650\u0643\u0652\u0631\u0650 \u0641\u064E\u0647\u064E\u0644\u0652 \u0645\u0650\u0646 \u0645\u0651\u064F\u062F\u0651\u064E\u0643\u0650\u0631\u064D","Dan demi sesungguhnya! Kami telah mudahkan Al-Quran untuk menjadi peringatan dan pengajaran, maka adakah sesiapa yang mahu mengambil peringatan dan pelajaran (daripadanya).","And We have certainly made the Qur'an easy for remembrance, so is there any who will remember.",[[14,6,8],[15,20,21],[16,35,36],[1,53,58]]],[12,86,"\u0642\u064E\u0627\u0644\u064E \u0625\u0650\u0646\u0651\u064E\u0645\u064E\u0627\u0653 \u0623\u064E\u0634\u0652\u0643\u064F\u0648\u0627\u06DF \u0628\u064E\u062B\u0651\u0650\u0649 \u0648\u064E\u062D\u064F\u0632\u0652\u0646\u0650\u0649\u0653 \u0625\u0650\u0644\u064E\u0649 \u0671\u0644\u0644\u0651\u064E\u0647\u0650 \u0648\u064E\u0623\u064E\u0639\u0652\u0644\u064E\u0645\u064F \u0645\u0650\u0646\u064E \u0671\u0644\u0644\u0651\u064E\u0647\u0650 \u0645\u064E\u0627 \u0644\u064E\u0627 \u062A\u064E\u0639\u0652\u0644\u064E\u0645\u064F\u0648\u0646\u064E",'(Nabi Yaakub) menjawab: "Sesungguhnya aku hanyalah mengadukan kesusahan dan dukacitaku kepada Allah dan aku mengetahui (dengan perantaraan wahyu) dari Allah, apa yang kamu tidak mengetahuinya."','He said, "I only complain of my suffering and my grief to Allah, and I know from Allah that which you do not know."',[[0,8,11],[12,13,15],[17,23,25],[12,41,43],[15,50,51],[15,74,75],[10,98,99]]],[39,53,"\u0642\u064F\u0644\u0652 \u064A\u064E\u0670\u0639\u0650\u0628\u064E\u0627\u062F\u0650\u0649\u064E \u0671\u0644\u0651\u064E\u0630\u0650\u064A\u0646\u064E \u0623\u064E\u0633\u0652\u0631\u064E\u0641\u064F\u0648\u0627\u06DF \u0639\u064E\u0644\u064E\u0649\u0670\u0653 \u0623\u064E\u0646\u0641\u064F\u0633\u0650\u0647\u0650\u0645\u0652 \u0644\u064E\u0627 \u062A\u064E\u0642\u0652\u0646\u064E\u0637\u064F\u0648\u0627\u06DF \u0645\u0650\u0646 \u0631\u0651\u064E\u062D\u0652\u0645\u064E\u0629\u0650 \u0671\u0644\u0644\u0651\u064E\u0647\u0650 \u0625\u0650\u0646\u0651\u064E \u0671\u0644\u0644\u0651\u064E\u0647\u064E \u064A\u064E\u063A\u0652\u0641\u0650\u0631\u064F \u0671\u0644\u0630\u0651\u064F\u0646\u064F\u0648\u0628\u064E \u062C\u064E\u0645\u0650\u064A\u0639\u064B\u0627 \u0625\u0650\u0646\u0651\u064E\u0647\u064F\u06E5 \u0647\u064F\u0648\u064E \u0671\u0644\u0652\u063A\u064E\u0641\u064F\u0648\u0631\u064F \u0671\u0644\u0631\u0651\u064E\u062D\u0650\u064A\u0645\u064F",'Katakanlah (wahai Muhammad): "Wahai hamba-hambaKu yang telah melampaui batas terhadap diri mereka sendiri (dengan perbuatan-perbuatan maksiat), janganlah kamu berputus asa dari rahmat Allah, kerana sesungguhnya Allah mengampunkan segala dosa; sesungguhnya Dia lah jua Yang Maha Pengampun, lagi Maha Mengasihani."','Say, "O My servants who have transgressed against themselves [by sinning], do not despair of the mercy of Allah. Indeed, Allah forgives all sins. Indeed, it is He who is the Forgiving, the Merciful."',[[9,7,8],[15,18,19],[17,37,39],[12,44,47],[6,50,53],[14,66,68],[17,73,75],[2,78,83],[15,90,91],[0,100,103],[15,104,105],[15,121,122],[16,122,123],[0,143,146],[9,148,149],[15,155,156],[15,166,167],[16,167,168],[10,173,174]]],[20,132,"\u0648\u064E\u0623\u0652\u0645\u064F\u0631\u0652 \u0623\u064E\u0647\u0652\u0644\u064E\u0643\u064E \u0628\u0650\u0671\u0644\u0635\u0651\u064E\u0644\u064E\u0648\u0670\u0629\u0650 \u0648\u064E\u0671\u0635\u0652\u0637\u064E\u0628\u0650\u0631\u0652 \u0639\u064E\u0644\u064E\u064A\u0652\u0647\u064E\u0627 \u0644\u064E\u0627 \u0646\u064E\u0633\u0652\u0640\u0654\u064E\u0644\u064F\u0643\u064E \u0631\u0650\u0632\u0652\u0642\u064B\u0627 \u0646\u0651\u064E\u062D\u0652\u0646\u064F \u0646\u064E\u0631\u0652\u0632\u064F\u0642\u064F\u0643\u064E \u0648\u064E\u0671\u0644\u0652\u0639\u064E\u0670\u0642\u0650\u0628\u064E\u0629\u064F \u0644\u0650\u0644\u062A\u0651\u064E\u0642\u0652\u0648\u064E\u0649\u0670","Dan perintahkanlah keluargamu serta umatmu mengerjakan sembahyang, dan hendaklah engkau tekun bersabar menunaikannya. Kami tidak meminta rezeki kepadamu, (bahkan) Kamilah yang memberi rezeki kepadamu. Dan (ingatlah) kesudahan yang baik adalah bagi orang-orang yang bertaqwa.","And enjoin prayer upon your family [and people] and be steadfast therein. We ask you not for provision; We provide for you, and the [best] outcome is for [those of] righteousness.",[[15,20,21],[16,21,22],[17,27,28],[9,28,29],[15,34,35],[1,75,81],[15,99,100],[9,104,105],[16,114,115],[14,118,120]]],[3,134,"\u0671\u0644\u0651\u064E\u0630\u0650\u064A\u0646\u064E \u064A\u064F\u0646\u0641\u0650\u0642\u064F\u0648\u0646\u064E \u0641\u0650\u0649 \u0671\u0644\u0633\u0651\u064E\u0631\u0651\u064E\u0627\u0653\u0621\u0650 \u0648\u064E\u0671\u0644\u0636\u0651\u064E\u0631\u0651\u064E\u0627\u0653\u0621\u0650 \u0648\u064E\u0671\u0644\u0652\u0643\u064E\u0670\u0638\u0650\u0645\u0650\u064A\u0646\u064E \u0671\u0644\u0652\u063A\u064E\u064A\u0652\u0638\u064E \u0648\u064E\u0671\u0644\u0652\u0639\u064E\u0627\u0641\u0650\u064A\u0646\u064E \u0639\u064E\u0646\u0650 \u0671\u0644\u0646\u0651\u064E\u0627\u0633\u0650 \u0648\u064E\u0671\u0644\u0644\u0651\u064E\u0647\u064F \u064A\u064F\u062D\u0650\u0628\u0651\u064F \u0671\u0644\u0652\u0645\u064F\u062D\u0652\u0633\u0650\u0646\u0650\u064A\u0646\u064E","Iaitu orang-orang yang mendermakan hartanya pada masa senang dan susah, dan orang-orang yang menahan kemarahannya, dan orang-orang yang memaafkan kesalahan orang. Dan (ingatlah), Allah mengasihi orang-orang yang berbuat perkara-perkara yang baik.","Who spend [in the cause of Allah] during ease and hardship and who restrain anger and who pardon the people - and Allah loves the doers of good.",[[6,12,15],[15,25,26],[16,26,27],[11,33,35],[15,40,41],[16,41,42],[11,48,50],[15,55,56],[9,60,61],[15,69,70],[15,81,82],[15,98,99],[16,99,100],[0,100,103],[15,109,110],[15,125,126],[10,136,137]]],[94,7,"\u0641\u064E\u0625\u0650\u0630\u064E\u0627 \u0641\u064E\u0631\u064E\u063A\u0652\u062A\u064E \u0641\u064E\u0671\u0646\u0635\u064E\u0628\u0652","Kemudian apabila engkau telah selesai (daripada sesuatu amal soleh), maka bersungguh-sungguhlah engkau berusaha (mengerjakan amal soleh yang lain).","So when you have finished [your duties], then stand up [for worship].",[[15,19,20],[6,20,23],[14,23,25]]],[16,128,"\u0625\u0650\u0646\u0651\u064E \u0671\u0644\u0644\u0651\u064E\u0647\u064E \u0645\u064E\u0639\u064E \u0671\u0644\u0651\u064E\u0630\u0650\u064A\u0646\u064E \u0671\u062A\u0651\u064E\u0642\u064E\u0648\u0627\u06DF \u0648\u0651\u064E\u0671\u0644\u0651\u064E\u0630\u0650\u064A\u0646\u064E \u0647\u064F\u0645 \u0645\u0651\u064F\u062D\u0652\u0633\u0650\u0646\u064F\u0648\u0646\u064E","Sesungguhnya Allah beserta orang-orang yang bertaqwa, dan orang-orang yang berusaha memperbaiki amalannya.","Indeed, Allah is with those who fear Him and those who are doers of good.",[[0,2,5],[15,6,7],[15,19,20],[15,29,30],[17,36,38],[15,42,43],[5,54,59],[10,65,66]]],[64,16,"\u0641\u064E\u0671\u062A\u0651\u064E\u0642\u064F\u0648\u0627\u06DF \u0671\u0644\u0644\u0651\u064E\u0647\u064E \u0645\u064E\u0627 \u0671\u0633\u0652\u062A\u064E\u0637\u064E\u0639\u0652\u062A\u064F\u0645\u0652 \u0648\u064E\u0671\u0633\u0652\u0645\u064E\u0639\u064F\u0648\u0627\u06DF \u0648\u064E\u0623\u064E\u0637\u0650\u064A\u0639\u064F\u0648\u0627\u06DF \u0648\u064E\u0623\u064E\u0646\u0641\u0650\u0642\u064F\u0648\u0627\u06DF \u062E\u064E\u064A\u0652\u0631\u064B\u0627 \u0644\u0651\u0650\u0623\u064E\u0646\u0641\u064F\u0633\u0650\u0643\u064F\u0645\u0652 \u0648\u064E\u0645\u064E\u0646 \u064A\u064F\u0648\u0642\u064E \u0634\u064F\u062D\u0651\u064E \u0646\u064E\u0641\u0652\u0633\u0650\u0647\u0650\u06E6 \u0641\u064E\u0623\u064F\u0648\u06DF\u0644\u064E\u0670\u0653\u0626\u0650\u0643\u064E \u0647\u064F\u0645\u064F \u0671\u0644\u0652\u0645\u064F\u0641\u0652\u0644\u0650\u062D\u064F\u0648\u0646\u064E","Oleh itu bertaqwalah kamu kepada Allah sedaya supaya kamu; dan dengarlah (akan pengajaran-pengajaranNya) serta taatlah (akan perintah-perintahNya); dan belanjakanlah harta kamu (serta buatlah) kebajikan untuk diri kamu. Dan (ingatlah), sesiapa yang menjaga serta memelihara dirinya daripada dipengaruhi oleh tabiat bakhilnya, maka merekalah orang-orang yang berjaya.","So fear Allah as much as you are able and listen and obey and spend [in the way of Allah]; it is better for your selves. And whoever is protected from the stinginess of his soul - it is those who will be the successful.",[[15,2,3],[17,9,11],[15,12,13],[15,24,25],[15,40,41],[17,48,50],[17,61,63],[6,68,71],[17,74,76],[2,82,88],[6,90,93],[1,104,108],[9,126,127],[17,132,134],[11,136,138],[15,148,149],[10,159,160]]],[89,28,"\u0671\u0631\u0652\u062C\u0650\u0639\u0650\u0649\u0653 \u0625\u0650\u0644\u064E\u0649\u0670 \u0631\u064E\u0628\u0651\u0650\u0643\u0650 \u0631\u064E\u0627\u0636\u0650\u064A\u064E\u0629\u064B \u0645\u0651\u064E\u0631\u0652\u0636\u0650\u064A\u0651\u064E\u0629\u064B","Kembalilah kepada Tuhanmu dengan keadaan engkau berpuas hati (dengan segala nikmat yang diberikan) lagi diredhai (di sisi Tuhanmu).","Return to your Lord, well-pleased and pleasing [to Him].",[[12,7,9],[1,33,38]]],[2,155,"\u0648\u064E\u0644\u064E\u0646\u064E\u0628\u0652\u0644\u064F\u0648\u064E\u0646\u0651\u064E\u0643\u064F\u0645 \u0628\u0650\u0634\u064E\u0649\u0652\u0621\u064D \u0645\u0651\u0650\u0646\u064E \u0671\u0644\u0652\u062E\u064E\u0648\u0652\u0641\u0650 \u0648\u064E\u0671\u0644\u0652\u062C\u064F\u0648\u0639\u0650 \u0648\u064E\u0646\u064E\u0642\u0652\u0635\u064D \u0645\u0651\u0650\u0646\u064E \u0671\u0644\u0652\u0623\u064E\u0645\u0652\u0648\u064E\u0670\u0644\u0650 \u0648\u064E\u0671\u0644\u0652\u0623\u064E\u0646\u0641\u064F\u0633\u0650 \u0648\u064E\u0671\u0644\u062B\u0651\u064E\u0645\u064E\u0631\u064E\u0670\u062A\u0650 \u0648\u064E\u0628\u064E\u0634\u0651\u0650\u0631\u0650 \u0671\u0644\u0635\u0651\u064E\u0670\u0628\u0650\u0631\u0650\u064A\u0646\u064E","Demi sesungguhnya! Kami akan menguji kamu dengan sedikit perasaan takut (kepada musuh) dan (dengan merasai) kelaparan, dan (dengan berlakunya) kekurangan dari harta benda dan jiwa serta hasil tanaman. Dan berilah khabar gembira kepada orang-orang yang sabar.","And We will surely test you with something of fear and hunger and a loss of wealth and lives and fruits, but give good tidings to the patient.",[[14,6,8],[0,12,15],[7,17,21],[1,26,31],[15,34,35],[15,46,47],[14,59,61],[1,62,67],[15,70,71],[9,79,80],[15,85,86],[6,90,93],[15,98,99],[16,99,100],[9,107,108],[15,121,122],[16,122,123],[9,126,127],[10,131,132]]],[93,4,"\u0648\u064E\u0644\u064E\u0644\u0652\u0621\u064E\u0627\u062E\u0650\u0631\u064E\u0629\u064F \u062E\u064E\u064A\u0652\u0631\u064C \u0644\u0651\u064E\u0643\u064E \u0645\u0650\u0646\u064E \u0671\u0644\u0652\u0623\u064F\u0648\u0644\u064E\u0649\u0670","Dan sesungguhnya kesudahan keaadaanmu adalah lebih baik bagimu daripada permulaannya.","And the Hereafter is better for you than the first [life].",[[2,21,26],[15,34,35]]],[2,110,"\u0648\u064E\u0623\u064E\u0642\u0650\u064A\u0645\u064F\u0648\u0627\u06DF \u0671\u0644\u0635\u0651\u064E\u0644\u064E\u0648\u0670\u0629\u064E \u0648\u064E\u0621\u064E\u0627\u062A\u064F\u0648\u0627\u06DF \u0671\u0644\u0632\u0651\u064E\u0643\u064E\u0648\u0670\u0629\u064E \u0648\u064E\u0645\u064E\u0627 \u062A\u064F\u0642\u064E\u062F\u0651\u0650\u0645\u064F\u0648\u0627\u06DF \u0644\u0650\u0623\u064E\u0646\u0641\u064F\u0633\u0650\u0643\u064F\u0645 \u0645\u0651\u0650\u0646\u0652 \u062E\u064E\u064A\u0652\u0631\u064D \u062A\u064E\u062C\u0650\u062F\u064F\u0648\u0647\u064F \u0639\u0650\u0646\u062F\u064E \u0671\u0644\u0644\u0651\u064E\u0647\u0650 \u0625\u0650\u0646\u0651\u064E \u0671\u0644\u0644\u0651\u064E\u0647\u064E \u0628\u0650\u0645\u064E\u0627 \u062A\u064E\u0639\u0652\u0645\u064E\u0644\u064F\u0648\u0646\u064E \u0628\u064E\u0635\u0650\u064A\u0631\u064C","Dan dirikanlah oleh kamu akan sembahyang dan tunaikanlah zakat dan apa jua yang kamu dahulukan dari kebaikan untuk diri kamu, tentulah kamu akan mendapat balasan pahalanya di sisi Allah. Sesungguhnya Allah sentiasa Melihat segala yang kamu kerjakan.","And establish prayer and give zakah, and whatever good you put forward for yourselves - you will find it with Allah. Indeed, Allah of what you do, is Seeing.",[[17,10,12],[15,13,14],[16,14,15],[17,20,21],[9,21,22],[17,33,35],[15,36,37],[16,37,38],[17,43,44],[9,44,45],[17,64,66],[6,71,74],[5,78,83],[6,91,95],[6,105,108],[15,109,110],[0,119,122],[15,123,124],[10,153,154]]],[10,57,"\u064A\u064E\u0670\u0653\u0623\u064E\u064A\u0651\u064F\u0647\u064E\u0627 \u0671\u0644\u0646\u0651\u064E\u0627\u0633\u064F \u0642\u064E\u062F\u0652 \u062C\u064E\u0627\u0653\u0621\u064E\u062A\u0652\u0643\u064F\u0645 \u0645\u0651\u064E\u0648\u0652\u0639\u0650\u0638\u064E\u0629\u064C \u0645\u0651\u0650\u0646 \u0631\u0651\u064E\u0628\u0651\u0650\u0643\u064F\u0645\u0652 \u0648\u064E\u0634\u0650\u0641\u064E\u0627\u0653\u0621\u064C \u0644\u0651\u0650\u0645\u064E\u0627 \u0641\u0650\u0649 \u0671\u0644\u0635\u0651\u064F\u062F\u064F\u0648\u0631\u0650 \u0648\u064E\u0647\u064F\u062F\u064B\u0649 \u0648\u064E\u0631\u064E\u062D\u0652\u0645\u064E\u0629\u064C \u0644\u0651\u0650\u0644\u0652\u0645\u064F\u0624\u0652\u0645\u0650\u0646\u0650\u064A\u0646\u064E","Wahai umat manusia! Sesungguhnya telah datang kepada kamu Al-Quran yang menjadi nasihat pengajaran dari Tuhan kamu, dan yang menjadi penawar bagi penyakit-penyakit batin yang ada di dalam dada kamu, dan juga menjadi hidayah petunjuk untuk keselamatan, serta membawa rahmat bagi orang-orang yang beriman.","O mankind, there has to come to you instruction from your Lord and healing for what is in the breasts and guidance and mercy for the believers.",[[12,2,4],[15,13,14],[16,14,15],[0,15,18],[14,24,26],[11,29,31],[5,37,42],[1,49,54],[2,54,59],[11,73,75],[2,76,81],[15,89,90],[16,90,91],[1,105,110],[2,117,122],[10,132,133]]],[47,24,"\u0623\u064E\u0641\u064E\u0644\u064E\u0627 \u064A\u064E\u062A\u064E\u062F\u064E\u0628\u0651\u064E\u0631\u064F\u0648\u0646\u064E \u0671\u0644\u0652\u0642\u064F\u0631\u0652\u0621\u064E\u0627\u0646\u064E \u0623\u064E\u0645\u0652 \u0639\u064E\u0644\u064E\u0649\u0670 \u0642\u064F\u0644\u064F\u0648\u0628\u064D \u0623\u064E\u0642\u0652\u0641\u064E\u0627\u0644\u064F\u0647\u064E\u0627\u0653","(Setelah diterangkan yang demikian) maka adakah mereka sengaja tidak berusaha memahami serta memikirkan isi Al-Quran? Atau telah ada di atas hati mereka kunci penutup (yang menghalangnya daripada menerima ajaran Al-Quran).","Then do they not reflect upon the Qur'an, or are there locks upon [their] hearts.",[[15,23,24],[14,58,60]]],[13,28,"\u0671\u0644\u0651\u064E\u0630\u0650\u064A\u0646\u064E \u0621\u064E\u0627\u0645\u064E\u0646\u064F\u0648\u0627\u06DF \u0648\u064E\u062A\u064E\u0637\u0652\u0645\u064E\u0626\u0650\u0646\u0651\u064F \u0642\u064F\u0644\u064F\u0648\u0628\u064F\u0647\u064F\u0645 \u0628\u0650\u0630\u0650\u0643\u0652\u0631\u0650 \u0671\u0644\u0644\u0651\u064E\u0647\u0650 \u0623\u064E\u0644\u064E\u0627 \u0628\u0650\u0630\u0650\u0643\u0652\u0631\u0650 \u0671\u0644\u0644\u0651\u064E\u0647\u0650 \u062A\u064E\u0637\u0652\u0645\u064E\u0626\u0650\u0646\u0651\u064F \u0671\u0644\u0652\u0642\u064F\u0644\u064F\u0648\u0628\u064F",'(Iaitu) orang-orang yang beriman dan tenang tenteram hati mereka dengan zikrullah. Ketahuilah dengan "zikrullah" itu, tenang tenteramlah hati manusia.',"Those who have believed and whose hearts are assured by the remembrance of Allah. Unquestionably, by the remembrance of Allah hearts are assured.",[[17,18,20],[14,25,27],[0,31,34],[7,44,48],[15,55,56],[15,78,79],[14,88,90],[0,94,97],[15,98,99],[10,105,106],[14,106,107]]],[67,2,"\u0671\u0644\u0651\u064E\u0630\u0650\u0649 \u062E\u064E\u0644\u064E\u0642\u064E \u0671\u0644\u0652\u0645\u064E\u0648\u0652\u062A\u064E \u0648\u064E\u0671\u0644\u0652\u062D\u064E\u064A\u064E\u0648\u0670\u0629\u064E \u0644\u0650\u064A\u064E\u0628\u0652\u0644\u064F\u0648\u064E\u0643\u064F\u0645\u0652 \u0623\u064E\u064A\u0651\u064F\u0643\u064F\u0645\u0652 \u0623\u064E\u062D\u0652\u0633\u064E\u0646\u064F \u0639\u064E\u0645\u064E\u0644\u064B\u0627 \u0648\u064E\u0647\u064F\u0648\u064E \u0671\u0644\u0652\u0639\u064E\u0632\u0650\u064A\u0632\u064F \u0671\u0644\u0652\u063A\u064E\u0641\u064F\u0648\u0631\u064F","Dia lah yang telah mentakdirkan adanya mati dan hidup (kamu) - untuk menguji dan menzahirkan keadaan kamu: siapakah di antara kamu yang lebih baik amalnya; dan Ia Maha Kuasa (membalas amal kamu), lagi Maha Pengampun, (bagi orang-orang yang bertaubat).","[He] who created death and life to test you [as to] which of you is best in deed - and He is the Exalted in Might, the Forgiving.",[[15,15,16],[15,27,28],[17,34,35],[9,35,36],[14,43,45],[1,78,83],[15,88,89],[15,99,100],[10,106,107]]],[14,7,"\u0648\u064E\u0625\u0650\u0630\u0652 \u062A\u064E\u0623\u064E\u0630\u0651\u064E\u0646\u064E \u0631\u064E\u0628\u0651\u064F\u0643\u064F\u0645\u0652 \u0644\u064E\u0626\u0650\u0646 \u0634\u064E\u0643\u064E\u0631\u0652\u062A\u064F\u0645\u0652 \u0644\u064E\u0623\u064E\u0632\u0650\u064A\u062F\u064E\u0646\u0651\u064E\u0643\u064F\u0645\u0652 \u0648\u064E\u0644\u064E\u0626\u0650\u0646 \u0643\u064E\u0641\u064E\u0631\u0652\u062A\u064F\u0645\u0652 \u0625\u0650\u0646\u0651\u064E \u0639\u064E\u0630\u064E\u0627\u0628\u0650\u0649 \u0644\u064E\u0634\u064E\u062F\u0650\u064A\u062F\u064C",'Dan (ingatlah) ketika Tuhan kamu memberitahu: "Demi sesungguhnya! Jika kamu bersyukur nescaya Aku akan tambahi nikmatKu kepada kamu, dan demi sesungguhnya, jika kamu kufur ingkar sesungguhnya azabKu amatlah keras."',"And [remember] when your Lord proclaimed, 'If you are grateful, I will surely increase you [in favor]; but if you deny, indeed, My punishment is severe.'",[[6,31,35],[0,53,56],[6,67,71],[0,82,85],[10,101,102],[14,102,103]]],[18,46,"\u0671\u0644\u0652\u0645\u064E\u0627\u0644\u064F \u0648\u064E\u0671\u0644\u0652\u0628\u064E\u0646\u064F\u0648\u0646\u064E \u0632\u0650\u064A\u0646\u064E\u0629\u064F \u0671\u0644\u0652\u062D\u064E\u064A\u064E\u0648\u0670\u0629\u0650 \u0671\u0644\u062F\u0651\u064F\u0646\u0652\u064A\u064E\u0627 \u0648\u064E\u0671\u0644\u0652\u0628\u064E\u0670\u0642\u0650\u064A\u064E\u0670\u062A\u064F \u0671\u0644\u0635\u0651\u064E\u0670\u0644\u0650\u062D\u064E\u0670\u062A\u064F \u062E\u064E\u064A\u0652\u0631\u064C \u0639\u0650\u0646\u062F\u064E \u0631\u064E\u0628\u0651\u0650\u0643\u064E \u062B\u064E\u0648\u064E\u0627\u0628\u064B\u0627 \u0648\u064E\u062E\u064E\u064A\u0652\u0631\u064C \u0623\u064E\u0645\u064E\u0644\u064B\u0627","Harta benda dan anak pinak itu, ialah perhiasan hidup di dunia; dan amal-amal soleh yang kekal faedahnya itu lebih baik pada sisi Tuhanmu sebagai pahala balasan, dan lebih baik sebagai asas yang memberi harapan.","Wealth and children are [but] adornment of the worldly life. But the enduring good deeds are better to your Lord for reward and better for [one's] hope.",[[15,11,12],[15,30,31],[17,37,38],[9,38,39],[15,42,43],[16,43,44],[15,55,56],[9,60,61],[9,65,66],[15,69,70],[16,70,71],[9,74,75],[9,79,80],[6,92,95],[1,110,115]]],[7,23,"\u0642\u064E\u0627\u0644\u064E\u0627 \u0631\u064E\u0628\u0651\u064E\u0646\u064E\u0627 \u0638\u064E\u0644\u064E\u0645\u0652\u0646\u064E\u0627\u0653 \u0623\u064E\u0646\u0641\u064F\u0633\u064E\u0646\u064E\u0627 \u0648\u064E\u0625\u0650\u0646 \u0644\u0651\u064E\u0645\u0652 \u062A\u064E\u063A\u0652\u0641\u0650\u0631\u0652 \u0644\u064E\u0646\u064E\u0627 \u0648\u064E\u062A\u064E\u0631\u0652\u062D\u064E\u0645\u0652\u0646\u064E\u0627 \u0644\u064E\u0646\u064E\u0643\u064F\u0648\u0646\u064E\u0646\u0651\u064E \u0645\u0650\u0646\u064E \u0671\u0644\u0652\u062E\u064E\u0670\u0633\u0650\u0631\u0650\u064A\u0646\u064E",'Mereka berdua merayu: "Wahai Tuhan kami, kami telah menganiaya diri kami sendiri, dan kalau Engkau tidak mengampunkan kami dan memberi rahmat kepada kami, nescaya menjadilah kami dari orang-orang yang rugi."','They said, "Our Lord, we have wronged ourselves, and if You do not forgive us and have mercy upon us, we will surely be among the losers."',[[12,24,26],[6,29,32],[2,42,47],[0,88,91],[15,97,98],[9,102,103],[10,107,108]]],[2,152,"\u0641\u064E\u0671\u0630\u0652\u0643\u064F\u0631\u064F\u0648\u0646\u0650\u0649\u0653 \u0623\u064E\u0630\u0652\u0643\u064F\u0631\u0652\u0643\u064F\u0645\u0652 \u0648\u064E\u0671\u0634\u0652\u0643\u064F\u0631\u064F\u0648\u0627\u06DF \u0644\u0650\u0649 \u0648\u064E\u0644\u064E\u0627 \u062A\u064E\u0643\u0652\u0641\u064F\u0631\u064F\u0648\u0646\u0650","Oleh itu ingatlah kamu kepadaKu (dengan mematuhi hukum dan undang-undangKu), supaya Aku membalas kamu dengan kebaikan; dan bersyukurlah kamu kepadaKu dan janganlah kamu kufur (akan nikmatKu).","So remember Me; I will remember you. And be grateful to Me and do not deny Me.",[[15,2,3],[12,12,14],[15,30,31],[17,38,40],[10,59,60]]],[96,1,"\u0628\u0650\u0633\u0652\u0645\u0650 \u0671\u0644\u0644\u0651\u064E\u0647\u0650 \u0671\u0644\u0631\u0651\u064E\u062D\u0652\u0645\u064E\u0670\u0646\u0650 \u0671\u0644\u0631\u0651\u064E\u062D\u0650\u064A\u0645\u0650 \u0671\u0642\u0652\u0631\u064E\u0623\u0652 \u0628\u0650\u0671\u0633\u0652\u0645\u0650 \u0631\u064E\u0628\u0651\u0650\u0643\u064E \u0671\u0644\u0651\u064E\u0630\u0650\u0649 \u062E\u064E\u0644\u064E\u0642\u064E","Bacalah (wahai Muhammad) dengan nama Tuhanmu yang menciptakan (sekalian makhluk).","Recite in the name of your Lord who created.",[[14,40,42],[15,49,50],[15,63,64],[14,75,76]]],[28,24,"\u0641\u064E\u0633\u064E\u0642\u064E\u0649\u0670 \u0644\u064E\u0647\u064F\u0645\u064E\u0627 \u062B\u064F\u0645\u0651\u064E \u062A\u064E\u0648\u064E\u0644\u0651\u064E\u0649\u0670\u0653 \u0625\u0650\u0644\u064E\u0649 \u0671\u0644\u0638\u0651\u0650\u0644\u0651\u0650 \u0641\u064E\u0642\u064E\u0627\u0644\u064E \u0631\u064E\u0628\u0651\u0650 \u0625\u0650\u0646\u0651\u0650\u0649 \u0644\u0650\u0645\u064E\u0627\u0653 \u0623\u064E\u0646\u0632\u064E\u0644\u0652\u062A\u064E \u0625\u0650\u0644\u064E\u0649\u0651\u064E \u0645\u0650\u0646\u0652 \u062E\u064E\u064A\u0652\u0631\u064D \u0641\u064E\u0642\u0650\u064A\u0631\u064C",'Maka Musa pun memberi minum kepada binatang-binatang ternak mereka, kemudian ia pergi ke tempat teduh lalu berdoa dengan berkata: "Wahai Tuhanku, sesungguhnya aku sangat berhajat kepada sebarang rezeki pemberian yang Engkau berikan."','So he watered [their flocks] for them; then he went back to the shade and said, "My Lord, indeed I am, for whatever good You would send down to me, in need."',[[0,19,22],[12,30,33],[15,40,41],[16,41,42],[0,65,68],[12,74,76],[6,79,82],[6,105,109],[10,111,112]]],[59,18,"\u064A\u064E\u0670\u0653\u0623\u064E\u064A\u0651\u064F\u0647\u064E\u0627 \u0671\u0644\u0651\u064E\u0630\u0650\u064A\u0646\u064E \u0621\u064E\u0627\u0645\u064E\u0646\u064F\u0648\u0627\u06DF \u0671\u062A\u0651\u064E\u0642\u064F\u0648\u0627\u06DF \u0671\u0644\u0644\u0651\u064E\u0647\u064E \u0648\u064E\u0644\u0652\u062A\u064E\u0646\u0638\u064F\u0631\u0652 \u0646\u064E\u0641\u0652\u0633\u064C \u0645\u0651\u064E\u0627 \u0642\u064E\u062F\u0651\u064E\u0645\u064E\u062A\u0652 \u0644\u0650\u063A\u064E\u062F\u064D \u0648\u064E\u0671\u062A\u0651\u064E\u0642\u064F\u0648\u0627\u06DF \u0671\u0644\u0644\u0651\u064E\u0647\u064E \u0625\u0650\u0646\u0651\u064E \u0671\u0644\u0644\u0651\u064E\u0647\u064E \u062E\u064E\u0628\u0650\u064A\u0631\u064C\u06E2 \u0628\u0650\u0645\u064E\u0627 \u062A\u064E\u0639\u0652\u0645\u064E\u0644\u064F\u0648\u0646\u064E","Wahai orang-orang yang beriman! Bertaqwalah kepada Allah (dengan mengerjakan suruhanNya dan meninggalkan laranganNya); dan hendaklah tiap-tiap diri melihat dan memerhatikan apa yang ia telah sediakan (dari amal-amalnya) untuk hari esok (hari akhirat). Dan (sekali lagi diingatkan): Bertaqwalah kepada Allah, sesungguhnya Allah Amat Meliputi PengetahuanNya akan segala yang kamu kerjakan.","O you who have believed, fear Allah. And let every soul look to what it has put forth for tomorrow - and fear Allah. Indeed, Allah is Acquainted with what you do.",[[12,2,4],[15,13,14],[17,31,33],[15,34,35],[17,41,43],[15,44,45],[6,58,61],[1,69,74],[1,91,95],[15,95,96],[17,102,104],[15,105,106],[0,115,118],[15,119,120],[8,133,137],[10,150,151]]],[6,162,"\u0642\u064F\u0644\u0652 \u0625\u0650\u0646\u0651\u064E \u0635\u064E\u0644\u064E\u0627\u062A\u0650\u0649 \u0648\u064E\u0646\u064F\u0633\u064F\u0643\u0650\u0649 \u0648\u064E\u0645\u064E\u062D\u0652\u064A\u064E\u0627\u0649\u064E \u0648\u064E\u0645\u064E\u0645\u064E\u0627\u062A\u0650\u0649 \u0644\u0650\u0644\u0651\u064E\u0647\u0650 \u0631\u064E\u0628\u0651\u0650 \u0671\u0644\u0652\u0639\u064E\u0670\u0644\u064E\u0645\u0650\u064A\u0646\u064E",'Katakanlah: "Sesungguhnya sembahyangku dan ibadatku, hidupku dan matiku, hanyalah untuk Allah Tuhan yang memelihara dan mentadbirkan sekalian alam."','Say, "Indeed, my prayer, my rites of sacrifice, my living and my dying are for Allah, Lord of the worlds."',[[0,7,10],[15,67,68],[9,72,73],[10,77,78]]],[17,9,"\u0625\u0650\u0646\u0651\u064E \u0647\u064E\u0670\u0630\u064E\u0627 \u0671\u0644\u0652\u0642\u064F\u0631\u0652\u0621\u064E\u0627\u0646\u064E \u064A\u064E\u0647\u0652\u062F\u0650\u0649 \u0644\u0650\u0644\u0651\u064E\u062A\u0650\u0649 \u0647\u0650\u0649\u064E \u0623\u064E\u0642\u0652\u0648\u064E\u0645\u064F \u0648\u064E\u064A\u064F\u0628\u064E\u0634\u0651\u0650\u0631\u064F \u0671\u0644\u0652\u0645\u064F\u0624\u0652\u0645\u0650\u0646\u0650\u064A\u0646\u064E \u0671\u0644\u0651\u064E\u0630\u0650\u064A\u0646\u064E \u064A\u064E\u0639\u0652\u0645\u064E\u0644\u064F\u0648\u0646\u064E \u0671\u0644\u0635\u0651\u064E\u0670\u0644\u0650\u062D\u064E\u0670\u062A\u0650 \u0623\u064E\u0646\u0651\u064E \u0644\u064E\u0647\u064F\u0645\u0652 \u0623\u064E\u062C\u0652\u0631\u064B\u0627 \u0643\u064E\u0628\u0650\u064A\u0631\u064B\u0627","Sesungguhnya Al-Quran ini memberi petunjuk ke jalan yang amat betul (ugama Islam), dan memberikan berita yang mengembirakan orang-orang yang beriman yang mengerjakan amal-amal soleh, bahawa mereka beroleh pahala yang besar.","Indeed, this Qur'an guides to that which is most suitable and gives good tidings to the believers who do righteous deeds that they will have a great reward.",[[0,2,5],[9,8,9],[15,13,14],[14,50,52],[15,69,70],[15,84,85],[15,106,107],[16,107,108],[9,111,112],[9,116,117],[0,122,125],[14,135,137],[6,138,143]]],[94,8,"\u0648\u064E\u0625\u0650\u0644\u064E\u0649\u0670 \u0631\u064E\u0628\u0651\u0650\u0643\u064E \u0641\u064E\u0671\u0631\u0652\u063A\u064E\u0628","Dan kepada Tuhanmu sahaja hendaklah engkau memohon (apa yang engkau gemar dan ingini).","And to your Lord direct [your] longing.",[[15,19,20],[14,24,25]]],[31,17,"\u064A\u064E\u0670\u0628\u064F\u0646\u064E\u0649\u0651\u064E \u0623\u064E\u0642\u0650\u0645\u0650 \u0671\u0644\u0635\u0651\u064E\u0644\u064E\u0648\u0670\u0629\u064E \u0648\u064E\u0623\u0652\u0645\u064F\u0631\u0652 \u0628\u0650\u0671\u0644\u0652\u0645\u064E\u0639\u0652\u0631\u064F\u0648\u0641\u0650 \u0648\u064E\u0671\u0646\u0652\u0647\u064E \u0639\u064E\u0646\u0650 \u0671\u0644\u0652\u0645\u064F\u0646\u0643\u064E\u0631\u0650 \u0648\u064E\u0671\u0635\u0652\u0628\u0650\u0631\u0652 \u0639\u064E\u0644\u064E\u0649\u0670 \u0645\u064E\u0627\u0653 \u0623\u064E\u0635\u064E\u0627\u0628\u064E\u0643\u064E \u0625\u0650\u0646\u0651\u064E \u0630\u064E\u0670\u0644\u0650\u0643\u064E \u0645\u0650\u0646\u0652 \u0639\u064E\u0632\u0652\u0645\u0650 \u0671\u0644\u0652\u0623\u064F\u0645\u064F\u0648\u0631\u0650","Wahai anak kesayanganku, dirikanlah sembahyang, dan suruhlah berbuat kebaikan, serta laranglah daripada melakukan perbuatan yang mungkar, dan bersabarlah atas segala bala bencana yang menimpamu. Sesungguhnya yang demikian itu adalah dari perkara-perkara yang dikehendaki diambil berat melakukannya.","O my son, establish prayer, enjoin what is right, forbid what is wrong, and be patient over what befalls you. Indeed, [all] that is of the matters [requiring] determination.",[[9,2,3],[15,18,19],[16,19,20],[17,25,26],[9,26,27],[15,41,42],[15,56,57],[15,67,68],[6,72,75],[15,80,81],[12,97,99],[0,112,115],[9,118,119],[15,136,137],[10,143,144]]],[38,29,"\u0643\u0650\u062A\u064E\u0670\u0628\u064C \u0623\u064E\u0646\u0632\u064E\u0644\u0652\u0646\u064E\u0670\u0647\u064F \u0625\u0650\u0644\u064E\u064A\u0652\u0643\u064E \u0645\u064F\u0628\u064E\u0670\u0631\u064E\u0643\u064C \u0644\u0651\u0650\u064A\u064E\u062F\u0651\u064E\u0628\u0651\u064E\u0631\u064F\u0648\u0653\u0627\u06DF \u0621\u064E\u0627\u064A\u064E\u0670\u062A\u0650\u0647\u0650\u06E6 \u0648\u064E\u0644\u0650\u064A\u064E\u062A\u064E\u0630\u064E\u0643\u0651\u064E\u0631\u064E \u0623\u064F\u0648\u06DF\u0644\u064F\u0648\u0627\u06DF \u0671\u0644\u0652\u0623\u064E\u0644\u0652\u0628\u064E\u0670\u0628\u0650","(Al-Quran ini) sebuah Kitab yang Kami turunkan kepadamu (dan umatmu wahai Muhammad), -Kitab yang banyak faedah-faedah dan manfaatnya, untuk mereka memahami dengan teliti kandungan ayat-ayatnya, dan untuk orang-orang yang berakal sempurna beringat mengambil iktibar.","[This is] a blessed Book which We have revealed to you, [O Muhammad], that they might reflect upon its verses and that those of understanding would be reminded.",[[9,4,5],[6,10,13],[9,17,18],[9,34,35],[2,38,43],[12,53,55],[17,55,57],[9,63,64],[9,68,69],[17,88,90],[17,93,95],[15,96,97],[10,105,106],[14,106,107]]],[71,10,"\u0641\u064E\u0642\u064F\u0644\u0652\u062A\u064F \u0671\u0633\u0652\u062A\u064E\u063A\u0652\u0641\u0650\u0631\u064F\u0648\u0627\u06DF \u0631\u064E\u0628\u0651\u064E\u0643\u064F\u0645\u0652 \u0625\u0650\u0646\u0651\u064E\u0647\u064F\u06E5 \u0643\u064E\u0627\u0646\u064E \u063A\u064E\u0641\u0651\u064E\u0627\u0631\u064B\u0627",'Sehingga aku berkata (kepada mereka): "Pohonkanlah ampun kepada Tuhan kamu, sesungguhnya adalah Ia Maha Pengampun."',"And said, 'Ask forgiveness of your Lord. Indeed, He is ever a Perpetual Forgiver.'",[[15,9,10],[17,21,23],[0,36,39],[9,41,42]]],[40,60,"\u0648\u064E\u0642\u064E\u0627\u0644\u064E \u0631\u064E\u0628\u0651\u064F\u0643\u064F\u0645\u064F \u0671\u062F\u0652\u0639\u064F\u0648\u0646\u0650\u0649\u0653 \u0623\u064E\u0633\u0652\u062A\u064E\u062C\u0650\u0628\u0652 \u0644\u064E\u0643\u064F\u0645\u0652 \u0625\u0650\u0646\u0651\u064E \u0671\u0644\u0651\u064E\u0630\u0650\u064A\u0646\u064E \u064A\u064E\u0633\u0652\u062A\u064E\u0643\u0652\u0628\u0650\u0631\u064F\u0648\u0646\u064E \u0639\u064E\u0646\u0652 \u0639\u0650\u0628\u064E\u0627\u062F\u064E\u062A\u0650\u0649 \u0633\u064E\u064A\u064E\u062F\u0652\u062E\u064F\u0644\u064F\u0648\u0646\u064E \u062C\u064E\u0647\u064E\u0646\u0651\u064E\u0645\u064E \u062F\u064E\u0627\u062E\u0650\u0631\u0650\u064A\u0646\u064E",'Dan Tuhan kamu berfirman: "Berdoalah kamu kepadaKu nescaya Aku perkenankan doa permohonan kamu. Sesungguhnya orang-orang yang sombong takbur daripada beribadat dan berdoa kepadaKu, akan masuk neraka Jahannam dalam keadaan hina."','And your Lord says, "Call upon Me; I will respond to you." Indeed, those who disdain My worship will enter Hell [rendered] contemptible.',[[15,18,19],[14,19,21],[12,26,28],[14,37,39],[0,49,52],[15,53,54],[14,99,101],[0,113,116],[10,126,127]]],[2,45,"\u0648\u064E\u0671\u0633\u0652\u062A\u064E\u0639\u0650\u064A\u0646\u064F\u0648\u0627\u06DF \u0628\u0650\u0671\u0644\u0635\u0651\u064E\u0628\u0652\u0631\u0650 \u0648\u064E\u0671\u0644\u0635\u0651\u064E\u0644\u064E\u0648\u0670\u0629\u0650 \u0648\u064E\u0625\u0650\u0646\u0651\u064E\u0647\u064E\u0627 \u0644\u064E\u0643\u064E\u0628\u0650\u064A\u0631\u064E\u0629\u064C \u0625\u0650\u0644\u0651\u064E\u0627 \u0639\u064E\u0644\u064E\u0649 \u0671\u0644\u0652\u062E\u064E\u0670\u0634\u0650\u0639\u0650\u064A\u0646\u064E","Dan mintalah pertolongan (kepada Allah) dengan jalan sabar dan mengerjakan sembahyang; dan sesungguhnya sembahyang itu amatlah berat kecuali kepada orang-orang yang khusyuk.","And seek help through patience and prayer, and indeed, it is difficult except for the humbly submissive [to Allah].",[[15,2,3],[17,13,15],[15,18,19],[16,19,20],[14,23,25],[15,30,31],[16,31,32],[17,37,38],[9,38,39],[0,46,49],[15,78,79],[9,83,84],[10,88,89]]],[9,51,"\u0642\u064F\u0644 \u0644\u0651\u064E\u0646 \u064A\u064F\u0635\u0650\u064A\u0628\u064E\u0646\u064E\u0627\u0653 \u0625\u0650\u0644\u0651\u064E\u0627 \u0645\u064E\u0627 \u0643\u064E\u062A\u064E\u0628\u064E \u0671\u0644\u0644\u0651\u064E\u0647\u064F \u0644\u064E\u0646\u064E\u0627 \u0647\u064F\u0648\u064E \u0645\u064E\u0648\u0652\u0644\u064E\u0649\u0670\u0646\u064E\u0627 \u0648\u064E\u0639\u064E\u0644\u064E\u0649 \u0671\u0644\u0644\u0651\u064E\u0647\u0650 \u0641\u064E\u0644\u0652\u064A\u064E\u062A\u064E\u0648\u064E\u0643\u0651\u064E\u0644\u0650 \u0671\u0644\u0652\u0645\u064F\u0624\u0652\u0645\u0650\u0646\u064F\u0648\u0646\u064E",'Katakanlah (wahai Muhammad): "Tidak sekali-kali akan menimpa kami sesuatu pun melainkan apa yang telah ditetapkan Allah bagi kami. Dia lah Pelindung yang menyelamatkan kami, dan (dengan kepercayaan itu) maka kepada Allah jualah hendaknya orang-orang yang beriman bertawakal."','Say, "Never will we be struck except by what Allah has decreed for us; He is our protector." And upon Allah let the believers rely.',[[1,7,11],[12,18,20],[15,39,40],[9,65,66],[15,78,79],[15,102,103],[10,113,114]]],[20,114,"\u0641\u064E\u062A\u064E\u0639\u064E\u0670\u0644\u064E\u0649 \u0671\u0644\u0644\u0651\u064E\u0647\u064F \u0671\u0644\u0652\u0645\u064E\u0644\u0650\u0643\u064F \u0671\u0644\u0652\u062D\u064E\u0642\u0651\u064F \u0648\u064E\u0644\u064E\u0627 \u062A\u064E\u0639\u0652\u062C\u064E\u0644\u0652 \u0628\u0650\u0671\u0644\u0652\u0642\u064F\u0631\u0652\u0621\u064E\u0627\u0646\u0650 \u0645\u0650\u0646 \u0642\u064E\u0628\u0652\u0644\u0650 \u0623\u064E\u0646 \u064A\u064F\u0642\u0652\u0636\u064E\u0649\u0670\u0653 \u0625\u0650\u0644\u064E\u064A\u0652\u0643\u064E \u0648\u064E\u062D\u0652\u064A\u064F\u0647\u064F\u06E5 \u0648\u064E\u0642\u064F\u0644 \u0631\u0651\u064E\u0628\u0651\u0650 \u0632\u0650\u062F\u0652\u0646\u0650\u0649 \u0639\u0650\u0644\u0652\u0645\u064B\u0627",'Maka Maha Tinggilah Allah, yang Menguasai seluruh alam, lagi Yang Benar (pada segala-galanya). Dan janganlah engkau (wahai Muhammad) tergesa-gesa membaca Al-Quran sebelum selesai dibacakan oleh Jibril kepadamu, dan berdoalah dengan berkata: "Wahai Tuhanku, tambahilah ilmuku."',`So high [above all] is Allah, the Sovereign, the Truth. And, [O Muhammad], do not hasten with [recitation of] the Qur'an before its revelation is completed to you, and say, "My Lord, increase me in knowledge."`,[[9,6,7],[15,11,12],[15,19,20],[15,29,30],[15,55,56],[6,70,74],[14,74,76],[1,81,85],[14,85,87],[12,89,92],[9,110,111],[4,116,117],[14,127,129]]],[2,186,"\u0648\u064E\u0625\u0650\u0630\u064E\u0627 \u0633\u064E\u0623\u064E\u0644\u064E\u0643\u064E \u0639\u0650\u0628\u064E\u0627\u062F\u0650\u0649 \u0639\u064E\u0646\u0651\u0650\u0649 \u0641\u064E\u0625\u0650\u0646\u0651\u0650\u0649 \u0642\u064E\u0631\u0650\u064A\u0628\u064C \u0623\u064F\u062C\u0650\u064A\u0628\u064F \u062F\u064E\u0639\u0652\u0648\u064E\u0629\u064E \u0671\u0644\u062F\u0651\u064E\u0627\u0639\u0650 \u0625\u0650\u0630\u064E\u0627 \u062F\u064E\u0639\u064E\u0627\u0646\u0650 \u0641\u064E\u0644\u0652\u064A\u064E\u0633\u0652\u062A\u064E\u062C\u0650\u064A\u0628\u064F\u0648\u0627\u06DF \u0644\u0650\u0649 \u0648\u064E\u0644\u0652\u064A\u064F\u0624\u0652\u0645\u0650\u0646\u064F\u0648\u0627\u06DF \u0628\u0650\u0649 \u0644\u064E\u0639\u064E\u0644\u0651\u064E\u0647\u064F\u0645\u0652 \u064A\u064E\u0631\u0652\u0634\u064F\u062F\u064F\u0648\u0646\u064E","Dan apabila hamba-hambaKu bertanya kepadamu mengenai Aku maka (beritahu kepada mereka): sesungguhnya Aku (Allah) sentiasa hampir (kepada mereka); Aku perkenankan permohonan orang yang berdoa apabila ia berdoa kepadaKu. Maka hendaklah mereka menyahut seruanku (dengan mematuhi perintahKu), dan hendaklah mereka beriman kepadaKu supaya mereka menjadi baik serta betul.","And when My servants ask you, [O Muhammad], concerning Me - indeed I am near. I respond to the invocation of the supplicant when he calls upon Me. So let them respond to Me [by obedience] and believe in Me that they may be [rightly] guided.",[[0,28,31],[0,37,40],[15,67,68],[16,68,69],[17,106,108],[17,126,128],[10,153,154]]],[3,190,"\u0625\u0650\u0646\u0651\u064E \u0641\u0650\u0649 \u062E\u064E\u0644\u0652\u0642\u0650 \u0671\u0644\u0633\u0651\u064E\u0645\u064E\u0670\u0648\u064E\u0670\u062A\u0650 \u0648\u064E\u0671\u0644\u0652\u0623\u064E\u0631\u0652\u0636\u0650 \u0648\u064E\u0671\u062E\u0652\u062A\u0650\u0644\u064E\u0670\u0641\u0650 \u0671\u0644\u0651\u064E\u064A\u0652\u0644\u0650 \u0648\u064E\u0671\u0644\u0646\u0651\u064E\u0647\u064E\u0627\u0631\u0650 \u0644\u064E\u0621\u064E\u0627\u064A\u064E\u0670\u062A\u064D \u0644\u0651\u0650\u0623\u064F\u0648\u06DF\u0644\u0650\u0649 \u0671\u0644\u0652\u0623\u064E\u0644\u0652\u0628\u064E\u0670\u0628\u0650","Sesungguhnya pada kejadian langit dan bumi, dan pada pertukaran malam dan siang, ada tanda-tanda (kekuasaan, kebijaksanaan, dan keluasan rahmat Allah) bagi orang-orang yang berakal.","Indeed, in the creation of the heavens and the earth and the alternation of the night and the day are signs for those of understanding.",[[0,2,5],[15,17,18],[16,18,19],[9,24,25],[9,27,28],[15,33,34],[15,45,46],[9,52,53],[15,56,57],[15,67,68],[16,68,69],[0,69,72],[9,85,86],[2,87,92],[17,94,96],[15,100,101],[10,109,110],[14,110,111]]],[14,40,"\u0631\u064E\u0628\u0651\u0650 \u0671\u062C\u0652\u0639\u064E\u0644\u0652\u0646\u0650\u0649 \u0645\u064F\u0642\u0650\u064A\u0645\u064E \u0671\u0644\u0635\u0651\u064E\u0644\u064E\u0648\u0670\u0629\u0650 \u0648\u064E\u0645\u0650\u0646 \u0630\u064F\u0631\u0651\u0650\u064A\u0651\u064E\u062A\u0650\u0649 \u0631\u064E\u0628\u0651\u064E\u0646\u064E\u0627 \u0648\u064E\u062A\u064E\u0642\u064E\u0628\u0651\u064E\u0644\u0652 \u062F\u064F\u0639\u064E\u0627\u0653\u0621\u0650","Wahai Tuhanku! Jadikanlah daku orang yang mendirikan sembahyang dan demikianlah juga zuriat keturunanku. Wahai Tuhan kami, perkenankanlah doa permohonanku.","My Lord, make me an establisher of prayer, and [many] from my descendants. Our Lord, and accept my supplication.",[[15,6,7],[14,7,9],[15,25,26],[16,26,27],[17,32,33],[9,33,34],[6,41,45],[11,80,82]]],[55,13,"\u0641\u064E\u0628\u0650\u0623\u064E\u0649\u0651\u0650 \u0621\u064E\u0627\u0644\u064E\u0627\u0653\u0621\u0650 \u0631\u064E\u0628\u0651\u0650\u0643\u064F\u0645\u064E\u0627 \u062A\u064F\u0643\u064E\u0630\u0651\u0650\u0628\u064E\u0627\u0646\u0650","Maka yang mana satu di antara nikmat-nikmat Tuhan kamu, yang kamu hendak dustakan (wahai umat manusia dan jin).","So which of the favors of your Lord would you deny.",[[11,15,17],[10,40,41]]],[26,62,"\u0642\u064E\u0627\u0644\u064E \u0643\u064E\u0644\u0651\u064E\u0627\u0653 \u0625\u0650\u0646\u0651\u064E \u0645\u064E\u0639\u0650\u0649\u064E \u0631\u064E\u0628\u0651\u0650\u0649 \u0633\u064E\u064A\u064E\u0647\u0652\u062F\u0650\u064A\u0646\u0650",'Nabi Musa menjawab: "Tidak! Jangan fikir (akan berlaku yang demikian)! Sesungguhnya aku sentiasa disertai oleh Tuhanku (dengan pemuliharaan dan pertolonganNya), Ia akan menunjuk jalan kepadaku."','[Moses] said, "No! Indeed, with me is my Lord; He will guide me."',[[12,11,13],[0,16,19],[10,42,43]]],[93,5,"\u0648\u064E\u0644\u064E\u0633\u064E\u0648\u0652\u0641\u064E \u064A\u064F\u0639\u0652\u0637\u0650\u064A\u0643\u064E \u0631\u064E\u0628\u0651\u064F\u0643\u064E \u0641\u064E\u062A\u064E\u0631\u0652\u0636\u064E\u0649\u0670\u0653","Dan sesungguhnya Tuhanmu akan memberikanmu (kejayaan dan kebahagiaan di dunia dan di akhirat) sehingga engkau reda - berpuas hati.","And your Lord is going to give you, and you will be satisfied.",[]],[7,56,"\u0648\u064E\u0644\u064E\u0627 \u062A\u064F\u0641\u0652\u0633\u0650\u062F\u064F\u0648\u0627\u06DF \u0641\u0650\u0649 \u0671\u0644\u0652\u0623\u064E\u0631\u0652\u0636\u0650 \u0628\u064E\u0639\u0652\u062F\u064E \u0625\u0650\u0635\u0652\u0644\u064E\u0670\u062D\u0650\u0647\u064E\u0627 \u0648\u064E\u0671\u062F\u0652\u0639\u064F\u0648\u0647\u064F \u062E\u064E\u0648\u0652\u0641\u064B\u0627 \u0648\u064E\u0637\u064E\u0645\u064E\u0639\u064B\u0627 \u0625\u0650\u0646\u0651\u064E \u0631\u064E\u062D\u0652\u0645\u064E\u062A\u064E \u0671\u0644\u0644\u0651\u064E\u0647\u0650 \u0642\u064E\u0631\u0650\u064A\u0628\u064C \u0645\u0651\u0650\u0646\u064E \u0671\u0644\u0652\u0645\u064F\u062D\u0652\u0633\u0650\u0646\u0650\u064A\u0646\u064E","Dan janganlah kamu berbuat kerosakan di bumi sesudah Allah menyediakan segala yang membawa kebaikan padanya, dan berdoalah kepadaNya dengan perasaan bimbang (kalau-kalau tidak diterima) dan juga dengan perasaan terlalu mengharapkan (supaya makbul). Sesungguhnya rahmat Allah itu dekat kepada orang-orang yang memperbaiki amalannya.","And cause not corruption upon the earth after its reformation. And invoke Him in fear and aspiration. Indeed, the mercy of Allah is near to the doers of good.",[[17,15,17],[15,22,23],[9,45,46],[15,54,55],[14,55,57],[1,68,73],[0,83,86],[15,96,97],[1,110,115],[15,118,119],[10,129,130]]],[93,3,"\u0645\u064E\u0627 \u0648\u064E\u062F\u0651\u064E\u0639\u064E\u0643\u064E \u0631\u064E\u0628\u0651\u064F\u0643\u064E \u0648\u064E\u0645\u064E\u0627 \u0642\u064E\u0644\u064E\u0649\u0670","(Bahawa) Tuhanmu (wahai Muhammad) tidak meninggalkanmu, dan Ia tidak benci (kepadamu, sebagaimana yang dituduh oleh kaum musyrik).","Your Lord has not taken leave of you, [O Muhammad], nor has He detested [you].",[]],[29,69,"\u0648\u064E\u0671\u0644\u0651\u064E\u0630\u0650\u064A\u0646\u064E \u062C\u064E\u0670\u0647\u064E\u062F\u064F\u0648\u0627\u06DF \u0641\u0650\u064A\u0646\u064E\u0627 \u0644\u064E\u0646\u064E\u0647\u0652\u062F\u0650\u064A\u064E\u0646\u0651\u064E\u0647\u064F\u0645\u0652 \u0633\u064F\u0628\u064F\u0644\u064E\u0646\u064E\u0627 \u0648\u064E\u0625\u0650\u0646\u0651\u064E \u0671\u0644\u0644\u0651\u064E\u0647\u064E \u0644\u064E\u0645\u064E\u0639\u064E \u0671\u0644\u0652\u0645\u064F\u062D\u0652\u0633\u0650\u0646\u0650\u064A\u0646\u064E","Dan orang-orang yang berusaha dengan bersungguh-sungguh kerana memenuhi kehendak ugama Kami, sesungguhnya Kami akan memimpin mereka ke jalan-jalan Kami (yang menjadikan mereka bergembira serta beroleh keredaan); dan sesungguhnya (pertolongan dan bantuan) Allah adalah berserta orang-orang yang berusaha membaiki amalannya.","And those who strive for Us - We will surely guide them to Our ways. And indeed, Allah is with the doers of good.",[[15,2,3],[9,14,15],[17,20,22],[0,40,43],[0,62,65],[15,66,67],[15,81,82],[10,92,93]]],[3,139,"\u0648\u064E\u0644\u064E\u0627 \u062A\u064E\u0647\u0650\u0646\u064F\u0648\u0627\u06DF \u0648\u064E\u0644\u064E\u0627 \u062A\u064E\u062D\u0652\u0632\u064E\u0646\u064F\u0648\u0627\u06DF \u0648\u064E\u0623\u064E\u0646\u062A\u064F\u0645\u064F \u0671\u0644\u0652\u0623\u064E\u0639\u0652\u0644\u064E\u0648\u0652\u0646\u064E \u0625\u0650\u0646 \u0643\u064F\u0646\u062A\u064F\u0645 \u0645\u0651\u064F\u0624\u0652\u0645\u0650\u0646\u0650\u064A\u0646\u064E","Dan janganlah kamu merasa lemah (dalam perjuangan mempertahan dan menegakkan Islam), dan janganlah kamu berdukacita (terhadap apa yang akan menimpa kamu), padahal kamulah orang-orang yang tertinggi (mengatasi musuh dengan mencapai kemenangan) jika kamu orang-orang yang (sungguh-sungguh) beriman.","So do not weaken and do not grieve, and you will be superior if you are [true] believers.",[[17,13,15],[17,31,33],[6,38,41],[15,44,45],[6,60,64],[6,64,67],[5,67,72],[10,78,79]]],[23,1,"\u0628\u0650\u0633\u0652\u0645\u0650 \u0671\u0644\u0644\u0651\u064E\u0647\u0650 \u0671\u0644\u0631\u0651\u064E\u062D\u0652\u0645\u064E\u0670\u0646\u0650 \u0671\u0644\u0631\u0651\u064E\u062D\u0650\u064A\u0645\u0650 \u0642\u064E\u062F\u0652 \u0623\u064E\u0641\u0652\u0644\u064E\u062D\u064E \u0671\u0644\u0652\u0645\u064F\u0624\u0652\u0645\u0650\u0646\u064F\u0648\u0646\u064E","Sesungguhnya berjayalah orang-orang yang beriman.","Certainly will the believers have succeeded.",[[14,41,43],[15,53,54],[10,64,65]]],[94,6,"\u0625\u0650\u0646\u0651\u064E \u0645\u064E\u0639\u064E \u0671\u0644\u0652\u0639\u064F\u0633\u0652\u0631\u0650 \u064A\u064F\u0633\u0652\u0631\u064B\u0627","(Sekali lagi ditegaskan): bahawa sesungguhnya tiap-tiap kesukaran disertai kemudahan.","Indeed, with hardship [will be] ease.",[[0,2,5],[15,11,12]]],[42,19,"\u0671\u0644\u0644\u0651\u064E\u0647\u064F \u0644\u064E\u0637\u0650\u064A\u0641\u064C\u06E2 \u0628\u0650\u0639\u0650\u0628\u064E\u0627\u062F\u0650\u0647\u0650\u06E6 \u064A\u064E\u0631\u0652\u0632\u064F\u0642\u064F \u0645\u064E\u0646 \u064A\u064E\u0634\u064E\u0627\u0653\u0621\u064F \u0648\u064E\u0647\u064F\u0648\u064E \u0671\u0644\u0652\u0642\u064E\u0648\u0650\u0649\u0651\u064F \u0671\u0644\u0652\u0639\u064E\u0632\u0650\u064A\u0632\u064F","Allah Maha Lembut tadbirNya (serta melimpah-limpah kebaikan dan belas kasihanNya) kepada hamba-hambaNya; Ia memberi rezeki kepada sesiapa yang dikehendakiNya (menurut peraturan yang telah ditetapkan), dan Dia lah Yang Maha Kuat, lagi Maha Kuasa.","Allah is Subtle with His servants; He gives provisions to whom He wills. And He is the Powerful, the Exalted in Might.",[[8,14,18],[9,28,29],[1,41,45],[11,47,49],[15,59,60],[15,70,71],[10,77,78]]],[87,14,"\u0642\u064E\u062F\u0652 \u0623\u064E\u0641\u0652\u0644\u064E\u062D\u064E \u0645\u064E\u0646 \u062A\u064E\u0632\u064E\u0643\u0651\u064E\u0649\u0670","Sesungguhnya berjayalah orang yang - setelah menerima peringatan itu - berusaha membersihkan dirinya (dengan taat dan amal yang soleh).","He has certainly succeeded who purifies himself.",[[14,2,4],[6,16,20]]],[20,25,"\u0642\u064E\u0627\u0644\u064E \u0631\u064E\u0628\u0651\u0650 \u0671\u0634\u0652\u0631\u064E\u062D\u0652 \u0644\u0650\u0649 \u0635\u064E\u062F\u0652\u0631\u0650\u0649",'Nabi Musa berdoa dengan berkata: "Wahai Tuhanku, lapangkanlah bagiku, dadaku."','[Moses] said, "My Lord, expand for me my breast [with assurance]."',[[15,12,13],[14,26,28]]],[18,10,"\u0625\u0650\u0630\u0652 \u0623\u064E\u0648\u064E\u0649 \u0671\u0644\u0652\u0641\u0650\u062A\u0652\u064A\u064E\u0629\u064F \u0625\u0650\u0644\u064E\u0649 \u0671\u0644\u0652\u0643\u064E\u0647\u0652\u0641\u0650 \u0641\u064E\u0642\u064E\u0627\u0644\u064F\u0648\u0627\u06DF \u0631\u064E\u0628\u0651\u064E\u0646\u064E\u0627\u0653 \u0621\u064E\u0627\u062A\u0650\u0646\u064E\u0627 \u0645\u0650\u0646 \u0644\u0651\u064E\u062F\u064F\u0646\u0643\u064E \u0631\u064E\u062D\u0652\u0645\u064E\u0629\u064B \u0648\u064E\u0647\u064E\u064A\u0651\u0650\u0626\u0652 \u0644\u064E\u0646\u064E\u0627 \u0645\u0650\u0646\u0652 \u0623\u064E\u0645\u0652\u0631\u0650\u0646\u064E\u0627 \u0631\u064E\u0634\u064E\u062F\u064B\u0627",'(Ingatkanlah peristiwa) ketika serombongan orang-orang muda pergi ke gua, lalu mereka berdoa: "Wahai Tuhan kami! Kurniakanlah kami rahmat dari sisiMu, dan berilah kemudahan-kemudahan serta pimpinan kepada kami untuk keselamatan ugama kami."','[Mention] when the youths retreated to the cave and said, "Our Lord, grant us from Yourself mercy and prepare for us from our affair right guidance."',[[15,11,12],[15,29,30],[17,47,49],[12,57,59],[2,71,76],[6,78,81],[1,89,93]]],[33,41,"\u064A\u064E\u0670\u0653\u0623\u064E\u064A\u0651\u064F\u0647\u064E\u0627 \u0671\u0644\u0651\u064E\u0630\u0650\u064A\u0646\u064E \u0621\u064E\u0627\u0645\u064E\u0646\u064F\u0648\u0627\u06DF \u0671\u0630\u0652\u0643\u064F\u0631\u064F\u0648\u0627\u06DF \u0671\u0644\u0644\u0651\u064E\u0647\u064E \u0630\u0650\u0643\u0652\u0631\u064B\u0627 \u0643\u064E\u062B\u0650\u064A\u0631\u064B\u0627","Wahai orang-orang yang beriman, (untuk bersyukur kepada Allah) ingatlah serta sebutlah nama Allah dengan ingatan serta sebutan yang sebanyak-banyaknya.","O you who have believed, remember Allah with much remembrance.",[[12,2,4],[15,13,14],[17,31,33],[15,34,35],[17,42,44],[15,45,46],[6,58,63]]],[51,56,"\u0648\u064E\u0645\u064E\u0627 \u062E\u064E\u0644\u064E\u0642\u0652\u062A\u064F \u0671\u0644\u0652\u062C\u0650\u0646\u0651\u064E \u0648\u064E\u0671\u0644\u0652\u0625\u0650\u0646\u0633\u064E \u0625\u0650\u0644\u0651\u064E\u0627 \u0644\u0650\u064A\u064E\u0639\u0652\u0628\u064F\u062F\u064F\u0648\u0646\u0650","Dan (ingatlah) Aku tidak menciptakan jin dan manusia melainkan untuk mereka menyembah dan beribadat kepadaKu.","And I did not create the jinn and mankind except to worship Me.",[[14,10,12],[15,15,16],[0,20,23],[15,26,27],[6,31,34],[10,52,53]]],[17,82,"\u0648\u064E\u0646\u064F\u0646\u064E\u0632\u0651\u0650\u0644\u064F \u0645\u0650\u0646\u064E \u0671\u0644\u0652\u0642\u064F\u0631\u0652\u0621\u064E\u0627\u0646\u0650 \u0645\u064E\u0627 \u0647\u064F\u0648\u064E \u0634\u0650\u0641\u064E\u0627\u0653\u0621\u064C \u0648\u064E\u0631\u064E\u062D\u0652\u0645\u064E\u0629\u064C \u0644\u0651\u0650\u0644\u0652\u0645\u064F\u0624\u0652\u0645\u0650\u0646\u0650\u064A\u0646\u064E \u0648\u064E\u0644\u064E\u0627 \u064A\u064E\u0632\u0650\u064A\u062F\u064F \u0671\u0644\u0638\u0651\u064E\u0670\u0644\u0650\u0645\u0650\u064A\u0646\u064E \u0625\u0650\u0644\u0651\u064E\u0627 \u062E\u064E\u0633\u064E\u0627\u0631\u064B\u0627","Dan Kami turunkan dengan beransur-ansur dari Al-Quran Aya-ayat Suci yang menjadi ubat penawar dan rahmat bagi orang-orang yang beriman kepadanya; dan (sebaliknya) Al-Quran tidak menambahkan orang-orang yang zalim (disebabkan keingkaran mereka) melainkan kerugian jua.","And We send down of the Qur'an that which is healing and mercy for the believers, but it does not increase the wrongdoers except in loss.",[[15,17,18],[11,43,45],[1,46,50],[2,57,62],[15,90,91],[16,91,92],[9,95,96]]],[94,5,"\u0641\u064E\u0625\u0650\u0646\u0651\u064E \u0645\u064E\u0639\u064E \u0671\u0644\u0652\u0639\u064F\u0633\u0652\u0631\u0650 \u064A\u064F\u0633\u0652\u0631\u064B\u0627","Oleh itu, maka (tetapkanlah kepercayaanmu) bahawa sesungguhnya tiap-tiap kesukaran disertai kemudahan.","For indeed, with hardship [will be] ease.",[[0,4,7],[15,13,14]]],[11,6,"\u0648\u064E\u0645\u064E\u0627 \u0645\u0650\u0646 \u062F\u064E\u0627\u0653\u0628\u0651\u064E\u0629\u064D \u0641\u0650\u0649 \u0671\u0644\u0652\u0623\u064E\u0631\u0652\u0636\u0650 \u0625\u0650\u0644\u0651\u064E\u0627 \u0639\u064E\u0644\u064E\u0649 \u0671\u0644\u0644\u0651\u064E\u0647\u0650 \u0631\u0650\u0632\u0652\u0642\u064F\u0647\u064E\u0627 \u0648\u064E\u064A\u064E\u0639\u0652\u0644\u064E\u0645\u064F \u0645\u064F\u0633\u0652\u062A\u064E\u0642\u064E\u0631\u0651\u064E\u0647\u064E\u0627 \u0648\u064E\u0645\u064F\u0633\u0652\u062A\u064E\u0648\u0652\u062F\u064E\u0639\u064E\u0647\u064E\u0627 \u0643\u064F\u0644\u0651\u064C \u0641\u0650\u0649 \u0643\u0650\u062A\u064E\u0670\u0628\u064D \u0645\u0651\u064F\u0628\u0650\u064A\u0646\u064D","Dan tiadalah sesuatupun dari makhluk-makhluk yang bergerak di bumi melainkan Allah jualah yang menanggung rezekinya dan mengetahui tempat kediamannya dan tempat ia disimpan. Semuanya itu tersurat di dalam Kitab (Lauh mahfuz) yang nyata (kepada malaikat-malaikat yang berkenaan).","And there is no creature on earth but that upon Allah is its provision, and He knows its place of dwelling and place of storage. All is in a clear register.",[[6,8,12],[13,12,14],[6,18,22],[15,24,25],[15,47,48],[6,113,117],[9,123,124],[1,125,130],[10,132,133]]],[12,87,"\u064A\u064E\u0670\u0628\u064E\u0646\u0650\u0649\u0651\u064E \u0671\u0630\u0652\u0647\u064E\u0628\u064F\u0648\u0627\u06DF \u0641\u064E\u062A\u064E\u062D\u064E\u0633\u0651\u064E\u0633\u064F\u0648\u0627\u06DF \u0645\u0650\u0646 \u064A\u064F\u0648\u0633\u064F\u0641\u064E \u0648\u064E\u0623\u064E\u062E\u0650\u064A\u0647\u0650 \u0648\u064E\u0644\u064E\u0627 \u062A\u064E\u0627\u06DF\u064A\u0652\u0640\u0654\u064E\u0633\u064F\u0648\u0627\u06DF \u0645\u0650\u0646 \u0631\u0651\u064E\u0648\u0652\u062D\u0650 \u0671\u0644\u0644\u0651\u064E\u0647\u0650 \u0625\u0650\u0646\u0651\u064E\u0647\u064F\u06E5 \u0644\u064E\u0627 \u064A\u064E\u0627\u06DF\u064A\u0652\u0640\u0654\u064E\u0633\u064F \u0645\u0650\u0646 \u0631\u0651\u064E\u0648\u0652\u062D\u0650 \u0671\u0644\u0644\u0651\u064E\u0647\u0650 \u0625\u0650\u0644\u0651\u064E\u0627 \u0671\u0644\u0652\u0642\u064E\u0648\u0652\u0645\u064F \u0671\u0644\u0652\u0643\u064E\u0670\u0641\u0650\u0631\u064F\u0648\u0646\u064E","Wahai anak-anakku! Pergilah dan intiplah khabar berita mengenai Yusuf dan saudaranya (Bunyamin), dan janganlah kamu berputus asa dari rahmat serta pertolongan Allah. Sesungguhnya tidak berputus asa dari rahmat dan pertolongan Allah itu melainkan kaum yang kafir.","O my sons, go and find out about Joseph and his brother and despair not of relief from Allah. Indeed, no one despairs of relief from Allah except the disbelieving people.",[[9,2,3],[15,11,12],[17,19,21],[17,34,36],[1,39,43],[17,67,69],[17,77,79],[2,82,87],[15,92,93],[0,102,105],[9,107,108],[17,115,117],[2,127,132],[15,137,138],[15,152,153],[15,162,163],[9,167,168],[10,172,173]]],[3,92,"\u0644\u064E\u0646 \u062A\u064E\u0646\u064E\u0627\u0644\u064F\u0648\u0627\u06DF \u0671\u0644\u0652\u0628\u0650\u0631\u0651\u064E \u062D\u064E\u062A\u0651\u064E\u0649\u0670 \u062A\u064F\u0646\u0641\u0650\u0642\u064F\u0648\u0627\u06DF \u0645\u0650\u0645\u0651\u064E\u0627 \u062A\u064F\u062D\u0650\u0628\u0651\u064F\u0648\u0646\u064E \u0648\u064E\u0645\u064E\u0627 \u062A\u064F\u0646\u0641\u0650\u0642\u064F\u0648\u0627\u06DF \u0645\u0650\u0646 \u0634\u064E\u0649\u0652\u0621\u064D \u0641\u064E\u0625\u0650\u0646\u0651\u064E \u0671\u0644\u0644\u0651\u064E\u0647\u064E \u0628\u0650\u0647\u0650\u06E6 \u0639\u064E\u0644\u0650\u064A\u0645\u064C","Kamu tidak sekali-kali akan dapat mencapai (hakikat) kebajikan dan kebaktian (yang sempurna) sebelum kamu dermakan sebahagian dari apa yang kamu sayangi. Dan sesuatu apa jua yang kamu dermakan maka sesungguhnya Allah mengetahuinya.","Never will you attain the good [reward] until you spend [in the way of Allah] from that which you love. And whatever you spend - indeed, Allah is Knowing of it.",[[6,2,6],[17,12,14],[15,15,16],[6,34,37],[17,40,42],[0,45,48],[6,69,72],[17,75,77],[6,80,84],[6,87,91],[0,93,96],[15,97,98],[9,109,110],[10,115,116]]],[49,10,"\u0625\u0650\u0646\u0651\u064E\u0645\u064E\u0627 \u0671\u0644\u0652\u0645\u064F\u0624\u0652\u0645\u0650\u0646\u064F\u0648\u0646\u064E \u0625\u0650\u062E\u0652\u0648\u064E\u0629\u064C \u0641\u064E\u0623\u064E\u0635\u0652\u0644\u0650\u062D\u064F\u0648\u0627\u06DF \u0628\u064E\u064A\u0652\u0646\u064E \u0623\u064E\u062E\u064E\u0648\u064E\u064A\u0652\u0643\u064F\u0645\u0652 \u0648\u064E\u0671\u062A\u0651\u064E\u0642\u064F\u0648\u0627\u06DF \u0671\u0644\u0644\u0651\u064E\u0647\u064E \u0644\u064E\u0639\u064E\u0644\u0651\u064E\u0643\u064F\u0645\u0652 \u062A\u064F\u0631\u0652\u062D\u064E\u0645\u064F\u0648\u0646\u064E","Sebenarnya orang-orang yang beriman itu adalah bersaudara, maka damaikanlah di antara dua saudara kamu (yang bertelingkah) itu; dan bertaqwalah kepada Allah supaya kamu beroleh rahmat.","The believers are but brothers, so make settlement between your brothers. And fear Allah that you may receive mercy.",[[0,2,5],[15,9,10],[6,31,35],[17,44,46],[15,69,70],[17,76,78],[15,79,80],[10,107,108]]],[4,28,"\u064A\u064F\u0631\u0650\u064A\u062F\u064F \u0671\u0644\u0644\u0651\u064E\u0647\u064F \u0623\u064E\u0646 \u064A\u064F\u062E\u064E\u0641\u0651\u0650\u0641\u064E \u0639\u064E\u0646\u0643\u064F\u0645\u0652 \u0648\u064E\u062E\u064F\u0644\u0650\u0642\u064E \u0671\u0644\u0652\u0625\u0650\u0646\u0633\u064E\u0670\u0646\u064F \u0636\u064E\u0639\u0650\u064A\u0641\u064B\u0627","Allah (sentiasa) hendak meringankan (beban hukumnya) daripada kamu, kerana manusia itu dijadikan berkeadaan lemah.","And Allah wants to lighten for you [your difficulties]; and mankind was created weak.",[[15,8,9],[1,18,22],[6,32,35],[15,47,48],[6,52,55],[9,55,56]]],[3,8,"\u0631\u064E\u0628\u0651\u064E\u0646\u064E\u0627 \u0644\u064E\u0627 \u062A\u064F\u0632\u0650\u063A\u0652 \u0642\u064F\u0644\u064F\u0648\u0628\u064E\u0646\u064E\u0627 \u0628\u064E\u0639\u0652\u062F\u064E \u0625\u0650\u0630\u0652 \u0647\u064E\u062F\u064E\u064A\u0652\u062A\u064E\u0646\u064E\u0627 \u0648\u064E\u0647\u064E\u0628\u0652 \u0644\u064E\u0646\u064E\u0627 \u0645\u0650\u0646 \u0644\u0651\u064E\u062F\u064F\u0646\u0643\u064E \u0631\u064E\u062D\u0652\u0645\u064E\u0629\u064B \u0625\u0650\u0646\u0651\u064E\u0643\u064E \u0623\u064E\u0646\u062A\u064E \u0671\u0644\u0652\u0648\u064E\u0647\u0651\u064E\u0627\u0628\u064F",'(Mereka berdoa dengan berkata): "Wahai Tuhan kami! Janganlah Engkau memesongkan hati kami sesudah Engkau beri petunjuk kepada kami, dan kurniakanlah kepada kami limpah rahmat dari sisiMu; sesungguhnya Engkau jualah Tuhan Yang melimpah-limpah pemberianNya."','[Who say], "Our Lord, let not our hearts deviate after You have guided us and grant us from Yourself mercy. Indeed, You are the Bestower."',[[14,59,61],[2,70,75],[6,77,80],[0,92,95],[6,100,103],[15,104,105],[10,112,113],[14,113,114]]],[2,153,"\u064A\u064E\u0670\u0653\u0623\u064E\u064A\u0651\u064F\u0647\u064E\u0627 \u0671\u0644\u0651\u064E\u0630\u0650\u064A\u0646\u064E \u0621\u064E\u0627\u0645\u064E\u0646\u064F\u0648\u0627\u06DF \u0671\u0633\u0652\u062A\u064E\u0639\u0650\u064A\u0646\u064F\u0648\u0627\u06DF \u0628\u0650\u0671\u0644\u0635\u0651\u064E\u0628\u0652\u0631\u0650 \u0648\u064E\u0671\u0644\u0635\u0651\u064E\u0644\u064E\u0648\u0670\u0629\u0650 \u0625\u0650\u0646\u0651\u064E \u0671\u0644\u0644\u0651\u064E\u0647\u064E \u0645\u064E\u0639\u064E \u0671\u0644\u0635\u0651\u064E\u0670\u0628\u0650\u0631\u0650\u064A\u0646\u064E","Wahai sekalian orang-orang yang beriman! Mintalah pertolongan (untuk menghadapi susah payah dalam menyempurnakan sesuatu perintah Tuhan) dengan bersabar dan dengan (mengerjakan) sembahyang; kerana sesungguhnya Allah menyertai (menolong) orang-orang yang sabar.","O you who have believed, seek help through patience and prayer. Indeed, Allah is with the patient.",[[12,2,4],[15,13,14],[17,31,33],[15,34,35],[17,45,47],[15,50,51],[16,51,52],[14,55,57],[15,62,63],[16,63,64],[17,69,70],[9,70,71],[0,76,79],[15,80,81],[15,93,94],[16,94,95],[9,98,99],[10,103,104]]],[50,16,"\u0648\u064E\u0644\u064E\u0642\u064E\u062F\u0652 \u062E\u064E\u0644\u064E\u0642\u0652\u0646\u064E\u0627 \u0671\u0644\u0652\u0625\u0650\u0646\u0633\u064E\u0670\u0646\u064E \u0648\u064E\u0646\u064E\u0639\u0652\u0644\u064E\u0645\u064F \u0645\u064E\u0627 \u062A\u064F\u0648\u064E\u0633\u0652\u0648\u0650\u0633\u064F \u0628\u0650\u0647\u0650\u06E6 \u0646\u064E\u0641\u0652\u0633\u064F\u0647\u064F\u06E5 \u0648\u064E\u0646\u064E\u062D\u0652\u0646\u064F \u0623\u064E\u0642\u0652\u0631\u064E\u0628\u064F \u0625\u0650\u0644\u064E\u064A\u0652\u0647\u0650 \u0645\u0650\u0646\u0652 \u062D\u064E\u0628\u0652\u0644\u0650 \u0671\u0644\u0652\u0648\u064E\u0631\u0650\u064A\u062F\u0650","Dan demi sesungguhnya, Kami telah mencipta manusia dan Kami sedia mengetahui apa yang dibisikkan oleh hatinya, sedang (pengetahuan) Kami lebih dekat kepadanya daripada urat lehernya.","And We have already created man and know what his soul whispers to him, and We are closer to him than [his] jugular vein.",[[14,6,8],[14,13,15],[15,19,20],[6,24,27],[9,27,28],[9,61,62],[9,71,72],[14,84,86],[14,107,109],[15,112,113],[10,119,120],[14,120,121]]],[3,200,"\u064A\u064E\u0670\u0653\u0623\u064E\u064A\u0651\u064F\u0647\u064E\u0627 \u0671\u0644\u0651\u064E\u0630\u0650\u064A\u0646\u064E \u0621\u064E\u0627\u0645\u064E\u0646\u064F\u0648\u0627\u06DF \u0671\u0635\u0652\u0628\u0650\u0631\u064F\u0648\u0627\u06DF \u0648\u064E\u0635\u064E\u0627\u0628\u0650\u0631\u064F\u0648\u0627\u06DF \u0648\u064E\u0631\u064E\u0627\u0628\u0650\u0637\u064F\u0648\u0627\u06DF \u0648\u064E\u0671\u062A\u0651\u064E\u0642\u064F\u0648\u0627\u06DF \u0671\u0644\u0644\u0651\u064E\u0647\u064E \u0644\u064E\u0639\u064E\u0644\u0651\u064E\u0643\u064F\u0645\u0652 \u062A\u064F\u0641\u0652\u0644\u0650\u062D\u064F\u0648\u0646\u064E","Wahai orang-orang yang beriman! Bersabarlah kamu (menghadapi segala kesukaran dalam mengerjakan perkara-perkara yang berkebajikan), dan kuatkanlah kesabaran kamu lebih daripada kesabaran musuh, di medan perjuangan), dan bersedialah (dengan kekuatan pertahanan di daerah-daerah sempadan) serta bertaqwalah kamu kepada Allah supaya, kamu berjaya (mencapai kemenangan).","O you who have believed, persevere and endure and remain stationed and fear Allah that you may be successful.",[[12,2,4],[15,13,14],[17,31,33],[15,34,35],[17,42,44],[17,55,57],[17,68,70],[15,73,74],[17,80,82],[15,83,84],[10,111,112]]],[8,2,"\u0625\u0650\u0646\u0651\u064E\u0645\u064E\u0627 \u0671\u0644\u0652\u0645\u064F\u0624\u0652\u0645\u0650\u0646\u064F\u0648\u0646\u064E \u0671\u0644\u0651\u064E\u0630\u0650\u064A\u0646\u064E \u0625\u0650\u0630\u064E\u0627 \u0630\u064F\u0643\u0650\u0631\u064E \u0671\u0644\u0644\u0651\u064E\u0647\u064F \u0648\u064E\u062C\u0650\u0644\u064E\u062A\u0652 \u0642\u064F\u0644\u064F\u0648\u0628\u064F\u0647\u064F\u0645\u0652 \u0648\u064E\u0625\u0650\u0630\u064E\u0627 \u062A\u064F\u0644\u0650\u064A\u064E\u062A\u0652 \u0639\u064E\u0644\u064E\u064A\u0652\u0647\u0650\u0645\u0652 \u0621\u064E\u0627\u064A\u064E\u0670\u062A\u064F\u0647\u064F\u06E5 \u0632\u064E\u0627\u062F\u064E\u062A\u0652\u0647\u064F\u0645\u0652 \u0625\u0650\u064A\u0645\u064E\u0670\u0646\u064B\u0627 \u0648\u064E\u0639\u064E\u0644\u064E\u0649\u0670 \u0631\u064E\u0628\u0651\u0650\u0647\u0650\u0645\u0652 \u064A\u064E\u062A\u064E\u0648\u064E\u0643\u0651\u064E\u0644\u064F\u0648\u0646\u064E","Sesungguhnya orang-orang yang beriman itu (yang sempurna imannya) ialah mereka yang apabila disebut nama Allah (dan sifat-sifatNya) gementarlah hati mereka; dan apabila dibacakan kepada mereka ayat-ayatNya, menjadikan mereka bertambah iman, dan kepada Tuhan mereka jualah mereka berserah.","The believers are only those who, when Allah is mentioned, their hearts become fearful, and when His verses are recited to them, it increases them in faith; and upon their Lord they rely.",[[0,2,5],[15,9,10],[15,24,25],[15,47,48],[9,109,110],[9,114,115],[9,133,134],[1,135,140],[10,168,169]]],[20,46,"\u0642\u064E\u0627\u0644\u064E \u0644\u064E\u0627 \u062A\u064E\u062E\u064E\u0627\u0641\u064E\u0627\u0653 \u0625\u0650\u0646\u0651\u064E\u0646\u0650\u0649 \u0645\u064E\u0639\u064E\u0643\u064F\u0645\u064E\u0627\u0653 \u0623\u064E\u0633\u0652\u0645\u064E\u0639\u064F \u0648\u064E\u0623\u064E\u0631\u064E\u0649\u0670",'Allah berfirman: "Janganlah kamu takut, sesungguhnya Aku ada bersama-sama kamu; Aku mendengar dan melihat segala-galanya."','[Allah] said, "Fear not. Indeed, I am with you both; I hear and I see."',[[12,17,19],[0,22,25],[12,37,39]]],[2,201,"\u0648\u064E\u0645\u0650\u0646\u0652\u0647\u064F\u0645 \u0645\u0651\u064E\u0646 \u064A\u064E\u0642\u064F\u0648\u0644\u064F \u0631\u064E\u0628\u0651\u064E\u0646\u064E\u0627\u0653 \u0621\u064E\u0627\u062A\u0650\u0646\u064E\u0627 \u0641\u0650\u0649 \u0671\u0644\u062F\u0651\u064F\u0646\u0652\u064A\u064E\u0627 \u062D\u064E\u0633\u064E\u0646\u064E\u0629\u064B \u0648\u064E\u0641\u0650\u0649 \u0671\u0644\u0652\u0621\u064E\u0627\u062E\u0650\u0631\u064E\u0629\u0650 \u062D\u064E\u0633\u064E\u0646\u064E\u0629\u064B \u0648\u064E\u0642\u0650\u0646\u064E\u0627 \u0639\u064E\u0630\u064E\u0627\u0628\u064E \u0671\u0644\u0646\u0651\u064E\u0627\u0631\u0650",'Dan di antara mereka pula ada yang (berdoa dengan) berkata: "Wahai Tuhan kami, berilah kami kebaikan di dunia dan kebaikan di akhirat, dan peliharalah kami dari azab neraka."','But among them is he who says, "Our Lord, give us in this world [that which is] good and in the Hereafter [that which is] good and protect us from the punishment of the Fire."',[[5,8,13],[1,13,17],[12,30,32],[15,46,47],[16,47,48],[1,64,68],[15,72,73],[1,92,96],[15,110,111],[16,111,112],[0,112,115],[10,115,116]]],[16,97,"\u0645\u064E\u0646\u0652 \u0639\u064E\u0645\u0650\u0644\u064E \u0635\u064E\u0670\u0644\u0650\u062D\u064B\u0627 \u0645\u0651\u0650\u0646 \u0630\u064E\u0643\u064E\u0631\u064D \u0623\u064E\u0648\u0652 \u0623\u064F\u0646\u062B\u064E\u0649\u0670 \u0648\u064E\u0647\u064F\u0648\u064E \u0645\u064F\u0624\u0652\u0645\u0650\u0646\u064C \u0641\u064E\u0644\u064E\u0646\u064F\u062D\u0652\u064A\u0650\u064A\u064E\u0646\u0651\u064E\u0647\u064F\u06E5 \u062D\u064E\u064A\u064E\u0648\u0670\u0629\u064B \u0637\u064E\u064A\u0651\u0650\u0628\u064E\u0629\u064B \u0648\u064E\u0644\u064E\u0646\u064E\u062C\u0652\u0632\u0650\u064A\u064E\u0646\u0651\u064E\u0647\u064F\u0645\u0652 \u0623\u064E\u062C\u0652\u0631\u064E\u0647\u064F\u0645 \u0628\u0650\u0623\u064E\u062D\u0652\u0633\u064E\u0646\u0650 \u0645\u064E\u0627 \u0643\u064E\u0627\u0646\u064F\u0648\u0627\u06DF \u064A\u064E\u0639\u0652\u0645\u064E\u0644\u064F\u0648\u0646\u064E","Sesiapa yang beramal soleh, dari lelaki atau perempuan, sedang ia beriman, maka sesungguhnya Kami akan menghidupkan dia dengan kehidupan yang baik; dan sesungguhnya kami akan membalas mereka, dengan memberikan pahala yang lebih dari apa yang mereka telah kerjakan.","Whoever does righteousness, whether male or female, while he is a believer - We will surely cause him to live a good life, and We will surely give them their reward [in the Hereafter] according to the best of what they used to do.",[[9,14,15],[1,18,24],[6,24,28],[6,40,43],[6,60,64],[0,74,77],[9,79,80],[17,85,86],[9,86,87],[6,88,92],[1,98,102],[14,106,108],[0,112,115],[14,122,124],[7,128,132],[17,151,153],[10,162,163]]],[65,3,"\u0648\u064E\u064A\u064E\u0631\u0652\u0632\u064F\u0642\u0652\u0647\u064F \u0645\u0650\u0646\u0652 \u062D\u064E\u064A\u0652\u062B\u064F \u0644\u064E\u0627 \u064A\u064E\u062D\u0652\u062A\u064E\u0633\u0650\u0628\u064F \u0648\u064E\u0645\u064E\u0646 \u064A\u064E\u062A\u064E\u0648\u064E\u0643\u0651\u064E\u0644\u0652 \u0639\u064E\u0644\u064E\u0649 \u0671\u0644\u0644\u0651\u064E\u0647\u0650 \u0641\u064E\u0647\u064F\u0648\u064E \u062D\u064E\u0633\u0652\u0628\u064F\u0647\u064F\u06E5\u0653 \u0625\u0650\u0646\u0651\u064E \u0671\u0644\u0644\u0651\u064E\u0647\u064E \u0628\u064E\u0670\u0644\u0650\u063A\u064F \u0623\u064E\u0645\u0652\u0631\u0650\u0647\u0650\u06E6 \u0642\u064E\u062F\u0652 \u062C\u064E\u0639\u064E\u0644\u064E \u0671\u0644\u0644\u0651\u064E\u0647\u064F \u0644\u0650\u0643\u064F\u0644\u0651\u0650 \u0634\u064E\u0649\u0652\u0621\u064D \u0642\u064E\u062F\u0652\u0631\u064B\u0627","Serta memberinya rezeki dari jalan yang tidak terlintas di hatinya. Dan (Ingatlah), sesiapa berserah diri bulat-bulat kepada Allah, maka Allah cukuplah baginya (untuk menolong dan menyelamatkannya). Sesungguhnya Allah tetap melakukan segala perkara yang dikehendakiNya. Allah telahpun menentukan kadar dan masa bagi berlakunya tiap-tiap sesuatu.","And will provide for him from where he does not expect. And whoever relies upon Allah - then He is sufficient for him. Indeed, Allah will accomplish His purpose. Allah has already set for everything a [decreed] extent.",[[14,8,10],[1,44,48],[15,64,65],[12,87,89],[0,92,95],[15,96,97],[9,106,107],[9,120,121],[14,124,126],[15,134,135],[6,155,159],[14,159,161]]]],AL_KAHF=[293,304],TJ_RULES=["ghunnah","idghaam_ghunnah","idghaam_no_ghunnah","idghaam_mutajanisayn","idghaam_mutaqaribayn","idghaam_shafawi","ikhfa","ikhfa_shafawi","iqlab","madd_2","madd_246","madd_muttasil","madd_munfasil","madd_6","qalqalah","hamzat_wasl","lam_shamsiyyah","silent"],TJ_INFO={izhar_halqi:{c:0,quiz:0,ms:"Izhar Halqi",en:"Izhar Halqi",ar:"\u0625\u0638\u0647\u0627\u0631 \u062D\u0644\u0642\u064A",letters:"\u0621 \u0647 \u0639 \u062D \u063A \u062E",len:["Tiada dengung","No ghunnah"],s:["Nun sakinah atau tanwin bertemu huruf halqi: dibaca jelas tanpa dengung.","Noon sakinah or tanween before a throat letter: read clearly, no ghunnah."],b:["Apabila nun mati (\u0646\u0652) atau tanwin bertemu salah satu daripada enam huruf halqi (huruf kerongkong), bunyi nun disebut dengan jelas dan terang tanpa dengung.","When a silent noon (\u0646\u0652) or tanween is followed by one of the six throat letters, the noon is pronounced clearly and fully, without ghunnah."]},idghaam_ghunnah:{c:1,quiz:1,ms:"Idgham Maal Ghunnah",en:"Idgham with Ghunnah",ar:"\u0625\u062F\u063A\u0627\u0645 \u0628\u063A\u0646\u0629",letters:"\u064A \u0646 \u0645 \u0648",len:["Dengung 2 harakat","Ghunnah 2 counts"],s:["Nun sakinah atau tanwin bertemu \u064A \u0646 \u0645 \u0648: dimasukkan dengan dengung.","Noon sakinah or tanween before \u064A \u0646 \u0645 \u0648: merged with ghunnah."],b:["Nun mati atau tanwin di hujung kalimah bertemu huruf \u064A\u060C \u0646\u060C \u0645 atau \u0648 di awal kalimah berikutnya. Bunyi nun dimasukkan ke dalam huruf tersebut dan didengungkan kira-kira 2 harakat. Jika berlaku dalam satu kalimah (contohnya \u062F\u064F\u0646\u0652\u064A\u064E\u0627), ia dibaca jelas (Izhar Mutlak).","A silent noon or tanween at the end of a word followed by \u064A\u060C \u0646\u060C \u0645 or \u0648 at the start of the next word. The noon merges into that letter with ghunnah of about 2 counts. Within one word (e.g. \u062F\u064F\u0646\u0652\u064A\u064E\u0627) it is read clearly instead (Izhar Mutlaq)."]},idghaam_no_ghunnah:{c:1,quiz:1,ms:"Idgham Bila Ghunnah",en:"Idgham without Ghunnah",ar:"\u0625\u062F\u063A\u0627\u0645 \u0628\u0644\u0627 \u063A\u0646\u0629",letters:"\u0644 \u0631",len:["Tiada dengung","No ghunnah"],s:["Nun sakinah atau tanwin bertemu \u0644 atau \u0631: dimasukkan tanpa dengung.","Noon sakinah or tanween before \u0644 or \u0631: merged without ghunnah."],b:["Nun mati atau tanwin bertemu huruf \u0644 atau \u0631. Bunyi nun dimasukkan sepenuhnya ke dalam huruf berikutnya tanpa dengung, dan huruf \u0644 atau \u0631 itu dibaca bersabdu.","A silent noon or tanween followed by \u0644 or \u0631 is fully merged into that letter without ghunnah, and the \u0644 or \u0631 is read with shaddah."]},iqlab:{c:1,quiz:1,ms:"Iqlab",en:"Iqlab",ar:"\u0625\u0642\u0644\u0627\u0628",letters:"\u0628",len:["Dengung 2 harakat","Ghunnah 2 counts"],s:["Nun sakinah atau tanwin bertemu \u0628: bunyi nun ditukar kepada mim dengan dengung.","Noon sakinah or tanween before \u0628: the noon becomes a meem sound with ghunnah."],b:["Apabila nun mati atau tanwin bertemu huruf \u0628, bunyi nun ditukar menjadi bunyi mim yang samar, berserta dengung kira-kira 2 harakat. Dalam mushaf ia ditandakan dengan mim kecil (\u06E2).","When a silent noon or tanween is followed by \u0628, the noon changes into a hidden meem sound with ghunnah of about 2 counts. The mushaf marks it with a small meem (\u06E2)."]},ikhfa:{c:1,quiz:1,ms:"Ikhfa' Haqiqi",en:"Ikhfa",ar:"\u0625\u062E\u0641\u0627\u0621 \u062D\u0642\u064A\u0642\u064A",letters:"\u062A \u062B \u062C \u062F \u0630 \u0632 \u0633 \u0634 \u0635 \u0636 \u0637 \u0638 \u0641 \u0642 \u0643",len:["Dengung 2 harakat","Ghunnah 2 counts"],s:["Nun sakinah atau tanwin bertemu 15 huruf ikhfa': disebut samar dengan dengung.","Noon sakinah or tanween before one of 15 letters: hidden, with ghunnah."],b:["Nun mati atau tanwin bertemu salah satu daripada 15 huruf ikhfa'. Bunyi nun disebut samar-samar (antara jelas dan masuk) berserta dengung kira-kira 2 harakat, sambil lidah bersedia untuk huruf berikutnya.","A silent noon or tanween followed by one of the 15 ikhfa letters is pronounced in a hidden way (between clear and merged) with ghunnah of about 2 counts, while the tongue prepares for the next letter."]},izhar_syafawi:{c:0,quiz:0,ms:"Izhar Syafawi",en:"Izhar Shafawi",ar:"\u0625\u0638\u0647\u0627\u0631 \u0634\u0641\u0648\u064A",letters:["Semua huruf selain \u0645 dan \u0628","All letters except \u0645 and \u0628"],len:["Tiada dengung","No ghunnah"],s:["Mim sakinah bertemu huruf selain \u0645 dan \u0628: dibaca jelas di bibir.","Meem sakinah before any letter except \u0645 and \u0628: read clearly."],b:["Mim mati (\u0645\u0652) bertemu mana-mana huruf selain \u0645 dan \u0628. Mim disebut dengan jelas pada dua bibir tanpa dengung. Lebih berhati-hati apabila bertemu \u0648 dan \u0641 supaya mim tidak disamarkan.","A silent meem (\u0645\u0652) followed by any letter other than \u0645 and \u0628 is pronounced clearly with both lips, without ghunnah. Take extra care before \u0648 and \u0641 so it isn't hidden."]},ikhfa_shafawi:{c:1,quiz:1,ms:"Ikhfa' Syafawi",en:"Ikhfa Shafawi",ar:"\u0625\u062E\u0641\u0627\u0621 \u0634\u0641\u0648\u064A",letters:"\u0628",len:["Dengung 2 harakat","Ghunnah 2 counts"],s:["Mim sakinah bertemu \u0628: disebut samar dengan dengung.","Meem sakinah before \u0628: hidden, with ghunnah."],b:["Mim mati bertemu huruf \u0628. Mim disebut sama
