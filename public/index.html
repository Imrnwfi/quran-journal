rejected.","Hud 11:25\u201349 \xB7 Al-'Ankabut 29:14 \xB7 Surah Nuh 71"],["hud","Hud","Diutus kepada kaum 'Ad yang kuat dan sombong. Mereka ingkar lalu dibinasakan dengan angin yang sangat kencang.","Sent to the mighty, arrogant people of 'Ad. They rejected him and were destroyed by a furious wind.","Hud 11:50\u201360 \xB7 Al-Ahqaf 46:21\u201325"],["salih","Salih","Diutus kepada kaum Thamud. Mukjizatnya seekor unta betina, tetapi kaumnya menyembelih unta itu lalu ditimpa azab.","Sent to the people of Thamud. His sign was a she-camel, but they killed it and were punished.","Hud 11:61\u201368 \xB7 Asy-Syams 91:11\u201315"],["ibrahim","Ibrahim","Bapa para nabi. Baginda menghancurkan berhala kaumnya lalu dicampak ke dalam api, tetapi Allah menjadikan api itu sejuk. Bersama Ismail, baginda membina Kaabah.","Father of the prophets. He broke his people's idols and was thrown into fire, which Allah made cool. With Ismail he built the Ka'bah.","Al-Anbiya' 21:51\u201370 \xB7 Al-Baqarah 2:127"],["lut","Lut","Anak saudara Ibrahim, diutus kepada kaum yang melakukan perbuatan keji. Mereka ingkar lalu negeri mereka diterbalikkan.","Ibrahim's nephew, sent to a people who committed shameful acts. They refused to change and their towns were overturned.","Hud 11:77\u201383"],["ismail","Ismail","Anak Ibrahim yang sabar dan taat. Baginda redha untuk dikorbankan, lalu Allah menggantikannya dengan seekor sembelihan. Baginda membantu bapanya membina Kaabah.","Ibrahim's patient, obedient son. He accepted being sacrificed, and Allah replaced him with a ram. He helped his father build the Ka'bah.","As-Saffat 37:101\u2013107 \xB7 Al-Baqarah 2:127"],["ishak","Ishak","Anak Ibrahim dan Sarah, yang dilahirkan sebagai khabar gembira ketika kedua-duanya sudah tua.","Son of Ibrahim and Sarah, born as glad tidings when both were old.","Hud 11:71\u201373 \xB7 As-Saffat 37:112\u2013113"],["yaakub","Yaakub","Anak Ishak dan bapa kepada Yusuf. Baginda tetap sabar dan berharap kepada Allah walaupun lama kehilangan Yusuf.","Son of Ishaq and father of Yusuf. He stayed patient and hopeful in Allah through the long loss of Yusuf.","Yusuf 12:83\u201387"],["yusuf","Yusuf","Dibuang ke dalam perigi oleh saudara-saudaranya, dijual sebagai hamba dan dipenjara, tetapi kemudian menjadi pemegang perbendaharaan Mesir. Baginda memaafkan saudara-saudaranya.","Thrown into a well by his brothers, sold as a slave and imprisoned, he later became treasurer of Egypt and forgave his brothers.","Surah Yusuf 12"],["ayub","Ayub","Diuji dengan penyakit dan kehilangan harta serta keluarga, tetapi tetap sabar. Allah menyembuhkan dan mengembalikan nikmatnya.","Tested with illness and the loss of wealth and family, he stayed patient. Allah healed him and restored his blessings.","Al-Anbiya' 21:83\u201384 \xB7 Sad 38:41\u201344"],["syuaib","Syuaib","Diutus kepada penduduk Madyan yang menipu dalam timbangan dan sukatan. Mereka ingkar lalu ditimpa gempa.","Sent to the people of Madyan, who cheated in weights and measures. They rejected him and were struck by an earthquake.","Hud 11:84\u201395"],["musa","Musa","Diutus kepada Firaun dengan mukjizat tongkat dan tangan yang bercahaya. Laut terbelah untuk menyelamatkan Bani Israil, dan baginda menerima Taurat.","Sent to Pharaoh with the signs of the staff and the shining hand. The sea parted to save the Children of Israel, and he received the Torah.","Taha 20 \xB7 Al-Qasas 28 \xB7 Asy-Syu'ara' 26:10\u201368"],["harun","Harun","Saudara Musa yang fasih berbicara, dilantik sebagai pembantunya dalam dakwah kepada Firaun.","Musa's eloquent brother, appointed to help him call Pharaoh.","Taha 20:29\u201336"],["zulkifli","Zulkifli","Disebut dalam Al-Quran sebagai antara orang yang sabar dan orang pilihan.","Mentioned in the Quran among the patient and the chosen.","Al-Anbiya' 21:85\u201386 \xB7 Sad 38:48"],["daud","Daud","Mengalahkan Jalut ketika masih muda, kemudian menjadi raja. Allah menurunkan kitab Zabur dan melembutkan besi baginya.","He defeated Goliath (Jalut) as a young man and became king. Allah gave him the Psalms (Zabur) and softened iron for him.","Al-Baqarah 2:251 \xB7 Saba' 34:10\u201311"],["sulaiman","Sulaiman","Anak Daud, diberi kerajaan yang hebat: faham bahasa binatang, menguasai angin dan jin. Kisahnya dengan semut dan Ratu Balqis disebut dalam Surah An-Naml.","Son of Dawud, given a great kingdom: he understood animals and commanded the wind and jinn. His stories with the ant and the Queen of Sheba are in Surah An-Naml.","An-Naml 27:15\u201344 \xB7 Saba' 34:12\u201314"],["ilyas","Ilyas","Menyeru kaumnya supaya meninggalkan penyembahan berhala Ba'l dan kembali menyembah Allah.","He called his people to abandon the idol Ba'l and worship Allah.","As-Saffat 37:123\u2013132"],["ilyasa","Ilyasa'","Disebut bersama para nabi pilihan yang dilebihkan oleh Allah.","Mentioned among the chosen prophets whom Allah favoured.","Al-An'am 6:86 \xB7 Sad 38:48"],["yunus","Yunus","Meninggalkan kaumnya sebelum diizinkan, lalu ditelan ikan besar. Dalam perut ikan baginda berdoa memohon ampun, lalu diselamatkan.","He left his people before being permitted and was swallowed by a great fish. Inside it he prayed for forgiveness and was saved.","Al-Anbiya' 21:87\u201388 \xB7 As-Saffat 37:139\u2013148"],["zakaria","Zakaria","Penjaga Maryam. Ketika sudah tua, baginda berdoa dengan penuh harap dan dikurniakan anak, Yahya.","Guardian of Maryam. In old age he prayed with hope and was granted a son, Yahya.","Ali 'Imran 3:37\u201341 \xB7 Maryam 19:2\u201311"],["yahya","Yahya","Anak Zakaria, diberi hikmah sejak kecil, berbakti kepada ibu bapa dan tidak sombong.","Son of Zakariya, given wisdom as a child, devoted to his parents and never arrogant.","Maryam 19:12\u201315"],["isa","Isa","Lahir daripada Maryam tanpa bapa. Dengan izin Allah, baginda menyembuhkan orang sakit dan menghidupkan orang mati. Baginda menerima Injil dan diangkat oleh Allah.","Born of Maryam without a father. By Allah's permission he healed the sick and raised the dead. He received the Gospel and was raised up by Allah.","Ali 'Imran 3:45\u201355 \xB7 Maryam 19:16\u201336"],["muhammad","Muhammad \uFDFA","Penutup sekalian nabi, diutus sebagai rahmat untuk seluruh alam dengan Al-Quran. Lihat Sirah ringkas untuk kisah baginda.","The seal of the prophets, sent as a mercy to all the worlds with the Quran. See the short Sirah for his story.","Al-Ahzab 33:40 \xB7 Al-Anbiya' 21:107"]],ASAS={rukun:[["Rukun Iman","Pillars of Faith",[["Beriman kepada Allah","Belief in Allah"],["Beriman kepada para malaikat","Belief in the angels"],["Beriman kepada kitab-kitab","Belief in the revealed books"],["Beriman kepada para rasul","Belief in the messengers"],["Beriman kepada hari akhirat","Belief in the Last Day"],["Beriman kepada qada' dan qadar","Belief in divine decree (qada' and qadar)"]],"Dalil: Hadis Jibril, riwayat Muslim.","Source: the hadith of Jibril, narrated by Muslim."],["Rukun Islam","Pillars of Islam",[["Mengucap dua kalimah syahadah","Bearing witness (the two shahadahs)"],["Mendirikan solat","Establishing the prayer"],["Menunaikan zakat","Paying zakah"],["Berpuasa di bulan Ramadan","Fasting in Ramadan"],["Menunaikan haji bagi yang mampu","Performing hajj for those able"]],'Dalil: "Islam dibina di atas lima perkara", riwayat al-Bukhari & Muslim.','Source: "Islam is built on five", narrated by al-Bukhari & Muslim.']],wuduk:[["Rukun wuduk (6)","Obligatory acts of wudu (6)",[["Niat (dalam hati, ketika membasuh muka)","Intention (in the heart, while washing the face)"],["Membasuh muka","Washing the face"],["Membasuh kedua-dua tangan hingga siku","Washing both arms up to the elbows"],["Menyapu sebahagian kepala","Wiping part of the head"],["Membasuh kedua-dua kaki hingga buku lali","Washing both feet up to the ankles"],["Tertib (mengikut susunan)","Doing them in order"]],"Lafaz niat: \u0646\u064E\u0648\u064E\u064A\u0652\u062A\u064F \u0631\u064E\u0641\u0652\u0639\u064E \u0627\u0644\u0652\u062D\u064E\u062F\u064E\u062B\u0650 \u0627\u0644\u0652\u06 0627\u0644\u0652\u062C\u064E\u0646\u064E\u0651\u0629\u0650","Sesiapa yang menempuh jalan untuk mencari ilmu, Allah mudahkan baginya jalan ke syurga.","Whoever takes a path seeking knowledge, Allah makes easy for him a path to Paradise.","Riwayat Muslim","Muslim"],["doa","ibadah","\u0627\u0644\u062F\u064F\u0651\u0639\u064E\u0627\u0621\u064F \u0647\u064F\u0648\u064E \u0627\u0644\u0652\u0639\u0650\u0628\u064E\u0627\u062F\u064E\u0629\u064F","Doa itu ialah ibadah.","Supplication is worship.","Riwayat Abu Daud & at-Tirmizi","Abu Dawud & At-Tirmidhi"],["thaharah","ibadah","\u0627\u0644\u0637\u064F\u0651\u0647\u064F\u0648\u0631\u064F \u0634\u064E\u0637\u0652\u0631\u064F \u0627\u0644\u0652\u0625\u0650\u064A\u0645\u064E\u0627\u0646\u0650","Bersuci itu sebahagian daripada iman.","Purity is half of faith.","Riwayat Muslim","Muslim"],["zikir","ibadah","\u0643\u064E\u0644\u0650\u0645\u064E\u062A\u064E\u0627\u0646\u0650 \u062E\u064E\u0641\u0650\u064A\u0641\u064E\u062A\u064E\u0627\u0646\u0650 \u0639\u064E\u0644\u064E\u0649 \u0627\u0644\u0644\u0650\u0651\u0633\u064E\u0627\u0646\u0650\u060C \u062B\u064E\u0642\u0650\u064A\u0644\u064E\u062A\u064E\u0627\u0646\u0650 \u0641\u0650\u064A \u0627\u0644\u0652\u0645\u0650\u064A\u0632\u064E\u0627\u0646\u0650\u060C \u062D\u064E\u0628\u0650\u064A\u0628\u064E\u062A\u064E\u0627\u0646\u0650 \u0625\u0650\u0644\u064E\u0649 \u0627\u0644\u0631\u064E\u0651\u062D\u0652\u0645\u064E\u0670\u0646\u0650: \u0633\u064F\u0628\u0652\u062D\u064E\u0627\u0646\u064E \u0627\u0644\u0644\u064E\u0651\u0647\u0650 \u0648\u064E\u0628\u0650\u062D\u064E\u0645\u0652\u062F\u0650\u0647\u0650\u060C \u0633\u064F\u0628\u0652\u062D\u064E\u0627\u0646\u064E \u0627\u0644\u0644\u064E\u0651\u0647\u0650 \u0627\u0644\u0652\u0639\u064E\u0638\u0650\u064A\u0645\u0650","Dua kalimah yang ringan di lidah, berat dalam timbangan dan disukai oleh Ar-Rahman: Subhanallahi wa bihamdihi, Subhanallahil 'azim.","Two phrases light on the tongue, heavy on the scale and beloved to the Most Merciful: Subhanallahi wa bihamdihi, Subhanallahil 'azim.","Riwayat al-Bukhari & Muslim","Al-Bukhari & Muslim"],["hati","akhlak","\u0625\u0650\u0646\u064E\u0651 \u0627\u0644\u0644\u064E\u0651\u0647\u064E \u0644\u064E\u0627 \u064A\u064E\u0646\u0652\u0638\u064F\u0631\u064F \u0625\u0650\u0644\u064E\u0649\u0670 \u0635\u064F\u0648\u064E\u0631\u0650\u0643\u064F\u0645\u0652 \u0648\u064E\u0623\u064E\u0645\u0652\u0648\u064E\u0627\u0644\u0650\u0643\u064F\u0645\u0652\u060C \u0648\u064E\u0644\u064E\u0670\u0643\u0650\u0646\u0652 \u064A\u064E\u0646\u0652\u0638\u064F\u0631\u064F \u0625\u0650\u0644\u064E\u0649\u0670 \u0642\u064F\u0644\u064F\u0648\u0628\u0650\u0643\u064F\u0645\u0652 \u0648\u064E\u0623\u064E\u0639\u0652\u0645\u064E\u0627\u0644\u0650\u0643\u064F\u0645\u0652","Sesungguhnya Allah tidak melihat kepada rupa dan harta kamu, tetapi Dia melihat kepada hati dan amalan kamu.","Allah does not look at your appearance or your wealth, but He looks at your hearts and your deeds.","Riwayat Muslim","Muslim"],["kasih","akhlak","\u0644\u064E\u0627 \u064A\u064F\u0624\u0652\u0645\u0650\u0646\u064F \u0623\u064E\u062D\u064E\u062F\u064F\u0643\u064F\u0645\u0652 \u062D\u064E\u062A\u064E\u0651\u0649\u0670 \u064A\u064F\u062D\u0650\u0628\u064E\u0651 \u0644\u0650\u0623\u064E\u062E\u0650\u064A\u0647\u0650 \u0645\u064E\u0627 \u064A\u064F\u062D\u0650\u0628\u064F\u0651 \u0644\u0650\u0646\u064E\u0641\u0652\u0633\u0650\u0647\u0650","Tidak sempurna iman seseorang daripada kamu sehingga dia mengasihi saudaranya sebagaimana dia mengasihi dirinya sendiri.","None of you truly believes until he loves for his brother what he loves for himself.","Riwayat al-Bukhari & Muslim","Al-Bukhari & Muslim"],["katabaik","akhlak","\u0645\u064E\u0646\u0652 \u0643\u064E\u0627\u0646\u064E \u064A\u064F\u0624\u0652\u0645\u0650\u0646\u064F \u0628\u0650\u0627\u0644\u0644\u064E\u0651\u0647\u0650 \u0648\u064E\u0627\u0644\u0652\u064A\u064E\u0648\u0652\u0645\u0650 \u0627\u0644\u0652\u0622\u062E\u0650\u0631\u0650 \u0641\u064E\u0644\u0652\u064A\u064E\u0642\u064F\u0644\u0652 \u062E\u064E\u064A\u0652\u0631\u064B\u0627 \u0623\u064E\u0648\u0652 \u0644\u0650\u064A\u064E\u0635\u0652\u0645\u064F\u062A\u0652","Sesiapa yang beriman kepada Allah dan hari akhirat, hendaklah dia berkata yang baik atau diam.","Whoever believes in Allah and the Last Day, let him speak good or keep silent.","Riwayat al-Bukhari & Muslim","Al-Bukhari & Muslim"],["marah","akhlak","\u0644\u064E\u0627 \u062A\u064E\u063A\u0652\u0636\u064E\u0628\u0652","Jangan marah.","Do not get angry.","Riwayat al-Bukhari","Al-Bukhari"],["senyum","akhlak","\u062A\u064E\u0628\u064E\u0633\u064F\u0651\u0645\u064F\u0643\u064E \u0641\u0650\u064A \u0648\u064E\u062C\u0652\u0647\u0650 \u0623\u064E\u062E\u0650\u064A\u0643\u064E \u0644\u064E\u0643\u064E \u0635\u064E\u062F\u064E\u0642\u064E\u0629\u064C","Senyumanmu di hadapan saudaramu adalah sedekah.","Your smile in the face of your brother is charity.","Riwayat at-Tirmizi","At-Tirmidhi"],["kalimah","akhlak","\u0627\u0644\u0652\u0643\u064E\u0644\u0650\u0645\u064E\u0629\u064F \u0627\u0644\u0637\u064E\u0651\u064A\u0650\u0651\u0628\u064E\u0629\u064F \u0635\u064E\u062F\u064E\u0642\u064E\u0629\u064C","Kata-kata yang baik itu sedekah.","A good word is charity.","Riwayat al-Bukhari & Muslim","Al-Bukhari & Muslim"],["muslim","akhlak","\u0627\u0644\u0652\u0645\u064F\u0633\u0652\u0644\u0650\u0645\u064F \u0645\u064E\u0646\u0652 \u0633\u064E\u0644\u0650\u0645\u064E \u0627\u0644\u0652\u0645\u064F\u0633\u0652\u0644\u0650\u0645\u064F\u0648\u0646\u064E \u0645\u0650\u0646\u0652 \u0644\u0650\u0633\u064E\u0627\u0646\u0650\u0647\u0650 \u0648\u064E\u064A\u064E\u062F\u0650\u0647\u0650","Seorang Muslim ialah orang yang Muslim lain selamat daripada (gangguan) lidah dan tangannya.","A Muslim is one from whose tongue and hand other Muslims are safe.","Riwayat al-Bukhari & Muslim","Al-Bukhari & Muslim"],["takwa","akhlak","\u0627\u062A\u064E\u0651\u0642\u0650 \u0627\u0644\u0644\u064E\u0651\u0647\u064E \u062D\u064E\u064A\u0652\u062B\u064F\u0645\u064E\u062
