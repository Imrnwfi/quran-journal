ween before a throat letter: read clearly, no ghunnah."],b:["Apabila nun mati (\u0646\u0652) atau tanwin bertemu salah satu daripada enam huruf halqi (huruf kerongkong), bunyi nun disebut dengan jelas dan terang tanpa dengung.","When a silent noon (\u0646\u0652) or tanween is followed by one of the six throat letters, the noon is pronounced clearly and fully, without ghunnah."]},idghaam_ghunnah:{c:1,quiz:1,ms:"Idgham Maal Ghunnah",en:"Idgham with Ghunnah",ar:"\u0625\u062F\u063A\u0627\u0645 \u0628\u063A\u0646\u0629",letters:"\u064A \u0646 \u0645 \u0648",len:["Dengung 2 harakat","Ghunnah 2 counts"],s:["Nun sakinah atau tanwin bertemu \u064A \u0646 \u0645 \u0648: dimasukkan dengan dengung.","Noon sakinah or tanween before \u064A \u0646 \u0645 \u0648: merged with ghunnah."],b:["Nun mati atau tanwin di hujung kalimah bertemu huruf \u064A\u060C \u0646\u060C \u0645 atau \u0648 di awal kalimah berikutnya. Bunyi nun dimasukkan ke dalam huruf tersebut dan didengungkan kira-kira 2 harakat. Jika berlaku dalam satu kalimah (contohnya \u062F\u064F\u0646\u0652\u064A\u064E\u0627), ia dibaca jelas (Izhar Mutlak).","A silent noon or tanween at the end of a word followed by \u064A\u060C \u0646\u060C \u0645 or \u0648 at the start of the next word. The noon merges into that letter with ghunnah of about 2 counts. Within one word (e.g. \u062F\u064F\u0646\u0652\u064A\u064E\u0627) it is read clearly instead (Izhar Mutlaq)."]},idghaam_no_ghunnah:{c:1,quiz:1,ms:"Idgham Bila Ghunnah",en:"Idgham without Ghunnah",ar:"\u0625\u062F\u063A\u0627\u0645 \u0628\u0644\u0627 \u063A\u0646\u0629",letters:"\u0644 \u0631",len:["Tiada dengung","No ghunnah"],s:["Nun sakinah atau tanwin bertemu \u0644 atau \u0631: dimasukkan tanpa dengung.","Noon sakinah or tanween before \u0644 or \u0631: merged without ghunnah."],b:["Nun mati atau tanwin bertemu huruf \u0644 atau \u0631. Bunyi nun dimasukkan sepenuhnya ke dalam huruf berikutnya tanpa dengung, dan huruf \u0644 atau \u0631 itu dibaca bersabdu.","A silent noon or tanween followed by \u0644 or \u0631 is fully merged into that letter without ghunnah, and the \u0644 or \u0631 is read with shaddah."]},iqlab:{c:1,quiz:1,ms:"Iqlab",en:"Iqlab",ar:"\u0625\u0642\u0644\u0627\u0628",letters:"\u0628",len:["Dengung 2 harakat","Ghunnah 2 counts"],s:["Nun sakinah atau tanwin bertemu \u0628: bunyi nun ditukar kepada mim dengan dengung.","Noon sakinah or tanween before \u0628: the noon becomes a meem sound with ghunnah."],b:["Apabila nun mati atau tanwin bertemu huruf \u0628, bunyi nun ditukar menjadi bunyi mim yang samar, berserta dengung kira-kira 2 harakat. Dalam mushaf ia ditandakan dengan mim kecil (\u06E2).","When a silent noon or tanween is followed by \u0628, the noon changes into a hidden meem sound with ghunnah of about 2 counts. The mushaf marks it with a small meem (\u06E2)."]},ikhfa:{c:1,quiz:1,ms:"Ikhfa' Haqiqi",en:"Ikhfa",ar:"\u0625\u062E\u0641\u0627\u0621 \u062D\u0642\u064A\u0642\u064A",letters:"\u062A \u062B \u062C \u062F \u0630 \u0632 \u0633 \u0634 \u0635 \u0636 \u0637 \u0638 \u0641 \u0642 \u0643",len:["Dengung 2 harakat","Ghunnah 2 counts"],s:["Nun sakinah atau tanwin bertemu 15 huruf ikhfa': disebut samar dengan dengung.","Noon sakinah or tanween before one of 15 letters: hidden, with ghunnah."],b:["Nun mati atau tanwin bertemu salah satu daripada 15 huruf ikhfa'. Bunyi nun disebut samar-samar (antara jelas dan masuk) berserta dengung kira-kira 2 harakat, sambil lidah bersedia untuk huruf berikutnya.","A silent noon or tanween followed by one of the 15 ikhfa letters is pronounced in a hidden way (between clear and merged) with ghunnah of about 2 counts, while the tongue prepares for the next letter."]},izhar_syafawi:{c:0,quiz:0,ms:"Izhar Syafawi",en:"Izhar Shafawi",ar:"\u0625\u0638\u0647\u0627\u0631 \u0634\u0641\u0648\u064A",letters:["Semua huruf selain \u0645 dan \u0628","All letters except \u0645 and \u0628"],len:["Tiada dengung","No ghunnah"],s:["Mim sakinah bertemu huruf selain \u0645 dan \u0628: dibaca jelas di bibir.","Meem sakinah before any letter except \u0645 and \u0628: read clearly."],b:["Mim mati (\u0645\u0652) bertemu mana-mana huruf selain \u0645 dan \u0628. Mim disebut dengan jelas pada dua bibir tanpa dengung. Lebih berhati-hati apabila bertemu \u0648 dan \u0641 supaya mim tidak disamarkan.","A silent meem (\u0645\u0652) followed by any letter other than \u0645 and \u0628 is pronounced clearly with both lips, without ghunnah. Take extra care before \u0648 and \u0641 so it isn't hidden."]},ikhfa_shafawi:{c:1,quiz:1,ms:"Ikhfa' Syafawi",en:"Ikhfa Shafawi",ar:"\u0625\u062E\u0641\u0627\u0621 \u0634\u0641\u0648\u064A",letters:"\u0628",len:["Dengung 2 harakat","Ghunnah 2 counts"],s:["Mim sakinah bertemu \u0628: disebut samar dengan dengung.","Meem sakinah before \u0628: hidden, with ghunnah."],b:["Mim mati bertemu huruf \u0628. Mim disebut samar-samar dengan bibir dirapatkan perlahan, berserta dengung kira-kira 2 harakat.","A silent meem followed by \u0628 is hidden, with the lips closing lightly, and ghunnah of about 2 counts."]},idghaam_shafawi:{c:1,quiz:1,ms:"Idgham Mithlain",en:"Idgham Shafawi",ar:"\u0625\u062F\u063A\u0627\u0645 \u0645\u062A\u0645\u0627\u062B\u0644\u064A\u0646",letters:"\u0645",len:["Dengung 2 harakat","Ghunnah 2 counts"],s:["Mim sakinah bertemu \u0645: dimasukkan dengan dengung.","Meem sakinah before \u0645: merged, with ghunnah."],b:["Mim mati bertemu mim berbaris. Mim pertama dimasukkan ke dalam mim kedua sehingga menjadi satu mim bersabdu, berserta dengung kira-kira 2 harakat. Juga dikenali sebagai Idgham Syafawi.","A silent meem followed by a voweled meem merges into one doubled meem, with ghunnah of about 2 counts. Also called Idgham Mithlain."]},ghunnah:{c:1,quiz:1,ms:"Ghunnah Musyaddadah",en:"Ghunnah",ar:"\u063A\u0646\u0629 \u0645\u0634\u062F\u062F\u0629",letters:"\u0646\u0651 \u0645\u0651",len:["Dengung 2 harakat","Ghunnah 2 counts"],s:["Nun atau mim bersabdu: wajib didengungkan.","Noon or meem with shaddah: always read with ghunnah."],b:["Setiap nun atau mim yang bersabdu (bertasydid) wajib dibaca dengan dengung yang sempurna kira-kira 2 harakat.","Every noon or meem carrying a shaddah is read with a full ghunnah of about 2 counts."]},madd_2:{c:1,quiz:1,ms:"Mad Asli (Tabi'i)",en:"Natural Madd",ar:"\u0645\u062F \u0637\u0628\u064A\u0639\u064A",letters:"\u0627 \u0648 \u064A",len:["2 harakat","2 counts"],s:["Huruf mad tanpa sebab lain: dipanjangkan 2 harakat.","A madd letter with no other cause: 2 counts."],b:["Alif selepas baris atas, wau mati selepas baris hadapan, atau ya mati selepas baris bawah, tanpa hamzah atau sukun selepasnya. Dipanjangkan 2 harakat. Warna ini juga meliputi mad lain yang sama panjang seperti Mad Badal, Mad 'Iwad dan Mad Silah Sughra.","Alif after fathah, silent waw after dammah, or silent ya after kasrah, with no hamzah or sukun after it. Stretched 2 counts. This colour also covers other 2-count madds such as Badal, 'Iwad and short Silah."]},madd_muttasil:{c:1,quiz:1,ms:"Mad Wajib Muttasil",en:"Madd Muttasil",ar:"\u0645\u062F \u0648\u0627\u062C\u0628 \u0645\u062A\u0635\u0644",letters:["Huruf mad + \u0621 dalam satu kalimah","Madd letter + \u0621 in one word"],len:["4 atau 5 harakat","4 or 5 counts"],s:["Huruf mad bertemu hamzah dalam satu kalimah: 4 atau 5 harakat.","Madd letter followed by hamzah in the same word: 4 or 5 counts."],b:["Huruf mad diikuti hamzah dalam kalimah yang sama, contohnya \u062C\u064E\u0622\u0621\u064E dan \u0671\u0644\u0633\u064E\u0651\u0645\u064E\u0622\u0621\u0650. Wajib dipanjangkan 4 atau 5 harakat (riwayat Hafs, tariq Syatibiyyah).","A madd letter followed by hamzah in the same word, e.g. \u062C\u064E\u0622\u0621\u064E and \u0671\u0644\u0633\u064E\u0651\u0645\u064E\u0622\u0621\u0650. It must be stretched 4 or 5 counts (Hafs, via ash-Shatibiyyah)."]},madd_munfasil:{c:1,quiz:1,ms:"Mad Jaiz Munfasil",en:"Madd Munfasil",ar:"\u0645\u062F \u062C\u0627\u0626\u0632 \u0645\u0646\u0641\u0635\u0644",letters:["Huruf mad + \u0621 pada kalimah berikutnya","Madd letter + \u0621 in the next word"],len:["4 atau 5 harakat","4 or 5 counts"],s:["Huruf mad di hujung kalimah, hamzah di awal kalimah berikutnya: 4 atau 5 harakat.","Madd letter at the end of a word, hamzah starting the next: 4 or 5 counts."],b:["Huruf mad di hujung satu kalimah dan hamzah di awal kalimah berikutnya, contohnya \u0625\u0650\u0646\u064E\u0651\u0622 \u0623\u064E\u0639\u0652\u0637\u064E\u064A\u0652\u0646\u064E\u0670\u0643\u064E. Dipanjangkan 4 atau 5 harakat (riwayat Hafs, tariq Syatibiyyah).","A madd letter ends one word and a hamzah starts the next, e.g. \u0625\u0650\u0646\u064E\u0651\u0622 \u0623\u064E\u0639\u0652\u0637\u064E\u064A\u0652\u0646\u064E\u0670\u0643\u064E. Stretched 4 or 5 counts (Hafs, via ash-Shatibiyyah)."]},madd_246:{c:1,quiz:1,ms:"Mad 'Arid Lissukun / Mad Lin",en:"Madd 'Arid / Leen",ar:"\u0645\u062F \u0639\u0627\u0631\u0636 \u0644\u0644\u0633\u0643\u0648\u0646",letters:"\u0627 \u0648 \u064A",len:["2, 4 atau 6 harakat (ketika waqaf)","2, 4 or 6 counts (when stopping)"],s:["Huruf mad sebelum huruf terakhir yang diwaqafkan: 2, 4 atau 6 harakat.","Madd letter before the last letter when stopping: 2, 4 or 6 counts."],b:["Apabila berhenti (waqaf) di hujung kalimah dan sebelum huruf terakhir itu ada huruf mad, contohnya \u0671\u0644\u0652\u0639\u064E\u0670\u0644\u064E\u0645\u0650\u064A\u0646\u064E, boleh dipanjangkan 2, 4 atau 6 harakat. Begitu juga Mad Lin, iaitu wau atau ya mati selepas baris atas (contohnya \u062E\u064E\u0648\u0652\u0641\u064D) ketika waqaf. Jika bacaan disambung, hukum ini tidak berlaku.","When stopping at the end of a word with a madd letter just before the last letter, e.g. \u0671\u0644\u0652\u0639\u064E\u0670\u0644\u064E\u0645\u0650\u064A\u0646\u064E, it may be stretched 2, 4 or 6 counts. The same applies to Madd Leen, a silent waw or ya after fathah (e.g. \u062E\u064E\u0648\u0652\u0641\u064D), when stopping. If you continue reading, this rule does not apply."]},madd_6:{c:1,quiz:1,ms:"Mad Lazim",en:"Madd Lazim",ar:"\u0645\u062F \u0644\u0627\u0632\u0645",letters:["Huruf mad + sukun asli / syaddah","Madd letter + original sukun / shaddah"],len:["6 harakat","6 counts"],s:["Huruf mad bertemu sukun asli atau syaddah: wajib 6 harakat.","Madd letter followed by an original sukun or shaddah: 6 counts."],b:["Huruf mad diikuti huruf bersukun asli atau bersabdu dalam kalimah yang sama, contohnya \u0671\u0644\u0636\u064E\u0651\u0622\u0644\u0650\u0651\u064A\u0646\u064E, atau pada sesetengah huruf pembuka surah seperti \u0627\u0644\u0653\u0645\u0653. Wajib dipanjangkan 6 harakat.","A madd letter followed by a letter with an original sukun or shaddah in the same word, e.g. \u0671\u0644\u0636\u064E\u0651\u0622\u0644\u0650\u0651\u064A\u0646\u064E, or in some opening letters of surahs such as \u0627\u0644\u0653\u0645\u0653. It must be stretched 6 counts."]},qalqalah:{c:1,quiz:1,ms:"Qalqalah",en:"Qalqalah",ar:"\u0642\u0644\u0642\u0644\u0629",letters:"\u0642 \u0637 \u0628 \u062C \u062F",len:["Lantunan","Echo"],s:["Huruf \u0642 \u0637 \u0628 \u062C \u062F bersukun: dibaca melantun.","\u0642 \u0637 \u0628 \u062C \u062F with sukun: read with an echoing bounce."],b:["Lima huruf qalqalah (\u0642\u064F\u0637\u0652\u0628\u064F \u062C\u064E\u062F\u064D\u0651) apabila mati dibaca dengan lantunan suara. Qalqalah Sughra berlaku di tengah kalimah, manakala Qalqalah Kubra berlaku ketika berhenti di hujung kalimah dan lantunannya lebih kuat.","The five qalqalah letters (\u0642\u064F\u0637\u0652\u0628\u064F \u062C\u064E\u062F\u064D\u0651) are read with a bouncing echo when they carry sukun. Minor qalqalah is in the middle of a word; major qalqalah happens when stopping at the end of a word and is stronger."]},lam_qamariah:{c:0,quiz:0,ms:"Alif Lam Qamariah",en:"Lam Qamariyyah",ar:"\u0627\u0644\u0644\u0627\u0645 \u0627\u0644\u0642\u0645\u0631\u064A\u0629",letters:"\u0627 \u0628 \u063A \u062D \u062C \u0643 \u0648 \u062E \u0641 \u0639 \u0642 \u064A \u0645 \u0647",len:["Lam dibaca jelas","Lam pronounced"],s:["Alif lam bertemu 14 huruf qamariah: lam dibaca jelas.","Alif lam before one of 14 moon letters: the lam is pronounced."],b:["Alif lam (\u0627\u0644) yang bertemu salah satu daripada 14 huruf qamariah dibaca jelas, ditandai dengan sukun pada lam, contohnya \u0671\u0644\u0652\u0642\u064E\u0645\u064E\u0631\u064F.","Alif lam (\u0627\u0644) before one of the 14 moon letters is pronounced clearly; the lam carries a sukun, e.g. \u0671\u0644\u0652\u0642\u064E\u0645\u064E\u0631\u064F."]},lam_shamsiyyah:{c:1,quiz:1,ms:"Alif Lam Syamsiah",en:"Lam Shamsiyyah",ar:"\u0627\u0644\u0644\u0627\u0645 \u0627\u0644\u0634\u0645\u0633\u064A\u0629",letters:"\u062A \u062B \u062F \u0630 \u0631 \u0632 \u0633 \u0634 \u0635 \u0636 \u0637 \u0638 \u0644 \u0646",len:["Lam tidak dibaca","Lam not pronounced"],s:["Alif lam bertemu 14 huruf syamsiah: lam tidak dibaca.","Alif lam before one of 14 sun letters: the lam is silent."],b:["Alif lam yang bertemu salah satu daripada 14 huruf syamsiah tidak dibaca. Bunyi lam dimasukkan ke dalam huruf selepasnya yang bertanda sabdu, contohnya \u0671\u0644\u0634\u064E\u0651\u0645\u0652\u0633\u064F.","Alif lam before one of the 14 sun letters is not pronounced; it merges into the next letter, which carries a shaddah, e.g. \u0671\u0644\u0634\u064E\u0651\u0645\u0652\u0633\u064F."]},hamzat_wasl:{c:1,quiz:1,ms:"Hamzah Wasal",en:"Hamzat al-Wasl",ar:"\u0647\u0645\u0632\u0629 \u0627\u0644\u0648\u0635\u0644",letters:"\u0671",len:["Gugur bila disambung","Dropped when joined"],s:["Hamzah yang dibaca ketika memulakan bacaan, tetapi gugur apabila disambung.","A hamzah read only when starting, dropped when joined."],b:["Hamzah wasal (\u0671) hanya dibunyikan apabila memulakan bacaan pada kalimah itu. Apabila bacaan disambung dari kalimah sebelumnya, ia tidak dibaca.","Hamzat al-wasl (\u0671) is only pronounced when you start reading from that word. When joined to the previous word, it is not read."]},idghaam_mutajanisayn:{c:1,quiz:1,ms:"Idgham Mutajanisain",en:"Idgham Mutajanisayn",ar:"\u0
