52","mereka","they"],["\u0646\u064E\u062D\u0652\u0646\u064F","kami","we"],["\u0623\u064E\u0646\u062A\u064E","engkau","you"],["\u0643\u064F\u0644\u0651","setiap, semua","every, all"],["\u0628\u064E\u064A\u0652\u0646","antara","between"],["\u0642\u064E\u0628\u0652\u0644","sebelum","before (time)"],["\u0628\u064E\u0639\u0652\u062F","selepas","after"],["\u0639\u0650\u0646\u062F","di sisi","with, near"],["\u0625\u0650\u0630\u064E\u0627","apabila","when"]],RASUL=[["adam","Adam","Manusia pertama, dicipta daripada tanah. Allah mengajarnya nama-nama segala sesuatu. Selepas tergoda oleh Iblis dan bertaubat, baginda diturunkan ke bumi sebagai khalifah.","The first human, created from clay. Allah taught him the names of all things. After Iblis tempted him and he repented, he was sent to earth as a vicegerent.","Al-Baqarah 2:30\u201337 \xB7 Al-A'raf 7:11\u201325"],["idris","Idris","Seorang nabi yang benar dan sabar. Allah mengangkatnya ke kedudukan yang tinggi.","A truthful and patient prophet whom Allah raised to a high station.","Maryam 19:56\u201357 \xB7 Al-Anbiya' 21:85"],["nuh","Nuh","Berdakwah kepada kaumnya selama 950 tahun, tetapi hanya sedikit yang beriman. Atas perintah Allah baginda membina bahtera, lalu banjir besar menenggelamkan orang yang ingkar.","He called his people for 950 years, but few believed. By Allah's command he built the ark, and a great flood drowned those who rejected.","Hud 11:25\u201349 \xB7 Al-'Ankabut 29:14 \xB7 Surah Nuh 71"],["hud","Hud","Diutus kepada kaum 'Ad yang kuat dan sombong. Mereka ingkar lalu dibinasakan dengan angin yang sangat kencang.","Sent to the mighty, arrogant people of 'Ad. They rejected him and were destroyed by a furious wind.","Hud 11:50\u201360 \xB7 Al-Ahqaf 46:21\u201325"],["salih","Salih","Diutus kepada kaum Thamud. Mukjizatnya seekor unta betina, tetapi kaumnya menyembelih unta itu lalu ditimpa azab.","Sent to the people of Thamud. His sign was a she-camel, but they killed it and were punished.","Hud 11:61\u201368 \xB7 Asy-Syams 91:11\u201315"],["ibrahim","Ibrahim","Bapa para nabi. Baginda menghancurkan berhala kaumnya lalu dicampak ke dalam api, tetapi Allah menjadikan api itu sejuk. Bersama Ismail, baginda membina Kaabah.","Father of the prophets. He broke his people's idols and was thrown into fire, which Allah made cool. With Ismail he built the Ka'bah.","Al-Anbiya' 21:51\u201370 \xB7 Al-Baqarah 2:127"],["lut","Lut","Anak saudara Ibrahim, diutus kepada kaum yang melakukan perbuatan keji. Mereka ingkar lalu negeri mereka diterbalikkan.","Ibrahim's nephew, sent to a people who committed shameful acts. They refused to change and their towns were overturned.","Hud 11:77\u201383"],["ismail","Ismail","Anak Ibrahim yang sabar dan taat. Baginda redha untuk dikorbankan, lalu Allah menggantikannya dengan seekor sembelihan. Baginda membantu bapanya membina Kaabah.","Ibrahim's patient, obedient son. He accepted being sacrificed, and Allah replaced him with a ram. He helped his father build the Ka'bah.","As-Saffat 37:101\u2013107 \xB7 Al-Baqarah 2:127"],["ishak","Ishak","Anak Ibrahim dan Sarah, yang dilahirkan sebagai khabar gembira ketika kedua-duanya sudah tua.","Son of Ibrahim and Sarah, born as glad tidings when both were old.","Hud 11:71\u201373 \xB7 As-Saffat 37:112\u2013113"],["yaakub","Yaakub","Anak Ishak dan bapa kepada Yusuf. Baginda tetap sabar dan berharap kepada Allah walaupun lama kehilangan Yusuf.","Son of Ishaq and father of Yusuf. He stayed patient and hopeful in Allah through the long loss of Yusuf.","Yusuf 12:83\u201387"],["yusuf","Yusuf","Dibuang ke dalam perigi oleh saudara-saudaranya, dijual sebagai hamba dan dipenjara, tetapi kemudian menjadi pemegang perbendaharaan Mesir. Baginda memaafkan saudara-saudaranya.","Thrown into a well by his brothers, sold as a slave and imprisoned, he later became treasurer of Egypt and forgave his brothers.","Surah Yusuf 12"],["ayub","Ayub","Diuji dengan penyakit dan kehilangan harta serta keluarga, tetapi tetap sabar. Allah menyembuhkan dan mengembalikan nikmatnya.","Tested with illness and the loss of wealth and family, he stayed patient. Allah healed him and restored his blessings.","Al-Anbiya' 21:83\u201384 \xB7 Sad 38:41\u201344"],["syuaib","Syuaib","Diutus kepada penduduk Madyan yang menipu dalam timbangan dan sukatan. Mereka ingkar lalu ditimpa gempa.","Sent to the people of Madyan, who cheated in weights and measures. They rejected him and were struck by an earthquake.","Hud 11:84\u201395"],["musa","Musa","Diutus kepada Firaun dengan mukjizat tongkat dan tangan yang bercahaya. Laut terbelah untuk menyelamatkan Bani Israil, dan baginda menerima Taurat.","Sent to Pharaoh with the signs of the staff and the shining hand. The sea parted to save the Children of Israel, and he received the Torah.","Taha 20 \xB7 Al-Qasas 28 \xB7 Asy-Syu'ara' 26:10\u201368"],["harun","Harun","Saudara Musa yang fasih berbicara, dilantik sebagai pembantunya dalam dakwah kepada Firaun.","Musa's eloquent brother, appointed to help him call Pharaoh.","Taha 20:29\u201336"],["zulkifli","Zulkifli","Disebut dalam Al-Quran sebagai antara orang yang sabar dan orang pilihan.","Mentioned in the Quran among the patient and the chosen.","Al-Anbiya' 21:85\u201386 \xB7 Sad 38:48"],["daud","Daud","Mengalahkan Jalut ketika masih muda, kemudian menjadi raja. Allah menurunkan kitab Zabur dan melembutkan besi baginya.","He defeated Goliath (Jalut) as a young man and became king. Allah gave him the Psalms (Zabur) and softened iron for him.","Al-Baqarah 2:251 \xB7 Saba' 34:10\u201311"],["sulaiman","Sulaiman","Anak Daud, diberi kerajaan yang hebat: faham bahasa binatang, menguasai angin dan jin. Kisahnya dengan semut dan Ratu Balqis disebut dalam Surah An-Naml.","Son of Dawud, given a great kingdom: he understood animals and commanded the wind and jinn. His stories with the ant and the Queen of Sheba are in Surah An-Naml.","An-Naml 27:15\u201344 \xB7 Saba' 34:12\u201314"],["ilyas","Ilyas","Menyeru kaumnya supaya meninggalkan penyembahan berhala Ba'l dan kembali menyembah Allah.","He called his people to abandon the idol Ba'l and worship Allah.","As-Saffat 37:123\u2013132"],["ilyasa","Ilyasa'","Disebut bersama para nabi pilihan yang dilebihkan oleh Allah.","Mentioned among the chosen prophets whom Allah favoured.","Al-An'am 6:86 \xB7 Sad 38:48"],["yunus","Yunus","Meninggalkan kaumnya sebelum diizinkan, lalu ditelan ikan besar. Dalam perut ikan baginda berdoa memohon ampun, lalu diselamatkan.","He left his people before being permitted and was swallowed by a great fish. Inside it he prayed for forgiveness and was saved.","Al-Anbiya' 21:87\u201388 \xB7 As-Saffat 37:139\u2013148"],["zakaria","Zakaria","Penjaga Maryam. Ketika sudah tua, baginda berdoa dengan penuh harap dan dikurniakan anak, Yahya.","Guardian of Maryam. In old age he prayed with hope and was granted a son, Yahya.","Ali 'Imran 3:37\u201341 \xB7 Maryam 19:2\u201311"],["yahya","Yahya","Anak Zakaria, diberi hikmah sejak kecil, berbakti kepada ibu bapa dan tidak sombong.","Son of Zakariya, given wisdom as a child, devoted to his parents and never arrogant.","Maryam 19:12\u201315"],["isa","Isa","Lahir daripada Maryam tanpa bapa. Dengan izin Allah, baginda menyembuhkan orang sakit dan menghidupkan orang mati. Baginda menerima Injil dan diangkat oleh Allah.","Born of Maryam without a father. By Allah's permission he healed the sick and raised the dead. He received the Gospel and was raised up by Allah.","Ali 'Imran 3:45\u201355 \xB7 Maryam 19:16\u201336"],["muhammad","Muhammad \uFDFA","Penutup sekalian nabi, diutus sebagai rahmat untuk seluruh alam dengan Al-Quran. Lihat Sirah ringkas untuk kisah baginda.","The seal of the prophets, sent as a mercy to all the worlds with the Quran. See the short Sirah for his story.","Al-Ahzab 33:40 \xB7 Al-Anbiya' 21:107"]],ASAS={rukun:[["Rukun Iman","Pillars of Faith",[["Beriman kepada Allah","Belief in Allah"],["Beriman kepada para malaikat","Belief in the angels"],["Beriman kepada kitab-kitab","Belief in the revealed books"],["Beriman kepada para rasul","Belief in the messengers"],["Beriman kepada hari akhirat","Belief in the Last Day"],["Beriman kepada qada' dan qadar","Belief in divine decree (qada' and qadar)"]],"Dalil: Hadis Jibril, riwayat Muslim.","Source: the hadith of Jibril, narrated by Muslim."],["Rukun Islam","Pillars of Islam",[["Mengucap dua kalimah syahadah","Bearing witness (the two shahadahs)"],["Mendirikan solat","Establishing the prayer"],["Menunaikan zakat","Paying zakah"],["Berpuasa di bulan Ramadan","Fasting in Ramadan"],["Menunaikan haji bagi yang mampu","Performing hajj for those able"]],'Dalil: "Islam dibina di atas lima perkara", riwayat al-Bukhari & Muslim.','Source: "Islam is built on five", narrated by al-Bukhari & Muslim.']],wuduk:[["Rukun wuduk (6)","Obligatory acts of wudu (6)",[["Niat (dalam hati, ketika membasuh muka)","Intention (in the heart, while washing the face)"],["Membasuh muka","Washing the face"],["Membasuh kedua-dua tangan hingga siku","Washing both arms up to the elbows"],["Menyapu sebahagian kepala","Wiping part of the head"],["Membasuh kedua-dua kaki hingga buku lali","Washing both feet up to the ankles"],["Tertib (mengikut susunan)","Doing them in order"]],"Lafaz niat: \u0646\u064E\u0648\u064E\u064A\u0652\u062A\u064F \u0631\u064E\u0641\u0652\u0639\u064E \u0627\u0644\u0652\u062D\u064E\u062F\u064E\u062B\u0650 \u0627\u0644\u0652\u0623\u064E\u0635\u0652\u063A\u064E\u0631\u0650 \u0644\u0650\u0644\u064E\u0651\u0647\u0650 \u062A\u064E\u0639\u064E\u0627\u0644\u064E\u0649 (Sahaja aku mengangkat hadas kecil kerana Allah Ta'ala).","The intention may be said: nawaitu raf'al hadathil asghari lillahi ta'ala (I intend to lift minor impurity for Allah)."],["Sunat wuduk","Sunnah acts of wudu",[["Membaca Bismillah","Saying Bismillah"],["Membasuh kedua-dua tapak tangan","Washing both palms"],["Berkumur-kumur dan memasukkan air ke hidung","Rinsing the mouth and nose"],["Menyapu seluruh kepala dan kedua-dua telinga","Wiping the whole head and both ears"],["Mendahulukan anggota kanan","Starting with the right side"],["Membasuh tiga kali setiap anggota","Washing each part three times"],["Berdoa selepas wuduk","Saying the dua after wudu"]],"",""],["Perkara yang membatalkan wuduk","What breaks wudu",[["Keluar sesuatu dari qubul atau dubur","Anything leaving the front or back passage"],["Hilang akal: tidur tidak tetap punggung, gila, pengsan atau mabuk","Losing awareness: deep sleep not seated firmly, insanity, fainting or intoxication"],["Bersentuh kulit lelaki dan perempuan yang bukan mahram tanpa lapik","Skin contact between a man and a non-mahram woman without a barrier"],["Menyentuh kemaluan dengan tapak tangan","Touching the private parts with the palm"]],"Mengikut mazhab Syafi'i.","According to the Shafi'i school."]],solat:[["Rukun solat (13)","Pillars of the prayer (13)",[["Niat","Intention"],["Takbiratul ihram","The opening takbir"],["Berdiri bagi yang mampu","Standing, if able"],["Membaca Al-Fatihah","Reciting Al-Fatihah"],["Rukuk dengan tama'ninah","Bowing, with stillness"],["Iktidal dengan tama'ninah","Rising from bowing, with stillness"],["Sujud dua kali dengan tama'ninah","Prostrating twice, with stillness"],["Duduk antara dua sujud dengan tama'ninah","Sitting between the prostrations, with stillness"],["Duduk tahiyat akhir","Sitting for the final tashahhud"],["Membaca tahiyat akhir","Reciting the final tashahhud"],["Berselawat ke atas Nabi dalam tahiyat akhir","Sending salawat on the Prophet in the final tashahhud"],["Memberi salam yang pertama","The first salam"],["Tertib","Doing them in order"]],"Bacaan untuk setiap rukun ada di Doa \u2192 Dalam solat.","The recitations for each pillar are in Duas \u2192 In solat."],["Syarat sah solat","Conditions for a valid prayer",[["Suci daripada hadas kecil dan besar","Free of minor and major impurity"],["Suci badan, pakaian dan tempat daripada najis","Body, clothes and place free of filth"],["Menutup aurat","Covering the awrah"],["Menghadap kiblat","Facing the qiblah"],["Masuk waktu solat","The prayer time has begun"]],"",""],["Perkara yang membatalkan solat","What breaks the prayer",[["Berhadas","Losing wudu"],["Berkata-kata dengan sengaja","Speaking deliberately"],["Bergerak banyak tiga kali berturut-turut","Three large consecutive movements"],["Makan atau minum","Eating or drinking"],["Terbuka aurat (dan tidak segera ditutup)","The awrah becoming uncovered (and not covered at once)"],["Berpaling dada dari kiblat","Turning the chest away from the qiblah"],["Ketawa","Laughing"],["Meninggalkan rukun dengan sengaja","Leaving out a pillar deliberately"]],"Mengikut mazhab Syafi'i.","According to the Shafi'i school."]],mandi:[["Sebab wajib mandi","What makes ghusl obligatory",[["Keluar mani","Release of semen"],["Bersetubuh (jimak)","Sexual intercourse"],["Selesai haid","End of menstruation"],["Selesai nifas","End of post-natal bleeding"],["Wiladah (bersalin)","Giving birth"],["Mati (bagi orang Islam, kecuali syahid)","Death (for a Muslim, except a martyr)"]],"",""],["Rukun mandi wajib","Obligatory acts of ghusl",[["Niat","Intention"],["Meratakan air ke seluruh badan, termasuk rambut dan kulit","Making water reach the whole body, including hair and skin"]],"Lafaz niat: \u0646\u064E\u0648\u064E\u064A\u0652\u062A\u064F \u0631\u064E\u0641\u0652\u0639\u064E \u0627\u0644\u0652\u062D\u064E\u062F\u064E\u062B\u0650 \u0627\u0644\u0652\u0623\u064E\u0643\u0652\u0628\u064E\u0631\u0650 \u0644\u0650\u0644\u064E\u0651\u0647\u0650 \u062A\u064E\u0639\u064E\u0627\u0644\u064E\u0649 (Sahaja aku mengangkat hadas besar kerana Allah Ta'ala).","The intention may be said: nawaitu raf'al hadathil akbari lillahi ta'ala (I intend to lift major impurity for Allah)."],["Sunat mandi wajib","Sunnah acts of ghusl",[["Membaca Bismillah","Saying Bismillah"],["Membasuh kedua-dua tangan dan istinjak","Washing the hands and private parts"],["Berwuduk sebelum mandi","Doing wudu before the bath"],["Mendahulukan anggota kanan","Starting with the right side"],["Menggosok badan","Rubbing the body"],["Membasuh tiga kali","Washing three times"]],"",""]]},MAKHRAJ=[["jauf","Al-Jauf (rongga mulut & tekak)","Al-Jawf (the mouth and throat cavity)","\u0627 \u0648 \u064A","Huruf mad: alif selepas fathah, wau sukun selepas dhammah, ya sukun selepas kasrah. Bunyi keluar dari ruang kosong mulut dan tekak.","The madd letters: alif after fathah, sukun waw after dammah, sukun ya after kasrah. The sound comes from the open space of the mouth and throat."],["halq1","Pangkal tekak (Aqsal Halq)","Deepest throat","\u0621 \u0647","Bahagian tekak yang paling dalam, dekat dada.","The deepest part of the throat, nearest the chest."],["halq2","Tengah tekak (Wasatul Halq)","Middle throat","\u0639 \u062D","Bahagian tengah tekak.","The middle of the throat."],["halq3","Hujung tekak (Adnal Halq)","Upper throat","\u063A \u062E","Bahagian tekak yang paling hampir dengan mulut.","The part of the throat nearest the mouth."],["lisan1","Pangkal lidah","Back of the tongue","\u0642 \u0643","Qaf: pangkal lidah bertemu lelangit lembut. Kaf: sedikit ke depan daripada qaf.","Qaf: back of the tongue against the soft palate. Kaf: a little further forward."],["lisan2","Tengah lidah","Middle of the tongue","\u062C \u0634 \u064A","Tengah lidah bertemu lelangit keras (ya yang tidak bertanda mad).","Middle of the tongue against the hard palate (ya that is not madd)."],["lisan3","Tepi lidah","Side of the tongue","\u0636 \u0644","Dhad: tepi lidah bertemu gigi geraham atas. Lam: hujung tepi lidah ke gusi gigi depan.","Dad: side of the tongue against the upper molars. Lam: the front edge of the tongue to the gums of the front teeth."],["lisan4","Hujung lidah & gusi","Tip of the tongue & gums","\u0646 \u0631","Nun: hujung lidah ke gusi atas. Ra: hampir dengan nun, sedikit ke belakang dan melibatkan belakang hujung lidah.","Nun: tongue tip to the upper gums. Ra: close to nun, slightly further back, using the top of the tongue tip."],["lisan5","Hujung lidah & pangkal gigi atas","Tongue tip & roots of the upper teeth","\u0637 \u062F \u062A","Hujung lidah bertemu pangkal gigi depan atas.","Tongue tip against the roots of the upper front teeth."],["lisan6","Hujung lidah & gigi bawah (huruf siulan)","Tongue tip & lower teeth (whistling letters)","\u0635 \u0633 \u0632","Hujung lidah hampir dengan gigi depan bawah, bunyi seperti siulan.","Tongue tip near the lower front teeth, with a whistling sound."],["lisan7","Hujung lidah & hujung gigi atas","Tongue tip & edges of the upper teeth","\u0638 \u0630 \u062B","Hujung lidah bertemu hujung gigi depan atas, lidah sedikit terkeluar.","Tongue tip against the edges of the upper front teeth, slightly out."],["syafah1","Bibir bawah & gigi atas","Lower lip & upper teeth","\u0641","Bahagian dalam bibir bawah bertemu hujung gigi depan atas.","Inner lower lip against the edges of the upper front teeth."],["syafah2","Dua bibir","Both lips","\u0628 \u0645 \u0648","Ba dan mim: dua bibir bertemu. Wau (bukan mad): dua bibir dimuncungkan tanpa rapat.","Ba and mim: lips together. Waw (not madd): lips rounded without closing."],["khaisyum","Al-Khaisyum (pangkal hidung)","Al-Khayshum (the nasal cavity)","\u0646\u0651 \u0645\u0651","Tempat keluar dengung (ghunnah): nun dan mim bertasydid, ikhfa', idgham bighunnah dan iqlab.","Where nasalisation (ghunnah) comes from: doubled nun and mim, ikhfa', idgham with ghunnah and iqlab."]],PATHS=[["doa7","Hafal 7 doa harian","Memorise 7 daily duas",[["doa","makan"],["doa","tidur"],["doa","keluarrumah"],["doa","kenderaan"],["doa","ibubapa"],["doa","dunia"],["doa","ilmu"]]],["tajwid7","Kenali tajwid asas","Get to know basic tajwid",[["tj","izhar_halqi"],["tj","ikhfa"],["tj","idghaam_ghunnah"],["tj","iqlab"],["tj","ikhfa_shafawi"],["tj","madd_2"],["quiz","tajwid"]]],["asma9","Kenali Asmaul Husna","Learn the 99 Names",[["asma",1],["asma",12],["asma",23],["asma",34],["asma",45],["asma",56],["asma",67],["asma",78],["asma",89]]],["sirah8","Sirah dalam 8 hari","The Sirah in 8 days" i bila dalam talian.",fbFail:"Tak dapat hantar. Cuba lagi.",fbThanks:"Terima kasih atas maklum balas anda!",fbReport:"Lapor kesilapan teks",fbRowHint:"Jumpa kesilapan pada teks doa, hadis atau ayat? Ada cadangan? Hantar terus kepada pemilik app.",fbOpen:"Tulis maklum balas",fbInbox:"Maklum balas pengguna",fbInboxNone:"Belum ada maklum balas.",fbInboxErr:"Tak dapat memuatkan.",fbDelete:"Padam",clTitle:"Sejarah kemas kini",clOlder:"Sebelum ini: jurnal bacaan, khatam, waktu solat, peringatan, statistik dan perkongsian.",abTitle:"Tentang app",abIntro:"Quran Note ialah jurnal bacaan Al-Quran peribadi: catat muka surat, jejak khatam, belajar tajwid, doa dan hadis.",abSources:"Sumber kandungan",abQuran:"Teks Al-Quran Uthmani",abTrans:"Terjemahan: Abdullah Muhammad Basmeih (Melayu) dan Saheeh International (Inggeris), melalui Tanzil.net / QuranEnc",abTajwid:"Data hukum tajwid",abAudio:"Bacaan qari",abSolat:"Waktu solat",abSolatBk:"sandaran:",abDoa:"Doa dan hadis: lafaz masyhur daripada kitab hadis muktabar, dengan sumber dinyatakan pada setiap satu",abTech:"Teknologi",abFonts:"Fon",pvTitle:"Privasi",pvUpdated:"Dikemas kini: 21 November 2026",pvBlocks:[["Dalam telefon anda","Jurnal peribadi (catatan, nota, khatam, kuiz, tajwid, doa kegemaran dan tetapan) disimpan dalam telefon anda sahaja. Kami tidak menghantarnya ke pelayan."],["Akaun passkey (pilihan)","Jika anda cipta akaun, jurnal anda (catatan, khatam, kuiz dan tajwid) disimpan di pelayan supaya boleh dipulihkan di telefon lain. Akaun dibuka dengan passkey atau kod pemulihan sahaja; kami tidak menyimpan e-mel atau kata laluan. Anda boleh padam akaun dan semua data awan bila-bila masa di Tetapan."],["Akaun pemilik","Jika anda pemilik app, jurnal anda disegerakkan ke pelayan supaya boleh dibuka di telefon lain. Hanya orang yang ada PIN atau passkey boleh mengubahnya; pelawat hanya nampak jurnal tanpa surat kapsul masa dan data belajar."],["Cabaran keluarga","Hanya nama yang anda pilih dan jumlah muka surat minggu ini dikongsi dengan ahli kumpulan. Keluar kumpulan akan memadamkan nama anda daripadanya."],["Pindah telefon & maklum balas","Kod pindah disimpan paling lama 24 jam dan dipadam selepas digunakan. Maklum balas (mesej, nama pilihan, versi app) hanya boleh dibaca oleh pemilik app."],["Peringatan & waktu solat","Jika peringatan dihidupkan, pelayan menyimpan langganan notifikasi peranti, zon waktu, jam peringatan, tarikh bacaan terakhir, tanda Al-Waqi'ah/Al-Mulk hari itu dan masa peringatan sunat yang anda pilih. Tiada isi jurnal atau nota disimpan untuk tujuan ini. Menutup semua peringatan memadam rekod ini. Lokasi hanya digunakan dalam telefon untuk memilih zon waktu solat dan tidak disimpan di pelayan."],["Keselamatan","Alamat IP hanya digunakan dalam bentuk cincang (hash) untuk mengehadkan cubaan berulang, dan tamat selepas sejam."],["Padam data","Padam data dalam telefon melalui tetapan pelayar (Clear site data). Akaun passkey boleh dipadam terus di Tetapan \u2192 Akaun & sandaran awan. Untuk data pelayan yang lain, hantar permintaan melalui Maklum balas."]],lqTitle:"Kuiz",lqStart:"Kuiz 5 soalan",lqRight:"Betul!",lqWrong:"Belum tepat. Soalan ini akan diulang dalam Ulang kaji pintar.",lqAsmaQ:"Apakah maksud nama ini?",lqAsmaHint:a=>`Ini nama ke-${a} daripada 99.`,lqKataQ:"Apakah maksud perkataan ini?",lqKataHint:a=>`Maksudnya bermula dengan huruf "${a}".`,lqSirahQ:a=>`Peristiwa manakah berlaku pada ${a}?`,lqSirahHint:a=>`Ia berlaku pada fasa ${a}.`,lqHadisQ:"Apakah maksud hadis ini?",lqHadisHint:a=>`Hadis ini ${a.charAt(0).toLowerCase()+a.slice(1)}.`,qhLearnShort:"Belajar",asTitle:"Asmaul Husna",asShort:"Asmaul Husna",asSub:a=>`99 nama Allah \xB7 ${a}/99 dibaca`,asList:"Senarai",asFlash:"Kad imbas",asFlashHint:"Ketik kad untuk lihat maksud. Cuba ingat dahulu sebelum membuka.",asNote:"Susunan mengikut riwayat at-Tirmizi. Maksud ialah terjemahan ringkas; setiap nama mempunyai makna yang lebih luas.",kkTitle:"Kosa kata Al-Quran",kkShort:"Kosa kata",kkSub:a=>`${a} perkataan yang -capsule letters or learning data."],["Family challenge","Only the name you choose and this week's page total are shared with group members. Leaving the group removes your name from it."],["Moving phones & feedback","Transfer codes are kept for at most 24 hours and deleted once used. Feedback (message, optional name, app version) can only be read by the app owner."],["Reminders & prayer times","If reminders are on, the server keeps this device's notification subscription, time zone, reminder hours, last reading day, that day's Al-Waqi'ah/Al-Mulk ticks and the times of the sunnah reminders you chose. No journal content or notes are stored for this. Turning all reminders off deletes the record. Location is only used on your phone to pick the prayer-time zone and isn't stored on the server."],["Security","IP addresses are only used in hashed form to limit repeated attempts, and expire after an hour."],["Deleting data","Delete data on your phone through your browser settings (Clear site data). A passkey account can be deleted directly in Settings \u2192 Account & cloud backup. For other server data, send a request through Feedback."]],lqTitle:"Quiz",lqStart:"5-question quiz",lqRight:"Right!",lqWrong:"Not yet. This will come back in Smart review.",lqAsmaQ:"What does this name mean?",lqAsmaHint:a=>`This is name ${a} of 99.`,lqKataQ:"What does this word mean?",lqKataHint:a=>`The meaning starts with "${a}".`,lqSirahQ:a=>`Which event happened in ${a}?`,lqSirahHint:a=>`It happened in the ${a} period.`,lqHadisQ:"What does this hadith mean?",lqHadisHint:a=>`Narrated by ${a}.`,qhLearnShort:"Learn",asTitle:"Asma'ul Husna",asShort:"99 Names",asSub:a=>`The 99 Names of Allah \xB7 ${a}/99 read`,asList:"List",asFlash:"Flashcards",asFlashHint:"Tap a card to see the meaning. Try to recall it first.",asNote:"Order as narrated by at-Tirmidhi. Meanings are short translations; each name carries a broader meaning.",kkTitle:"Quran vocabulary",kkShort:"Vocabulary",kkSub:a=>`${a} frequent words  Muhajirin dan Ansar.","Lessons of Badr, spoils of war, qualities of believers, and the bond of the Muhajirin and Ansar."],["Tanpa basmalah; perjanjian dengan musyrikin, perang Tabuk, pendedahan munafik, dan taubat tiga sahabat yang tertinggal.","No basmalah; treaties with the idolaters, Tabuk, the hypocrites exposed, and the repentance of the three who stayed behind."],["Kebenaran wahyu, kisah Nabi Nuh, Musa dan Firaun, dan kaum Nabi Yunus yang beriman sebelum azab.","The truth of revelation, Nuh, Musa and Pharaoh, and the people of Yunus who believed before punishment."],["Para nabi yang sabar menghadapi kaum mereka: Nuh, Hud, Saleh, Ibrahim, Lut, Syuaib dan Musa.","Prophets patient with their people: Nuh, Hud, Salih, Ibrahim, Lut, Shu'ayb and Musa."],["Kisah Nabi Yusuf dari mimpi, perigi, godaan dan penjara hingga bersatu semula dengan keluarga; tentang sabar dan memaafkan.","Yusuf's story from the dream, the well, temptation and prison to reunion; on patience and forgiveness."],["Tanda kekuasaan Allah di alam, hati tenang dengan mengingati Allah, dan perubahan bermula dari diri sendiri.","Signs of Allah in nature, hearts at rest in His remembrance, and change beginning within."],["Nikmat Allah dan syukur, perumpamaan kalimah yang baik seperti pohon yang baik, dan doa Nabi Ibrahim.","Allah's blessings and gratitude, the good word like a good tree, and Ibrahim's prayers."],["Al-Quran dipelihara Allah, Adam dan Iblis, tetamu Nabi Ibrahim, dan penduduk al-Hijr.","Allah preserves the Quran, Adam and Iblis, Ibrahim's guests, and the people of al-Hijr."],["Lebah; nikmat Allah yang tidak terhitung di alam, dan seruan berdakwah dengan hikmah.","The Bee: countless blessings in nature, and calling to Allah with wisdom."],["Isra' Mikraj, Bani Israil, berbuat baik kepada ibu bapa dan pesanan akhlak, dan Al-Quran sebagai penawar.","The Night Journey, the Children of Israel, kindness to parents and moral guidance, and the Quran as healing."],["Empat kisah ujian: pemuda gua (iman), pemilik dua kebun (harta), Musa dan Khidir (ilmu), Zulqarnain (kuasa).","Four trials: the youths of the cave (faith), the two gardens (wealth), Musa and Khidr (knowledge), Dhul-Qarnayn (power)."],["Rahmat Allah dalam kisah Zakaria dan Yahya, kelahiran Isa kepada Maryam, dan Nabi Ibrahim.","Allah's mercy: Zakariya and Yahya, the birth of Isa to Maryam, and Ibrahim."],["Kisah Nabi Musa dari api di Tur hingga berhadapan Firaun dan Samiri; Al-Quran bukan untuk menyusahkan.","Musa from the fire at Tur to Pharaoh and the Samiri; the Quran was not sent to burden."],["Para nabi membawa tauhid yang sama; Ibrahim dan berhala, serta doa Ayub, Yunus dan Zakaria.","Prophets with one message; Ibrahim and the idols, and the prayers of Ayyub, Yunus and Zakariya."],["Ibadah haji dan korban, kegoncangan hari kiamat, dan izin mempertahankan diri.","Pilgrimage and sacrifice, the quake of the Hour, and permission to defend oneself."],["Sifat orang beriman yang berjaya, peringkat kejadian manusia, dan para rasul.","Qualities of successful believers, the stages of human creation, and the messengers."],["Menjaga maruah dan aurat, fitnah terhadap Aisyah, ayat cahaya, dan adab meminta izin masuk rumah.","Modesty and dignity, the slander against Aisha, the Verse of Light, and asking permission to enter homes."],["Pembeza antara benar dan batil, dan sifat 'ibadurrahman, hamba Allah Yang Maha Pemurah.","The Criterion between truth and falsehood, and the qualities of the servants of the Most Merciful."],['Kisah para nabi dengan ulangan "Tuhanmu Maha Perkasa lagi Maha Penyayang".',`Prophets' stories with the refrain "your Lord is the Mighty, the Merciful".`],["Semut; Nabi Sulaiman, burung hud-hud dan Ratu Saba', dan nikmat Allah.","The Ant: Sulayman, the hoopoe and the Queen of Sheba, and Allah's favours."],["Nabi Musa dari bayi di sungai hingga ke Madyan, dan Qarun yang angkuh dengan hartanya.","Musa from infancy on the river to Madyan, and Qarun's arrogance with his wealth."],["Labah-labah; iman pasti diuji, dan rumah labah-labah sebagai perumpamaan bergantung selain Allah.","The Spider: faith will be tested, and the spider's house as the parable of relying on other than Allah."],["Kemenangan Rom yang dijanjikan, tanda-tanda Allah termasuk pasangan dan kasih sayang, dan fitrah manusia.","The Romans' promised victory, Allah's signs including spouses and love, and human nature (fitrah)."],["Nasihat Luqman kepada anaknya: tauhid, berbuat baik kepada ibu bapa, solat, sabar dan rendah diri.","Luqman's advice to his son: oneness of Allah, kindness to parents, prayer, patience and humility."],["Penciptaan manusia, hari kebangkitan, dan orang beriman yang bangun malam berdoa.","Human creation, resurrection, and believers who rise at night in prayer."],["Perang Khandaq, kedudukan isteri-isteri Nabi, adab bersama Nabi, dan selawat.","The Battle of the Trench, the Prophet's wives, manners with the Prophet, and sending blessings on him."],["Nikmat kepada keluarga Daud dan Sulaiman, dan kaum Saba' yang kufur nikmat.","Favours to Dawud and Sulayman, and the people of Sheba who were ungrateful."],["Pencipta langit dan bumi, malaikat bersayap, manusia berhajat kepada Allah, dan pewaris Al-Quran.","Originator of the heavens and earth, winged angels, our need for Allah, and the heirs of the Book."],["Kebenaran risalah, penduduk sebuah negeri dan lelaki yang menyeru mereka, tanda-tanda Allah, dan kebangkitan.","The truth of the message, the townspeople and the man who called them, Allah's signs, and resurrection."],["Malaikat yang bersaf, pengorbanan Nabi Ibrahim dan Ismail, dan Nabi Yunus dalam perut ikan.","The angels in ranks, the sacrifice of Ibrahim and Isma'il, and Yunus in the whale."],["Nabi Daud dan Sulaiman yang kembali kepada Allah, kesabaran Nabi Ayub, dan keangkuhan Iblis.","Dawud and Sulayman turning to Allah, Ayyub's patience, and the arrogance of Iblis."],["Ikhlas dalam beribadah, rombongan ke syurga dan neraka, dan jangan berputus asa dari rahmat Allah.","Sincere worship, the groups led to Paradise and Hell, and never despairing of Allah's mercy."],['Allah Maha Pengampun; mukmin dari keluarga Firaun yang membela Nabi Musa, dan "berdoalah kepada-Ku, Aku perkenankan".',`The Forgiver: the believer from Pharaoh's family who defended Musa, and "call on Me, I will answer".`],["Al-Quran yang dijelaskan, kulit dan anggota menjadi saksi, dan balas kejahatan dengan kebaikan.","The Quran made clear, skins and limbs as witnesses, and repelling evil with good."],["Bermesyuarat dalam urusan, satu agama sejak Nabi Nuh, dan rezeki dalam ketentuan Allah.","Consultation, one religion since Nuh, and provision measured by Allah."],["Perhiasan dunia yang sementara, mengikut nenek moyang secara membuta tuli, dan kisah Musa dan Isa.","Fleeting worldly ornaments, blindly following forefathers, and Musa and Isa."],["Malam yang diberkati turunnya Al-Quran, asap sebagai tanda, dan Firaun yang tenggelam.","The blessed night of revelation, the smoke as a sign, and Pharaoh's drowning."],["Tanda-tanda Allah di alam, dan setiap umat berlutut pada hari kiamat bersama kitab amalannya.","Signs in creation, and every nation kneeling on the Day with its record."],["Kaum 'Ad di bukit pasir, berbuat baik kepada ibu bapa, dan jin yang mendengar Al-Quran.","'Ad of the sand dunes, kindness to parents, and the jinn who listened to the Quran."],['Orang beriman dan orang kafir, perang, dan tadabbur Al-Quran: "atau adakah hati mereka terkunci?"','Believers and disbelievers, fighting, and reflecting on the Quran: "or are there locks on their hearts?"'],["Kemenangan yang nyata melalui Perjanjian Hudaibiah, dan bai'ah di bawah pohon.","The clear victory through the Treaty of Hudaybiyah, and the pledge under the tree."],["Adab sosial: periksa berita, damaikan yang bertelagah, jangan mengejek, mengumpat atau berburuk sangka.","Social manners: verify news, reconcile, and avoid mockery, backbiting and suspicion."],["Hari kebangkitan, malaikat pencatat amalan, dan Allah lebih dekat daripada urat leher.","Resurrection, the recording angels, and Allah closer than the jugular vein."],["Jin dan manusia dicipta untuk beribadah, dan tetamu Nabi Ibrahim.","Jinn and humans created to worship, and Ibrahim's guests."],["Sumpah dengan Bukit Tur, nikmat syurga, dan hujah terhadap orang yang menolak.","An oath by Mount Tur, the joys of Paradise, and arguments against the deniers."],["Wahyu dan Mikraj, berhala yang tiada kuasa, dan setiap orang mendapat apa yang diusahakannya.","Revelation and the Ascension, powerless idols, and each person gets what they strive for."],['Bulan terbelah, dan ulangan "Kami mudahkan Al-Quran untuk peringatan" melalui kisah kaum terdahulu.','The splitting of the moon, and the refrain "We have made the Quran easy to remember".'],['Nikmat Allah dengan ulangan "Maka nikmat Tuhanmu yang manakah yang kamu dustakan?"',`Allah's favours with the refrain "Which of your Lord's favours will you deny?"`],["Hari kiamat dan tiga golongan manusia: yang terdahulu, golongan kanan dan golongan kiri.","The Event and the three groups: the foremost, those on the right, and those on the left."],["Besi; berinfak, dunia hanya permainan dan perhiasan, dan hati yang khusyuk.","Iron: spending for Allah, worldly life as play and adornment, and humble hearts."],["Wanita yang mengadu tentang zihar didengar Allah, dan adab majlis serta berbisik.","The woman who pleaded about zihar was heard by Allah; manners of gatherings and private talk."],["Pengusiran Bani Nadir, Ansar yang mengutamakan orang lain, dan nama-nama Allah di akhir surah.","The exile of Banu Nadir, the selfless Ansar, and Allah's names at the end."],["Wanita yang diuji; setia kepada iman, dan teladan Nabi Ibrahim.","The woman tested: loyalty to faith, and the example of Ibrahim."],["Barisan yang tersusun, jangan cakap apa yang tidak dibuat, dan perniagaan yang menyelamatkan.","In ranks: don't say what you don't do, and the trade that saves."],["Solat Jumaat dan tinggalkan jual beli, dan perumpamaan membawa kitab tanpa mengamalkannya.","Friday prayer and leaving trade, and the parable of carrying scripture without acting on it."],["Sifat orang munafik, dan jangan harta dan anak melalaikan daripada mengingati Allah.","Traits of hypocrites, and don't let wealth and children distract you from Allah."],["Hari dinampakkan untung rugi, ujian harta dan keluarga, dan bertakwa sekadar kemampuan.","The day of loss and gain, trials of wealth and family, and mindfulness of Allah as much as you can."],["Hukum talak dan iddah; sesiapa bertakwa, Allah beri jalan keluar dan rezeki yang tidak disangka.","Divorce and waiting periods; whoever is mindful of Allah, He makes a way out and provides unexpectedly."],["Teguran dalam rumah tangga Nabi, peliharalah diri dan keluarga dari neraka, dan taubat nasuha.","A lesson in the Prophet's household, protect yourselves and your families from the Fire, and sincere repentance."],["Kerajaan milik Allah; hidup dan mati sebagai ujian siapa yang terbaik amalannya, dan tanda-tanda di langit.","Sovereignty belongs to Allah; life and death test who is best in deeds; and signs in the sky."],["Pena; akhlak Nabi yang agung, pemilik kebun yang kedekut, dan sabar, jangan seperti Nabi Yunus yang tergesa-gesa.","The Pen: the Prophet's great character, the stingy garden owners, and patience, unlike Yunus's haste."],["Hari kiamat yang pasti, kaum yang dibinasakan, dan kitab amalan diterima di kanan atau kiri.","The inevitable Day, destroyed nations, and records given in the right or left hand."],["Manusia bersifat berkeluh kesah, kecuali orang yang menjaga solat.","Humans are anxious by nature, except those steadfast in prayer."],["Dakwah Nabi Nuh siang dan malam, dan istighfar membawa hujan dan rezeki.","Nuh's call day and night, and seeking forgiveness bringing rain and provision."],["Jin yang mendengar Al-Quran lalu beriman, dan masjid hanya untuk Allah.","The jinn who heard the Quran and believed, and mosques are for Allah alone."],["Bangun malam membaca Al-Quran dengan tartil, dan keringanan selepas itu.","Rising at night to recite the Quran slowly, and the later easing."],["Perintah bangun memberi peringatan dan membesarkan Allah, dan orang yang menentang Al-Quran.","The command to arise, warn and magnify your Lord, and the man who opposed the Quran."],["Hari kebangkitan, jiwa yang menyesali diri, dan cara wahyu diterima.","Resurrection, the self-reproaching soul, and how revelation was received."],["Manusia dicipta dan diberi pilihan, orang baik memberi makan kerana Allah, dan nikmat syurga.","Humans created and given choice, the righteous feeding others for Allah's sake, and Paradise."],['Angin yang diutus, dengan ulangan "Celakalah pada hari itu bagi orang yang mendustakan".','Winds sent forth, with the refrain "Woe that Day to the deniers".'],["Berita besar tentang hari kebangkitan, tanda kekuasaan Allah di alam, syurga dan neraka.","The great news of resurrection, Allah's power in nature, Paradise and Hell."],["Malaikat pencabut nyawa, kisah Musa dan Firaun, dan orang yang takut kepada Allah dan menahan nafsu.","Angels drawing out souls, Musa and Pharaoh, and those who fear Allah and restrain desire."],["Teguran ketika Nabi bermasam muka kepada seorang buta yang datang belajar; setiap jiwa bernilai.","A rebuke when the Prophet frowned at a blind man who came to learn; every soul matters."],["Peristiwa kiamat: matahari digulung, bintang berguguran, dan bayi perempuan yang ditanam hidup-hidup ditanya.","Scenes of the Hour: the sun folded up, stars falling, and the buried baby girl questioned."],["Langit terbelah, dan malaikat yang mulia mencatat amalan.","The sky splitting, and the noble angels recording deeds."],["Celaka orang yang menipu timbangan, dan catatan amalan orang baik dan orang jahat.","Woe to those who cheat in measure, and the records of the righteous and the wicked."],["Langit terbelah patuh kepada Tuhannya, dan manusia bersusah payah menuju Tuhannya.","The sky splits in obedience, and humans labour on towards their Lord."],["Ashab al-Ukhdud yang dibakar kerana iman, dan Al-Quran terpelihara di Lauh Mahfuz.","The People of the Ditch burned for their faith, and the Quran preserved on the Tablet."],["Bintang yang menembus, setiap jiwa ada penjaganya, dan asal kejadian manusia.","The piercing star, a guardian over every soul, and human origins."],["Sucikan nama Tuhanmu Yang Maha Tinggi, Al-Quran yang tidak dilupakan, dan akhirat lebih baik.","Glorify your Lord Most High; the Quran kept in memory; the Hereafter is better."],["Hari yang meliputi, wajah yang hina dan wajah yang berseri, dan renungan pada unta, langit dan gunung.","The Overwhelming Day, downcast and joyful faces, and reflecting on camels, sky and mountains."],["Kaum 'Ad, Samud dan Firaun, ujian senang dan susah, dan jiwa yang tenang kembali kepada Tuhannya.","'Ad, Thamud and Pharaoh, tests of ease and hardship, and the soul at peace returning to its Lord."],["Negeri Makkah, dan jalan mendaki yang sukar: membebaskan hamba dan memberi makan ketika susah.","The city of Makkah, and the steep path: freeing slaves and feeding others in hard times."],["Berjaya orang yang menyucikan jiwa, dan rugi orang yang mengotorinya; kisah kaum Samud.","Successful is whoever purifies the soul, and lost whoever corrupts it; the story of Thamud."],["Usaha manusia berbeza: yang memberi dan bertakwa dipermudahkan, yang bakhil disukarkan.","People's efforts differ: the giving and mindful are eased, the stingy find hardship."],["Pujukan kepada Nabi bahawa Allah tidak meninggalkannya; jaga anak yatim dan peminta, dan sebutlah nikmat Allah.","Comfort to the Prophet that Allah has not left him; care for orphans and those who ask; speak of Allah's blessings."],["Dada dilapangkan, beban diangkat, dan sesungguhnya bersama kesukaran ada kemudahan.","The chest expanded, the burden lifted, and with hardship comes ease."],["Manusia dicipta dalam bentuk terbaik, dan kemuliaan bagi yang beriman dan beramal soleh.","Humans created in the best form, and honour for those who believe and do good."],['Wahyu pertama "Bacalah!", Allah mengajar dengan pena, dan sujudlah serta dekatilah Allah.','The first revelation "Read!", Allah teaches by the pen; prostrate and draw near.'],["Lailatulqadar, malam turunnya Al-Quran, lebih baik daripada seribu bulan.","The Night of Decree, when the Quran was sent down, better than a thousand months."],["Bukti yang nyata, agama yang ikhlas kepada Allah, dan sebaik-baik makhluk.","The clear proof, sincere devotion to Allah, and the best of creation."],["Bumi bergegar dan menceritakan beritanya; kebaikan atau kejahatan sebesar zarah pun akan dilihat.","The earth shakes and tells its news; even an atom's weight of good or evil will be seen."],["Kuda yang berlari kencang; manusia tidak bersyukur dan terlalu cintakan harta.","The charging horses; humans are ungrateful and love wealth intensely."],["Hari yang menggemparkan, manusia seperti kelkatu berterbangan, dan timbangan amalan.","The Striking Day, people like scattered moths, and the scales of deeds."],["Berlumba-lumba memperbanyak harta melalaikan hingga ke kubur, dan setiap nikmat akan ditanya.","Competing for more distracts until the grave, and every blessing will be asked about."],["Demi masa, manusia dalam kerugian kecuali yang beriman, beramal soleh, dan berpesan dengan kebenaran dan kesabaran.","By time, people are at a loss except those who believe, do good, and urge truth and patience."],["Celaka pengumpat dan pencela yang mengumpul harta dan menyangka ia kekal.","Woe to the slanderer who hoards wealth thinking it makes him immortal."],["Tentera bergajah Abrahah yang hendak meruntuhkan Kaabah dihancurkan oleh burung Ababil.","Abraha's army of the elephant, set on destroying the Ka'bah, destroyed by flocks of birds."],["Nikmat keamanan dan perjalanan dagang Quraisy; sembahlah Tuhan Kaabah.","Quraysh's security and trade journeys; so worship the Lord of the Ka'bah."],["Pendusta agama: mengherdik anak yatim, tidak menggalakkan memberi makan, lalai dalam solat dan menahan bantuan kecil.","Denying the faith: repelling orphans, not urging feeding the poor, heedless prayer, and withholding small kindnesses."],["Nikmat yang banyak (Al-Kausar) kepada Nabi; maka solatlah dan berkorbanlah.","Abundant good (al-Kawthar) given to the Prophet; so pray and sacrifice."],["Tegas dalam akidah: bagimu agamamu, bagiku agamaku.","Firm in belief: to you your religion, to me mine."],["Pertolongan Allah dan pembukaan Makkah; bertasbih dan beristighfar.","Allah's help and the opening of Makkah; glorify Him and seek forgiveness."],["Abu Lahab dan isterinya yang memusuhi Nabi.","Abu Lahab and his wife, who opposed the Prophet."],["Inti tauhid: Allah Maha Esa, tempat bergantung, tidak beranak dan tidak diperanakkan.","The essence of oneness: Allah is One, the Eternal Refuge, neither begetting nor begotten."],["Berlindung kepada Tuhan waktu subuh daripada kejahatan makhluk, gelap malam, sihir dan hasad.","Refuge with the Lord of daybreak from harm, the dark of night, sorcery and envy."],["Berlindung kepada Tuhan manusia daripada bisikan syaitan dalam dada.","Refuge with the Lord of people from the whisperer in the heart."]],SURAH_MADANI=new Set([2,3,4,5,8,9,13,22,24,33,47,48,49,55,57,58,59,60,61,62,63,64,65,66,76,98,99,110]),ASBAB=[[96,1,5,"Wahyu pertama turun ketika Nabi \uFDFA beribadah di Gua Hira'. Malaikat Jibril datang dan menyuruh baginda membaca.","The first revelation came while the Prophet \uFDFA was worshipping in the Cave of Hira'. Jibril came and told him to read.","Sahih al-Bukhari","Sahih al-Bukhari"],[93,1,3,"Wahyu terhenti seketika dan Nabi \uFDFA tidak bangun malam satu atau dua malam kerana sakit. Seorang wanita mengejek bahawa baginda telah ditinggalkan, lalu surah ini turun.","Revelation paused and the Prophet \uFDFA, unwell, did not rise at night for a night or two. A woman taunted that he had been abandoned, and this surah came down.","Sahih al-Bukhari & Muslim","Sahih al-Bukhari & Muslim"],[80,1,10,"Abdullah bin Ummi Maktum, seorang buta, datang meminta diajar ketika Nabi \uFDFA sedang berbincang dengan pembesar Quraisy.","Abdullah ibn Umm Maktum, a blind man, came asking to be taught while the Prophet \uFDFA was talking with Quraysh leaders.","Riwayat at-Tirmizi","At-Tirmidhi"],[111,1,5,'Nabi \uFDFA naik ke Bukit Safa dan menyeru kaum Quraisy. Abu Lahab berkata, "Celakalah engkau, untuk inikah engkau kumpulkan kami?"','The Prophet \uFDFA climbed as-Safa and called the Quraysh. Abu Lahab said, "Perish you! Is this why you gathered us?"',"Sahih al-Bukhari & Muslim","Sahih al-Bukhari & Muslim"],[2,144,144,"Nabi \uFDFA bersolat menghadap Baitulmaqdis selama 16 atau 17 bulan dan suka jika dapat menghadap Kaabah. Lalu turun perintah menukar kiblat.","The Prophet \uFDFA prayed towards Jerusalem for 16 or 17 months and longed to face the Ka'bah. Then the change of qibla was revealed.","Sahih al-Bukhari","Sahih al-Bukhari"],[2,158,158,"Sebahagian Ansar keberatan bersa'ie antara Safa dan Marwah kerana ia dikaitkan dengan amalan zaman jahiliah.","Some of the Ansar hesitated to walk between as-Safa and al-Marwah because of its link to pre-Islamic practice.","Sahih al-Bukhari","Sahih al-Bukhari"],[2,187,187,"Qais bin Sirmah tertidur sebelum sempat makan ketika berbuka, lalu pengsan keesokan harinya. Turun kebenaran makan dan minum pada malam Ramadan hingga terbit fajar.","Qays ibn Sirmah fell asleep before eating at iftar and fainted the next day. Permission to eat and drink on Ramadan nights until dawn was revealed.","Sahih al-Bukhari","Sahih al-Bukhari"],[2,256,256,"Sebahagian anak Ansar dibesarkan sebagai Yahudi. Apabila Bani Nadir diusir, ibu bapa mereka ingin memaksa anak-anak itu memeluk Islam.","Some Ansar children had been raised as Jews. When Banu Nadir were exiled, their parents wanted to force them into Islam.","Riwayat Abu Daud","Abu Dawud"],[3,128,128,"Turun berkaitan doa Nabi \uFDFA terhadap beberapa pemimpin musyrikin selepas perang Uhud.","Revealed concerning the Prophet's \uFDFA supplication against some idolater leaders after Uhud.","Sahih al-Bukhari & Muslim","Sahih al-Bukhari & Muslim"],[5,3,3,`"Pada hari ini Aku sempurnakan agamamu" turun pada hari Arafah ketika Haji Wada', pada hari Jumaat.`,'"This day I have perfected your religion" came down on the Day of Arafah during the Farewell Pilgrimage, a Friday.',"Sahih al-Bukhari & Muslim","Sahih al-Bukhari & Muslim"],[5,6,6,"Ayat tayamum turun ketika rantai Aisyah hilang dalam satu perjalanan dan rombongan tidak menemui air.","The verse of tayammum came down when Aisha's necklace was lost on a journey and the party found no water.","Sahih al-Bukhari","Sahih al-Bukhari"],[8,1,1,"Para sahabat berbeza pendapat tentang pembahagian harta rampasan selepas perang Badar.","The Companions differed over dividing the spoils after Badr.","Riwayat Abu Daud & Ahmad","Abu Dawud & Ahmad"],[9,117,118,"Taubat tiga sahabat yang tidak ikut ke Tabuk tanpa uzur, iaitu Ka'ab bin Malik, Murarah bin ar-Rabi' dan Hilal bin Umayyah, diterima selepas 50 hari.","The repentance of three who stayed behind from Tabuk without excuse, Ka'b ibn Malik, Murarah ibn ar-Rabi' and Hilal ibn Umayyah, was accepted after 50 days.","Sahih al-Bukhari & Muslim","Sahih al-Bukhari & Muslim"],[17,85,85,"Orang Yahudi bertanya kepada Nabi \uFDFA tentang roh.","Some Jews asked the Prophet \uFDFA about the soul (ruh).","Sahih al-Bukhari & Muslim","Sahih al-Bukhari & Muslim"],[24,11,20,"Ayat-ayat ini membersihkan nama Aisyah daripada fitnah yang disebarkan (hadis al-ifk).","These verses cleared Aisha of the slander spread about her (the incident of al-ifk).","Sahih al-Bukhari & Muslim","Sahih al-Bukhari & Muslim"],[49,2,2,"Abu Bakar dan Umar meninggikan suara di hadapan Nabi \uFDFA ketika berbeza pendapat tentang siapa yang patut memimpin Bani Tamim.","Abu Bakr and Umar raised their voices before the Prophet \uFDFA while disagreeing over who should lead Banu Tamim.","Sahih al-Bukhari","Sahih al-Bukhari"],[58,1,4,"Khaulah binti Tha'labah mengadu kepada Nabi \uFDFA tentang suaminya yang menziharnya.","Khawlah bint Tha'labah complained to the Prophet \uFDFA about her husband declaring zihar on her.","Riwayat Abu Daud & Ahmad","Abu Dawud & Ahmad"],[66,1,2,"Nabi \uFDFA mengharamkan madu ke atas dirinya demi menjaga hati isteri-isteri baginda.","The Prophet \uFDFA forbade himself honey to please some of his wives.","Sahih al-Bukhari & Muslim","Sahih al-Bukhari & Muslim"]],QDOA={before:["\u0623\u064E\u0639\u064F\u0648\u0630\u064F \u0628\u0650\u0627\u0644\u0644\u064E\u0651\u0647\u0650 \u0645\u0650\u0646\u064E \u0627\u0644\u0634\u064E\u0651\u064A\u0652\u0637\u064E\u0627\u0646\u0650 \u0627\u0644\u0631\u064E\u0651\u062C\u0650\u064A\u0645\u0650","Aku berlindung kepada Allah daripada syaitan yang direjam.","I seek refuge with Allah from the accursed devil.","Surah An-Nahl 16:98","Surah An-Nahl 16:98"],after:["\u0633\u064F\u0628\u0652\u062D\u064E\u0627\u0646\u064E\u0643\u064E \u0627\u0644\u0644\u064E\u0651\u0647\u064F\u0645\u064E\u0651 \u0648\u064E\u0628\u0650\u062D\u064E\u0645\u0652\u062F\u0650\u0643\u064E\u060C \u0623\u064E\u0634\u0652\u0647\u064E\u062F\u064F \u0623\u064E\u0646\u0652 \u0644\u064E\u0627 \u0625\u0650\u0644\u064E\u0670\u0647\u064E \u0625\u0650\u0644\u064E\u0651\u0627 \u0623\u064E\u0646\u0652\u062A\u064E\u060C \u0623\u064E\u0633\u0652\u062A\u064E\u063A\u0652\u0641\u0650\u0631\u064F\u0643\u064E \u0648\u064E\u0623\u064E\u062A\u064F\u0648\u0628\u064F \u0625\u0650\u0644\u064E\u064A\u0652\u0643\u064E","Maha Suci Engkau ya Allah dan dengan memuji-Mu. Aku bersaksi tiada tuhan melainkan Engkau. Aku memohon ampun dan bertaubat kepada-Mu.","Glory be to You, O Allah, and praise. I bear witness there is no god but You. I seek Your forgiveness and turn to You.","Riwayat an-Nasa'i (Nabi \uFDFA menutup majlis, bacaan Al-Quran dan solat dengannya)","An-Nasa'i (the Prophet \uFDFA ended gatherings, recitation and prayer with it)"]},BASM_WORDS=4,sura \u0631\u064E\u0651\u0648\u064E\u0627\u062A\u0650\u0628\u064F",ms:"Rawatib (sebelum & selepas fardu)",en:"Rawatib (before & after obligatory prayers)",rak:["2 atau 4 rakaat, setiap satu salam selepas 2 rakaat","2 or 4 rak'ahs, with salam after every 2"],time:["Qabliyah: selepas masuk waktu, sebelum fardu. Ba'diyah: selepas fardu, sebelum waktu tamat.","Qabliyah: after the time begins, before the obligatory prayer. Ba'diyah: after it, before the time ends."],niat:"\u0623\u064F\u0635\u064E\u0644\u0650\u0651\u064A \u0633\u064F\u0646\u064E\u0651\u0629\u064E \u0627\u0644\u0638\u064F\u0651\u0647\u0652\u0631\u0650 \u0631\u064E\u0643\u0652\u0639\u064E\u062A\u064E\u064A\u0652\u0646\u0650 \u0642\u064E\u0628\u0652\u0644\u0650\u064A\u064E\u0651\u0629\u064B \u0644\u0650\u0644\u064E\u0651\u0647\u0650 \u062A\u064E\u0639\u064E\u0627\u0644\u064E\u0649",rumi:"Usolli sunnataz zuhri rak'ataini qabliyyatan lillahi ta'ala",niatMs:"Contoh Zohor: Sahaja aku solat sunat Zohor dua rakaat sebelum (fardu) kerana Allah Taala. Tukar 'qabliyyatan' kepada 'ba'diyyatan' untuk selepas fardu, dan tukar nama solat (al-'asri, al-maghribi, al-'isya'i).",niatEn:"Example for Dhuhr: I pray two rak'ahs of Sunnah before Dhuhr for the sake of Allah. Say 'ba'diyyatan' for after the prayer, and change the prayer's name.",how:[["Muakkad (sangat dituntut): 2 sebelum Subuh, 2 atau 4 sebelum Zohor, 2 selepas Zohor, 2 selepas Maghrib, 2 selepas Isyak.","Strongly recommended: 2 before Fajr, 2 or 4 before Dhuhr, 2 after Dhuhr, 2 after Maghrib, 2 after Isha."],["Ghairu muakkad: 2 atau 4 sebelum Asar, 2 sebelum Maghrib, 2 sebelum Isyak.","Less emphasised: 2 or 4 before Asr, 2 before Maghrib, 2 before Isha."],["Tiada solat sunat rawatib selepas Subuh dan selepas Asar.","There is no rawatib after Fajr or after Asr."]],fad:["Sesiapa yang solat 12 rakaat sunat dalam sehari semalam, dibina untuknya sebuah rumah di syurga.","Whoever prays twelve rak'ahs of Sunnah in a day and night, a house is built for them in Paradise."],src:["Riwayat Muslim (Ummu Habibah)","Muslim (Umm Habibah)"]},{id:"dhuha",cat:"harian",ar:"\u0635\u064E\u0644\u064E\u0627\u0629\u064F \u0627\u0644\u0636\u064F\u0651\u062D\u064E\u0649",ms:"Dhuha",en:"Duha",rak:["Sekurang-kurangnya 2, hingga 8 rakaat (2 rakaat satu salam)","At least 2, up to 8 rak'ahs (salam after every 2)"],time:["Selepas matahari naik (lebih kurang 15\u201320 minit selepas syuruk) hingga sebelum masuk Zohor. Afdal apabila matahari mulai panas.","From when the sun has risen (about 15\u201320 minutes after sunrise) until just before Dhuhr. Best once the day grows warm."],niat:"\u0623\u064F\u0635\u064E\u0644\u0650\u0651\u064A \u0633\u064F\u0646\u064E\u0651\u0629\u064E \u0627\u0644\u0636\u064F\u0651\u062D\u064E\u0649 \u0631\u064E\u0643\u0652\u0639\u064E\u062A\u064E\u064A\u0652\u0646\u0650 \u0644\u0650\u0644\u064E\u0651\u0647\u0650 \u062A\u064E\u0639\u064E\u0627\u0644\u064E\u0649",rumi:"Usolli sunnatad dhuha rak'ataini lillahi ta'ala",niatMs:"Sahaja aku solat sunat Dhuha dua rakaat kerana Allah Taala.",niatEn:"I pray two rak'ahs of Duha for the sake of Allah.",how:[["Nabi \uFDFA pernah solat Dhuha 8 rakaat pada hari pembukaan Makkah (Riwayat al-Bukhari & Muslim).","The Prophet \uFDFA prayed 8 rak'ahs of Duha on the day Makkah was opened (al-Bukhari & Muslim)."]],fad:["Setiap sendi tubuh perlu bersedekah setiap pagi, dan dua rakaat Dhuha sudah mencukupi bagi semua itu.","Every joint of the body owes a charity each morning, and two rak'ahs of Duha suffice for all of it."],src:["Riwayat Muslim (Abu Dzar)","Muslim (Abu Dharr)"]},{id:"tahajjud",cat:"harian",ar:"\u0635\u064E\u0644\u064E\u0627\u0629\u064F \u0627\u0644\u062A\u064E\u0651\u0647\u064E\u062C\u064F\u0651\u062F\u0650",ms:"Tahajjud (qiamullail)",en:"Tahajjud (night prayer)",rak:["Sekurang-kurangnya 2 rakaat, tiada had (2 rakaat satu salam)","At least 2 rak'ahs, no upper limit (salam after every 2)"],time:["Waktu malam selepas Isyak, setelah tidur walaupun sebentar. Afdal pada sepertiga malam terakhir.","At night after Isha, after having slept even briefly. Best in the last third of the night."],niat:"\u0623\u064F\u0635\u064E\u0644\u0650\u0651\u064A \u0633\u064F\u0646\u064E\u0651\u0629\u064E \u0627\u0644\u062A\u064E\u0651\u0647\u064E\u062C\u064F\u0651\u062F\u0650 \u0631\u064E\u0643\u0652\u0639\u064E\u062A\u064E\u064A\u0652\u0646\u0650 \u0644\u0650\u0644\u064E\u0651\u0647\u0650 \u062A\u064E\u0639\u064E\u0627\u0644\u064E\u0649",rumi:"Usolli sunnatat tahajjudi rak'ataini lillahi ta'ala",niatMs:"Sahaja aku solat sunat Tahajjud dua rakaat kerana Allah Taala.",niatEn:"I pray two rak'ahs of Tahajjud for the sake of Allah.",how:[["Panjangkan bacaan dan sujud mengikut kemampuan, kemudian tutup dengan Witir.","Lengthen recitation and prostration as you are able, then close with Witr."]],fad:["Solat yang paling afdal selepas solat fardu ialah solat malam.","The best prayer after the obligatory prayers is the night prayer."],src:["Riwayat Muslim (Abu Hurairah)","Muslim (Abu Hurayrah)"]},{id:"witir",cat:"harian",ar:"\u0635\u064E\u0644\u064E\u0627\u0629\u064F \u0627\u0644\u0652\u0648\u0650\u062A\u0652\u0631\u0650",ms:"Witir",en:"Witr",rak:["Bilangan ganjil: 1, 3, 5 hingga 11 rakaat","An odd number: 1, 3, 5 up to 11 rak'ahs"],time:["Selepas solat Isyak hingga sebelum terbit fajar. Jadikan ia solat terakhir pada malam itu.","After Isha until before dawn. Make it the last prayer of the night."],niat:"\u0623\u064F\u0635\u064E\u0644\u0650\u0651\u064A \u0633\u064F\u0646\u064E\u0651\u0629\u064E \u0627\u0644\u0652\u0648\u0650\u062A\u0652\u0631\u0650 \u0631\u064E\u0643\u0652\u0639\u064E\u062A\u064E\u064A\u0652\u0646\u0650 \u0644\u0650\u0644\u064E\u0651\u0647\u0650 \u062A\u064E\u0639\u064E\u0627\u0644\u064E\u0649",rumi:"Usolli sunnatal witri rak'ataini lillahi ta'ala",niatMs:`Untuk 3 rakaat (2 + 1): Sahaja aku solat sunat Witir dua rakaat kerana Allah Taala. Kemudian untuk rakaat terakhir: "Usolli sunnatal witri rak'atan lillahi ta'ala" (satu rakaat).`,niatEn:`For 3 rak'ahs (2 + 1): I pray two rak'ahs of Witr for the sake of Allah. Then for the last: "Usolli sunnatal witri rak'atan lillahi ta'ala" (one rak'ah).`,how:[["Cara biasa di Malaysia: 2 rakaat salam, kemudian 1 rakaat salam.","A common way: 2 rak'ahs with salam, then 1 rak'ah with salam."],[`Selepas salam, baca "Subhanal malikil quddus" 3 kali (Riwayat Abu Daud & an-Nasa'i).`,`After salam, say "Subhanal malikil quddus" three times (Abu Dawud & an-Nasa'i).`]],surah:["Untuk 3 rakaat: Al-A'la, Al-Kafirun, Al-Ikhlas (Riwayat Abu Daud & at-Tirmizi)","For 3 rak'ahs: Al-A'la, Al-Kafirun, Al-Ikhlas (Abu Dawud & at-Tirmidhi)"],doa:{ar:"\u0633\u064F\u0628\u0652\u062D\u064E\u0627\u0646\u064E \u0627\u0644\u0652\u0645\u064E\u0644\u0650\u0643\u0650 \u0627\u0644\u0652\u0642\u064F\u062F\u064F\u0651\u0648\u0633\u0650",ms:"Maha Suci Raja Yang Maha Suci (3 kali)",en:"Glory be to the King, the Most Holy (3 times)"},fad:["Jadikanlah solat terakhir kamu pada waktu malam itu Witir.","Make Witr the last of your prayers at night."],src:["Riwayat al-Bukhari & Muslim (Ibn Umar)","al-Bukhari & Muslim (Ibn Umar)"]},{id:"wuduk",cat:"harian",ar:"\u0633\u064F\u0646\u064E\u0651\u0629\u064F \u0627\u0644\u0652\u0648\u064F\u0636\u064F\u0648\u0621\u0650",ms:"Sunat wuduk",en:"After wudu'",rak:["2 rakaat","2 rak'ahs"],time:["Sejurus selepas berwuduk, pada bila-bila masa yang tidak makruh.","Right after wudu', at any time prayer is not disliked."],niat:"\u0623\u064F\u0635\u064E\u0644\u0650\u0651\u064A \u0633\u064F\u0646\u064E\u0651\u0629\u064E \u0627\u0644\u0652\u0648\u064F\u0636\u064F\u0648\u0621\u0650 \u0631\u064E\u0643\u0652\u0639\u064E\u062A\u064E\u064A\u0652\u0646\u0650 \u0644\u0650\u0644\u064E\u0651\u0647\u0650 \u062A\u064E\u0639\u064E\u0627\u0644\u064E\u0649",rumi:"Usolli sunnatal wudhu'i rak'ataini lillahi ta'ala",niatMs:"Sahaja aku solat sunat wuduk dua rakaat kerana Allah Taala.",niatEn:"I pray two rak'ahs after wudu' for the sake of Allah.",how:[],fad:["Nabi \uFDFA mendengar bunyi tapak kaki Bilal di syurga, kerana Bilal sentiasa solat selepas setiap kali bersuci.","The Prophet \uFDFA heard Bilal's footsteps in Paradise, because Bilal prayed after every purification."],src:["Riwayat al-Bukhari & Muslim (Abu Hurairah)","al-Bukhari & Muslim (Abu Hurayrah)"]},{id:"masjid",cat:"harian",ar:"\u062A\u064E\u062D\u0650\u064A\u064E\u0651\u0629\u064F \u0627\u0644\u0652\u0645\u064E\u0633\u0652\u062C\u0650\u062F\u0650",ms:"Tahiyyatul masjid",en:"Greeting the mosque",rak:["2 rakaat","2 rak'ahs"],time:["Sebaik masuk masjid, sebelum duduk.","On entering a mosque, before sitting down."],niat:"\u0623\u064F\u0635\u064E\u0644\u0650\u0651\u064A \u0633\u064F\u0646\u064E\u0651\u0629\u064E \u062A\u064E\u062D\u0650\u064A\u064E\u0651\u0629\u0650 \u0627\u0644\u0652\u0645\u064E\u0633\u0652\u062C\u0650\u062F\u0650 \u0631\u064E\u0643\u0652\u0639\u064E\u062A\u064E\u064A\u0652\u0646\u0650 \u0644\u0650\u0644\u064E\u0651\u0647\u0650 \u062A\u064E\u0639\u064E\u0627\u0644\u064E\u0649",rumi:"Usolli sunnata tahiyyatil masjidi rak'ataini lillahi ta'ala",niatMs:"Sahaja aku solat sunat tahiyyatul masjid dua rakaat kerana Allah Taala.",niatEn:"I pray two rak'ahs greeting the mosque for the sake of Allah.",how:[["Jika terus solat fardu atau sunat lain, ia sudah memadai.","If you go straight into an obligatory or other sunnah prayer, that suffices."]],fad:["Apabila seseorang daripada kamu masuk ke masjid, janganlah dia duduk sehingga solat dua rakaat.","When one of you enters the mosque, let him not sit until he has prayed two rak'ahs."],src:["Riwayat al-Bukhari & Muslim (Abu Qatadah)","al-Bukhari & Muslim (Abu Qatadah)"]},{id:"taubat",cat:"perlu",ar:"\u0635\u064E\u0644\u064E\u0627\u0629\u064F \u0627\u0644\u062A\u064E\u0651\u0648\u0652\u0628\u064E\u0629\u0650",ms:"Taubat",en:"Repentance",rak:["2 rakaat","2 rak'ahs"],time:["Bila-bila masa selepas melakukan dosa, kecuali waktu yang makruh.","Any time after a sin, except the disliked times."],niat:"\u0623\u064F\u0635\u064E\u0644\u0650\u0651\u064A \u0633\u064F\u0646\u064E\u0651\u0629\u064E \u0627\u0644\u062A\u064E\u0651\u0648\u0652\u0628\u064E\u0629\u0650 \u0631\u064E\u0643\u0652\u0639\u064E\u062A\u064E\u064A\u0652\u0646\u0650 \u0644\u0650\u0644\u064E\u0651\u0647\u0650 \u062A\u064E\u0639\u064E\u0627\u0644\u064E\u0649",rumi:"Usolli sunnatat taubati rak'ataini lillahi ta'ala",niatMs:"Sahaja aku solat sunat taubat dua rakaat kerana Allah Taala.",niatEn:"I pray two rak'ahs of repentance for the sake of Allah.",how:[["Bersuci dengan sempurna, solat, kemudian beristighfar dan berazam tidak mengulanginya.","Purify well, pray, then seek forgiveness and resolve not to return to it."]],fad:["Tiada seorang hamba yang melakukan dosa, lalu bersuci dengan baik dan solat dua rakaat, kemudian memohon ampun kepada Allah, melainkan Allah mengampuninya.","No servant commits a sin, then purifies well, prays two rak'ahs and asks Allah's forgiveness, except that Allah forgives him."],src:["Riwayat Abu Daud & at-Tirmizi (Abu Bakar)","Abu Dawud & at-Tirmidhi (Abu Bakr)"]},{id:"istikharah",cat:"perlu",ar:"\u0635\u064E\u0644\u064E\u0627\u0629\u064F \u0627\u0644\u0650\u0627\u0633\u0652\u062A\u0650\u062E\u064E\u0627\u0631\u064E\u0629\u0650",ms:"Istikharah",en:"Istikharah (seeking guidance)",rak:["2 rakaat, kemudian doa istikharah","2 rak'ahs, then the du'a of istikharah"],time:["Bila-bila masa ketika perlu membuat keputusan, kecuali waktu yang makruh.","Whenever you need to make a decision, except the disliked times."],niat:"\u0623\u064F\u0635\u064E\u0644\u0650\u0651\u064A \u0633\u064F\u0646\u064E\u0651\u0629\u064E \u0627\u0644\u0650\u0627\u0633\u0652\u062A\u0650\u062E\u064E\u0627\u0631\u064E\u0629\u0650 \u0631\u064E\u0643\u0652\u0639\u064E\u062A\u064E\u064A\u0652\u0646\u0650 \u0644\u0650\u0644\u064E\u0651\u0647\u0650 \u062A\u064E\u0639\u064E\u0627\u0644\u064E\u0649",rumi:"Usolli sunnatal istikharati rak'ataini lillahi ta'ala",niatMs:"Sahaja aku solat sunat istikharah dua rakaat kerana Allah Taala.",niatEn:"I pray two rak'ahs of istikharah for the sake of Allah.",how:[['Selepas salam, baca doa istikharah. Ketika sampai "hadzal amra", sebut perkara yang hendak diputuskan.',`After salam, recite the du'a. At "hadhal amra", name the matter you are deciding.`],["Kemudian buat keputusan dengan bertawakal; petunjuk tidak semestinya datang melalui mimpi.","Then decide, trusting in Allah; guidance need not come through a dream."]],doa:{ar:"\u0627\u0644\u0644\u064E\u0651\u0647\u064F\u0645\u064E\u0651 \u0625\u0650\u0646\u0650\u0651\u064A \u0623\u064E\u0633\u0652\u062A\u064E\u062E\u0650\u064A\u0631\u064F\u0643\u064E \u0628\u0650\u0639\u0650\u0644\u0652\u0645\u0650\u0643\u064E\u060C \u0648\u064E\u0623\u064E\u0633\u0652\u062A\u064E\u0642\u0652\u062F\u0650\u0631\u064F\u0643\u064E \u0628\u0650\u0642\u064F\u062F\u0652\u0631\u064E\u062A\u0650\u0643\u064E\u060C \u0648\u064E\u0623\u064E\u0633\u0652\u0623\u064E\u0644\u064F\u0643\u064E \u0645\u0650\u0646\u0652 \u0641\u064E\u0636\u0652\u0644\u0650\u0643\u064E \u0627\u0644\u0652\u0639\u064E\u0638\u0650\u064A\u0645\u0650\u060C \u0641\u064E\u0625\u0650\u0646\u064E\u0651\u0643\u064E \u062A\u064E\u0642\u0652\u062F\u0650\u0631\u064F \u0648\u064E\u0644\u064E\u0627 \u0623\u064E\u0642\u0652\u062F\u0650\u0631\u064F\u060C \u0648\u064E\u062A\u064E\u0639\u0652\u0644\u064E\u0645\u064F \u0648\u064E\u0644\u064E\u0627 \u0623\u064E\u0639\u0652\u0644\u064E\u0645\u064F\u060C \u0648\u064E\u0623\u064E\u0646\u0652\u062A\u064E \u0639\u064E\u0644\u064E\u0651\u0627\u0645\u064F \u0627\u0644\u0652\u063A\u064F\u064A\u064F\u0648\u0628\u0650. \u0627\u0644\u0644\u064E\u0651\u0647\u064F\u0645\u064E\u0651 \u0625\u0650\u0646\u0652 \u0643\u064F\u0646\u0652\u062A\u064E \u062A\u064E\u0639\u0652\u0644\u064E\u0645\u064F \u0623\u064E\u0646\u064E\u0651 \u0647\u064E\u0670\u0630\u064E\u0627 \u0627\u0644\u0652\u0623\u064E\u0645\u0652\u0631\u064E \u062E\u064E\u064A\u0652\u0631\u064C \u0644\u0650\u064A \u0641\u0650\u064A \u062F\u0650\u064A\u0646\u0650\u064A \u0648\u064E\u0645\u064E\u0639\u064E\u0627\u0634\u0650\u064A \u0648\u064E\u0639\u064E\u0627\u0642\u0650\u0628\u064E\u0629\u0650 \u0623\u064E\u0645\u0652\u0631\u0650\u064A \u0641\u064E\u0627\u0642\u0652\u062F\u064F\u0631\u0652\u0647\u064F \u0644\u0650\u064A \u0648\u064E\u064A\u064E\u0633\u0650\u0651\u0631\u0652\u0647\u064F \u0644\u0650\u064A \u062B\u064F\u0645\u064E\u0651 \u0628\u064E\u0627\u0631\u0650\u0643\u0652 \u0644\u0650\u064A \u0641\u0650\u064A\u0647\u0650\u060C \u0648\u064E\u0625\u0650\u0646\u0652 \u0643\u064F\u0646\u0652\u062A\u064E \u062A\u064E\u0639\u0652\u0644\u064E\u0645\u064F \u0623\u064E\u0646\u064E\u0651 \u0647\u064E\u0670\u0630\u064E\u0627 \u0627\u0644\u0652\u0623\u064E\u0645\u0652\u0631\u064E \u0634\u064E\u0631\u064C\u0651 \u0644\u0650\u064A \u0641\u0650\u064A \u062F\u0650\u064A\u0646\u0650\u064A \u0648\u064E\u0645\u064E\u0639\u064E\u0627\u0634\u0650\u064A \u0648\u064E\u0639\u064E\u0627\u0642\u0650\u0628\u064E\u0629\u0650 \u0623\u064E\u0645\u0652\u0631\u0650\u064A \u0641\u064E\u0627\u0635\u0652\u0631\u0650\u0641\u0652\u0647\u064F \u0639\u064E\u0646\u0650\u0651\u064A \u0648\u064E\u0627\u0635\u0652\u0631\u0650\u0641\u0652\u0646\u0650\u064A \u0639\u064E\u0646\u0652\u0647\u064F\u060C \u0648\u064E\u0627\u0642\u0652\u062F\u064F\u0631\u0652 \u0644\u0650\u064A\u064E \u0627\u0644\u0652\u062E\u064E\u064A\u0652\u0631\u064E \u062D\u064E\u064A\u0652\u062B\u064F \u0643\u064E\u0627\u0646\u064E \u062B\u064F\u0645\u064E\u0651 \u0623\u064E\u0631\u0652\u0636\u0650\u0646\u0650\u064A \u0628\u0650\u0647\u0650",ms:"Ya Allah, aku memohon pilihan-Mu dengan ilmu-Mu dan kekuatan dengan kuasa-Mu, dan aku memohon kurnia-Mu yang besar. Engkau berkuasa sedang aku tidak, Engkau mengetahui sedang aku tidak, dan Engkaulah yang mengetahui perkara ghaib. Ya Allah, jika Engkau mengetahui urusan ini baik bagiku pada agamaku, kehidupanku dan kesudahan urusanku, maka takdirkan dan mudahkanlah ia untukku, kemudian berkatilah. Jika Engkau mengetahui ia buruk bagiku, jauhkanlah ia daripadaku dan jauhkanlah aku daripadanya, takdirkanlah kebaikan untukku di mana sahaja, kemudian jadikan aku reda dengannya.",en:"O Allah, I seek Your choice through Your knowledge and Your power through Your might, and ask of Your great bounty. You are able and I am not; You know and I do not; You know the unseen. O Allah, if You know this matter is good for me in my religion, my life and its outcome, decree it for me, make it easy, then bless it. If You know it is bad for me, turn it away from me and me from it, decree good for me wherever it is, then make me content with it.",src:["Riwayat al-Bukhari (Jabir)","al-Bukhari (Jabir)"]},fad:["Nabi \uFDFA mengajar para sahabat istikharah dalam semua urusan, sebagaimana baginda mengajar surah Al-Quran.","The Prophet \uFDFA taught his Companions istikharah in all matters, as he taught them a surah of the Quran."],src:["Riwayat al-Bukhari (Jabir)","al-Bukhari (Jabir)"]},{id:"hajat",cat:"perlu",ar:"\u0635\u064E\u0644\u064E\u0627\u0629\u064F \u0627\u0644\u0652\u062D\u064E\u0627\u062C\u064E\u0629\u0650",ms:"Hajat",en:"Need (hajat)",rak:["2 rakaat (ada yang melakukan hingga 12)","2 rak'ahs (some pray up to 12)"],time:["Bila-bila masa ketika ada hajat, kecuali waktu yang makruh.","Whenever you have a need, except the disliked times."],niat:"\u0623\u064F\u0635\u064E\u0644\u0650\u0651\u064A \u0633\u064F\u0646\u064E\u0651\u0629\u064E \u0627\u0644\u0652\u062D\u064E\u0627\u062C\u064E\u0629\u0650 \u0631\u064E\u0643\u0652\u0639\u064E\u062A\u064E\u064A\u0652\u0646\u0650 \u0644\u0650\u0644\u064E\u0651\u0647\u0650 \u062A\u064E\u0639\u064E\u0627\u0644\u064E\u0649",rumi:"Usolli sunnatal hajati rak'ataini lillahi ta'ala",niatMs:"Sahaja aku solat sunat hajat dua rakaat kerana Allah Taala.",niatEn:"I pray two rak'ahs for a need for the sake of Allah.",how:[["Selepas salam, memuji Allah, berselawat ke atas Nabi \uFDFA, kemudian memohon hajat dengan bahasa sendiri.","After salam, praise Allah, send blessings on the Prophet \uFDFA, then ask for your need in your own words."]],fad:["Banyak diamalkan untuk memohon hajat kepada Allah.","Widely practised to ask Allah for a need."],src:["Riwayat at-Tirmizi (Abdullah bin Abi Aufa). Kekuatan hadis ini diperselisihkan oleh ulama.","At-Tirmidhi (Abdullah ibn Abi Awfa). Scholars differ on this hadith's strength."]},{id:"tarawih",cat:"musim",ar:"\u0635\u064E\u0644\u064E\u0627\u0629\u064F \u0627\u0644\u062A\u064E\u0651\u0631\u064E\u0627\u0648\u0650\u064A\u062D\u0650",ms:"Tarawih",en:"Tarawih",rak:["8 atau 20 rakaat, 2 rakaat satu salam, diikuti Witir","8 or 20 rak'ahs, salam after every 2, followed by Witr"],time:["Setiap malam Ramadan, selepas solat Isyak hingga sebelum fajar.","Every night of Ramadan, after Isha until before dawn."],niat:"\u0623\u064F\u0635\u064E\u0644\u0650\u0651\u064A \u0633\u064F\u0646\u064E\u0651\u0629\u064E \u0627\u0644\u062A\u064E\u0651\u0631\u064E\u0627\u0648\u0650\u064A\u062D\u0650 \u0631\u064E\u0643\u0652\u0639\u064E\u062A\u064E\u064A\u0652\u0646\u0650 \u0644\u0650\u0644\u064E\u0651\u0647\u0650 \u062A\u064E\u0639\u064E\u0627\u0644\u064E\u0649",rumi:"Usolli sunnatat tarawihi rak'ataini lillahi ta'ala",niatMs:`Sahaja aku solat sunat Tarawih dua rakaat kerana Allah Taala. Tambah "ma'muman" jika berimamkan orang lain, atau "imaman" jika menjadi imam.`,niatEn:`I pray two rak'ahs of Tarawih for the sake of Allah. Add "ma'muman" when following an imam, or "imaman" when leading.`,how:[["Afdal berjemaah. Boleh juga dilakukan bersendirian di rumah.","Best in congregation, though it may be prayed alone at home."]],fad:["Sesiapa yang berdiri (solat) pada malam Ramadan dengan iman dan mengharapkan pahala, diampunkan dosanya yang telah lalu.","Whoever stands in prayer during Ramadan nights with faith and hoping for reward, his past sins are forgiven."],src:["Riwayat al-Bukhari & Muslim (Abu Hurairah)","al-Bukhari & Muslim (Abu Hurayrah)"]},{id:"raya",cat:"musim",ar:"\u0635\u064E\u0644\u064E\u0627\u0629\u064F \u0627\u0644\u0652\u0639\u0650\u064A\u062F\u064E\u064A\u0652\u0646\u0650",ms:"Hari Raya (Aidilfitri & Aidiladha)",en:"Eid (al-Fitr & al-Adha)",rak:["2 rakaat, diikuti khutbah","2 rak'ahs, followed by the sermon"],time:["Pagi 1 Syawal dan 10 Zulhijjah, selepas matahari naik hingga sebelum Zohor.","The morning of 1 Shawwal and 10 Dhul-Hijjah, after sunrise until before Dhuhr."],niat:"\u0623\u064F\u0635\u064E\u0644\u0650\u0651\u064A \u0633\u064F\u0646\u064E\u0651\u0629\u064E \u0639\u0650\u064A\u062F\u0650 \u0627\u0644\u0652\u0641\u0650\u0637\u0652\u0631\u0650 \u0631\u064E\u0643\u0652\u0639\u064E\u062A\u064E\u064A\u0652\u0646\u0650 \u0644\u0650\u0644\u064E\u0651\u0647\u0650 \u062A\u064E\u0639\u064E\u0627\u0644\u064E\u0649",rumi:"Usolli sunnata 'idil fitri rak'ataini lillahi ta'ala",niatMs:`Sahaja aku solat sunat Hari Raya Aidilfitri dua rakaat kerana Allah Taala. Untuk Aidiladha: "'idil adha". Tambah "ma'muman" jika berjemaah.`,niatEn:`I pray two rak'ahs of Eid al-Fitr for the sake of Allah. For Eid al-Adha: "'idil adha". Add "ma'muman" in congregation.`,how:[["Rakaat pertama: 7 takbir selepas takbiratul ihram. Rakaat kedua: 5 takbir sebelum Al-Fatihah.","First rak'ah: 7 takbirs after the opening takbir. Second rak'ah: 5 takbirs before Al-Fatihah."],['Antara takbir, sunat membaca "Subhanallah walhamdulillah wa la ilaha illallah wallahu akbar".','Between the takbirs, it is recommended to say "Subhanallah walhamdulillah wa la ilaha illallah wallahu akbar".']],surah:["Al-A'la & Al-Ghasyiyah, atau Qaf & Al-Qamar (Riwayat Muslim)","Al-A'la & Al-Ghashiyah, or Qaf & Al-Qamar (Muslim)"],fad:["Sunat muakkad yang Nabi \uFDFA tidak pernah tinggalkan, hingga baginda menyuruh semua termasuk wanita keluar menyaksikannya.","A strongly emphasised sunnah the Prophet \uFDFA never left, even calling everyone, women included, to attend."],src:["Riwayat al-Bukhari & Muslim (Ummu 'Atiyyah)","al-Bukhari & Muslim (Umm 'Atiyyah)"]},{id:"gerhana",cat:"musim",ar:"\u0635\u064E\u0644\u064E\u0627\u0629\u064F \u0627\u0644\u0652\u0643\u064F\u0633\u064F\u0648\u0641\u0650",ms:"Gerhana (matahari & bulan)",en:"Eclipse (solar & lunar)",rak:["2 rakaat; setiap rakaat dua kali berdiri dan dua kali rukuk","2 rak'ahs, each with two standings and two bows"],time:["Sepanjang gerhana berlaku, hingga ia selesai.","While the eclipse lasts, until it ends."],niat:"\u0623\u064F\u0635\u064E\u0644\u0650\u0651\u064A \u0633\u064F\u0646\u064E\u0651\u0629\u064E \u0627\u0644\u0652\u0643\u064F\u0633\u064F\u0648\u0641\u0650 \u0631\u064E\u0643\u0652\u0639\u064E\u062A\u064E\u064A\u0652\u0646\u0650 \u0644\u0650\u0644\u064E\u0651\u0647\u0650 \u062A\u064E\u0639\u064E\u0627\u0644\u064E\u0649",rumi:"Usolli sunnatal kusufi rak'ataini lillahi ta'ala",niatMs:'Gerhana matahari: Sahaja aku solat sunat gerhana matahari dua rakaat kerana Allah Taala. Gerhana bulan: "sunnatal khusufi".',niatEn:`Solar eclipse: I pray two rak'ahs for the eclipse for the sake of Allah. Lunar eclipse: "sunnatal khusufi".`,how:[["Setiap rakaat: Al-Fatihah dan surah, rukuk, bangun membaca Al-Fatihah dan surah sekali lagi, rukuk kali kedua, kemudian iktidal dan sujud.","Each rak'ah: Al-Fatihah and a surah, bow, rise and recite Al-Fatihah and a surah again, bow a second time, then stand and prostrate."],["Afdal berjemaah dan dipanjangkan bacaannya, diikuti khutbah.","Best in congregation with long recitation, followed by a sermon."]],fad:["Matahari dan bulan adalah dua tanda kebesaran Allah. Apabila berlaku gerhana, berdoalah dan solatlah sehingga ia hilang.","The sun and moon are two of Allah's signs. When an eclipse happens, pray and supplicate until it clears."],src:["Riwayat al-Bukhari & Muslim (Aisyah)","al-Bukhari & Muslim (Aisha)"]},{id:"istisqa",cat:"musim",ar:"\u0635\u064E\u0644\u064E\u0627\u0629\u064F \u0627\u0644\u0650\u0627\u0633\u0652\u062A\u0650\u0633\u0652\u0642\u064E\u0627\u0621\u0650",ms:"Istisqa' (minta hujan)",en:"Istisqa' (asking for rain)",rak:["2 rakaat seperti solat Hari Raya, diikuti khutbah dan doa","2 rak'ahs like the Eid prayer, followed by a sermon and du'a"],time:["Ketika kemarau atau kekurangan air.","In drought or water shortage."],niat:"\u
