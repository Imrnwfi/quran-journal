function PrayerCard({ T, lang, settings, persistSettings, today, available, openSignal }) {
  const [data, setData] = useState(() => readJson("quran-journal-solat", null));
  const [open, setOpen] = useState(false);
  useEffect(() => { if (openSignal) setOpen(true); }, [openSignal]);
  const [status, setStatus] = useState("idle"); // idle | loading | locating | error | denied | outside
  const [zones, setZones] = useState(null);
  const [picking, setPicking] = useState(false);
  const [now, setNow] = useState(() => new Date());
  useEffect(() => { const id = setInterval(() => setNow(new Date()), 30000); return () => clearInterval(id); }, []);

  const zone = settings.zone || "";
  useEffect(() => {
    if (!available || !zone) return;
    let cancelled = false;
    const fresh = data && data.zone === zone && data.days && data.days[0] && data.days[0].date === today;
    if (fresh) return;
    setStatus("loading");
    api("solat?zone=" + encodeURIComponent(zone)).then((r) => {
      if (cancelled) return;
      if (r.ok && r.body && Array.isArray(r.body.days)) { setData(r.body); writeJson("quran-journal-solat", r.body); setStatus("idle"); }
      else setStatus("error");
    }).catch(() => { if (!cancelled) setStatus("error"); });
    return () => { cancelled = true; };
  }, [zone, today, available]);

  // Line our Hijri dates up with JAKIM's (Malaysia can differ from Umm al-Qura by a day).
  useEffect(() => {
    const d0 = data && data.days && data.days.find((d) => d.date === today);
    if (!d0 || !d0.hijri) return;
    const m = d0.hijri.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if (!m) return;
    for (const off of [0, -1, 1, -2, 2]) {
      const h = hijriOf(today, off);
      if (h && h.y === +m[1] && h.m === +m[2] && h.d === +m[3]) { if ((settings.hijriOffset || 0) !== off) persistSettings({ hijriOffset: off }); break; }
    }
  }, [data, today]);

  async function openPicker() {
    setPicking(true);
    if (!zones) { try { setZones(await loadZones()); } catch (e) { setStatus("error"); } }
  }
  function chooseZone(z, extra = {}) {
    persistSettings({ zone: z.c, zoneLabel: zoneLabelOf(z.c), ...extra });
    setPicking(false); setStatus("idle");
  }
  function locate() {
    if (!navigator.geolocation) { setStatus("denied"); openPicker(); return; }
    setStatus("locating");
    navigator.geolocation.getCurrentPosition(async (pos) => {
      try {
        const zs = zones || await loadZones(); setZones(zs);
        const z = zoneFor(pos.coords.latitude, pos.coords.longitude, zs);
        if (z) chooseZone(z); else { setStatus("outside"); setPicking(true); }
      } catch (e) { setStatus("error"); }
    }, () => { setStatus("denied"); openPicker(); }, { enableHighAccuracy: false, timeout: 15000, maximumAge: 10 * 60 * 1000 });
  }

  const days = data && data.zone === zone ? data.days || [] : [];
  const td = days.find((d) => d.date === today);
  const tm = days.find((d) => d.date === addDays(today, 1));
  let next = null;
  if (td) {
    const nowMin = now.getHours() * 60 + now.getMinutes();
    for (const k of PRAYERS) {
      const [h, m] = (td[k] || "").split(":").map(Number);
      if (Number.isFinite(h) && h * 60 + m > nowMin) { next = { k, mins: h * 60 + m - nowMin, tomorrow: false }; break; }
    }
    if (!next && tm && tm.fajr) { const [h, m] = tm.fajr.split(":").map(Number); next = { k: "fajr", mins: 24 * 60 - nowMin + h * 60 + m, tomorrow: true }; }
  }
  const fmtT = (t) => { if (!t) return "—"; const [h, m] = t.split(":").map(Number); const d = new Date(); d.setHours(h, m, 0, 0); return d.toLocaleTimeString(T.locale, { hour: "numeric", minute: "2-digit" }); };
  const hijriLabel = td && td.hijri ? (() => { const m = td.hijri.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/); return m ? `${+m[3]} ${(HIJRI_MONTHS[lang] || HIJRI_MONTHS.ms)[+m[2] - 1]} ${m[1]}` : ""; })() : "";
  const msg = { locating: T.solatLocating, loading: T.solatLoading, error: T.solatError, denied: T.solatDenied, outside: T.solatOutside }[status];

  const summary = !available ? T.solatServerOnly : !zone ? T.solatPickShort
    : next ? `${T.solatNames[next.k]}${next.tomorrow ? ` (${T.solatTomorrow})` : ""} ${fmtT((next.tomorrow ? tm : td)[next.k])} · ${T.solatHM(Math.floor(next.mins / 60), next.mins % 60)}`
    : status === "error" ? T.solatError : T.solatLoading;

  return (
    <section id="solat" style={{ ...styles.estCard, padding: open ? "14px 18px 16px" : "12px 16px", marginBottom: 14 }}>
      <button className="qt-btn" type="button" onClick={() => setOpen(!open)} aria-expanded={open} style={styles.solatHead}>
        <span style={{ color: "var(--gold)" }}><Icon name="mosque" size={24} /></span>
        <span style={{ flex: 1, textAlign: "left", minWidth: 0 }}>
          <span style={{ ...styles.estLabel, display: "block" }}>{T.solat}{zone ? ` · ${zone}` : ""}</span>
          {!open && <span style={styles.solatSummary}>{summary}</span>}
          {open && hijriLabel && <span style={{ fontSize: 12, opacity: 0.75 }}>{hijriLabel}</span>}
        </span>
        <span style={{ ...styles.chev, fontSize: 20, transform: open ? "rotate(90deg)" : "none" }}>›</span>
      </button>
      {open && <div className="qt-fade" style={{ marginTop: 10 }}>
      {!available ? (
        <div style={styles.estSub}>{T.solatServerOnly}</div>
      ) : !zone ? (
        <div style={styles.estSub}>{T.solatEmpty}</div>
      ) : (
        <>
          {zoneLabelOf(zone) && <div style={{ fontSize: 12, opacity: 0.65, marginBottom: 10 }}>{zoneLabelOf(zone)}</div>}
          {td ? (
            <>
              {next && (
                <div style={styles.solatNext}>
                  {T.solatNext(T.solatNames[next.k] + (next.tomorrow ? ` (${T.solatTomorrow})` : ""), T.solatHM(Math.floor(next.mins / 60), next.mins % 60))}
                </div>
              )}
              <div style={styles.solatGrid}>
                {PRAYERS.map((k) => {
                  const on = next && !next.tomorrow && next.k === k;
                  return (
                    <div key={k} style={{ ...styles.solatCell, ...(on ? styles.solatCellOn : {}) }}>
                      <div style={styles.solatName}>{T.solatNames[k]}</div>
                      <div style={styles.solatTime}>{fmtT(td[k])}</div>
                    </div>
                  );
                })}
              </div>
              <div style={{ fontSize: 11, opacity: 0.55, marginTop: 8 }}>{T.solatSource(data.source || "JAKIM e-Solat")}</div>
            </>
          ) : (status !== "loading" && status !== "error") ? <div style={styles.estSub}>{T.solatLoading}</div> : null}
        </>
      )}
      {msg && <div style={{ fontSize: 12.5, marginTop: 8, color: status === "loading" || status === "locating" ? "inherit" : "var(--danger)" }}>{msg}</div>}
      {available && (
        <div style={{ ...styles.btnRow, marginTop: 12 }}>
          <button className="qt-btn" type="button" onClick={locate} disabled={status === "locating"} style={styles.smallPrimary}>{T.solatLocate}</button>
          <button className="qt-btn" type="button" onClick={() => (picking ? setPicking(false) : openPicker())} style={styles.cancelBtn}>{zone ? T.solatChange : T.solatPick}</button>
        </div>
      )}
      {picking && (
        <select className="qt-input" value={zone} onChange={(e) => { const z = (zones || []).find((x) => x.c === e.target.value); if (z) chooseZone(z); }}
          style={{ ...styles.input, marginTop: 10, fontFamily: "'Lora', serif", fontSize: 13 }} aria-label={T.solatPick}>
          <option value="">{zones ? T.solatPick + "…" : T.solatLoading}</option>
          {zones && [...new Set(zones.map((z) => z.s))].sort().map((st) => (
            <optgroup key={st} label={st}>
              {zones.filter((z) => z.s === st).map((z) => <option key={z.c} value={z.c}>{z.c} · {z.n}</option>)}
            </optgroup>
          ))}
        </select>
      )}
      </div>}
    </section>
  );
}

/* ---------- Yearly summary (+ shareable image) ---------- */
function computeYear(entries, spans, khatams, year) {
  const list = entries.filter((e) => e.date.slice(0, 4) === year);
  const byDate = {}, byMonth = {}, bySurah = {};
  let ayahs = 0;
  for (const en of list) {
    const [a, b] = spans[en.id] || [en.page, en.page];
    const n = b - a + 1;
    byDate[en.date] = (byDate[en.date] || 0) + n;
    const m = en.date.slice(0, 7);
    byMonth[m] = (byMonth[m] || 0) + n;
    for (let p = a; p <= b; p++) { const s = surahForPage(p); bySurah[s] = (bySurah[s] || 0) + 1; }
    ayahs += ayahsInSpan(a, b);
  }
  const days = Object.keys(byDate).sort();
  let best = 0, run = 0, prev = null;
  for (const d of days) { run = prev && addDays(prev, 1) === d ? run + 1 : 1; best = Math.max(best, run); prev = d; }
  const top = (obj) => Object.entries(obj).sort((x, y) => y[1] - x[1])[0] || null;
  return {
    year,
    pages: Object.values(byDate).reduce((x, y) => x + y, 0),
    days: days.length,
    bestStreak: best,
    khatams: khatams.filter((k) => k.date.slice(0, 4) === year).length,
    bestMonth: top(byMonth),
    topSurah: top(bySurah),
    notes: list.filter((e) => e.note).length,
    ayahs,
    first: days[0] || null,
  };
}

function rrect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}

async function drawYearCard(sum, tiles, T, fmtLong, name) {
  const W = 1080, H = 1350;
  try {
    await Promise.all([
      document.fonts.load("700 72px Amiri"), document.fonts.load("400 48px Amiri"),
      document.fonts.load("500 150px 'IBM Plex Mono'"), document.fonts.load("400 34px Lora"), document.fonts.load("600 40px Lora"),
    ]);
  } catch (e) {}
  const img = await new Promise((res) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = "splash-mark.png"; });
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const ctx = c.getContext("2d");
  const css = getComputedStyle(document.documentElement);
  const bg = ctx.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, css.getPropertyValue("--acc").trim() || "#0F4C3A"); bg.addColorStop(1, css.getPropertyValue("--sp3").trim() || "#052A1F");
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  const glow = ctx.createRadialGradient(W / 2, 250, 10, W / 2, 250, 520);
  glow.addColorStop(0, "rgba(255,205,110,0.32)"); glow.addColorStop(1, "rgba(255,205,110,0)");
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = "rgba(217,188,122,0.45)"; ctx.lineWidth = 3; rrect(ctx, 36, 36, W - 72, H - 72, 40); ctx.stroke();
  if (img) { const h = 250, w = img.width * h / img.height; ctx.drawImage(img, (W - w) / 2, 90, w, h); }
  ctx.textAlign = "center";
  ctx.fillStyle = "#E6C068"; ctx.font = "400 46px Amiri, serif"; ctx.fillText("وِرْد القُرْآن", W / 2, 400);
  ctx.fillStyle = "#F3ECD8"; ctx.font = "700 72px Amiri, serif"; ctx.fillText(T.yearTitle(sum.year), W / 2, 485);
  ctx.fillStyle = "#D9BC7A"; ctx.font = "500 150px 'IBM Plex Mono', monospace"; ctx.fillText(String(sum.pages), W / 2, 650);
  ctx.fillStyle = "rgba(243,236,216,0.8)"; ctx.font = "400 34px Lora, serif"; ctx.fillText(`${T.yearPages} · ${sum.ayahs.toLocaleString(T.locale)} ${T.ayat}`, W / 2, 705);
  const cols = 2, tw = 440, th = 128, gx = 40, gy = 24, x0 = (W - (cols * tw + gx)) / 2, y0 = 752;
  tiles.forEach(([label, value], i) => {
    const x = x0 + (i % cols) * (tw + gx), y = y0 + Math.floor(i / cols) * (th + gy);
    ctx.fillStyle = "rgba(255,255,255,0.07)"; rrect(ctx, x, y, tw, th, 22); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.14)"; ctx.lineWidth = 2; ctx.stroke();
    ctx.textAlign = "left";
    ctx.fillStyle = "rgba(243,236,216,0.7)"; ctx.font = "400 26px Lora, serif"; ctx.fillText(label.toUpperCase(), x + 28, y + 46);
    ctx.fillStyle = "#F3ECD8"; ctx.font = "600 40px Lora, serif";
    let v = String(value); while (ctx.measureText(v).width > tw - 56 && v.length > 4) v = v.slice(0, -2) + "…";
    ctx.fillText(v, x + 28, y + 98);
  });
  ctx.textAlign = "center"; ctx.fillStyle = "rgba(243,236,216,0.6)"; ctx.font = "400 28px Lora, serif";
  if (name) { ctx.fillStyle = "#E6C068"; ctx.font = "600 40px Lora, serif"; ctx.fillText(name, W / 2, H - 120); ctx.fillStyle = "rgba(243,236,216,0.6)"; ctx.font = "400 28px Lora, serif"; }
  ctx.fillText("Quran Note", W / 2, H - 72);
  return await new Promise((res) => c.toBlob(res, "image/png"));
}

function YearSummary({ entries, spans, khatams, today, T, fmtMonth, fmtLong, name }) {
  const years = useMemo(() => {
    const ys = new Set(entries.map((e) => e.date.slice(0, 4)));
    ys.add(today.slice(0, 4));
    return [...ys].sort().reverse();
  }, [entries, today]);
  const [year, setYear] = useState(years[0]);
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState("");
  const sum = useMemo(() => computeYear(entries, spans, khatams, year), [entries, spans, khatams, year]);
  const tiles = [
    [T.yearDays, `${sum.days} ${T.yearDaysUnit}`],
    [T.yearStreak, `${sum.bestStreak} ${T.yearDaysUnit}`],
    [T.yearKhatam, `${sum.khatams}×`],
    [T.yearNotes, String(sum.notes)],
    [T.yearBestMonth, sum.bestMonth ? `${fmtMonth(sum.bestMonth[0]).split(" ")[0]} · ${sum.bestMonth[1]}` : "—"],
    [T.yearTopSurah, sum.topSurah ? sum.topSurah[0] : "—"],
  ];
  async function share(download) {
    setBusy(true); setMsg(T.yearMaking);
    try {
      const blob = await drawYearCard(sum, tiles, T, fmtLong, name);
      if (!blob) throw new Error("blob");
      const name = `quran-note-${sum.year}.png`;
      const file = new File([blob], name, { type: "image/png" });
      if (!download && navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: `Quran Note — ${T.yearTitle(sum.year)}${name ? ` · ${name}` : ""}` });
      } else {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a"); a.href = url; a.download = name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 3000);
      }
      setMsg("");
    } catch (e) {
      setMsg(e && e.name === "AbortError" ? "" : T.yearFail);
    }
    setBusy(false);
  }
  return (
    <div style={{ marginBottom: 14 }}>
      {years.length > 1 && (
        <div style={styles.yearChips}>
          {years.map((y) => (
            <button key={y} className="qt-btn" type="button" onClick={() => setYear(y)}
              style={{ ...styles.langBtn, ...(y === year ? styles.langBtnOn : {}) }}>{y}</button>
          ))}
        </div>
      )}
      <div style={styles.yearCard}>
        <div style={{ textAlign: "center", fontFamily: "'Amiri', serif", color: "#E6C068", fontSize: 18 }}>وِرْد القُرْآن</div>
        <h3 style={styles.yearTitle}>{T.yearTitle(sum.year)}</h3>
        {sum.pages === 0 ? (
          <div style={{ textAlign: "center", opacity: 0.75, fontSize: 13.5, margin: "16px 0 6px" }}>{T.yearEmpty}</div>
        ) : (
          <>
            <div style={styles.yearBig}>
              <div style={styles.yearBigNum}>{sum.pages}</div>
              <div style={{ fontSize: 13, opacity: 0.8 }}>{T.yearPages} · {sum.ayahs.toLocaleString(T.locale)} {T.ayat}</div>
            </div>
            <div style={styles.yearGrid}>
              {tiles.map(([l, v]) => (
                <div key={l} style={styles.yearTile}>
                  <div style={styles.yearTileLabel}>{l}</div>
                  <div style={styles.yearTileValue}>{v}</div>
                </div>
              ))}
            </div>
            {sum.first && <div style={{ textAlign: "center", fontSize: 11.5, opacity: 0.6, marginTop: 12 }}>{T.yearSince(fmtLong(sum.first))}</div>}
          </>
        )}
      </div>
      {sum.pages > 0 && (
        <div style={styles.btnRow}>
          <button className="qt-btn" type="button" disabled={busy} onClick={() => share(false)} style={{ ...styles.smallPrimary, opacity: busy ? 0.6 : 1 }}>{T.yearShare}</button>
          <button className="qt-btn" type="button" disabled={busy} onClick={() => share(true)} style={styles.cancelBtn}>{T.yearDownload}</button>
          {msg && <span style={{ fontSize: 12.5, alignSelf: "center", opacity: 0.75 }}>{msg}</span>}
        </div>
      )}
    </div>
  );
}

// When does the user usually read? Buckets follow the prayer times of their zone when cached.
const TIME_BUCKETS = ["subuh", "pagi", "zohor", "maghrib", "malam", "qiam"];
function ReadingTimes({ entries, spans, today, T, smartHour, reminderMode }) {
  const [sel, setSel] = useState(null);
  const data = useMemo(() => {
    const sol = readJson("quran-journal-solat", null);
    const d0 = sol && Array.isArray(sol.days) && (sol.days.find((d) => d.date === today) || sol.days[0]);
    const mins = (hm, fb) => { const m = /^(\d{1,2}):(\d{2})/.exec((d0 && hm) || ""); return m ? +m[1] * 60 + +m[2] : fb; };
    const fajr = mins(d0 && d0.fajr, 340), syuruk = mins(d0 && d0.syuruk, 425), dhuhr = mins(d0 && d0.dhuhr, 790);
    const magh = mins(d0 && d0.maghrib, 1155), isha = mins(d0 && d0.isha, 1225);
    const bucketOf = (t) => t < fajr ? "qiam" : t <= syuruk + 90 ? "subuh" : t < dhuhr ? "pagi" : t < magh ? "zohor" : t <= isha + 20 ? "maghrib" : "malam";
    const out = Object.fromEntries(TIME_BUCKETS.map((k) => [k, { k, n: 0, pages: 0 }]));
    for (const en of entries) {
      if (typeof en.ts !== "number" || !realTime(en)) continue;
      const dt = new Date(en.ts);
      if (isoOf(dt) !== en.date) continue;
      const b = out[bucketOf(dt.getHours() * 60 + dt.getMinutes())];
      const [a, z] = spans[en.id] || [en.page, en.page];
      b.n++; b.pages += z - a + 1;
    }
    return TIME_BUCKETS.map((k) => out[k]);
  }, [entries, spans, today]);
  const total = data.reduce((a, b) => a + b.n, 0);
  if (total < 3) return (
    <div style={{ ...styles.chartCard, marginTop: 14 }}>
      <div style={styles.chartTitle}>{T.rtTitle}</div>
      <div style={{ ...styles.hint, margin: 0 }}>{T.rtEmpty}</div>
    </div>
  );
  const max = Math.max(...data.map((d) => d.n));
  const top = data.reduce((a, b) => (b.n > a.n ? b : a), data[0]);
  const withEnough = data.filter((d) => d.n >= 2);
  const longest = withEnough.length ? withEnough.reduce((a, b) => (b.pages / b.n > a.pages / a.n ? b : a), withEnough[0]) : null;
  const detail = sel != null ? data[sel] : null;
  const avg = (d) => (d.n ? d.pages / d.n : 0).toFixed(1);
  return (
    <div style={{ ...styles.chartCard, marginTop: 14 }}>
      <div style={styles.chartTitle}>{T.rtTitle}</div>
      <div role="list" style={{ display: "grid", gap: 2, marginTop: 4 }}>
        {data.map((d, i) => {
          const pct = Math.round((d.n / total) * 100);
          const on = sel === i, isTop = d === top;
          return (
            <button key={d.k} role="listitem" className="qt-btn" type="button" onClick={() => setSel(on ? null : i)}
              aria-label={T.rtTip(T.rtNames[d.k], d.n, d.pages, avg(d))}
              style={{ ...styles.rtRow, background: on ? "var(--muted)" : "transparent" }}>
              <span style={{ ...styles.rtLabel, fontWeight: isTop ? 700 : 400 }}>{T.rtNames[d.k]}</span>
              <span style={styles.rtTrack}>
                {d.n > 0 && <span style={{ ...styles.rtBar, width: `${Math.max(3, (d.n / max) * 100)}%` }} />}
              </span>
              <span style={styles.rtVal}>{pct}%</span>
            </button>
          );
        })}
      </div>
      <div style={styles.heatInfo} aria-live="polite">
        {detail ? T.rtTip(T.rtNames[detail.k], detail.n, detail.pages, avg(detail)) : T.rtTap(total)}
      </div>
      <div style={{ ...styles.hint, marginTop: 8, marginBottom: 0 }}>
        {T.rtTop(T.rtNames[top.k], Math.round((top.n / total) * 100))}
        {longest && longest.k !== top.k ? ` ${T.rtLongest(T.rtNames[longest.k], avg(longest))}` : ""}
        {reminderMode !== "fixed" && smartHour ? ` ${T.rtRemind(fmtHour(smartHour, T.locale))}` : ""}
      </div>
    </div>
  );
}

function Stats({ pagesByDate, today, T, fmtMonth, totalPages, bestStreak, readingDays, ayahsTotal, khatamCount }) {
  const thisMonth = today.slice(0, 7);
  const keys = [];
  for (let i = 11; i >= 0; i--) keys.push(addMonths(thisMonth, -i));
  const data = keys.map((k) => {
    let pages = 0, days = 0;
    for (const [d, n] of Object.entries(pagesByDate)) if (d.slice(0, 7) === k) { pages += n; days++; }
    return { k, pages, days };
  });
  const [sel, setSel] = useState(data.length - 1);
  const max = Math.max(1, ...data.map((d) => d.pages));
  const step = max <= 20 ? 5 : max <= 50 ? 10 : max <= 100 ? 25 : max <= 250 ? 50 : 100;
  const top = Math.ceil(max / step) * step;
  const ticks = [];
  for (let v = 0; v <= top; v += step) ticks.push(v);
  const W = 340, H = 190, L = 30, R = 6, TOP = 20, B = 24;
  const pw = W - L - R, ph = H - TOP - B;
  const band = pw / data.length, bw = Math.max(6, band - 4);
  const y = (v) => TOP + ph - (v / top) * ph;
  const best = data.reduce((a, b) => (b.pages > a.pages ? b : a), data[0]);
  const labelIdx = new Set([data.length - 1, data.indexOf(best)]);
  const shortMonth = (k) => parseIso(k + "-01").toLocaleDateString(T.locale, { month: "short" }).replace(".", "");
  const bar = (x, yTop, w, h) => {
    if (h <= 0) return "";
    const r = Math.min(4, h, w / 2);
    const yb = yTop + h;
    return `M${x},${yb} V${yTop + r} Q${x},${yTop} ${x + r},${yTop} H${x + w - r} Q${x + w},${yTop} ${x + w},${yTop + r} V${yb} Z`;
  };
  const avg = readingDays ? (totalPages / readingDays).toFixed(1) : "0";
  const tiles = [
    [T.statTotal, totalPages, ""], [T.statAyat, ayahsTotal.toLocaleString(T.locale), ""],
    [T.statBest, bestStreak, T.statDaysUnit], [T.statDays, readingDays, ""],
    [T.statAvg, avg, ""], [T.khatam, khatamCount, "×"],
  ];
  const s = data[sel];
  return (
    <div style={styles.historySection}>
      <div style={styles.statGrid}>
        {tiles.map(([label, val, unit]) => (
          <div key={label} style={styles.statTile}>
            <div style={styles.statLabel}>{label}</div>
            <div style={styles.statValue}><span style={styles.mono}>{val}</span>{unit && <span style={styles.statUnit}> {unit}</span>}</div>
          </div>
        ))}
      </div>
      <div style={styles.chartCard}>
        <div style={styles.chartTitle}>{T.statChart}</div>
        <svg viewBox={`0 0 ${W} ${H}`} width="100%" role="img" aria-label={T.statChart} style={{ display: "block", overflow: "visible" }}>
          {ticks.map((v) => (
            <g key={v}>
              <line x1={L} x2={W - R} y1={y(v)} y2={y(v)} stroke="var(--grid)" strokeWidth="1" />
              <text x={L - 6} y={y(v) + 3.5} textAnchor="end" fontSize="9.5" fill="var(--muted-ink)" fontFamily="IBM Plex Mono, monospace">{v}</text>
            </g>
          ))}
          {data.map((d, i) => {
            const x = L + i * band + (band - bw) / 2;
            const h = (d.pages / top) * ph;
            return (
              <g key={d.k}>
                <path d={bar(x, y(d.pages), bw, h)} fill="var(--bar)" opacity={sel === i ? 1 : 0.82} />
                {labelIdx.has(i) && d.pages > 0 && (
                  <text x={x + bw / 2} y={y(d.pages) - 5} textAnchor="middle" fontSize="10" fontWeight="600" fill="var(--ink)" fontFamily="IBM Plex Mono, monospace">{d.pages}</text>
                )}
                <text x={x + bw / 2} y={H - 8} textAnchor="middle" fontSize="9" fill={sel === i ? "var(--ink)" : "var(--muted-ink)"} fontWeight={sel === i ? 700 : 400}>{shortMonth(d.k)}</text>
                <rect x={L + i * band} y={TOP - 10} width={band} height={ph + 10 + B} fill="transparent" style={{ cursor: "pointer" }}
                  onClick={() => setSel(i)} onMouseEnter={() => setSel(i)}>
                  <title>{T.statTip(fmtMonth(d.k), d.pages, d.days)}</title>
                </rect>
              </g>
            );
          })}
          {sel != null && (
            <line x1={L + sel * band + band / 2} x2={L + sel * band + band / 2} y1={TOP - 6} y2={TOP + ph} stroke="var(--line3)" strokeWidth="1" strokeDasharray="2 3" pointerEvents="none" />
          )}
        </svg>
        <div style={styles.heatInfo} aria-live="polite">{T.statTip(fmtMonth(s.k), s.pages, s.days)}</div>
        {best.pages > 0 && <div style={{ ...styles.hint, marginTop: 8, marginBottom: 0 }}>{T.statBestMonth(fmtMonth(best.k), best.pages)} · {T.statTapHint}</div>}
      </div>
    </div>
  );
}
