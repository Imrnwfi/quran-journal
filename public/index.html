<script>
  // App shortcut "Sambung bacaan": jump straight to the next page on Quran.com.
  (function () {
    try {
      var q = new URLSearchParams(location.search);
      if (q.get("action") !== "read") return;
      var e = JSON.parse(localStorage.getItem("quran-journal-entries") || "[]"), last = null;
      for (var i = 0; i < e.length; i++) { var x = e[i]; if (!last || x.date > last.date || (x.date === last.date && x.ts > last.ts)) last = x; }
      if (last) location.replace("https://quran.com/page/" + Math.min(last.page + 1, 604));
    } catch (err) {}
  })();
</script>

<script>
  // Show the opening scene for 3.5 s (3.2 s + 0.3 s fade); if the app is still loading, wait for it.
  (function () {
    var el = document.getElementById("splash"), minDone = false, ready = false, gone = false;
    function hide() {
      if (gone || !minDone || !ready) return;
      gone = true; el.classList.add("out");
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
    }
    setTimeout(function () { minDone = true; hide(); }, 3200);
    window.addEventListener("app-ready", function () { ready = true; hide(); });
    setTimeout(function () { ready = true; minDone = true; hide(); }, 8000);

    // Short, brisk Bismillah (Saud Al-Shuraim, 1:1; backups: Maher Al-Muaiqly, Alafasy) when the app opens. Can be turned off in Settings.
    var settings = {};
    try { settings = JSON.parse(localStorage.getItem("quran-journal-settings") || "{}"); } catch (e) {}
    if (settings.sound === false) return;
    var SOURCES = [
      "https://everyayah.com/data/Saood_ash-Shuraym_128kbps/001001.mp3",
      "https://verses.quran.com/Shuraym/mp3/001001.mp3",
      "https://everyayah.com/data/Maher_AlMuaiqly_64kbps/001001.mp3",
      "https://verses.quran.foundation/Alafasy/mp3/001001.mp3"
    ];
    var VOLUME = 0.3, idx = 0, started = false;
    var audio = new Audio();
    audio.preload = "auto";
    audio.volume = 0;
    audio.src = SOURCES[0];
    audio.addEventListener("error", function () {
      if (++idx < SOURCES.length) { audio.src = SOURCES[idx]; if (started) play(); }
    });
    function fadeIn() {
      var v = 0;
      var t = setInterval(function () { v = Math.min(VOLUME, v + 0.06); try { audio.volume = v; } catch (e) {} if (v >= VOLUME) clearInterval(t); }, 50);
    }
    function play() {
      started = true;
      var p = audio.play();
      if (p && p.then) {
        p.then(function () { el.classList.remove("needs-tap"); fadeIn(); })
         .catch(function (err) { if (err && err.name === "NotAllowedError" && !gone) el.classList.add("needs-tap"); });
      }
    }
    el.querySelector(".sp-tap").addEventListener("click", function (e) { e.stopPropagation(); play(); });
    el.addEventListener("click", function () { if (el.classList.contains("needs-tap")) play(); });
    window.__bismillah = audio;
    play();
  })();
</script>

    if (!h) continue;
    for (const ev of ISLAMIC_EVENTS) {
      if (!seen.has(ev.id) && ev.m === h.m && ev.d === h.d) { seen.add(ev.id); found.push({ ...ev, date: iso, days: i, year: h.y }); }
    }

}

function smartHourOf(entries) {
  const samples = entries
    .filter((e) => typeof e.ts === "number" && isoOf(new Date(e.ts)) === e.date)
    .sort((a, b) => b.ts - a.ts).slice(0, 30)

    .sort((a, b) => a - b);

let ZONES_CACHE = null;
async function loadZones() {
  if (ZONES_CACHE) return ZONES_CACHE;

// Point-in-polygon on the JAKIM district boundaries; if the point is just off the coast, nearest zone within ~100 km.
function zoneFor(lat, lon, zones) {
  const inside = (x, y, rings) => {
    let hit = false;
    for (const r of rings) for (let i = 0, j = r.length - 1; i < r.length; j = i++) {
      const [xi, yi] = r[i], [xj, yj] = r[j];
      if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) hit = !hit;
    }
    return hit;
  };
  for (const z of zones) if (inside(lon, lat, z.p)) return z;
  let best = null, bd = Infinity;
  for (const z of zones) for (const r of z.p) for (const [x, y] of r) { const d = (x - lon) ** 2 + (y - lat) ** 2; if (d < bd) { bd = d; best = z; } }
  return bd < 1 ? best : null;
}

function readJson(key, fallback) {
  try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; } catch (e) { return fallback; }
}
function writeJson(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch (e) { return false; }
}
function readStr(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
function writeStr(key, v) { try { v == null ? localStorage.removeItem(key) : localStorage.setItem(key, v); } catch (e) {} }

function sortKhatams(list) {
  return [...list].sort((a, b) => (a.date === b.date ? a.ts - b.ts : a.date.localeCompare(b.date)));
}
function isAfterKhatam(entry, k) {
  if (!k) return true;
  if (entry.date !== k.date) return entry.date > k.date;
  return entry.ts > k.ts;
}
function cmpEntryAsc(a, b) { return a.date === b.date ? a.ts - b.ts : a.date.localeCompare(b.date); }

// Pages each entry covers. With "from": from–to. Without: continues from the previous entry's last page.
// Each khatam starts a fresh round.
function computeCoverage(entries, khatamsAsc) {
  const asc = [...entries].sort(cmpEntryAsc);
  const spans = {};
  let kIdx = 0, prevEnd = 0;
  for (const en of asc) {
    while (kIdx < khatamsAsc.length && isAfterKhatam(en, khatamsAsc[kIdx])) { kIdx++; prevEnd = 0; }
    let start, end = en.page;
    if (en.from) start = en.from;
    else if (prevEnd + 1 <= en.page) start = prevEnd + 1;
    else start = en.page;
    if (start > end) [start, end] = [end, start];
    spans[en.id] = [start, end];
    prevEnd = Math.max(start, end);
  }
  return spans;
}

function makeId(prefix) { return `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`; }

function validEntry(e) {
  return e && typeof e.id === "string" && Number.isInteger(e.page) && e.page >= 1 && e.page <= TOTAL_PAGES &&
    typeof e.date === "string" && /^\d{4}-\d{2}-\d{2}$/.test(e.date) && typeof e.ts === "number" &&
    (e.from == null || (Number.isInteger(e.from) && e.from >= 1 && e.from <= TOTAL_PAGES));
}
function validKhatam(k) {
  return k && typeof k.id === "string" && typeof k.date === "string" && /^\d{4}-\d{2}-\d{2}$/.test(k.date) && typeof k.ts === "number";
}

async function api(path, opts = {}, token) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 9000);
  try {
    const res = await fetch("/api/" + path, {
      ...opts, signal: ctrl.signal, cache: "no-store",
      headers: { "content-type": "application/json", ...(token ? { authorization: "Bearer " + token } : {}) },
    });
    const ct = res.headers.get("content-type") || "";
    const body = ct.includes("application/json") ? await res.json() : null;
    return { ok: res.ok, status: res.status, body };
  } finally { clearTimeout(timer); }
}

function docToState(doc) {
  return {
    entries: Array.isArray(doc?.entries) ? doc.entries : [],
    khatams: Array.isArray(doc?.khatams) ? doc.khatams : [],
    deleted: { entries: doc?.deleted?.entries || [], khatams: doc?.deleted?.khatams || [] },
    targetDate: doc?.settings?.targetDate || "",
    reminderMode: doc?.settings?.reminderMode === "fixed" ? "fixed" : "smart",
  };
}
function stateToDoc(s) {

  try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || tz; } catch (e) {}
  return { entries: s.entries, khatams: s.khatams, deleted: s.deleted, settings: { targetDate: s.targetDate || "", tz, reminderMode: s.reminderMode || "smart" } };
}
// Union by id (this device wins on the same id), minus anything deleted on either side.
function mergeStates(local, remote) {
  const deleted = {
    entries: uniq([...local.deleted.entries, ...remote.deleted.entries]),
    khatams: uniq([...local.deleted.khatams, ...remote.deleted.khatams]),
  };
  const byId = (mine, theirs, dead) => {
    const m = new Map();
    for (const x of theirs) m.set(x.id, x);
    for (const x of mine) m.set(x.id, x);
    return [...m.values()].filter((x) => !dead.has(x.id));
  };
  return {
    entries: byId(local.entries, remote.entries, new Set(deleted.entries)),
    khatams: byId(local.khatams, remote.khatams, new Set(deleted.khatams)),
    deleted,
    targetDate: local.targetDate || remote.targetDate || "",
    reminderMode: local.reminderMode || remote.reminderMode || "smart",
  };
}

  const pad = "=".repeat((4 - (b64.length % 4)) % 4);

  return Uint8Array.from([...raw].map((c) => c.charCodeAt(0)));

  async function doSync(attempt) {

      b("p100", "📖", totalPages, 100), b("p300", "📚", totalPages, 300),
      b("j1", "🕌", k > 0 ? 1 : juzDone, 1), b("j10", "⭐", k > 0 ? 10 : juzDone, 10), b("half", "🌗", k > 0 ? 15 : juzDone, 15),
      b("k1", "🏆", k, 1), b("k3", "👑", k, 3), b("n10", "✍️", notesList.length, 10),
    ];
  }, [entries.length, bestStreak, totalPages, juzDone, khatamCount, notesList.length]);
  const badgesDone = badges.filter((x) => x.done).length;

  /* ----- actions ----- */
  function addKhatam(kDate, kNote, ts) {
    const k = { id: makeId("k"), date: kDate, note: (kNote || "").trim(), ts };
    const next = [...khatams, k];
    persistKhatams(next);
    const n = sortKhatams(next).findIndex((x) => x.id === k.id) + 1;
    setKhatamFlash(T.flash(n, fmtLong(kDate)));
    setKhatamOpen(true);
    setDoa({ n });
  }
  function parsePageInput(v) {
    if (v === "" || v == null) return null;
    const n = parseInt(v, 10);
    return Number.isInteger(n) && n >= 1 && n <= TOTAL_PAGES ? n : NaN;
  }
  function addEntry(e) {
    e.preventDefault();
    const to = parsePageInput(page);
    const from = parsePageInput(fromPage);
    if (to == null || Number.isNaN(to) || Number.isNaN(from)) { setFormError(T.invalidPage); return; }
    setFormError("");
    const entry = { id: makeId("e"), page: to, from: from && from !== to ? from : null, note: note.trim(), date, ts: Date.now() };
    persist([entry, ...entries]);
    if (to === TOTAL_PAGES) addKhatam(date, "", entry.ts + 1);
    setPage(""); setFromPage(""); setNote("");
    closeLog();
    showToast(T.savedToast(rangeLabel(entry)));
  }
  function deleteEntry(id) {
    persistDeleted({ ...deleted, entries: [...deleted.entries, id] });
    persist(entries.filter((en) => en.id !== id));
    setConfirmDeleteId(null);
  }
  function startEdit(en) {
    setConfirmDeleteId(null);
    setEditId(en.id);
    setEditDraft({ from: en.from ? String(en.from) : "", page: String(en.page), date: en.date, note: en.note || "", err: "" });
  }
  function saveEdit(e) {
    e.preventDefault();
    const to = parsePageInput(editDraft.page);
    const from = parsePageInput(editDraft.from);
    if (to == null || Number.isNaN(to) || Number.isNaN(from)) { setEditDraft({ ...editDraft, err: T.invalidPage }); return; }
    persist(entries.map((en) => en.id === editId
      ? { ...en, page: to, from: from && from !== to ? from : null, date: editDraft.date, note: editDraft.note.trim() }
      : en));
    setEditId(null); setEditDraft(null);
  }
  function submitKhatam(e) {
    e.preventDefault();
    if (!khatamDate) return;
    addKhatam(khatamDate, khatamNote, Date.now());
    setKhatamNote("");
    setShowKhatamForm(false);
  }
  function deleteKhatam(id) {
    persistDeleted({ ...deleted, khatams: [...deleted.khatams, id] });
    persistKhatams(khatams.filter((k) => k.id !== id));
    setConfirmKhatamId(null);
    setKhatamFlash("");
  }
  function startEditKhatam(k) {
    setConfirmKhatamId(null);
    setEditKhatamId(k.id);
    setKhatamDraft({ date: k.date, note: k.note || "" });
  }
  function saveEditKhatam(e) {
    e.preventDefault();
    if (!khatamDraft.date) return;
    persistKhatams(khatams.map((k) => k.id === editKhatamId ? { ...k, date: khatamDraft.date, note: khatamDraft.note.trim() } : k));
    setEditKhatamId(null); setKhatamDraft(null); setKhatamFlash("");
  }

  function backupPayload() {
    return { app: "quran-journal", version: 3, exportedAt: new Date().toISOString(), entries, khatams, settings: { targetDate: settings.targetDate } };
  }
  function exportBackup() {
    try {
      const blob = new Blob([JSON.stringify(backupPayload(), null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = `quran-note-backup-${today}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    } catch (e) { setBackupMsg(T.copyFail); }
  }
  async function copyBackup() {
    try { await navigator.clipboard.writeText(JSON.stringify(backupPayload())); setBackupMsg(T.copied); }
    catch (e) { setBackupMsg(T.copyFail); }
  }
  function onImportFile(ev) {
    const file = ev.target.files && ev.target.files[0];
    ev.target.value = "";
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(String(reader.result));
        const list = Array.isArray(data) ? data : data.entries;
        const ks = Array.isArray(data) ? [] : (data.khatams || []);
        if (!Array.isArray(list) || !list.every(validEntry) || !Array.isArray(ks) || !ks.every(validKhatam)) throw new Error("bad");
        setPendingImport({ entries: list, khatams: ks, settings: data.settings || null });
        setBackupMsg("");
      } catch (e) { setPendingImport(null); setBackupMsg(T.importBad); }
    };
    reader.readAsText(file);
  }
  function confirmImport() {
    const keepIds = new Set([...pendingImport.entries.map((x) => x.id), ...pendingImport.khatams.map((x) => x.id)]);
    persistDeleted({
      entries: uniq([...deleted.entries, ...entries.map((x) => x.id)]).filter((id) => !keepIds.has(id)),
      khatams: uniq([...deleted.khatams, ...khatams.map((x) => x.id)]).filter((id) => !keepIds.has(id)),
    });
    stateRef.current = { ...stateRef.current, entries: pendingImport.entries, khatams: pendingImport.khatams };
    setEntries(pendingImport.entries); writeJson(STORAGE_KEY, pendingImport.entries);
    persistKhatams(pendingImport.khatams);
    if (pendingImport.settings) persistSettings({ targetDate: pendingImport.settings.targetDate || "" });
    setPendingImport(null);
    setBackupMsg(T.importOk);
  }
  async function doInstall() {
    if (!installEvt) return;
    try { installEvt.prompt(); const res = await installEvt.userChoice; if (res && res.outcome === "accepted") setIsStandalone(true); } catch (e) {}
    setInstallEvt(null);
  }

  /* ----- pieces ----- */
  const rangeLabel = (en) => {
    const [a, b] = en.from ? [Math.min(en.from, en.page), Math.max(en.from, en.page)] : [en.page, en.page];
    return a === b ? `p.${b}` : `p.${a}–${b}`;
  };

  function EntryEditor() {
    return (

          </label>
          <label style={styles.label}>{T.to}
            <input className="qt-input" type="number" min="1" max={TOTAL_PAGES} value={editDraft.page} required
              onChange={(e) => setEditDraft({ ...editDraft, page: e.target.value })} style={styles.input} />
          </label>
          <label style={{ ...styles.label, flex: 1.6 }}>{T.date}

        </div>
        <label style={styles.label}>{T.note}

        {editDraft.err && <div style={{ ...styles.errorText, marginTop: -6, marginBottom: 8 }}>{editDraft.err}</div>}
        <div style={{ display: "flex", gap: 8 }}>
          <button className="qt-btn" type="submit" style={styles.smallPrimary}>{T.save}</button>
          <button className="qt-btn" type="button" onClick={() => { setEditId(null); setEditDraft(null); }} style={styles.cancelBtn}>{T.cancel}</button>
        </div>
      </form>
    );

  function EntryCard({ en, showDate }) {

  const syncLabel = { saved: T.syncSaved, saving: T.syncSaving, offline: T.syncOffline, error: T.syncError }[syncState];

        ) : notif === "denied" ? (

        ) : notif === "on" ? (

            <div style={styles.btnRow}>

            </div>
          </>
        ) : (
          <>
            <button className="qt-btn" type="button" disabled={notif === "busy" || notif === "unknown"} onClick={enableNotif}
              style={{ ...styles.smallPrimary, opacity: notif === "busy" ? 0.6 : 1 }}>{T.notifOn}</button>
            {IS_IOS && !isStandalone && <div style={{ ...styles.hint, marginTop: 8 }}>{T.notifIOS}</div>}
          </>
        )}
        {notifMsg && <div style={{ fontSize: 12.5, marginTop: 8, color: "var(--title)" }}>{notifMsg}</div>}
        {role === "owner" && (
          <div style={{ marginTop: 12 }}>
            <div style={styles.segment}>
              {[["smart", T.remindSmart], ["fixed", T.remindFixed]].map(([k, l]) => (
                <button key={k} className="qt-btn" type="button" onClick={() => persistSettings({ reminderMode: k })}
                  aria-pressed={settings.reminderMode === k} style={{ ...styles.segBtn, ...(settings.reminderMode === k ? styles.segBtnOn : {}) }}>{l}</button>

            </div>

    role === "owner" && { key: "account", icon: "👤", title: T.account, value: "✓", body: (

      <button className="qt-btn" type="button" onClick={() => { setLoginErr(""); setLoginOpen(true); }} style={styles.smallPrimary}>{T.iAmOwner}</button>
    ) },
    { key: "backup", icon: "💾", title: T.backup, value: "", body: (
      <>
        <div style={styles.hint}>{T.backupHint}</div>
        <div style={styles.btnRow}>
          <button className="qt-btn" type="button" onClick={exportBackup} style={styles.smallPrimary}>{T.exportBtn}</button>
          <button className="qt-btn" type="button" onClick={copyBackup} style={styles.cancelBtn}>{T.copyBtn}</button>
          {canEdit && <button className="qt-btn" type="button" onClick={() => fileRef.current && fileRef.current.click()} style={styles.cancelBtn}>{T.importBtn}</button>}
        </div>
        {pendingImport && (

            <span style={{ fontSize: 12.5 }}>{T.importQ(pendingImport.entries.length, pendingImport.khatams.length)}</span>
            <button className="qt-btn" type="button" onClick={confirmImport} style={styles.confirmBtn}>{T.save}</button>
            <button className="qt-btn" type="button" onClick={() => setPendingImport(null)} style={styles.cancelBtn}>{T.cancel}</button>
          </div>

        {backupMsg && <div style={{ fontSize: 12.5, marginTop: 8, color: backupMsg === T.importBad || backupMsg === T.copyFail ? "var(--danger)" : "var(--title)" }}>{backupMsg}</div>}

        <div style={styles.hint}>{T.installAndroid}</div>

    ) },
  ];

  const navItems = [["home", "🏠", T.navHome], ["history", "📖", T.navHistory], ["log", "+", T.logTitle], ["stats", "📊", T.navStats], ["settings", "⚙️", T.navSettings]];
  const slides = [
    <>
          <div style={styles.estRow}>
            <div style={{ flex: 1 }}>
              <div style={styles.estLabel}>{T.estTitle}</div>
              {etaIso ? (
                <>
                  <div style={styles.estValue}>{fmtLong(etaIso)}</div>
                  <div style={styles.estSub}>{T.estPace(pace.toFixed(1))} · {T.estLeft(remaining)}</div>

        {screen === "home" && (
          <>
            <header style={styles.header}>

              <h1 style={styles.title}>Quran Note</h1>
              <div style={styles.todayLine}>

            <div style={styles.mihrabWrap}>

/* ---------- Calendar heatmap ---------- */
function Heatmap({ pagesByDate, today, T, fmtLong }) {
  const [sel, setSel] = useState(null);
  const scrollRef = useRef(null);
  const WEEKS = 26;
  const todayDow = (parseIso(today).getDay() + 6) % 7; // 0 = Monday
  const start = addDays(today, -(todayDow + (WEEKS - 1) * 7));
  const weeks = [];
  for (let w = 0; w < WEEKS; w++) {
    const col = [];
    for (let d = 0; d < 7; d++) col.push(addDays(start, w * 7 + d));
    weeks.push(col);
  }
  useEffect(() => { if (scrollRef.current) scrollRef.current.scrollLeft = scrollRef.current.scrollWidth; }, []);
  const level = (n) => (!n ? 0 : n <= 2 ? 1 : n <= 5 ? 2 : n <= 10 ? 3 : 4);
  const colors = ["var(--h0)", "var(--h1)", "var(--h2)", "var(--h3)", "var(--h4)"];
  const monthLabel = (iso) => parseIso(iso).toLocaleDateString(T.locale, { month: "short" });
  const readDays = Object.keys(pagesByDate).filter((d) => d >= start && d <= today).length;

  return (
    <div style={styles.historySection}>
      <div ref={scrollRef} className="qt-heat" style={styles.heatScroll}>
        <div style={{ display: "flex", gap: 3 }}>
          {weeks.map((col, wi) => {
            const first = col[0];
            const showMonth = wi === 0 || parseIso(first).getMonth() !== parseIso(weeks[wi - 1][0]).getMonth();
            return (
              <div key={wi} style={{ display: "flex", flexDirection: "column", gap: 3 }}>
                <div style={styles.heatMonth}>{showMonth ? monthLabel(first) : ""}</div>
                {col.map((d) => {
                  const future = d > today;
                  const n = pagesByDate[d] || 0;
                  return (
                    <button key={d} className="qt-btn" disabled={future} onClick={() => setSel(d)}
                      aria-label={T.calDay(fmtLong(d), n)}
                      style={{ ...styles.heatCell, background: future ? "transparent" : colors[level(n)],
                        outline: sel === d ? "2px solid var(--gold)" : "none", cursor: future ? "default" : "pointer" }} />
                  );
                })}
              </div>
            );
          })}
        </div>
      </div>
      <div style={styles.heatLegend}>
        <span>{T.calLegend}</span>
        {colors.map((c) => <span key={c} style={{ ...styles.heatCell, width: 11, height: 11, background: c, display: "inline-block" }} />)}
        <span>{T.calMore}</span>
        <span style={{ marginLeft: "auto" }}><span style={styles.mono}>{readDays}</span>/{WEEKS * 7 - (6 - todayDow)}</span>
      </div>
      <div style={styles.heatInfo}>{sel ? T.calDay(fmtLong(sel), pagesByDate[sel] || 0) : T.calTap}</div>
    </div>
  );
}

/* ---------- Prayer times card (JAKIM e-Solat via /api/solat) ---------- */
function PrayerCard({ T, lang, settings, persistSettings, today, available, openSignal }) {
  const [data, setData] = useState(() => readJson("quran-journal-solat", null));
  const [open, setOpen] = useState(false);
  useEffect(() => { if (openSignal) setOpen(true); }, [openSignal]);
  const [status, setStatus] = useState("idle"); // idle | loading | locating | error | denied | outside
  const [zones, setZones] = useState(null);
  const [picking, setPicking] = useState(false);
  const [now, setNow] = useState(() => new Date());
  useEffect(() => { const id = setInterval(() => setNow(new Date()), 30000); return () => clearInterval(id); }, []);

  const zone = settings.zone || "";
  useEffect(() => {
    if (!available || !zone) return;
    let cancelled = false;
    const fresh = data && data.zone === zone && data.days && data.days[0] && data.days[0].date === today;
    if (fresh) return;
    setStatus("loading");
    api("solat?zone=" + encodeURIComponent(zone)).then((r) => {
      if (cancelled) return;
      if (r.ok && r.body && Array.isArray(r.body.days)) { setData(r.body); writeJson("quran-journal-solat", r.body); setStatus("idle"); }
      else setStatus("error");
    }).catch(() => { if (!cancelled) setStatus("error"); });
    return () => { cancelled = true; };
  }, [zone, today, available]);

  // Line our Hijri dates up with JAKIM's (Malaysia can differ from Umm al-Qura by a day).
  useEffect(() => {
    const d0 = data && data.days && data.days.find((d) => d.date === today);
    if (!d0 || !d0.hijri) return;
    const m = d0.hijri.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if (!m) return;
    for (const off of [0, -1, 1, -2, 2]) {
      const h = hijriOf(today, off);
      if (h && h.y === +m[1] && h.m === +m[2] && h.d === +m[3]) { if ((settings.hijriOffset || 0) !== off) persistSettings({ hijriOffset: off }); break; }
    }
  }, [data, today]);

  async function openPicker() {
    setPicking(true);
    if (!zones) { try { setZones(await loadZones()); } catch (e) { setStatus("error"); } }
  }
  function chooseZone(z, extra = {}) {
    persistSettings({ zone: z.c, zoneLabel: zoneLabelOf(z.c), ...extra });
    setPicking(false); setStatus("idle");
  }
  function locate() {
    if (!navigator.geolocation) { setStatus("denied"); openPicker(); return; }
    setStatus("locating");
    navigator.geolocation.getCurrentPosition(async (pos) => {
      try {
        const zs = zones || await loadZones(); setZones(zs);
        const z = zoneFor(pos.coords.latitude, pos.coords.longitude, zs);
        const near = [Math.round(pos.coords.latitude * 100) / 100, Math.round(pos.coords.longitude * 100) / 100];
        if (z) chooseZone(z, { near }); else { persistSettings({ near }); setStatus("outside"); setPicking(true); }
      } catch (e) { setStatus("error"); }
    }, () => { setStatus("denied"); openPicker(); }, { enableHighAccuracy: false, timeout: 15000, maximumAge: 10 * 60 * 1000 });
  }

  const days = data && data.zone === zone ? data.days || [] : [];
  const td = days.find((d) => d.date === today);
  const tm = days.find((d) => d.date === addDays(today, 1));
  let next = null;
  if (td) {
    const nowMin = now.getHours() * 60 + now.getMinutes();
    for (const k of PRAYERS) {
      const [h, m] = (td[k] || "").split(":").map(Number);
      if (Number.isFinite(h) && h * 60 + m > nowMin) { next = { k, mins: h * 60 + m - nowMin, tomorrow: false }; break; }
    }
    if (!next && tm && tm.fajr) { const [h, m] = tm.fajr.split(":").map(Number); next = { k: "fajr", mins: 24 * 60 - nowMin + h * 60 + m, tomorrow: true }; }
  }
  const fmtT = (t) => { if (!t) return "—"; const [h, m] = t.split(":").map(Number); const d = new Date(); d.setHours(h, m, 0, 0); return d.toLocaleTimeString(T.locale, { hour: "numeric", minute: "2-digit" }); };
  const hijriLabel = td && td.hijri ? (() => { const m = td.hijri.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/); return m ? `${+m[3]} ${(HIJRI_MONTHS[lang] || HIJRI_MONTHS.ms)[+m[2] - 1]} ${m[1]}` : ""; })() : "";
  // Google Maps search for nearby mosques (uses the rough location from "Lokasi semasa" if known, else the phone's own location).
  const near = Array.isArray(settings.near) ? settings.near : null;
  const mosqueUrl = "https://www.google.com/maps/search/?api=1&query=" +
    encodeURIComponent(near ? `${T.mosqueQuery} near ${near[0]},${near[1]}` : `${T.mosqueQuery} near me`);
  const msg = { locating: T.solatLocating, loading: T.solatLoading, error: T.solatError, denied: T.solatDenied, outside: T.solatOutside }[status];

  const summary = !available ? T.solatServerOnly : !zone ? T.solatPickShort
    : next ? `${T.solatNames[next.k]}${next.tomorrow ? ` (${T.solatTomorrow})` : ""} ${fmtT((next.tomorrow ? tm : td)[next.k])} · ${T.solatHM(Math.floor(next.mins / 60), next.mins % 60)}`
    : status === "error" ? T.solatError : T.solatLoading;

  return (
    <section id="solat" style={{ ...styles.estCard, padding: open ? "14px 18px 16px" : "12px 16px", marginBottom: 14 }}>
      <button className="qt-btn" type="button" onClick={() => setOpen(!open)} aria-expanded={open} style={styles.solatHead}>
        <span aria-hidden="true" style={{ fontSize: 17 }}>🕌</span>
        <span style={{ flex: 1, textAlign: "left", minWidth: 0 }}>
          <span style={{ ...styles.estLabel, display: "block" }}>{T.solat}{zone ? ` · ${zone}` : ""}</span>
          {!open && <span style={styles.solatSummary}>{summary}</span>}
          {open && hijriLabel && <span style={{ fontSize: 12, opacity: 0.75 }}>{hijriLabel}</span>}
        </span>
        <span style={{ ...styles.chev, fontSize: 20, transform: open ? "rotate(90deg)" : "none" }}>›</span>
      </button>
      {open && <div className="qt-fade" style={{ marginTop: 10 }}>
      {!available ? (
        <div style={styles.estSub}>{T.solatServerOnly}</div>
      ) : !zone ? (
        <div style={styles.estSub}>{T.solatEmpty}</div>
      ) : (
        <>
          {zoneLabelOf(zone) && <div style={{ fontSize: 12, opacity: 0.65, marginBottom: 10 }}>{zoneLabelOf(zone)}</div>}
          {td ? (
            <>
              {next && (
                <div style={styles.solatNext}>
                  {T.solatNext(T.solatNames[next.k] + (next.tomorrow ? ` (${T.solatTomorrow})` : ""), T.solatHM(Math.floor(next.mins / 60), next.mins % 60))}
                </div>
              )}
              <div style={styles.solatGrid}>
                {PRAYERS.map((k) => {
                  const on = next && !next.tomorrow && next.k === k;
                  return (
                    <div key={k} style={{ ...styles.solatCell, ...(on ? styles.solatCellOn : {}) }}>
                      <div style={styles.solatName}>{T.solatNames[k]}</div>
                      <div style={styles.solatTime}>{fmtT(td[k])}</div>
                    </div>
                  );
                })}
              </div>
              <div style={{ fontSize: 11, opacity: 0.55, marginTop: 8 }}>{T.solatSource(data.source || "JAKIM e-Solat")}</div>
            </>
          ) : (status !== "loading" && status !== "error") ? <div style={styles.estSub}>{T.solatLoading}</div> : null}
        </>
      )}
      {msg && <div style={{ fontSize: 12.5, marginTop: 8, color: status === "loading" || status === "locating" ? "inherit" : "var(--danger)" }}>{msg}</div>}
      {available && (
        <div style={{ ...styles.btnRow, marginTop: 12 }}>
          <button className="qt-btn" type="button" onClick={locate} disabled={status === "locating"} style={styles.smallPrimary}>{T.solatLocate}</button>
          <button className="qt-btn" type="button" onClick={() => (picking ? setPicking(false) : openPicker())} style={styles.cancelBtn}>{zone ? T.solatChange : T.solatPick}</button>
        </div>
      )}
      {open && (
        <a href={mosqueUrl} target="_blank" rel="noopener noreferrer" style={styles.mosqueBtn}>{T.mosque} ↗</a>
      )}
      {picking && (
        <select className="qt-input" value={zone} onChange={(e) => { const z = (zones || []).find((x) => x.c === e.target.value); if (z) chooseZone(z); }}
          style={{ ...styles.input, marginTop: 10, fontFamily: "'Lora', serif", fontSize: 13 }} aria-label={T.solatPick}>
          <option value="">{zones ? T.solatPick + "…" : T.solatLoading}</option>
          {zones && [...new Set(zones.map((z) => z.s))].sort().map((st) => (
            <optgroup key={st} label={st}>
              {zones.filter((z) => z.s === st).map((z) => <option key={z.c} value={z.c}>{z.c} · {z.n}</option>)}
            </optgroup>
          ))}
        </select>
      )}
      </div>}
    </section>
  );
}

/* ---------- Yearly summary (+ shareable image) ---------- */
function computeYear(entries, spans, khatams, year) {
  const list = entries.filter((e) => e.date.slice(0, 4) === year);
  const byDate = {}, byMonth = {}, bySurah = {};
  let ayahs = 0;
  for (const en of list) {
    const [a, b] = spans[en.id] || [en.page, en.page];
    const n = b - a + 1;
    byDate[en.date] = (byDate[en.date] || 0) + n;
    const m = en.date.slice(0, 7);
    byMonth[m] = (byMonth[m] || 0) + n;
    for (let p = a; p <= b; p++) { const s = surahForPage(p); bySurah[s] = (bySurah[s] || 0) + 1; }
    ayahs += ayahsInSpan(a, b);
  }
  const days = Object.keys(byDate).sort();
  let best = 0, run = 0, prev = null;
  for (const d of days) { run = prev && addDays(prev, 1) === d ? run + 1 : 1; best = Math.max(best, run); prev = d; }
  const top = (obj) => Object.entries(obj).sort((x, y) => y[1] - x[1])[0] || null;
  return {
    year,
    pages: Object.values(byDate).reduce((x, y) => x + y, 0),
    days: days.length,
    bestStreak: best,
    khatams: khatams.filter((k) => k.date.slice(0, 4) === year).length,
    bestMonth: top(byMonth),
    topSurah: top(bySurah),
    notes: list.filter((e) => e.note).length,
    ayahs,
    first: days[0] || null,
  };
}

function rrect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}

async function drawYearCard(sum, tiles, T, fmtLong) {
  const W = 1080, H = 1350;
  try {
    await Promise.all([
      document.fonts.load("700 72px Amiri"), document.fonts.load("400 48px Amiri"),
      document.fonts.load("500 150px 'IBM Plex Mono'"), document.fonts.load("400 34px Lora"), document.fonts.load("600 40px Lora"),
    ]);
  } catch (e) {}
  const img = await new Promise((res) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = "splash-mark.png"; });
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const ctx = c.getContext("2d");
  const bg = ctx.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, "#0F4C3A"); bg.addColorStop(1, "#052A1F");
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  const glow = ctx.createRadialGradient(W / 2, 250, 10, W / 2, 250, 520);
  glow.addColorStop(0, "rgba(255,205,110,0.32)"); glow.addColorStop(1, "rgba(255,205,110,0)");
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = "rgba(217,188,122,0.45)"; ctx.lineWidth = 3; rrect(ctx, 36, 36, W - 72, H - 72, 40); ctx.stroke();
  if (img) { const h = 250, w = img.width * h / img.height; ctx.drawImage(img, (W - w) / 2, 90, w, h); }
  ctx.textAlign = "center";
  ctx.fillStyle = "#E6C068"; ctx.font = "400 46px Amiri, serif"; ctx.fillText("وِرْد القُرْآن", W / 2, 400);
  ctx.fillStyle = "#F3ECD8"; ctx.font = "700 72px Amiri, serif"; ctx.fillText(T.yearTitle(sum.year), W / 2, 485);
  ctx.fillStyle = "#D9BC7A"; ctx.font = "500 150px 'IBM Plex Mono', monospace"; ctx.fillText(String(sum.pages), W / 2, 650);
  ctx.fillStyle = "rgba(243,236,216,0.8)"; ctx.font = "400 34px Lora, serif"; ctx.fillText(`${T.yearPages} · ${sum.ayahs.toLocaleString(T.locale)} ${T.ayat}`, W / 2, 705);
  const cols = 2, tw = 440, th = 128, gx = 40, gy = 24, x0 = (W - (cols * tw + gx)) / 2, y0 = 752;
  tiles.forEach(([label, value], i) => {
    const x = x0 + (i % cols) * (tw + gx), y = y0 + Math.floor(i / cols) * (th + gy);
    ctx.fillStyle = "rgba(255,255,255,0.07)"; rrect(ctx, x, y, tw, th, 22); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.14)"; ctx.lineWidth = 2; ctx.stroke();
    ctx.textAlign = "left";
    ctx.fillStyle = "rgba(243,236,216,0.7)"; ctx.font = "400 26px Lora, serif"; ctx.fillText(label.toUpperCase(), x + 28, y + 46);
    ctx.fillStyle = "#F3ECD8"; ctx.font = "600 40px Lora, serif";
    let v = String(value); while (ctx.measureText(v).width > tw - 56 && v.length > 4) v = v.slice(0, -2) + "…";
    ctx.fillText(v, x + 28, y + 98);
  });
  ctx.textAlign = "center"; ctx.fillStyle = "rgba(243,236,216,0.6)"; ctx.font = "400 28px Lora, serif";
  ctx.fillText("Quran Note", W / 2, H - 82);
  return await new Promise((res) => c.toBlob(res, "image/png"));
}

function YearSummary({ entries, spans, khatams, today, T, fmtMonth, fmtLong }) {
  const years = useMemo(() => {
    const ys = new Set(entries.map((e) => e.date.slice(0, 4)));
    ys.add(today.slice(0, 4));
    return [...ys].sort().reverse();
  }, [entries, today]);
  const [year, setYear] = useState(years[0]);
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState("");
  const sum = useMemo(() => computeYear(entries, spans, khatams, year), [entries, spans, khatams, year]);
  const tiles = [
    [T.yearDays, `${sum.days} ${T.yearDaysUnit}`],
    [T.yearStreak, `${sum.bestStreak} ${T.yearDaysUnit}`],
    [T.yearKhatam, `${sum.khatams}×`],
    [T.yearNotes, String(sum.notes)],
    [T.yearBestMonth, sum.bestMonth ? `${fmtMonth(sum.bestMonth[0]).split(" ")[0]} · ${sum.bestMonth[1]}` : "—"],
    [T.yearTopSurah, sum.topSurah ? sum.topSurah[0] : "—"],
  ];
  async function share(download) {
    setBusy(true); setMsg(T.yearMaking);
    try {
      const blob = await drawYearCard(sum, tiles, T, fmtLong);
      if (!blob) throw new Error("blob");
      const name = `quran-note-${sum.year}.png`;
      const file = new File([blob], name, { type: "image/png" });
      if (!download && navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: `Quran Note — ${T.yearTitle(sum.year)}` });
      } else {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a"); a.href = url; a.download = name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 3000);
      }
      setMsg("");
    } catch (e) {
      setMsg(e && e.name === "AbortError" ? "" : T.yearFail);
    }
    setBusy(false);
  }
  return (
    <div style={{ marginBottom: 14 }}>
      {years.length > 1 && (
        <div style={styles.yearChips}>
          {years.map((y) => (
            <button key={y} className="qt-btn" type="button" onClick={() => setYear(y)}
              style={{ ...styles.langBtn, ...(y === year ? styles.langBtnOn : {}) }}>{y}</button>
          ))}
        </div>
      )}
      <div style={styles.yearCard}>
        <div style={{ textAlign: "center", fontFamily: "'Amiri', serif", color: "#E6C068", fontSize: 18 }}>وِرْد القُرْآن</div>
        <h3 style={styles.yearTitle}>{T.yearTitle(sum.year)}</h3>
        {sum.pages === 0 ? (
          <div style={{ textAlign: "center", opacity: 0.75, fontSize: 13.5, margin: "16px 0 6px" }}>{T.yearEmpty}</div>
        ) : (
          <>
            <div style={styles.yearBig}>
              <div style={styles.yearBigNum}>{sum.pages}</div>
              <div style={{ fontSize: 13, opacity: 0.8 }}>{T.yearPages} · {sum.ayahs.toLocaleString(T.locale)} {T.ayat}</div>
            </div>
            <div style={styles.yearGrid}>
              {tiles.map(([l, v]) => (
                <div key={l} style={styles.yearTile}>
                  <div style={styles.yearTileLabel}>{l}</div>
                  <div style={styles.yearTileValue}>{v}</div>
                </div>
              ))}
            </div>
            {sum.first && <div style={{ textAlign: "center", fontSize: 11.5, opacity: 0.6, marginTop: 12 }}>{T.yearSince(fmtLong(sum.first))}</div>}
          </>
        )}
      </div>
      {sum.pages > 0 && (
        <div style={styles.btnRow}>
          <button className="qt-btn" type="button" disabled={busy} onClick={() => share(false)} style={{ ...styles.smallPrimary, opacity: busy ? 0.6 : 1 }}>{T.yearShare}</button>
          <button className="qt-btn" type="button" disabled={busy} onClick={() => share(true)} style={styles.cancelBtn}>{T.yearDownload}</button>
          {msg && <span style={{ fontSize: 12.5, alignSelf: "center", opacity: 0.75 }}>{msg}</span>}
        </div>
      )}
    </div>
  );
}

/* ---------- Statistics: tiles + pages-per-month bars ---------- */
function Stats({ pagesByDate, today, T, fmtMonth, totalPages, bestStreak, readingDays, ayahsTotal, khatamCount }) {
  const thisMonth = today.slice(0, 7);
  const keys = [];
  for (let i = 11; i >= 0; i--) keys.push(addMonths(thisMonth, -i));
  const data = keys.map((k) => {
    let pages = 0, days = 0;
    for (const [d, n] of Object.entries(pagesByDate)) if (d.slice(0, 7) === k) { pages += n; days++; }
    return { k, pages, days };
  });
  const [sel, setSel] = useState(data.length - 1);
  const max = Math.max(1, ...data.map((d) => d.pages));
  const step = max <= 20 ? 5 : max <= 50 ? 10 : max <= 100 ? 25 : max <= 250 ? 50 : 100;
  const top = Math.ceil(max / step) * step;
  const ticks = [];
  for (let v = 0; v <= top; v += step) ticks.push(v);
  const W = 340, H = 190, L = 30, R = 6, TOP = 20, B = 24;
  const pw = W - L - R, ph = H - TOP - B;
  const band = pw / data.length, bw = Math.max(6, band - 4);
  const y = (v) => TOP + ph - (v / top) * ph;
  const best = data.reduce((a, b) => (b.pages > a.pages ? b : a), data[0]);
  const labelIdx = new Set([data.length - 1, data.indexOf(best)]);
  const shortMonth = (k) => parseIso(k + "-01").toLocaleDateString(T.locale, { month: "short" }).replace(".", "");
  const bar = (x, yTop, w, h) => {
    if (h <= 0) return "";
    const r = Math.min(4, h, w / 2);
    const yb = yTop + h;
    return `M${x},${yb} V${yTop + r} Q${x},${yTop} ${x + r},${yTop} H${x + w - r} Q${x + w},${yTop} ${x + w},${yTop + r} V${yb} Z`;
  };
  const avg = readingDays ? (totalPages / readingDays).toFixed(1) : "0";
  const tiles = [
    [T.statTotal, totalPages, ""], [T.statAyat, ayahsTotal.toLocaleString(T.locale), ""],
    [T.statBest, bestStreak, T.statDaysUnit], [T.statDays, readingDays, ""],
    [T.statAvg, avg, ""], [T.khatam, khatamCount, "×"],
  ];
  const s = data[sel];
  return (
    <div style={styles.historySection}>
      <div style={styles.statGrid}>
        {tiles.map(([label, val, unit]) => (
          <div key={label} style={styles.statTile}>
            <div style={styles.statLabel}>{label}</div>
            <div style={styles.statValue}><span style={styles.mono}>{val}</span>{unit && <span style={styles.statUnit}> {unit}</span>}</div>
          </div>
        ))}
      </div>
      <div style={styles.chartCard}>
        <div style={styles.chartTitle}>{T.statChart}</div>
        <svg viewBox={`0 0 ${W} ${H}`} width="100%" role="img" aria-label={T.statChart} style={{ display: "block", overflow: "visible" }}>
          {ticks.map((v) => (
            <g key={v}>
              <line x1={L} x2={W - R} y1={y(v)} y2={y(v)} stroke="var(--grid)" strokeWidth="1" />
              <text x={L - 6} y={y(v) + 3.5} textAnchor="end" fontSize="9.5" fill="var(--muted-ink)" fontFamily="IBM Plex Mono, monospace">{v}</text>
            </g>
          ))}
          {data.map((d, i) => {
            const x = L + i * band + (band - bw) / 2;
            const h = (d.pages / top) * ph;
            return (
              <g key={d.k}>
                <path d={bar(x, y(d.pages), bw, h)} fill="var(--bar)" opacity={sel === i ? 1 : 0.82} />
                {labelIdx.has(i) && d.pages > 0 && (
                  <text x={x + bw / 2} y={y(d.pages) - 5} textAnchor="middle" fontSize="10" fontWeight="600" fill="var(--ink)" fontFamily="IBM Plex Mono, monospace">{d.pages}</text>
                )}
                <text x={x + bw / 2} y={H - 8} textAnchor="middle" fontSize="9" fill={sel === i ? "var(--ink)" : "var(--muted-ink)"} fontWeight={sel === i ? 700 : 400}>{shortMonth(d.k)}</text>
                <rect x={L + i * band} y={TOP - 10} width={band} height={ph + 10 + B} fill="transparent" style={{ cursor: "pointer" }}
                  onClick={() => setSel(i)} onMouseEnter={() => setSel(i)}>
                  <title>{T.statTip(fmtMonth(d.k), d.pages, d.days)}</title>
                </rect>
              </g>
            );
          })}
          {sel != null && (
            <line x1={L + sel * band + band / 2} x2={L + sel * band + band / 2} y1={TOP - 6} y2={TOP + ph} stroke="var(--line3)" strokeWidth="1" strokeDasharray="2 3" pointerEvents="none" />
          )}
        </svg>
        <div style={styles.heatInfo} aria-live="polite">{T.statTip(fmtMonth(s.k), s.pages, s.days)}</div>
        {best.pages > 0 && <div style={{ ...styles.hint, marginTop: 8, marginBottom: 0 }}>{T.statBestMonth(fmtMonth(best.k), best.pages)} · {T.statTapHint}</div>}
      </div>
    </div>
  );
}
