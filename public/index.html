ibu bapa","For parents","\u0631\u064E\u0628\u0650\u0651 \u0627\u063A\u0652\u0641\u0650\u0631\u0652 \u0644\u0650\u064A \u0648\u064E\u0644\u0650\u0648\u064E\u0627\u0644\u0650\u062F\u064E\u064A\u064E\u0651 \u0648\u064E\u0627\u0631\u0652\u062D\u064E\u0645\u0652\u0647\u064F\u0645\u064E\u0627 \u0643\u064E\u0645\u064E\u0627 \u0631\u064E\u0628\u064E\u0651\u064A\u064E\u0627\u0646\u0650\u064A \u0635\u064E\u063A\u0650\u064A\u0631\u064B\u0627","Wahai Tuhanku, ampunilah aku dan kedua ibu bapaku, dan kasihanilah mereka sebagaimana mereka mendidikku semasa kecil.","My Lord, forgive me and my parents, and have mercy on them as they raised me when I was small."],["dunia","Kebaikan dunia & akhirat","Good in this life & the next","\u0631\u064E\u0628\u064E\u0651\u0646\u064E\u0627 \u0622\u062A\u0650\u0646\u064E\u0627 \u0641\u0650\u064A \u0627\u0644\u062F\u064F\u0651\u0646\u0652\u064A\u064E\u0627 \u062D\u064E\u0633\u064E\u0646\u064E\u0629\u064B \u0648\u064E\u0641\u0650\u064A \u0627\u0644\u0652\u0622\u062E\u0650\u0631\u064E\u0629\u0650 \u062D\u064E\u0633\u064E\u0646\u064E\u0629\u064B \u0648\u064E\u0642\u0650\u0646\u064E\u0627 \u0639\u064E\u0630\u064E\u0627\u0628\u064E \u0627\u0644\u0646\u064E\u0651\u0627\u0631\u0650","Wahai Tuhan kami, berilah kami kebaikan di dunia dan kebaikan di akhirat, dan peliharalah kami daripada azab neraka.","Our Lord, give us good in this world and good in the Hereafter, and protect us from the punishment of the Fire.","Al-Baqarah 2:201"],["ilmu","Tambah ilmu","Increase in knowledge","\u0631\u064E\u0628\u0650\u0651 \u0632\u0650\u062F\u0652\u0646\u0650\u064A \u0639\u0650\u0644\u0652\u0645\u064B\u0627","Wahai Tuhanku, tambahkanlah ilmuku.","My Lord, increase me in knowledge.","Ta-Ha 20:114"],["belajar","Sebelum belajar","Before studying","\u0631\u064E\u0628\u0650\u0651 \u0627\u0634\u0652\u0631\u064E\u062D\u0652 \u0644\u0650\u064A \u0635\u064E\u062F\u0652\u0631\u0650\u064A\u060C \u0648\u064E\u064A\u064E\u0633\u0650\u0651\u0631\u0652 \u0644\u0650\u064A \u0623\u064E\u0645\u0652\u0631\u0650\u064A\u060C \u0648\u064E\u0627\u062D\u0652\u0644\u064F\u0644\u0652 \u0639\u064F\u0642\u0652\u062F\u064E\u0629\u064B \u0645\u0650\u0646\u0652 \u0644\u0650\u0633\u064E\u0627\u0646\u0650\u064A\u060C \u064A\u064E\u0641\u0652\u0642\u064E\u0647\u064F\u0648\u0627 \u0642\u064E\u0648\u0652\u0644\u0650\u064A","Wahai Tuhanku, lapangkanlah dadaku, mudahkanlah urusanku, dan lepaskanlah kekakuan lidahku supaya mereka faham perkataanku.","My Lord, expand my chest for me, ease my task for me, and untie the knot from my tongue so they may understand my speech.","Ta-Ha 20:25\u201328"],["cermin","Melihat cermin","Looking in the mirror","\u0627\u0644\u0644\u064E\u0651\u0647\u064F\u0645\u064E\u0651 \u0623\u064E\u0646\u0652\u062A\u064E \u062D\u064E\u0633\u064E\u0651\u0646\u0652\u062A\u064E \u062E\u064E\u0644\u0652\u0642\u0650\u064A \u0641\u064E\u062D\u064E\u0633\u0650\u0651\u0646\u0652 \u062E\u064F\u0644\u064F\u0642\u0650\u064A","Ya Allah, Engkau telah memperelokkan kejadianku, maka perelokkanlah akhlakku.","O Allah, You have made my appearance beautiful, so make my character beautiful.","Riwayat Ahmad|Ahmad"],["wuduk","Sebelum wuduk","Before wudu'","\u0628\u0650\u0633\u0652\u0645\u0650 \u0627\u0644\u0644\u064E\u0651\u0647\u0650","Dengan nama Allah.","In the name of Allah.","Riwayat Abu Daud|Abu Dawud"],["lepaswuduk","Selepas wuduk","After wudu'","\u0623\u064E\u0634\u0652\u0647\u064E\u062F\u064F \u0623\u064E\u0646\u0652 \u0644\u064E\u0627 \u0625\u0650\u0644\u064E\u0670\u0647\u064E \u0625\u0650\u0644\u064E\u0651\u0627 \u0627\u0644\u0644\u064E\u0651\u0647\u064F \u0648\u064E\u062D\u0652\u062F\u064E\u0647\u064F \u0644\u064E\u0627 \u0634\u064E\u0631\u0650\u064A\u0643\u064E \u0644\u064E\u0647\u064F\u060C \u0648\u064E\u0623\u064E\u0634\u0652\u0647\u064E\u062F\u064F \u0623\u064E\u0646\u064E\u0651 \u0645\u064F\u062D\u064E\u0645\u064E\u0651\u062F\u064B\u0627 \u0639\u064E\u0628\u0652\u062F\u064F\u0647\u064F \u0648\u064E\u0631\u064E\u0633\u064F\u0648\u0644\u064F\u0647\u064F\u060C \u0627\u0644\u0644\u064E\u0651\u0647\u064F\u0645\u064E\u0651 \u0627\u062C\u0652\u0639\u064E\u0644\u0652\u0646\u0650\u064A \u0645\u0650\u0646\u064E \u0627\u0644\u062A\u064E\u0651\u0648\u064E\u0651\u0627\u0628\u0650\u064A\u0646\u064E \u0648\u064E\u0627\u062C\u0652\u0639\u064E\u0644\u0652\u0646\u0650\u064A \u0645\u0650\u0646\u064E \u0627\u0644\u0652\u0645\u064F\u062A\u064E\u0637\u064E\u0647\u0650\u0651\u0631\u0650\u064A\u0646\u064E","Aku bersaksi bahawa tiada Tuhan melainkan Allah, Yang Esa, tiada sekutu bagi-Nya, dan aku bersaksi bahawa Muhammad itu hamba dan pesuruh-Nya. Ya Allah, jadikanlah aku daripada golongan yang bertaubat dan jadikanlah aku daripada golongan yang menyucikan diri.","I bear witness that there is no god but Allah alone, with no partner, and that Muhammad is His servant and Messenger. O Allah, make me among those who repent and make me among those who purify themselves.","Riwayat Muslim & at-Tirmizi|Muslim & At-Tirmidhi"],["masjid","Masuk masjid","Entering the mosque","\u0627\u0644\u0644\u064E\u0651\u0647\u064F\u0645\u064E\u0651 \u0627\u0641\u0652\u062A\u064E\u062D\u0652 \u0644\u0650\u064A \u0623\u064E\u0628\u0652\u0648\u064E\u0627\u0628\u064E \u0631\u064E\u062D\u0652\u0645\u064E\u062A\u0650\u0643\u064E","Ya Allah, bukakanlah untukku pintu-pintu rahmat-Mu.","O Allah, open for me the doors of Your mercy.","Riwayat Muslim|Muslim"],["keluarmasjid","Keluar masjid","Leaving the mosque","\u0627\u0644\u0644\u064E\u0651\u0647\u064F\u0645\u064E\u0651 \u0625\u0650\u0646\u0650\u0651\u064A \u0623\u064E\u0633\u0652\u0623\u064E\u0644\u064F\u0643\u064E \u0645\u0650\u0646\u0652 \u0641\u064E\u0636\u0652\u0644\u0650\u0643\u064E","Ya Allah, aku memohon kurniaan-Mu.","O Allah, I ask You of Your bounty.","Riwayat Muslim|Muslim"],["azan","Selepas azan","After the adhan","\u0627\u0644\u0644\u064E\u0651\u0647\u064F\u0645\u064E\u0651 \u0631\u064E\u0628\u064E\u0651 \u0647\u064E\u0670\u0630\u0650\u0647\u0650 \u0627\u0644\u062F\u064E\u0651\u0639\u0652\u0648\u064E\u0629\u0650 \u0627\u0644\u062A\u064E\u0651\u0627\u0645\u064E\u0651\u0629\u0650\u060C \u0648\u064E\u0627\u0644\u0635\u064E\u0651\u0644\u064E\u0627\u0629\u0650 \u0627\u0644\u0652\u0642\u064E\u0627\u0626\u0650\u0645\u064E\u0629\u0650\u060C \u0622\u062A\u0650 \u0645\u064F\u062D\u064E\u0645\u064E\u0651\u062F\u064B\u0627 \u0627\u0644\u0652\u0648\u064E\u0633\u0650\u064A\u0644\u064E\u0629\u064E \u0648\u064E\u0627\u0644\u0652\u0641\u064E\u0636\u0650\u064A\u0644\u064E\u0629\u064E\u060C \u0648\u064E\u0627\u0628\u0652\u0639\u064E\u062B\u0652\u0647\u064F \u0645\u064E\u0642\u064E\u0627\u0645\u064B\u0627 \u0645\u064E\u062D\u0652\u0645\u064F\u0648\u062F\u064B\u0627 \u0627\u0644\u064E\u0651\u0630\u0650\u064A \u0648\u064E\u0639\u064E\u062F\u0652\u062A\u064E\u0647\u064F","Ya Allah, Tuhan bagi seruan yang sempurna ini dan solat yang akan didirikan, kurniakanlah kepada Muhammad al-wasilah dan kelebihan, dan bangkitkanlah baginda di tempat terpuji yang telah Engkau janjikan.","O Allah, Lord of this perfect call and the prayer about to be established, grant Muhammad al-wasilah and excellence, and raise him to the praised station You promised him.","Riwayat al-Bukhari|Al-Bukhari"],["berbuka","Berbuka puasa","Breaking the fast","\u0630\u064E\u0647\u064E\u0628\u064E \u0627\u0644\u0638\u064E\u0651\u0645\u064E\u0623\u064F \u0648\u064E\u0627\u0628\u0652\u062A\u064E\u0644\u064E\u0651\u062A\u0650 \u0627\u0644\u0652\u0639\u064F\u0631\u064F\u0648\u0642\u064F\u060C \u0648\u064E\u062B\u064E\u0628\u064E\u062A\u064E \u0627\u0644\u0652\u0623\u064E\u062C\u0652\u0631\u064F \u0625\u0650\u0646\u0652 \u0634\u064E\u0627\u0621\u064E \u0627\u0644\u0644\u064E\u0651\u0647\u064F","Telah hilang dahaga, urat-urat telah basah, dan telah tetap pahala, insya-Allah.","The thirst has gone, the veins are moistened, and the reward is certain, if Allah wills.","Riwayat Abu Daud|Abu Dawud"],["pagi","Pagi hari","In the morning","\u0623\u064E\u0635\u0652\u0628\u064E\u062D\u0652\u0646\u064E\u0627 \u0648\u064E\u0623\u064E\u0635\u0652\u0628\u064E\u062D\u064E \u0627\u0644\u0652\u0645\u064F\u0644\u0652\u0643\u064F \u0644\u0650\u0644\u064E\u0651\u0647\u0650\u060C \u0648\u064E\u0627\u0644\u0652\u062D\u064E\u0645\u0652\u062F\u064F \u0644\u0650\u0644\u064E\u0651\u0647\u0650\u060C \u0644\u064E\u0627 \u0625\u0650\u0644\u064E\u0670\u0647\u064E \u0625\u0650\u0644\u064E\u0651\u0627 \u0627\u0644\u0644\u064E\u0651\u0647\u064F \u0648\u064E\u062D\u0652\u062F\u064E\u0647\u064F \u0644\u064E\u0627 \u0634\u064E\u0631\u0650\u064A\u0643\u064E \u0644\u064E\u0647\u064F","Kami berada di waktu pagi dan kerajaan milik Allah. Segala puji bagi Allah. Tiada Tuhan melainkan Allah, Yang Esa, tiada sekutu bagi-Nya.","We have reached the morning and the dominion belongs to Allah. All praise is for Allah. There is no god but Allah alone, with no partner.","Riwayat Muslim|Muslim"],["petang","Petang hari","In the evening","\u0623\u064E\u0645\u0652\u0633\u064E\u064A\u0652\u0646\u064E\u0627 \u0648\u064E\u0623\u064E\u0645\u0652\u0633\u064E\u0649 \u0627\u0644\u0652\u0645\u064F\u0644\u0652\u0643\u064F \u0644\u0650\u0644\u064E\u0651\u0647\u0650\u060C \u0648\u064E\u0627\u0644\u0652\u062D\u064E\u0645\u0652\u062F\u064F \u0644\u0650\u0644\u064E\u0651\u0647\u0650\u060C \u0644\u064E\u0627 \u0625\u0650\u0644\u064E\u0670\u0647\u064E \u0625\u0650\u0644\u064E\u0651\u0627 \u0627\u0644\u0644\u064E\u0651\u0647\u064F \u0648\u064E\u062D\u0652\u062F\u064E\u0647\u064F \u0644\u064E\u0627 \u0634\u064E\u0631\u0650\u064A\u0643\u064E \u0644\u064E\u0647\u064F","Kami berada di waktu petang dan kerajaan milik Allah. Segala puji bagi Allah. Tiada Tuhan melainkan Allah, Yang Esa, tiada sekutu bagi-Nya.","We have reached the evening and the dominion belongs to Allah. All praise is for Allah. There is no god but Allah alone, with no partner.","Riwayat Muslim|Muslim"],["perlindungan","Perlindungan pagi & petang","Protection, morning & evening","\u0628\u0650\u0633\u0652\u0645\u0650 \u0627\u0644\u0644\u064E\u0651\u0647\u0650 \u0627\u0644\u064E\u0651\u0630\u0650\u064A \u0644\u064E\u0627 \u064A\u064E\u0636\u064F\u0631\u064F\u0651 \u0645\u064E\u0639\u064E \u0627\u0633\u0652\u0645\u0650\u0647\u0650 \u0634\u064E\u064A\u0652\u0621\u064C \u0641\u0650\u064A \u0627\u0644\u0652\u0623\u064E\u0631\u0652\u0636\u0650 \u0648\u064E\u0644\u064E\u0627 \u0641\u0650\u064A \u0627\u0644\u0633\u064E\u0651\u0645\u064E\u0627\u0621\u0650 \u0648\u064E\u0647\u064F\u0648\u064E \u0627\u0644\u0633\u064E\u0651\u0645\u0650\u064A\u0639\u064F \u0627\u0644\u0652\u0639\u064E\u0644\u0650\u064A\u0645\u064F","Dengan nama Allah yang tidak ada sesuatu pun di bumi dan di langit dapat memudaratkan bersama nama-Nya, dan Dia Maha Mendengar lagi Maha Mengetahui.","In the name of Allah, with whose name nothing on earth or in the heavens can cause harm, and He is the All-Hearing, the All-Knowing.","Riwayat Abu Daud & at-Tirmizi|Abu Dawud & At-Tirmidhi",3],["sayyidul","Penghulu istighfar","The master of seeking forgiveness","\u0627\u0644\u0644\u064E\u0651\u0647\u064F\u0645\u064E\u0651 \u0623\u064E\u0646\u0652\u062A\u064E \u0631\u064E\u0628\u0650\u0651\u064A \u0644\u064E\u0627 \u0625\u0650\u0644\u064E\u0670\u0647\u064E \u0625\u0650\u0644\u064E\u0651\u0627 \u0623\u064E\u0646\u0652\u062A\u064E\u060C \u062E\u064E\u0644\u064E\u0642\u0652\u062A\u064E\u0646\u0650\u064A \u0648\u064E\u0623\u064E\u0646\u064E\u0627 \u0639\u064E\u0628\u0652\u062F\u064F\u0643\u064E\u060C \u0648\u064E\u0623\u064E\u0646\u064E\u0627 \u0639\u064E\u0644\u064E\u0649\u0670 \u0639\u064E\u0647\u0652\u062F\u0650\u0643\u064E \u0648\u064E\u0648\u064E\u0639\u0652\u062F\u0650\u0643\u064E \u0645\u064E\u0627 \u0627\u0633\u0652\u062A\u064E\u0637\u064E\u0639\u0652\u062A\u064F\u060C \u0623\u064E\u0639\u064F\u0648\u0630\u064F \u0628\u0650\u0643\u064E \u0645\u0650\u0646\u0652 \u0634\u064E\u0631\u0650\u0651 \u0645\u064E\u0627 \u0635\u064E\u0646\u064E\u0639\u0652\u062A\u064F\u060C \u0623\u064E\u0628\u064F\u0648\u0621\u064F \u0644\u064E\u0643\u064E \u0628\u0650\u0646\u0650\u0639\u0652\u0645\u064E\u062A\u0650\u0643\u064E \u0639\u064E\u0644\u064E\u064A\u064E\u0651\u060C \u0648\u064E\u0623\u064E\u0628\u064F\u0648\u0621\u064F \u0628\u0650\u0630\u064E\u0646\u0652\u0628\u0650\u064A \u0641\u064E\u0627\u063A\u0652\u0641\u0650\u0631\u0652 \u0644\u0650\u064A\u060C \u0641\u064E\u0625\u0650\u0646\u064E\u0651\u0647\u064F \u0644\u064E\u0627 \u064A\u064E\u063A\u0652\u0641\u0650\u0631\u064F \u0627\u0644\u0630\u064F\u0651\u0646\u064F\u0648\u0628\u064E \u0625\u0650\u0644\u064E\u0651\u0627 \u0623\u064E\u0646\u0652\u062A\u064E","Ya Allah, Engkau Tuhanku, tiada Tuhan melainkan Engkau. Engkau menciptakan aku dan aku hamba-Mu. Aku berpegang pada janji-Mu sedaya upayaku. Aku berlindung dengan-Mu daripada keburukan perbuatanku. Aku mengakui nikmat-Mu kepadaku dan aku mengakui dosaku, maka ampunilah aku, kerana tiada yang mengampunkan dosa melainkan Engkau.","O Allah, You are my Lord; there is no god but You. You created me and I am Your servant, and I keep Your covenant and promise as best I can. I seek refuge in You from the evil of what I have done. I acknowledge Your favour upon me and I acknowledge my sin, so forgive me, for none forgives sins but You.","Riwayat al-Bukhari|Al-Bukhari"],["majlis","Penutup majlis","Closing a gathering","\u0633\u064F\u0628\u0652\u062D\u064E\u0627\u0646\u064E\u0643\u064E \u0627\u0644\u0644\u064E\u0651\u0647\u064F\u0645\u064E\u0651 \u0648\u064E\u0628\u0650\u062D\u064E\u0645\u0652\u062F\u0650\u0643\u064E\u060C \u0623\u064E\u0634\u0652\u0647\u064E\u062F\u064F \u0623\u064E\u0646\u0652 \u0644\u064E\u0627 \u0625\u0650\u0644\u064E\u0670\u0647\u064E \u0625\u0650\u0644\u064E\u0651\u0627 \u0623\u064E\u0646\u0652\u062A\u064E\u060C \u0623\u064E\u0633\u0652\u062A\u064E\u063A\u0652\u0641\u0650\u0631\u064F\u0643\u064E \u0648\u064E\u0623\u064E\u062A\u064F\u0648\u0628\u064F \u0625\u0650\u0644\u064E\u064A\u0652\u0643\u064E","Maha Suci Engkau ya Allah dan dengan memuji-Mu. Aku bersaksi bahawa tiada Tuhan melainkan Engkau. Aku memohon keampunan-Mu dan bertaubat kepada-Mu.","Glory be to You, O Allah, and with Your praise. I bear witness that there is no god but You. I seek Your forgiveness and repent to You.","Riwayat at-Tirmizi|At-Tirmidhi"],["musafir","Ketika bermusafir","When travelling","\u0627\u0644\u0644\u064E\u0651\u0647\u064F\u0645\u064E\u0651 \u0625\u0650\u0646\u064E\u0651\u0627 \u0646\u064E\u0633\u0652\u0623\u064E\u0644\u064F\u0643\u064E \u0641\u0650\u064A \u0633\u064E\u0641\u064E\u0631\u0650\u0646\u064E\u0627 \u0647\u064E\u0670\u0630\u064E\u0627 \u0627\u0644\u0652\u0628\u0650\u0631\u064E\u0651 \u0648\u064E\u0627\u0644\u062A\u064E\u0651\u0642\u0652\u0648\u064E\u0649\u0670\u060C \u0648\u064E\u0645\u0650\u0646\u064E \u0627\u0644\u0652\u0639\u064E\u0645\u064E\u0644\u0650 \u0645\u064E\u0627 \u062A\u064E\u0631\u0652\u0636\u064E\u0649\u0670\u060C \u0627\u0644\u0644\u064E\u0651\u0647\u064F\u0645\u064E\u0651 \u0647\u064E\u0648\u0650\u0651\u0646\u0652 \u0639\u064E\u0644\u064E\u064A\u0652\u0646\u064E\u0627 \u0633\u064E\u0641\u064E\u0631\u064E\u0646\u064E\u0627 \u0647\u064E\u0670\u0630\u064E\u0627 \u0648\u064E\u0627\u0637\u0652\u0648\u0650 \u0639\u064E\u0646\u064E\u0651\u0627 \u0628\u064F\u0639\u0652\u062F\u064E\u0647\u064F","Ya Allah, kami memohon dalam perjalanan kami ini kebaikan, takwa dan amalan yang Engkau redai. Ya Allah, mudahkanlah perjalanan kami ini dan dekatkanlah jaraknya bagi kami.","O Allah, we ask You on this journey of ours for righteousness, piety and deeds that please You. O Allah, make this journey easy for us and shorten its distance for us.","Riwayat Muslim|Muslim"],["guruh","Mendengar guruh","Hearing thunder","\u0633\u064F\u0628\u0652\u062D\u064E\u0627\u0646\u064E \u0627\u0644\u064E\u0651\u0630\u0650\u064A \u064A\u064F\u0633\u064E\u0628\u0650\u0651\u062D\u064F \u0627\u0644\u0631\u064E\u0651\u0639\u0652\u062F\u064F \u0628\u0650\u062D\u064E\u0645\u0652\u062F\u0650\u0647\u0650 \u0648\u064E\u0627\u0644\u0652\u0645\u064E\u0644\u064E\u0627\u0626\u0650\u0643\u064E\u0629\u064F \u0645\u0650\u0646\u0652 \u062E\u0650\u064A\u0641\u064E\u062A\u0650\u0647\u0650","Maha Suci Allah yang guruh bertasbih dengan memuji-Nya, demikian juga para malaikat kerana takut kepada-Nya.","Glory be to Him whom the thunder glorifies with His praise, as do the angels in awe of Him.","Riwayat Malik (al-Muwatta')|Malik (Al-Muwatta')"],["angin","Ketika angin kencang","In strong wind","\u0627\u0644\u0644\u064E\u0651\u0647\u064F\u0645\u064E\u0651 \u0625\u0650\u0646\u0650\u0651\u064A \u0623\u064E\u0633\u0652\u0623\u064E\u0644\u064F\u0643\u064E \u062E\u064E\u064A\u0652\u0631\u064E\u0647\u064E\u0627\u060C \u0648\u064E\u0623\u064E\u0639\u064F\u0648\u0630\u064F \u0628\u0650\u0643\u064E \u0645\u0650\u0646\u0652 \u0634\u064E\u0631\u0650\u0651\u0647\u064E\u0627","Ya Allah, aku memohon kebaikannya dan aku berlindung dengan-Mu daripada keburukannya.","O Allah, I ask You for its good and I seek refuge in You from its harm.","Riwayat Abu Daud|Abu Dawud"],["lepashujan","Selepas hujan","After rain","\u0645\u064F\u0637\u0650\u0631\u0652\u0646\u064E\u0627 \u0628\u0650\u0641\u064E\u0636\u0652\u0644\u0650 \u0627\u0644\u0644\u064E\u0651\u0647\u0650 \u0648\u064E\u0631\u064E\u062D\u0652\u0645\u064E\u062A\u0650\u0647\u0650","Kami diberi hujan dengan kurnia dan rahmat Allah.","We have been given rain by the grace and mercy of Allah.","Riwayat al-Bukhari & Muslim|Al-Bukhari & Muslim"],["anakbulan","Melihat anak bulan","Seeing the new moon","\u0627\u0644\u0644\u064E\u0651\u0647\u064F\u0645\u064E\u0651 \u0623\u064E\u0647\u0650\u0644\u064E\u0651\u0647\u064F \u0639\u064E\u0644\u064E\u064A\u0652\u0646\u064E\u0627 \u0628\u0650\u0627\u0644\u0652\u064A\u064F\u0645\u0652\u0646\u0650 \u0648\u064E\u0627\u0644\u0652\u0625\u0650\u064A\u0645\u064E\u0627\u0646\u0650\u060C \u0648\u064E\u0627\u0644\u0633\u064E\u0651\u0644\u064E\u0627\u0645\u064E\u0629\u0650 \u0648\u064E\u0627\u0644\u0652\u0625\u0650\u0633\u0652\u0644\u064E\u0627\u0645\u0650\u060C \u0631\u064E\u0628\u0650\u0651\u064A \u0648\u064E\u0631\u064E\u0628\u064F\u0651\u0643\u064E \u0627\u0644\u0644\u064E\u0651\u0647\u064F","Ya Allah, terbitkanlah anak bulan ini kepada kami dengan keberkatan dan iman, keselamatan dan Islam. Tuhanku dan Tuhanmu ialah Allah.","O Allah, bring this new moon over us with blessing and faith, safety and Islam. My Lord and your Lord is Allah.","Riwayat at-Tirmizi|At-Tirmidhi"],["musibah","Ditimpa musibah","When afflicted","\u0625\u0650\u0646\u064E\u0651\u0627 \u0644\u0650\u0644\u064E\u0651\u0647\u0650 \u0648\u064E\u0625\u0650\u0646\u064E\u0651\u0627 \u0625\u0650\u0644\u064E\u064A\u0652\u0647\u0650 \u0631\u064E\u0627\u062C\u0650\u0639\u064F\u0648\u0646\u064E\u060C \u0627\u0644\u0644\u064E\u0651\u0647\u064F\u0645\u064E\u0651 \u0623\u0652\u062C\u064F\u0631\u0652\u0646\u0650\u064A \u0641\u0650\u064A \u0645\u064F\u0635\u0650\u064A\u0628\u064E\u062A\u0650\u064A \u0648\u064E\u0623\u064E\u062E\u0652\u0644\u0650\u0641\u0652 \u0644\u0650\u064A \u062E\u064E\u064A\u0652\u0631\u064B\u0627 \u0645\u0650\u0646\u0652\u0647\u064E\u0627","Sesungguhnya kami milik Allah dan kepada-Nya kami kembali. Ya Allah, berilah aku pahala dalam musibahku ini dan gantikanlah untukku yang lebih baik daripadanya.","We belong to Allah and to Him we return. O Allah, reward me in my affliction and replace it for me with something better.","Riwayat Muslim|Muslim"],["gelisah","Ketika gelisah & dukacita","When anxious or sad","\u0627\u0644\u0644\u064E\u0651\u0647\u064F\u0645\u064E\u0651 \u0625\u0650\u0646\u0650\u0651\u064A \u0623\u064E\u0639\u064F\u0648\u0630\u064F \u0628\u0650\u0643\u064E \u0645\u0650\u0646\u064E \u0627\u0644\u0652\u0647\u064E\u0645\u0650\u0651 \u0648\u064E\u0627\u0644\u0652\u062D\u064E\u0632\u064E\u0646\u0650\u060C \u0648\u064E\u0627\u0644\u0652\u0639\u064E\u062C\u0652\u0632\u0650 \u0648\u064E\u0627\u0644\u0652\u0643\u064E\u0633\u064E\u0644\u0650\u060C \u0648\u064E\u0627\u0644\u0652\u0628\u064F\u062E\u0652\u0644\u0650 \u0648\u064E\u0627\u0644\u0652\u062C\u064F\u0628\u0652\u0646\u0650\u060C \u0648\u064E\u0636\u064E\u0644\u064E\u0639\u0650 \u0627\u0644\u062F\u064E\u0651\u064A\u0652\u0646\u0650 \u0648\u064E\u063A\u064E\u0644\u064E\u0628\u064E\u0629\u0650 \u0627\u0644\u0631\u0650\u0651\u062C\u064E\u0627\u0644\u0650","Ya Allah, aku berlindung dengan-Mu daripada rasa gelisah dan sedih, lemah dan malas, bakhil dan pengecut, bebanan hutang dan dikuasai orang lain.","O Allah, I seek refuge in You from worry and grief, weakness and laziness, miserliness and cowardice, the burden of debt and being overpowered by others.","Riwayat al-Bukhari|Al-Bukhari"],["yunus","Doa Nabi Yunus (ketika susah)","Prophet Yunus' dua (in hardship)","\u0644\u064E\u0627 \u0625\u0650\u0644\u064E\u0670\u0647\u064E \u0625\u0650\u0644\u064E\u0651\u0627 \u0623\u064E\u0646\u0652\u062A\u064E \u0633\u064F\u0628\u0652\u062D\u064E\u0627\u0646\u064E\u0643\u064E \u0625\u0650\u0646\u0650\u0651\u064A \u0643\u064F\u0646\u0652\u062A\u064F \u0645\u0650\u0646\u064E \u0627\u0644\u0638\u064E\u0651\u0627\u0644\u0650\u0645\u0650\u064A\u0646\u064E","Tiada Tuhan melainkan Engkau, Maha Suci Engkau, sesungguhnya aku termasuk orang yang zalim.","There is no god but You, glory be to You; I have indeed been among the wrongdoers.","Al-Anbiya' 21:87"],["hasbunallah","Bertawakal kepada Allah","Relying on Allah","\u062D\u064E\u0633\u0652\u0628\u064F\u0646\u064E\u0627 \u0627\u0644\u0644\u064E\u0651\u0647\u064F \u0648\u064E\u0646\u0650\u0639\u0652\u0645\u064E \u0627\u0644\u0652\u0648\u064E\u0643\u0650\u064A\u0644\u064F","Cukuplah Allah bagi kami, dan Dia sebaik-baik pelindung.","Allah is sufficient for us, and He is the best disposer of affairs.","Ali 'Imran 3:173"],["tetaphati","Tetapkan hati","Keep my heart firm","\u064A\u064E\u0627 \u0645\u064F\u0642\u064E\u0644\u0650\u0651\u0628\u064E \u0627\u0644\u0652\u0642\u064F\u0644\u064F\u0648\u0628\u0650 \u062B\u064E\u0628\u0650\u0651\u062A\u0652 \u0642\u064E\u0644\u0652\u0628\u0650\u064A \u0639\u064E\u0644\u064E\u0649\u0670 \u062F\u0650\u064A\u0646\u0650\u0643\u064E","Wahai Tuhan yang membolak-balikkan hati, tetapkanlah hatiku di atas agama-Mu.","O Turner of hearts, keep my heart firm upon Your religion.","Riwayat at-Tirmizi|At-Tirmidhi"],["marah","Ketika marah","When angry","\u0623\u064E\u0639\u064F\u0648\u0630\u064F \u0628\u0650\u0627\u0644\u0644\u064E\u0651\u0647\u0650 \u0645\u0650\u0646\u064E \u0627\u0644\u0634\u064E\u0651\u064A\u0652\u0637\u064E\u0627\u0646\u0650 \u0627\u0644\u0631\u064E\u0651\u062C\u0650\u064A\u0645\u0650","Aku berlindung dengan Allah daripada syaitan yang direjam.","I seek refuge in Allah from Satan, the accursed.","Riwayat al-Bukhari & Muslim|Al-Bukhari & Muslim"],["sakit","Mendoakan orang sakit","Praying for the sick","\u0627\u0644\u0644\u064E\u0651\u0647\u064F\u0645\u064E\u0651 \u0631\u064E\u0628\u064E\u0651 \u0627\u0644\u0646\u064E\u0651\u0627\u0633\u0650\u060C \u0623\u064E\u0630\u0652\u0647\u0650\u0628\u0650 \u0627\u0644\u0652\u0628\u064E\u0623\u0652\u0633\u064E\u060C \u0627\u0634\u0652\u0641\u0650 \u0623\u064E\u0646\u0652\u062A\u064E \u0627\u0644\u0634\u064E\u0651\u0627\u0641\u0650\u064A\u060C \u0644\u064E\u0627 \u0634\u0650\u0641\u064E\u0627\u0621\u064E \u0625\u0650\u0644\u064E\u0651\u0627 \u0634\u0650\u0641\u064E\u0627\u0624\u064F\u0643\u064E\u060C \u0634\u0650\u0641\u064E\u0627\u0621\u064B \u0644\u064E\u0627 \u064A\u064F\u063A\u064E\u0627\u062F\u0650\u0631\u064F \u0633\u064E\u0642\u064E\u0645\u064B\u0627","Ya Allah, Tuhan sekalian manusia, hilangkanlah penyakit ini. Sembuhkanlah, Engkaulah Yang Maha Menyembuhkan. Tiada kesembuhan melainkan kesembuhan daripada-Mu, kesembuhan yang tidak meninggalkan sebarang penyakit.","O Allah, Lord of mankind, remove the illness and heal, for You are the Healer. There is no healing but Your healing, a healing that leaves no illness behind.","Riwayat al-Bukhari & Muslim|Al-Bukhari & Muslim"],["ziarah","Menziarahi orang sakit","Visiting the sick","\u0644\u064E\u0627 \u0628\u064E\u0623\u0652\u0633\u064E\u060C \u0637\u064E\u0647\u064F\u0648\u0631\u064C \u0625\u0650\u0646\u0652 \u0634\u064E\u0627\u0621\u064E \u0627\u0644\u0644\u064E\u0651\u0647\u064F","Tidak mengapa, (sakit ini) menyucikan (dosa), insya-Allah.","No harm; it is a purification, if Allah wills.","Riwayat al-Bukhari|Al-Bukhari"],["bersin","Bersin & menjawabnya","Sneezing & replying","\u0627\u0644\u0652\u062D\u064E\u0645\u0652\u062F\u064F \u0644\u0650\u0644\u064E\u0651\u0647\u0650 \u30FB \u064A\u064E\u0631\u0652\u062D\u064E\u0645\u064F\u0643\u064E \u0627\u0644\u0644\u064E\u0651\u0647\u064F \u30FB \u064A\u064E\u0647\u0652\u062F\u0650\u064A\u0643\u064F\u0645\u064F \u0627\u0644\u0644\u064E\u0651\u0647\u064F \u0648\u064E\u064A\u064F\u0635\u0652\u0644\u0650\u062D\u064F \u0628\u064E\u0627\u0644\u064E\u0643\u064F\u0645\u0652","Yang bersin: Segala puji bagi Allah. Yang mendengar: Semoga Allah merahmatimu. Yang bersin membalas: Semoga Allah memberi kamu petunjuk dan memperbaiki keadaanmu.","The sneezer: All praise is for Allah. The listener: May Allah have mercy on you. The sneezer replies: May Allah guide you and set your affairs right.","Riwayat al-Bukhari|Al-Bukhari"],["tuanrumah","Untuk tuan rumah (selepas jamuan)","For the host (after a meal)","\u0627\u0644\u0644\u064E\u0651\u0647\u064F\u0645\u064E\u0651 \u0628\u064E\u0627\u0631\u0650\u0643\u0652 \u0644\u064E\u0647\u064F\u0645\u0652 \u0641\u0650\u064A\u0645\u064E\u0627 \u0631\u064E\u0632\u064E\u0642\u0652\u062A\u064E\u0647\u064F\u0645\u0652\u060C \u0648\u064E\u0627\u063A\u0652\u0641\u0650\u0631\u0652 \u0644\u064E\u0647\u064F\u0645\u0652 \u0648\u064E\u0627\u0631\u0652\u062D\u064E\u0645\u0652\u0647\u064F\u0645\u0652","Ya Allah, berkatilah rezeki yang Engkau kurniakan kepada mereka, ampunilah mereka dan rahmatilah mereka.","O Allah, bless them in what You have provided them, forgive them and have mercy on them.","Riwayat Muslim|Muslim"],["pengantin","Ucapan kepada pengantin","For newlyweds","\u0628\u064E\u0627\u0631\u064E\u0643\u064E \u0627\u0644\u0644\u064E\u0651\u0647\u064F \u0644\u064E\u0643\u064E\u060C \u0648\u064E\u0628\u064E\u0627\u0631\u064E\u0643\u064E \u0639\u064E\u0644\u064E\u064A\u0652\u0643\u064E\u060C \u0648\u064E\u062C\u064E\u0645\u064E\u0639\u064E \u0628\u064E\u064A\u0652\u0646\u064E\u0643\u064F\u0645\u064E\u0627 \u0641\u0650\u064A \u062E\u064E\u064A\u0652\u0631\u064D","Semoga Allah memberkatimu, melimpahkan keberkatan ke atasmu, dan menghimpunkan kamu berdua dalam kebaikan.","May Allah bless you, shower blessings upon you, and bring you both together in goodness.","Riwayat Abu Daud & at-Tirmizi|Abu Dawud & At-Tirmidhi"],["zuriat","Untuk pasangan & zuriat","For spouse & children","\u0631\u064E\u0628\u064E\u0651\u0646\u064E\u0627 \u0647\u064E\u0628\u0652 \u0644\u064E\u0646\u064E\u0627 \u0645\u0650\u0646\u0652 \u0623\u064E\u0632\u0652\u0648\u064E\u0627\u062C\u0650\u0646\u064E\u0627 \u0648\u064E\u0630\u064F\u0631\u0650\u0651\u064A\u064E\u0651\u0627\u062A\u0650\u0646\u064E\u0627 \u0642\u064F\u0631\u064E\u0651\u0629\u064E \u0623\u064E\u0639\u0652\u064A\u064F\u0646\u064D \u0648\u064E\u0627\u062C\u0652\u0639\u064E\u0644\u0652\u0646\u064E\u0627 \u0644\u0650\u0644\u0652\u0645\u064F\u062A\u064E\u0651\u0642\u0650\u064A\u0646\u064E \u0625\u0650\u0645\u064E\u0627\u0645\u064B\u0627","Wahai Tuhan kami, kurniakanlah kepada kami daripada pasangan dan zuriat kami penyejuk mata, dan jadikanlah kami ikutan bagi orang bertakwa.","Our Lord, grant us from our spouses and offspring comfort to our eyes, and make us leaders of the righteous.","Al-Furqan 25:74"],["quran","Sebelum membaca Al-Quran","Before reciting the Quran","\u0623\u064E\u0639\u064F\u0648\u0630\u064F \u0628\u0650\u0627\u0644\u0644\u064E\u0651\u0647\u0650 \u0645\u0650\u0646\u064E \u0627\u0644\u0634\u064E\u0651\u064A\u0652\u0637\u064E\u0627\u0646\u0650 \u0627\u0644\u0631\u064E\u0651\u062C\u0650\u064A\u0645\u0650","Aku berlindung dengan Allah daripada syaitan yang direjam.","I seek refuge in Allah from Satan, the accursed."]],solat:[["takbir","Takbiratul ihram","Opening takbir","\u0627\u0644\u0644\u064E\u0651\u0647\u064F \u0623\u064E\u0643\u0652\u0628\u064E\u0631\u064F","Allah Maha Besar.","Allah is the Greatest."],["iftitah","Doa iftitah","Opening supplication","\u0627\u0644\u0644\u064E\u0651\u0647\u064F \u0623\u064E\u0643\u0652\u0628\u064E\u0631\u064F \u0643\u064E\u0628\u0650\u064A\u0631\u064B\u0627\u060C \u0648\u064E\u0627\u0644\u0652\u062D\u064E\u0645\u0652\u062F\u064F \u0644\u0650\u0644\u064E\u0651\u0647\u0650 \u0643\u064E\u062B\u0650\u064A\u0631\u064B\u0627\u060C \u0648\u064E\u0633\u064F\u0628\u0652\u062D\u064E\u0627\u0646\u064E \u0627\u0644\u0644\u064E\u0651\u0647\u0650 \u0628\u064F\u0643\u0652\u0631\u064E\u0629\u064B \u0648\u064E\u0623\u064E\u0635\u0650\u064A\u0644\u064B\u0627. \u0648\u064E\u062C\u064E\u0651\u0647\u0652\u062A\u064F \u0648\u064E\u062C\u0652\u0647\u0650\u064A\u064E \u0644\u0650\u0644\u064E\u0651\u0630\u0650\u064A \u0641\u064E\u0637\u064E\u0631\u064E \u0627\u0644\u0633\u064E\u0651\u0645\u064E\u0627\u0648\u064E\u0627\u062A\u0650 \u0648\u064E\u0627\u0644\u0652\u0623\u064E\u0631\u0652\u0636\u064E \u062D\u064E\u0646\u0650\u064A\u0641\u064B\u0627 \u0645\u064F\u0633\u0652\u0644\u0650\u0645\u064B\u0627 \u0648\u064E\u0645\u064E\u0627 \u0623\u064E\u0646\u064E\u0627 \u0645\u0650\u0646\u064E \u0627\u0644\u0652\u0645\u064F\u0634\u0652\u0631\u0650\u0643\u0650\u064A\u0646\u064E. \u0625\u0650\u0646\u064E\u0651 \u0635\u064E\u0644\u064E\u0627\u062A\u0650\u064A \u0648\u064E\u0646\u064F\u0633\u064F\u0643\u0650\u064A \u0648\u064E\u0645\u064E\u062D\u0652\u064A\u064E\u0627\u064A\u064E \u0648\u064E\u0645\u064E\u0645\u064E\u0627\u062A\u0650\u064A \u0644\u0650\u0644\u064E\u0651\u0647\u0650 \u0631\u064E\u0628\u0650\u0651 \u0627\u0644\u0652\u0639\u064E\u0627\u0644\u064E\u0645\u0650\u064A\u0646\u064E\u060C \u0644\u064E\u0627 \u0634\u064E\u0631\u0650\u064A\u0643\u064E \u0644\u064E\u0647\u064F\u060C \u0648\u064E\u0628\u0650\u0630\u064E\u0670\u0644\u0650\u0643\u064E \u0623\u064F\u0645\u0650\u0631\u0652\u062A\u064F \u0648\u064E\u0623\u064E\u0646\u064E\u0627 \u0645\u0650\u0646\u064E \u0627\u0644\u0652\u0645\u064F\u0633\u0652\u0644\u0650\u0645\u0650\u064A\u0646\u064E","Allah Maha Besar dengan sebesar-besarnya, segala puji bagi Allah sebanyak-banyaknya, dan Maha Suci Allah pagi dan petang. Aku hadapkan wajahku kepada Tuhan yang mencipta langit dan bumi dalam keadaan lurus dan berserah diri, dan aku bukanlah daripada golongan musyrikin. Sesungguhnya solatku, ibadahku, hidupku dan matiku hanya untuk Allah Tuhan sekalian alam. Tiada sekutu bagi-Nya; dengan itu aku diperintahkan, dan aku daripada golongan Muslimin.","Allah is the Greatest, truly great; much praise is for Allah; glory be to Allah morning and evening. I have turned my face to the One who created the heavens and the earth, upright and submitting, and I am not of those who associate others with Him. My prayer, my worship, my living and my dying are for Allah, Lord of the worlds. He has no partner; this I have been commanded, and I am of the Muslims."],["rukuk","Rukuk","Bowing (ruku')","\u0633\u064F\u0628\u0652\u062D\u064E\u0627\u0646\u064E \u0631\u064E\u0628\u0650\u0651\u064A\u064E \u0627\u0644\u0652\u0639\u064E\u0638\u0650\u064A\u0645\u0650 \u0648\u064E\u0628\u0650\u062D\u064E\u0645\u0652\u062F\u0650\u0647\u0650","Maha Suci Tuhanku Yang Maha Agung dan dengan memuji-Nya.","Glory be to my Lord, the Most Great, and with His praise.","",3],["iktidal","Iktidal","Rising from bowing","\u0633\u064E\u0645\u0650\u0639\u064E \u0627\u0644\u0644\u064E\u0651\u0647\u064F \u0644\u0650\u0645\u064E\u0646\u0652 \u062D\u064E\u0645\u0650\u062F\u064E\u0647\u064F\u060C \u0631\u064E\u0628\u064E\u0651\u0646\u064E\u0627 \u0644\u064E\u0643\u064E \u0627\u0644\u0652\u062D\u064E\u0645\u0652\u062F\u064F \u0645\u0650\u0644\u0652\u0621\u064E \u0627\u0644\u0633\u064E\u0651\u0645\u064E\u0627\u0648\u064E\u0627\u062A\u0650 \u0648\u064E\u0645\u0650\u0644\u0652\u0621\u064E \u0627\u0644\u0652\u0623\u064E\u0631\u0652\u0636\u0650 \u0648\u064E\u0645\u0650\u0644\u0652\u0621\u064E \u0645\u064E\u0627 \u0634\u0650\u0626\u0652\u062A\u064E \u0645\u0650\u0646\u0652 \u0634\u064E\u064A\u0652\u0621\u064D \u0628\u064E\u0639\u0652\u062F\u064F","Allah mendengar orang yang memuji-Nya. Wahai Tuhan kami, bagi-Mu segala pujian sepenuh langit, sepenuh bumi dan sepenuh apa jua yang Engkau kehendaki selepas itu.","Allah hears the one who praises Him. Our Lord, to You is all praise, filling the heavens, filling the earth, and filling whatever else You will."],["sujud","Sujud","Prostration (sujud)","\u0633\u064F\u0628\u0652\u062D\u064E\u0627\u0646\u064E \u0631\u064E\u0628\u0650\u0651\u064A\u064E \u0627\u0644\u0652\u0623\u064E\u0639\u0652\u0644\u064E\u0649\u0670 \u0648\u064E\u0628\u0650\u062D\u064E\u0645\u0652\u062F\u0650\u0647\u0650","Maha Suci Tuhanku Yang Maha Tinggi dan dengan memuji-Nya.","Glory be to my Lord, the Most High, and with His praise.","",3],["duduk","Duduk antara dua sujud","Sitting between the two prostrations","\u0631\u064E\u0628\u0650\u0651 \u0627\u063A\u0652\u0641\u0650\u0631\u0652 \u0644\u0650\u064A \u0648\u064E\u0627\u0631\u0652\u062D\u064E\u0645\u0652\u0646\u0650\u064A \u0648\u064E\u0627\u062C\u0652\u0628\u064F\u0631\u0652\u0646\u0650\u064A \u0648\u064E\u0627\u0631\u0652\u0641\u064E\u0639\u0652\u0646\u0650\u064A \u0648\u064E\u0627\u0631\u0652\u0632\u064F\u0642\u0652\u0646\u0650\u064A \u0648\u064E\u0627\u0647\u0652\u062F\u0650\u0646\u0650\u064A \u0648\u064E\u0639\u064E\u0627\u0641\u0650\u0646\u0650\u064A \u0648\u064E\u0627\u0639\u0652\u0641\u064F \u0639\u064E\u0646\u0650\u0651\u064A","Wahai Tuhanku, ampunilah aku, rahmatilah aku, cukupkanlah kekuranganku, angkatlah darjatku, berilah aku rezeki, berilah aku petunjuk, sihatkanlah aku dan maafkanlah aku.","My Lord, forgive me, have mercy on me, mend me, raise me, provide for me, guide me, grant me well-being and pardon me."],["tahiyat","Tahiyat","Tashahhud","\u0627\u0644\u062A\u064E\u0651\u062D\u0650\u064A\u064E\u0651\u0627\u062A\u064F \u0627\u0644\u0652\u0645\u064F\u0628\u064E\u0627\u0631\u064E\u0643\u064E\u0627\u062A\u064F \u0627\u0644\u0635\u064E\u0651\u0644\u064E\u0648\u064E\u0627\u062A\u064F \u0627\u0644\u0637\u064E\u0651\u064A\u0650\u0651\u0628\u064E\u0627\u062A\u064F \u0644\u0650\u0644\u064E\u0651\u0647\u0650\u060C \u0627\u0644\u0633\u064E\u0651\u0644\u064E\u0627\u0645\u064F \u0639\u064E\u0644\u064E\u064A\u0652\u0643\u064E \u0623\u064E\u064A\u064F\u0651\u0647\u064E\u0627 \u0627\u0644\u0646\u064E\u0651\u0628\u0650\u064A\u064F\u0651 \u0648\u064E\u0631\u064E\u062D\u0652\u0645\u064E\u0629\u064F \u0627\u0644\u0644\u064E\u0651\u0647\u0650 \u0648\u064E\u0628\u064E\u0631\u064E\u0643\u064E\u0627\u062A\u064F\u0647\u064F\u060C \u0627\u0644\u0633\u064E\u0651\u0644\u064E\u0627\u0645\u064F \u0639\u064E\u0644\u064E\u064A\u0652\u0646\u064E\u0627 \u0648\u064E\u0639\u064E\u0644\u064E\u0649\u0670 \u0639\u0650\u0628\u064E\u0627\u062F\u0650 \u0627\u0644\u0644\u064E\u0651\u0647\u0650 \u0627\u0644\u0635\u064E\u0651\u0627\u0644\u0650\u062D\u0650\u064A\u0646\u064E\u060C \u0623\u064E\u0634\u0652\u0647\u064E\u062F\u064F \u0623\u064E\u0646\u0652 \u0644\u064E\u0627 \u0625\u0650\u0644\u064E\u0670\u0647\u064E \u0625\u0650\u0644\u064E\u0651\u0627 \u0627\u0644\u0644\u064E\u0651\u0647\u064F\u060C \u0648\u064E\u0623\u064E\u0634\u0652\u0647\u064E\u062F\u064F \u0623\u064E\u0646\u064E\u0651 \u0645\u064F\u062D\u064E\u0645\u064E\u0651\u062F\u064B\u0627 \u0631\u064E\u0633\u064F\u0648\u0644\u064F \u0627\u0644\u0644\u064E\u0651\u0647\u0650","Segala penghormatan, keberkatan, selawat dan kebaikan adalah bagi Allah. Salam sejahtera ke atasmu wahai Nabi, serta rahmat Allah dan keberkatan-Nya. Salam sejahtera ke atas kami dan ke atas hamba-hamba Allah yang soleh. Aku bersaksi bahawa tiada Tuhan melainkan Allah, dan aku bersaksi bahawa Muhammad itu pesuruh Allah.","All greetings, blessings, prayers and good things are for Allah. Peace be upon you, O Prophet, and the mercy of Allah and His blessings. Peace be upon us and upon the righteous servants of Allah. I bear witness that there is no god but Allah, and I bear witness that Muhammad is the Messenger of Allah."],["selawat","Selawat (tahiyat akhir)","Salawat (final sitting)","\u0627\u0644\u0644\u064E\u0651\u0647\u064F\u0645\u064E\u0651 \u0635\u064E\u0644\u0650\u0651 \u0639\u064E\u0644\u064E\u0649\u0670 \u0645\u064F\u062D\u064E\u0645\u064E\u0651\u062F\u064D \u0648\u064E\u0639\u064E\u0644\u064E\u0649\u0670 \u0622\u0644\u0650 \u0645\u064F\u062D\u064E\u0645\u064E\u0651\u062F\u064D\u060C \u0643\u064E\u0645\u064E\u0627 \u0635\u064E\u0644\u064E\u0651\u064A\u0652\u062A\u064E \u0639\u064E\u0644\u064E\u0649\u0670 \u0625\u0650\u0628\u0652\u0631\u064E\u0627\u0647\u0650\u064A\u0645\u064E \u0648\u064E\u0639\u064E\u0644\u064E\u0649\u0670 \u0622\u0644\u0650 \u0625\u0650\u0628\u0652\u0631\u064E\u0627\u0647\u0650\u064A\u0645\u064E\u060C \u0648\u064E\u0628\u064E\u0627\u0631\u0650\u0643\u0652 \u0639\u064E\u0644\u064E\u0649\u0670 \u0645\u064F\u062D\u064E\u0645\u064E\u0651\u062F\u064D \u0648\u064E\u0639\u064E\u0644\u064E\u0649\u0670 \u0622\u0644\u0650 \u0645\u064F\u062D\u064E\u0645\u064E\u0651\u062F\u064D\u060C \u0643\u064E\u0645\u064E\u0627 \u0628\u064E\u0627\u0631\u064E\u0643\u0652\u062A\u064E \u0639\u064E\u0644\u064E\u0649\u0670 \u0625\u0650\u0628\u0652\u0631\u064E\u0627\u0647\u0650\u064A\u0645\u064E \u0648\u064E\u0639\u064E\u0644\u064E\u0649\u0670 \u0622\u0644\u0650 \u0625\u0650\u0628\u0652\u0631\u064E\u0627\u0647\u0650\u064A\u0645\u064E\u060C \u0641\u0650\u064A \u0627\u0644\u0652\u0639\u064E\u0627\u0644\u064E\u0645\u0650\u064A\u0646\u064E \u0625\u0650\u0646\u064E\u0651\u0643\u064E \u062D\u064E\u0645\u0650\u064A\u062F\u064C \u0645\u064E\u062C\u0650\u064A\u062F\u064C","Ya Allah, limpahkanlah selawat ke atas Muhammad dan keluarga Muhammad, sebagaimana Engkau limpahkan ke atas Ibrahim dan keluarga Ibrahim. Berkatilah Muhammad dan keluarga Muhammad, sebagaimana Engkau berkati Ibrahim dan keluarga Ibrahim. Di seluruh alam, sesungguhnya Engkau Maha Terpuji lagi Maha Mulia.","O Allah, send prayers upon Muhammad and the family of Muhammad as You sent prayers upon Ibrahim and the family of Ibrahim, and bless Muhammad and the family of Muhammad as You blessed Ibrahim and the family of Ibrahim. In all the worlds, You are Praiseworthy and Glorious."],["salam","Salam","Closing salam","\u0627\u0644\u0633\u064E\u0651\u0644\u064E\u0627\u0645\u064F \u0639\u064E\u0644\u064E\u064A\u0652\u0643\u064F\u0645\u0652 \u0648\u064E\u0631\u064E\u062D\u0652\u0645\u064E\u0629\u064F \u0627\u0644\u0644\u064E\u0651\u0647\u0650","Salam sejahtera ke atas kamu dan rahmat Allah.","Peace be upon you and the mercy of Allah.","",2]],selepas:[["istighfar","Istighfar","Seeking forgiveness","\u0623\u064E\u0633\u0652\u062A\u064E\u063A\u0652\u0641\u0650\u0631\u064F \u0627\u0644\u0644\u064E\u0651\u0647\u064E","Aku memohon keampunan Allah.","I seek Allah's forgiveness.","",3],["assalam","Allahumma antas-salam","Allahumma antas-salam","\u0627\u0644\u0644\u064E\u0651\u0647\u064F\u0645\u064E\u0651 \u0623\u064E\u0646\u0652\u062A\u064E \u0627\u0644\u0633\u064E\u0651\u0644\u064E\u0627\u0645\u064F \u0648\u064E\u0645\u0650\u0646\u0652\u0643\u064E \u0627\u0644\u0633\u064E\u0651\u0644\u064E\u0627\u0645\u064F\u060C \u062A\u064E\u0628\u064E\u0627\u0631\u064E\u0643\u0652\u062A\u064E \u064A\u064E\u0627 \u0630\u064E\u0627 \u0627\u0644\u0652\u062C\u064E\u0644\u064E\u0627\u0644\u0650 \u0648\u064E\u0627\u0644\u0652\u0625\u0650\u0643\u0652\u0631\u064E\u0627\u0645\u0650","Ya Allah, Engkaulah As-Salam dan daripada-Mu kesejahteraan. Maha Berkat Engkau wahai Tuhan yang memiliki keagungan dan kemuliaan.","O Allah, You are Peace and from You is peace. Blessed are You, O Owner of majesty and honour."],["lamani","Tiada penghalang pemberian-Mu","None can withhold what You give","\u0644\u064E\u0627 \u0625\u0650\u0644\u064E\u0670\u0647\u064E \u0625\u0650\u0644\u064E\u0651\u0627 \u0627\u0644\u0644\u064E\u0651\u0647\u064F \u0648\u064E\u062D\u0652\u062F\u064E\u0647\u064F \u0644\u064E\u0627 \u0634\u064E\u0631\u0650\u064A\u0643\u064E \u0644\u064E\u0647\u064F\u060C \u0644\u064E\u0647\u064F \u0627\u0644\u0652\u0645\u064F\u0644\u0652\u0643\u064F \u0648\u064E\u0644\u064E\u0647\u064F \u0627\u0644\u0652\u062D\u064E\u0645\u0652\u062F\u064F \u0648\u064E\u0647\u064F\u0648\u064E \u0639\u064E\u0644\u064E\u0649\u0670 \u0643\u064F\u0644\u0650\u0651 \u0634\u064E\u064A\u0652\u0621\u064D \u0642\u064E\u062F\u0650\u064A\u0631\u064C\u060C \u0627\u0644\u0644\u064E\u0651\u0647\u064F\u0645\u064E\u0651 \u0644\u064E\u0627 \u0645\u064E\u0627\u0646\u0650\u0639\u064E \u0644\u0650\u0645\u064E\u0627 \u0623\u064E\u0639\u0652\u0637\u064E\u064A\u0652\u062A\u064E\u060C \u0648\u064E\u0644\u064E\u0627 \u0645\u064F\u0639\u0652\u0637\u0650\u064A\u064E \u0644\u0650\u0645\u064E\u0627 \u0645\u064E\u0646\u064E\u0639\u0652\u062A\u064E\u060C \u0648\u064E\u0644\u064E\u0627 \u064A\u064E\u0646\u0652\u0641\u064E\u0639\u064F \u0630\u064E\u0627 \u0627\u0644\u0652\u062C\u064E\u062F\u0650\u0651 \u0645\u0650\u0646\u0652\u0643\u064E \u0627\u0644\u0652\u062C\u064E\u062F\u064F\u0651","Tiada Tuhan melainkan Allah, Yang Esa, tiada sekutu bagi-Nya. Bagi-Nya kerajaan dan segala pujian, dan Dia Maha Berkuasa atas segala sesuatu. Ya Allah, tiada yang dapat menghalang apa yang Engkau berikan, tiada yang dapat memberi apa yang Engkau halang, dan kekayaan tidak memberi manfaat kepada pemiliknya di sisi-Mu.","There is no god but Allah alone, with no partner. His is the dominion and His is the praise, and He has power over all things. O Allah, none can withhold what You give, none can give what You withhold, and the wealth of the wealthy cannot avail him against You."],["kursi","Ayat Kursi","Ayat al-Kursi","\u0671\u0644\u0644\u0651\u064E\u0647\u064F \u0644\u064E\u0627\u0653 \u0625\u0650\u0644\u064E\u0670\u0647\u064E \u0625\u0650\u0644\u0651\u064E\u0627 \u0647\u064F\u0648\u064E \u0671\u0644\u0652\u062D\u064E\u0649\u0651\u064F \u0671\u0644\u0652\u0642\u064E\u064A\u0651\u064F\u0648\u0645\u064F \u0644\u064E\u0627 \u062A\u064E\u0623\u0652\u062E\u064F\u0630\u064F\u0647\u064F\u06E5 \u0633\u0650\u0646\u064E\u0629\u064C \u0648\u064E\u0644\u064E\u0627 \u0646\u064E\u0648\u0652\u0645\u064C \u0644\u0651\u064E\u0647\u064F\u06E5 \u0645\u064E\u0627 \u0641\u0650\u0649 \u0671\u0644\u0633\u0651\u064E\u0645\u064E\u0670\u0648\u064E\u0670\u062A\u0650 \u0648\u064E\u0645\u064E\u0627 \u0641\u0650\u0649 \u0671\u0644\u0652\u0623\u064E\u0631\u0652\u0636\u0650 \u0645\u064E\u0646 \u0630\u064E\u0627 \u0671\u0644\u0651\u064E\u0630\u0650\u0649 \u064A\u064E\u0634\u0652\u0641\u064E\u0639\u064F \u0639\u0650\u0646\u062F\u064E\u0647\u064F\u06E5\u0653 \u0625\u0650\u0644\u0651\u064E\u0627 \u0628\u0650\u0625\u0650\u0630\u0652\u0646\u0650\u0647\u0650\u06E6 \u064A\u064E\u0639\u0652\u0644\u064E\u0645\u064F \u0645\u064E\u0627 \u0628\u064E\u064A\u0652\u0646\u064E \u0623\u064E\u064A\u0652\u062F\u0650\u064A\u0647\u0650\u0645\u0652 \u0648\u064E\u0645\u064E\u0627 \u062E\u064E\u0644\u0652\u0641\u064E\u0647\u064F\u0645\u0652 \u0648\u064E\u0644\u064E\u0627 \u064A\u064F\u062D\u0650\u064A\u0637\u064F\u0648\u0646\u064E \u0628\u0650\u0634\u064E\u0649\u0652\u0621\u064D \u0645\u0651\u0650\u0646\u0652 \u0639\u0650\u0644\u0652\u0645\u0650\u0647\u0650\u06E6\u0653 \u0625\u0650\u0644\u0651\u064E\u0627 \u0628\u0650\u0645\u064E\u0627 \u0634\u064E\u0627\u0653\u0621\u064E \u0648\u064E\u0633\u0650\u0639\u064E \u0643\u064F\u0631\u0652\u0633\u0650\u064A\u0651\u064F\u0647\u064F \u0671\u0644\u0633\u0651\u064E\u0645\u064E\u0670\u0648\u064E\u0670\u062A\u0650 \u0648\u064E\u0671\u0644\u0652\u0623\u064E\u0631\u0652\u0636\u064E \u0648\u064E\u0644\u064E\u0627 \u064A\u064E\u0640\u0654\u064F\u0648\u062F\u064F\u0647\u064F\u06E5 \u062D\u0650\u0641\u0652\u0638\u064F\u0647\u064F\u0645\u064E\u0627 \u0648\u064E\u0647\u064F\u0648\u064E \u0671\u0644\u0652\u0639\u064E\u0644\u0650\u0649\u0651\u064F \u0671\u0644\u0652\u0639\u064E\u0638\u0650\u064A\u0645\u064F \u06DD\u0662\u0665\u0665","Allah, tiada Tuhan (yang berhak disembah) melainkan Dia, Yang Tetap hidup, Yang Kekal selama-lamanya mentadbirkan (sekalian makhlukNya). Yang tidak mengantuk usahkan tidur. Yang memiliki segala yang ada di langit dan yang ada di bumi. Tiada sesiapa yang dapat memberi syafaat (pertolongan) di sisiNya melainkan dengan izinNya. yang mengetahui apa yang ada di hadapan mereka dan apa yang ada di belakang mereka, sedang mereka tidak mengetahui sesuatu pun dari (kandungan) ilmu Allah melainkan apa yang Allah kehendaki (memberitahu kepadanya). Luasnya Kursi Allah (ilmuNya dan kekuasaanNya) meliputi langit dan bumi; dan tiadalah menjadi keberatan kepada Allah menjaga serta memelihara keduanya. Dan Dia lah Yang Maha Tinggi (darjat kemuliaanNya), lagi Maha Besar (kekuasaanNya)","Allah - there is no deity except Him, the Ever-Living, the Sustainer of [all] existence. Neither drowsiness overtakes Him nor sleep. To Him belongs whatever is in the heavens and whatever is on the earth. Who is it that can intercede with Him except by His permission? He knows what is [presently] before them and what will be after them, and they encompass not a thing of His knowledge except for what He wills. His Kursi extends over the heavens and the earth, and their preservation tires Him not. And He is the Most High, the Most Great","Al-Baqarah 2:255",0,1],["tasbih","Tasbih","Tasbih","\u0633\u064F\u0628\u0652\u062D\u064E\u0627\u0646\u064E \u0627\u0644\u0644\u064E\u0651\u0647\u0650","Maha Suci Allah.","Glory be to Allah.","",33],["tahmid","Tahmid","Tahmid","\u0627\u0644\u0652\u062D\u064E\u0645\u0652\u062F\u064F \u0644\u0650\u0644\u064E\u0651\u0647\u0650","Segala puji bagi Allah.","All praise is for Allah.","",33],["takbir33","Takbir","Takbir","\u0627\u0644\u0644\u064E\u0651\u0647\u064F \u0623\u064E\u0643\u0652\u0628\u064E\u0631\u064F","Allah Maha Besar.","Allah is the Greatest.","",33],["tahlil","Tahlil (cukupkan 100)","Tahlil (completing 100)","\u0644\u064E\u0627 \u0625\u0650\u0644\u064E\u0670\u0647\u064E \u0625\u0650\u0644\u064E\u0651\u0627 \u0627\u0644\u0644\u064E\u0651\u0647\u064F \u0648\u064E\u062D\u0652\u062F\u064E\u0647\u064F \u0644\u064E\u0627 \u0634\u064E\u0631\u0650\u064A\u0643\u064E \u0644\u064E\u0647\u064F\u060C \u0644\u064E\u0647\u064F \u0627\u0644\u0652\u0645\u064F\u0644\u0652\u0643\u064F \u0648\u064E\u0644\u064E\u0647\u064F \u0627\u0644\u0652\u062D\u064E\u0645\u0652\u062F\u064F \u0648\u064E\u0647\u064F\u0648\u064E \u0639\u064E\u0644\u064E\u0649\u0670 \u0643\u064F\u0644\u0650\u0651 \u0634\u064E\u064A\u0652\u0621\u064D \u0642\u064E\u062F\u0650\u064A\u0631\u064C","Tiada Tuhan melainkan Allah, Yang Esa, tiada sekutu bagi-Nya. Bagi-Nya kerajaan dan bagi-Nya segala pujian, dan Dia Maha Berkuasa atas segala sesuatu.","There is no god but Allah alone, with no partner. His is the dominion and His is the praise, and He has power over all things.","Dibaca selepas tasbih, tahmid dan takbir untuk melengkapkan 100.|Said after the tasbih, tahmid and takbir to complete 100."],["ainni","Bantulah aku mengingati-Mu","Help me remember You","\u0627\u0644\u0644\u064E\u0651\u0647\u064F\u0645\u064E\u0651 \u0623\u064E\u0639\u0650\u0646\u0650\u0651\u064A \u0639\u064E\u0644\u064E\u0649\u0670 \u0630\u0650\u0643\u0652\u0631\u0650\u0643\u064E \u0648\u064E\u0634\u064F\u0643\u0652\u0631\u0650\u0643\u064E \u0648\u064E\u062D\u064F\u0633\u0652\u0646\u0650 \u0639\u0650\u0628\u064E\u0627\u062F\u064E\u062A\u0650\u0643\u064E","Ya Allah, bantulah aku untuk mengingati-Mu, bersyukur kepada-Mu dan memperelokkan ibadahku kepada-Mu.","O Allah, help me to remember You, to thank You and to worship You well."],["ikhlas","Surah Al-Ikhlas","Surah Al-Ikhlas","\u0628\u0650\u0633\u0652\u0645\u0650 \u0671\u0644\u0644\u0651\u064E\u0647\u0650 \u0671\u0644\u0631\u0651\u064E\u062D\u0652\u0645\u064E\u0670\u0646\u0650 \u0671\u0644\u0631\u0651\u064E\u062D\u0650\u064A\u0645\u0650 \u0642\u064F\u0644\u0652 \u0647\u064F\u0648\u064E \u0671\u0644\u0644\u0651\u064E\u0647\u064F \u0623\u064E\u062D\u064E\u062F\u064C \u06DD\u0661 \u0671\u0644\u0644\u0651\u064E\u0647\u064F \u0671\u0644\u0635\u0651\u064E\u0645\u064E\u062F\u064F \u06DD\u0662 \u0644\u064E\u0645\u0652 \u064A\u064E\u0644\u0650\u062F\u0652 \u0648\u064E\u0644\u064E\u0645\u0652 \u064A\u064F\u0648\u0644\u064E\u062F\u0652 \u06DD\u0663 \u0648\u064E\u0644\u064E\u0645\u0652 \u064A\u064E\u0643\u064F\u0646 \u0644\u0651\u064E\u0647\u064F\u06E5 \u0643\u064F\u0641\u064F\u0648\u064B\u0627 \u0623\u064E\u062D\u064E\u062F\u064C\u06E2 \u06DD\u0664",'Katakanlah (wahai Muhammad): "(Tuhanku) ialah Allah Yang Maha Esa" Allah Yang menjadi tumpuan sekalian makhluk untuk memohon sebarang hajat Ia tiada beranak, dan Ia pula tidak diperanakkan Dan tidak ada sesiapapun yang serupa denganNya','Say, "He is Allah, [who is] One" Allah, the Eternal Refuge He neither begets nor is born Nor is there to Him any equivalent',"1\xD7 selepas setiap solat, 3\xD7 selepas Subuh & Maghrib.|Once after each solat, 3\xD7 after Fajr & Maghrib.",0,1],["falaq","Surah Al-Falaq","Surah Al-Falaq","\u0628\u0650\u0633\u0652\u0645\u0650 \u0671\u0644\u0644\u0651\u064E\u0647\u0650 \u0671\u0644\u0631\u0651\u064E\u062D\u0652\u0645\u064E\u0670\u0646\u0650 \u0671\u0644\u0631\u0651\u064E\u062D\u0650\u064A\u0645\u0650 \u0642\u064F\u0644\u0652 \u0623\u064E\u0639\u064F\u0648\u0630\u064F \u0628\u0650\u0631\u064E\u0628\u0651\u0650 \u0671\u0644\u0652\u0641\u064E\u0644\u064E\u0642\u0650 \u06DD\u0661 \u0645\u0650\u0646 \u0634\u064E\u0631\u0651\u0650 \u0645\u064E\u0627 \u062E\u064E\u0644\u064E\u0642\u064E \u06DD\u0662 \u0648\u064E\u0645\u0650\u0646 \u0634\u064E\u0631\u0651\u0650 \u063A\u064E\u0627\u0633\u0650\u0642\u064D \u0625\u0650\u0630\u064E\u0627 \u0648\u064E\u0642\u064E\u0628\u064E \u06DD\u0663 \u0648\u064E\u0645\u0650\u0646 \u0634\u064E\u0631\u0651\u0650 \u0671\u0644\u0646\u0651\u064E\u0641\u0651\u064E\u0670\u062B\u064E\u0670\u062A\u0650 \u0641\u0650\u0649 \u0671\u0644\u0652\u0639\u064F\u0642\u064E\u062F\u0650 \u06DD\u0664 \u0648\u064E\u0645\u0650\u0646 \u0634\u064E\u0631\u0651\u0650 \u062D\u064E\u0627\u0633\u0650\u062F\u064D \u0625\u0650\u0630\u064E\u0627 \u062D\u064E\u0633\u064E\u062F\u064E \u06DD\u0665",'Katakanlah (wahai Muhammad); "Aku berlindung kepada (Allah) Tuhan yang menciptakan sekalian makhluk" Dari bencana makhluk-makhluk yang Ia ciptakan Dan dari bahaya gelap apabila ia masuk Dan dari kejahatan makhluk-makhluk yang menghembus-hembus pada simpulan-simpulan (dan ikatan-ikatan) Dan dari kejahatan orang yang dengki apabila ia melakukan dengkinya','Say, "I seek refuge in the Lord of daybreak" From the evil of that which He created And from the evil of darkness when it settles And from the evil of the blowers in knots And from the evil of an envier when he envies',"1\xD7 selepas setiap solat, 3\xD7 selepas Subuh & Maghrib.|Once after each solat, 3\xD7 after Fajr & Maghrib.",0,1],["nas","Surah An-Nas","Surah An-Nas","\u0628\u0650\u0633\u0652\u0645\u0650 \u0671\u0644\u0644\u0651\u064E\u0647\u0650 \u0671\u0644\u0631\u0651\u064E\u062D\u0652\u0645\u064E\u0670\u0646\u0650 \u0671\u0644\u0631\u0651\u064E\u062D\u0650\u064A\u0645\u0650 \u0642\u064F\u0644\u0652 \u0623\u064E\u0639\u064F\u0648\u0630\u064F \u0628\u0650\u0631\u064E\u0628\u0651\u0650 \u0671\u0644\u0646\u0651\u064E\u0627\u0633\u0650 \u06DD\u0661 \u0645\u064E\u0644\u0650\u0643\u0650 \u0671\u0644\u0646\u0651\u064E\u0627\u0633\u0650 \u06DD\u0662 \u0625\u0650\u0644\u064E\u0670\u0647\u0650 \u0671\u0644\u0646\u0651\u064E\u0627\u0633\u0650 \u06DD\u0663 \u0645\u0650\u0646 \u0634\u064E\u0631\u0651\u0650 \u0671\u0644\u0652\u0648\u064E\u0633\u0652\u0648\u064E\u0627\u0633\u0650 \u0671\u0644\u0652\u062E\u064E\u0646\u0651\u064E\u0627\u0633\u0650 \u06DD\u0664 \u0671\u0644\u0651\u064E\u0630\u0650\u0649 \u064A\u064F\u0648\u064E\u0633\u0652\u0648\u0650\u0633\u064F \u0641\u0650\u0649 \u0635\u064F\u062F\u064F\u0648\u0631\u0650 \u0671\u0644\u0646\u0651\u064E\u0627\u0633\u0650 \u06DD\u0665 \u0645\u0650\u0646\u064E \u0671\u0644\u0652\u062C\u0650\u0646\u0651\u064E\u0629\u0650 \u0648\u064E\u0671\u0644\u0646\u0651\u064E\u0627\u0633\u0650 \u06DD\u0666",'Katakanlah (wahai Muhammad): "Aku berlindung kepada (Allah) Pemulihara sekalian manusia" Yang Menguasai sekalian manusia Tuhan yang berhak disembah oleh sekalian manusia Dari kejahatan pembisik penghasut yang timbul tenggelam Yang melemparkan bisikan dan hasutannya ke dalam hati manusia (Iaitu pembisik dan penghasut) dari kalangan jin dan manusia','Say, "I seek refuge in the Lord of mankind" The Sovereign of mankind The God of mankind From the evil of the retreating whisperer Who whispers [evil] into the breasts of mankind From among the jinn and mankind',"1\xD7 selepas setiap solat, 3\xD7 selepas Subuh & Maghrib.|Once after each solat, 3\xD7 after Fajr & Maghrib.",0,1],["ilmunafi","Selepas Subuh: ilmu, rezeki & amal","After Fajr: knowledge, provision & deeds","\u0627\u0644\u0644\u064E\u0651\u0647\u064F\u0645\u064E\u0651 \u0625\u0650\u0646\u0650\u0651\u064A \u0623\u064E\u0633\u0652\u0623\u064E\u0644\u064F\u0643\u064E \u0639\u0650\u0644\u0652\u0645\u064B\u0627 \u0646\u064E\u0627\u0641\u0650\u0639\u064B\u0627\u060C \u0648\u064E\u0631\u0650\u0632\u0652\u0642\u064B\u0627 \u0637\u064E\u064A\u0650\u0651\u0628\u064B\u0627\u060C \u0648\u064E\u0639\u064E\u0645\u064E\u0644\u064B\u0627 \u0645\u064F\u062A\u064E\u0642\u064E\u0628\u064E\u0651\u0644\u064B\u0627","Ya Allah, aku memohon kepada-Mu ilmu yang bermanfaat, rezeki yang baik dan amalan yang diterima.","O Allah, I ask You for beneficial knowledge, good provision and accepted deeds.","Selepas solat Subuh.|After the Fajr prayer."],["ajirni","Lindungi aku daripada neraka","Protect me from the Fire","\u0627\u0644\u0644\u064E\u0651\u0647\u064F\u0645\u064E\u0651 \u0623\u064E\u062C\u0650\u0631\u0652\u0646\u0650\u064A \u0645\u0650\u0646\u064E \u0627\u0644\u0646\u064E\u0651\u0627\u0631\u0650","Ya Allah, selamatkanlah aku daripada api neraka.","O Allah, save me from the Fire.","Selepas Subuh & Maghrib.|After Fajr & Maghrib.",7]]},DOA_CATS=[["diri","Diri & rumah","Self & home",["makan","lepasmakan","tidur","bangun","tandas","keluartandas","pakaian","cermin","masukrumah","keluarrumah"]],["ibadah","Ibadah","Worship",["wuduk","lepaswuduk","masjid","keluarmasjid","azan","berbuka","quran","majlis"]],["pagi","Pagi & petang","Morning & evening",["pagi","petang","perlindungan","sayyidul"]],["jalan","Perjalanan & alam","Travel & nature",["kenderaan","musafir","hujan","lepashujan","guruh","angin","anakbulan"]],["hati","Hati & ujian","Heart & hardship",["musibah","gelisah","yunus","hasbunallah","tetaphati","marah"]],["keluarga","Keluarga & sosial","Family & others",["ibubapa","zuriat","pengantin","tuanrumah","sakit","ziarah","bersin"]],["ilmu","Ilmu & kebaikan","Knowledge & good",["ilmu","belajar","dunia"]]],SIRAH=[["lahir","awal","570 M","","Kelahiran Nabi \uFDFA","Birth of the Prophet \uFDFA","Baginda lahir di Makkah pada Tahun Gajah, menurut pendapat masyhur pada 12 Rabiulawal. Bapanya, Abdullah, wafat sebelum baginda lahir. Baginda disusukan oleh Halimah as-Sa'diyah di perkampungan Bani Sa'ad.","He was born in Makkah in the Year of the Elephant, on 12 Rabi' al-Awwal according to the best-known view. His father, Abdullah, died before he was born. He was nursed by Halimah as-Sa'diyah among the Banu Sa'd.","Allah memelihara kekasih-Nya walaupun lahir sebagai anak yatim.","Allah takes care of His beloved even when born an orphan."],["yatim","awal","576 M","","Ibu wafat, dipelihara datuk & bapa saudara","Mother dies; raised by grandfather and uncle","Ketika berusia 6 tahun, ibunya Aminah wafat di Abwa'. Baginda dipelihara oleh datuknya Abdul Muttalib, dan selepas datuknya wafat (ketika baginda 8 tahun), oleh bapa saudaranya Abu Talib.","At six, his mother Aminah died at Abwa'. His grandfather Abdul Muttalib raised him, and after he died (when the Prophet was eight), his uncle Abu Talib.","Ujian sejak kecil membentuk jiwa yang tabah dan penyayang.","Hardship from childhood shaped a patient, caring soul."],["syam","awal","\xB1 582 M","","Ke Syam bersama Abu Talib","Journey to Syria with Abu Talib","Sekitar usia 12 tahun, baginda mengikuti Abu Talib berdagang ke Syam. Seorang rahib bernama Bahira melihat tanda-tanda kenabian pada baginda dan menasihati Abu Talib supaya menjaganya.","Around twelve, he travelled with Abu Talib's caravan to Syria. A monk named Bahira saw signs of prophethood in him and advised Abu Talib to protect him.","Baginda belajar berdagang dan bekerja sejak muda.","He learned trade and hard work from a young age."],["khadijah","awal","595 M","","Berkahwin dengan Khadijah","Marriage to Khadijah","Baginda terkenal sebagai al-Amin (yang dipercayai). Pada usia 25 tahun, baginda berkahwin dengan Khadijah binti Khuwailid, seorang peniaga mulia yang menurut riwayat masyhur berusia 40 tahun ketika itu.","He was known as al-Amin (the trustworthy). At 25 he married Khadijah bint Khuwaylid, a noble merchant who, by the best-known report, was 40 at the time.","Amanah dan akhlak mulia membuka pintu kebaikan.","Trustworthiness and good character open doors of good."],["hajar","awal","605 M","","Meletakkan Hajarul Aswad","Placing the Black Stone","Ketika Kaabah dibina semula, kabilah Quraisy bertelagah siapa yang berhak meletakkan Hajarul Aswad. Baginda meletakkan batu itu di atas kain dan meminta wakil setiap kabilah mengangkatnya bersama, lalu meletakkannya dengan tangan baginda sendiri.","When the Ka'bah was rebuilt, the Quraysh clans quarrelled over who would set the Black Stone. He placed it on a cloth, had each clan's leader lift it together, then set it in place himself.","Kebijaksanaan menyatukan orang dan mengelakkan pertumpahan darah.","Wisdom unites people and prevents bloodshed."],["wahyu","makkah","610 M","","Wahyu pertama di Gua Hira'","First revelation in the Cave of Hira'",`Pada usia 40 tahun, ketika beribadah di Gua Hira' pada bulan Ramadan, Malaikat Jibril datang membawa wahyu pertama: "Iqra'" (Surah Al-'Alaq 1\u20135). Khadijah menenangkan dan beriman kepada baginda.`,`At forty, while worshipping in the Cave of Hira' in Ramadan, Jibril brought the first revelation: "Iqra'" (Surah Al-'Alaq 1\u20135). Khadijah comforted him and believed in him.`,"Islam bermula dengan perintah membaca dan menuntut ilmu.","Islam began with the command to read and learn."],["rahsia","makkah","610\u2013613 M","","Dakwah secara rahsia","Calling to Islam in secret","Selama kira-kira tiga tahun, baginda berdakwah secara rahsia kepada orang terdekat. Antara yang terawal memeluk Islam ialah Khadijah, Abu Bakar, Ali bin Abi Talib dan Zaid bin Harithah.","For about three years he called those closest to him in secret. Among the first Muslims were Khadijah, Abu Bakr, Ali ibn Abi Talib and Zayd ibn Harithah.","Dakwah bermula dari keluarga dan sahabat terdekat.","Calling to good starts with family and close friends."],["terang","makkah","613 M","","Dakwah terang-terangan","Calling openly","Allah memerintahkan baginda berdakwah secara terbuka. Baginda menyeru Quraisy dari Bukit Safa. Penentangan dan penyeksaan terhadap orang Islam semakin berat, antaranya ke atas Bilal dan keluarga Yasir.","Allah commanded him to call openly, and he addressed the Quraysh from Mount Safa. Opposition and persecution grew, including against Bilal and the family of Yasir.","Kebenaran perlu disampaikan walaupun ditentang.","The truth must be conveyed even when opposed."],["habsyah","makkah","615 M","","Hijrah ke Habsyah","Migration to Abyssinia","Untuk menyelamatkan diri daripada penyeksaan, sekumpulan sahabat berhijrah ke Habsyah di bawah perlindungan raja Najasyi yang adil.","To escape persecution, a group of Companions migrated to Abyssinia under the protection of its just king, the Negus (Najashi).","Mencari tempat selamat untuk mempertahankan iman adalah dibenarkan.","Seeking safety to protect one's faith is permitted."],["boikot","makkah","616\u2013619 M","","Pemulauan Bani Hasyim","Boycott of Banu Hashim","Quraisy memulaukan Bani Hasyim dan Bani Muttalib di Syi'b Abi Talib selama kira-kira tiga tahun. Mereka mengalami kelaparan yang teruk sehingga pemulauan itu ditamatkan.","The Quraysh boycotted Banu Hashim and Banu Muttalib in the valley of Abu Talib for about three years, causing severe hunger until it ended.","Sabar dan bersatu ketika susah.","Patience and unity in hardship."],["huzn","makkah","619 M","","Tahun Dukacita & ke Taif","Year of Sorrow and Ta'if","Khadijah dan Abu Talib wafat pada tahun yang sama, dikenali sebagai 'Amul Huzn. Baginda kemudian berdakwah ke Taif, tetapi dihalau dan dilempar batu. Baginda tetap mendoakan kebaikan untuk mereka.","Khadijah and Abu Talib both died in the same year, the Year of Sorrow. He then went to Ta'if, where he was driven out and stoned, yet he still prayed for their good.","Membalas keburukan dengan doa dan kemaafan.","Answering harm with prayer and forgiveness."],["israk","makkah","\xB1 621 M","","Israk & Mikraj","Isra' and Mi'raj","Kira-kira setahun sebelum hijrah (pendapat masyhur 27 Rejab), baginda diperjalankan dari Masjidil Haram ke Masjidil Aqsa, kemudian diangkat ke langit. Solat lima waktu difardukan pada malam itu.","About a year before the Hijrah (commonly 27 Rajab), he was taken by night from Masjid al-Haram to Masjid al-Aqsa and then raised through the heavens. The five daily prayers were made obligatory that night.","Solat ialah hadiah besar dari langit untuk umat ini.","The prayer is a great gift from the heavens to this ummah."],["aqabah","makkah","621\u2013622 M","","Baiah Aqabah","Pledges of Aqabah","Penduduk Yathrib (Madinah) berbaiah kepada baginda di Aqabah, kali pertama dan kedua, untuk beriman dan melindungi baginda. Ini membuka jalan untuk hijrah.","People of Yathrib (Madinah) pledged allegiance at Aqabah, twice, to believe and to protect him. This opened the way for the Hijrah.","Allah membuka jalan keluar selepas kesusahan.","Allah opens a way out after hardship."],["hijrah","madinah","622 M","1 H","Hijrah ke Madinah","The Hijrah to Madinah","Bersama Abu Bakar, baginda bersembunyi di Gua Thur, lalu tiba di Quba' dan membina masjid pertama. Di Madinah, baginda membina Masjid Nabawi, mempersaudarakan Muhajirin dan Ansar, dan menggubal Piagam Madinah. Kalendar Hijrah bermula pada tahun ini.","With Abu Bakr he hid in the Cave of Thawr, then reached Quba' and built the first mosque. In Madinah he built the Prophet's Mosque, made brothers of the Muhajirun and Ansar, and set out the Charter of Madinah. The Hijri calendar starts from this year.","Membina masyarakat bermula dengan masjid, ukhuwah dan keadilan.","Building a community starts with the mosque, brotherhood and justice."],["badar","madinah","624 M","2 H","Perang Badar","Battle of Badr","Pada 17 Ramadan, kira-kira 313 orang Islam menang menentang tentera Quraisy yang jauh lebih ramai. Pada tahun yang sama, puasa Ramadan difardukan dan kiblat ditukar ke Kaabah.","On 17 Ramadan, about 313 Muslims defeated a far larger Quraysh army. That same year fasting in Ramadan was prescribed and the qiblah was turned to the Ka'bah.","Kemenangan datang daripada Allah, bukan bilangan.","Victory comes from Allah, not numbers."],["uhud","madinah","625 M","3 H","Perang Uhud","Battle of Uhud","Orang Islam hampir menang, tetapi sebahagian pemanah meninggalkan bukit yang diperintahkan baginda. Keadaan berubah, ramai sahabat syahid termasuk Hamzah, bapa saudara baginda.","The Muslims were close to victory, but some archers left the hill they had been ordered to hold. The tide turned and many were martyred, including Hamzah, the Prophet's uncle.","Taat kepada pimpinan dan tidak tamak dunia.","Obey leadership and don't be lured by worldly gain."],["khandaq","madinah","627 M","5 H","Perang Khandaq (Ahzab)","Battle of the Trench (Ahzab)","Atas cadangan Salman al-Farisi, orang Islam menggali parit untuk mempertahankan Madinah daripada gabungan tentera yang besar. Selepas kepungan berminggu-minggu, Allah menghantar angin kencang dan musuh berundur.","On Salman al-Farisi's suggestion, the Muslims dug a trench to defend Madinah against a large coalition. After weeks of siege, Allah sent a fierce wind and the enemy withdrew.","Bermesyuarat dan menerima idea yang baik dari sesiapa sahaja.","Consult others and accept good ideas from anyone."],["hudaibiyah","madinah","628 M","6 H","Perjanjian Hudaibiyah","Treaty of Hudaybiyyah","Baginda dan para sahabat dihalang menunaikan umrah, lalu perjanjian damai dimeterai. Walaupun syaratnya kelihatan berat sebelah, Al-Quran menyebutnya sebagai kemenangan yang nyata (Al-Fath). Baginda kemudian mengutus surat kepada raja-raja.","Prevented from performing umrah, the Muslims agreed a peace treaty. Though its terms seemed unfair, the Quran called it a clear victory (Al-Fath). He then sent letters to the kings of the region.","Kedamaian dan kesabaran membawa kemenangan yang lebih besar.","Peace and patience bring a greater victory."],["khaibar","madinah","629 M","7 H","Khaibar & Umrah al-Qada'","Khaybar and the Fulfilled Umrah","Kubu-kubu Khaibar dibuka. Setahun selepas Hudaibiyah, baginda dan para sahabat menunaikan umrah ke Makkah seperti yang dipersetujui.","The forts of Khaybar were opened. A year after Hudaybiyyah, the Muslims performed umrah in Makkah as agreed.","Menunaikan janji walaupun terhadap pihak lawan.","Keep promises, even to opponents."],["fathu","madinah","630 M","8 H","Pembukaan Makkah","The Conquest of Makkah","Pada bulan Ramadan, baginda memasuki Makkah hampir tanpa pertumpahan darah dan mengampunkan penduduknya yang dahulu memusuhi baginda. Berhala di sekeliling Kaabah dimusnahkan. Perang Hunain berlaku selepas itu.","In Ramadan he entered Makkah almost without bloodshed and pardoned the people who had once fought him. The idols around the Ka'bah were destroyed. The Battle of Hunayn followed.","Kemaafan ketika berkuasa ialah akhlak paling mulia.","Forgiving when in power is the noblest character."],["tabuk","madinah","630\u2013631 M","9 H","Tabuk & Tahun Delegasi","Tabuk and the Year of Delegations","Baginda memimpin ekspedisi ke Tabuk dalam cuaca yang sangat panas. Selepas itu banyak rombongan kabilah dari seluruh Semenanjung Arab datang ke Madinah untuk memeluk Islam ('Amul Wufud).","He led the expedition to Tabuk in intense heat. Afterwards many tribal delegations from across Arabia came to Madinah to embrace Islam (the Year of Delegations).","Pengorbanan ketika sukar menguji keikhlasan.","Sacrifice in hard times tests sincerity."],["wada","madinah","632 M","10 H","Haji Wada'","The Farewell Pilgrimage","Baginda menunaikan haji bersama lebih seratus ribu umat Islam dan menyampaikan khutbah tentang kesucian nyawa, harta dan maruah, hak wanita, dan persaudaraan sesama Muslim. Ayat tentang kesempurnaan agama turun (Al-Ma'idah 5:3).","He performed hajj with over a hundred thousand Muslims and gave a sermon on the sanctity of life, property and honour, the rights of women, and brotherhood among Muslims. The verse on the completion of the religion was revealed (Al-Ma'idah 5:3).","Islam ialah agama yang sempurna dan penuh rahmat.","Islam is a complete religion full of mercy."],["wafat","madinah","632 M","11 H","Kewafatan Rasulullah \uFDFA","The passing of the Prophet \uFDFA","Baginda wafat di Madinah pada bulan Rabiulawal, dalam usia 63 tahun, di rumah Aisyah. Abu Bakar mengingatkan umat: sesiapa menyembah Muhammad, Muhammad telah wafat; sesiapa menyembah Allah, Allah hidup selama-lamanya.","He passed away in Madinah in Rabi' al-Awwal, aged 63, in the house of Aisha. Abu Bakr reminded the people: whoever worshipped Muhammad, Muhammad has died; whoever worships Allah, Allah is Ever-Living.","Warisan baginda ialah Al-Quran dan Sunnah; teruskan mengamalkannya.","His legacy is the Quran and Sunnah; keep living by them."]],ASMA=[["\u0627\u0644\u0631\u064E\u0651\u062D\u0652\u0645\u064E\u0670\u0646\u064F","Ar-Rahman","Yang Maha Pemurah","The Most Gracious"],["\u0627\u0644\u0631\u064E\u0651\u062D\u0650\u064A\u0645\u064F","Ar-Rahim","Yang Maha Penyayang","The Most Merciful"],["\u0627\u0644\u0652\u0645\u064E\u0644\u0650\u0643\u064F","Al-Malik","Yang Maha Merajai","The King"],["\u0627\u0644\u0652\u0642\u064F\u062F\u064F\u0651\u0648\u0633\u064F","Al-Quddus","Yang Maha Suci","The Most Holy"],["\u0627\u0644\u0633\u064E\u0651\u0644\u064E\u0627\u0645\u064F","As-Salam","Yang Maha Sejahtera","The Source of Peace"],["\u0627\u0644\u0652\u0645\u064F\u0624\u06
