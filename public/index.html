<script>
  // App shortcut "Sambung bacaan": jump straight to the next page on Quran.com.
  (function () {
    try {
      var q = new URLSearchParams(location.search);
      if (q.get("action") !== "read") return;
      var key = localStorage.getItem("quran-note-personal") === "1" ? "qn-personal-entries" : "quran-journal-entries";
      var e = JSON.parse(localStorage.getItem(key) || "[]"), last = null;
      for (var i = 0; i < e.length; i++) { var x = e[i]; if (!last || x.date > last.date || (x.date === last.date && x.ts > last.ts)) last = x; }
      if (last) location.replace("https://quran.com/page/" + Math.min(last.page + 1, 604));
    } catch (err) {}
  })();
</script>

<script>
  // Show the opening scene for 3.5 s (3.2 s + 0.3 s fade); if the app is still loading, wait for it.
  (function () {
    var el = document.getElementById("splash"), minDone = false, ready = false, gone = false;
    function hide() {
      if (gone || !minDone || !ready) return;
      gone = true; el.classList.add("out");
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
    }
    setTimeout(function () { minDone = true; hide(); }, 3200);
    window.addEventListener("app-ready", function () { ready = true; hide(); });
    setTimeout(function () { ready = true; minDone = true; hide(); }, 8000);

    // Short, brisk Bismillah (Saud Al-Shuraim, 1:1; backups: Maher Al-Muaiqly, Alafasy) when the app opens. Can be turned off in Settings.
    var settings = {};
    try { settings = JSON.parse(localStorage.getItem("quran-journal-settings") || "{}"); } catch (e) {}
    if (settings.sound === false) return;
    var SOURCES = [
      "https://everyayah.com/data/Saood_ash-Shuraym_128kbps/001001.mp3",
      "https://verses.quran.com/Shuraym/mp3/001001.mp3",
      "https://everyayah.com/data/Maher_AlMuaiqly_64kbps/001001.mp3",
      "https://verses.quran.foundation/Alafasy/mp3/001001.mp3"
    ];
    var VOLUME = 0.3, idx = 0, started = false;
    var audio = new Audio();
    audio.preload = "auto";
    audio.volume = 0;
    audio.src = SOURCES[0];
    audio.addEventListener("error", function () {
      if (++idx < SOURCES.length) { audio.src = SOURCES[idx]; if (started) play(); }
    });
    function fadeIn() {
      var v = 0;
      var t = setInterval(function () { v = Math.min(VOLUME, v + 0.06); try { audio.volume = v; } catch (e) {} if (v >= VOLUME) clearInterval(t); }, 50);
    }
    function play() {
      started = true;
      var p = audio.play();
      if (p && p.then) {
        p.then(function () { el.classList.remove("needs-tap"); fadeIn(); })
         .catch(function (err) { if (err && err.name === "NotAllowedError" && !gone) el.classList.add("needs-tap"); });
      }
    }
    el.querySelector(".sp-tap").addEventListener("click", function (e) { e.stopPropagation(); play(); });
    el.addEventListener("click", function () { if (el.classList.contains("needs-tap")) play(); });
    window.__bismillah = audio;
    play();
  })();
</script>

    const get = (t) => parseInt((parts.find((x) => x.type === t) || {}).value, 10);

function ramadanInfo(today, offset) {
  const h = hijriOf(today, offset);
  if (!h) return null;

    let last = today;
    for (let i = 1; i <= 31; i++) { const x = addDays(today, i); const hx = hijriOf(x, offset); if (!hx || hx.m !== 9) { last = addDays(x, -1); break; } }
    return { inRamadan: true, day: h.d, year: h.y, lastDay: last, daysLeft: daysBetween(today, last) + 1 };
  }
  for (let i = 1; i <= 400; i++) {
    const x = addDays(today, i); const hx = hijriOf(x, offset);
    if (hx && hx.m === 9 && hx.d === 1) {
      let len = 30;
      for (let k = 29; k <= 30; k++) { const hk = hijriOf(addDays(x, k), offset); if (!hk || hk.m !== 9) { len = k; break; } }

function upcomingEvents(today, offset, limit = 3) {
  const found = [], seen = new Set();
  for (let i = 0; i <= 400 && found.length < ISLAMIC_EVENTS.length; i++) {
    const iso = addDays(today, i), h = hijriOf(iso, offset);

    for (const ev of ISLAMIC_EVENTS) {

}

// Point-in-polygon on the JAKIM district boundaries; if the point is just off the coast, nearest zone within ~100 km.
function zoneFor(lat, lon, zones) {
  const inside = (x, y, rings) => {
    let hit = false;
    for (const r of rings) for (let i = 0, j = r.length - 1; i < r.length; j = i++) {
      const [xi, yi] = r[i], [xj, yj] = r[j];
      if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) hit = !hit;
    }
    return hit;
  };
  for (const z of zones) if (inside(lon, lat, z.p)) return z;
  let best = null, bd = Infinity;
  for (const z of zones) for (const r of z.p) for (const [x, y] of r) { const d = (x - lon) ** 2 + (y - lat) ** 2; if (d < bd) { bd = d; best = z; } }
  return bd < 1 ? best : null;
}

const AYAT = [[3, 31, "قُلۡ إِن كُنتُمۡ تُحِبُّونَ ٱللَّهَ فَٱتَّبِعُونِي يُحۡبِبۡكُمُ ٱللَّهُ وَيَغۡفِرۡ لَكُمۡ ذُنُوبَكُمۡۚ وَٱللَّهُ غَفُورٞ رَّحِيمٞ", "Katakanlah (wahai Muhammad): \"Jika benar kamu mengasihi Allah maka ikutilah daku, nescaya Allah mengasihi kamu serta mengampunkan dosa-dosa kamu. Dan (ingatlah), Allah Maha Pengampun, lagi Maha Mengasihani.\"", "Say, [O Muhammad], \"If you should love Allah, then follow me, [so] Allah will love you and forgive you your sins. And Allah is Forgiving and Merciful.\""], [25, 74, "وَٱلَّذِينَ يَقُولُونَ رَبَّنَا هَبۡ لَنَا مِنۡ أَزۡوَٰجِنَا وَذُرِّيَّـٰتِنَا قُرَّةَ أَعۡيُنٖ وَٱجۡعَلۡنَا لِلۡمُتَّقِينَ إِمَامًا", "Dan juga mereka (yang diredhai Allah itu ialah orang-orang) yang berdoa dengan berkata: \"Wahai Tuhan kami, berilah kami beroleh dari isteri-isteri dan zuriat keturunan kami: perkara-perkara yang menyukakan hati melihatnya, dan jadikanlah kami imam ikutan bagi orang-orang yang (mahu) bertaqwa.\"", "And those who say, \"Our Lord, grant us from among our wives and offspring comfort to our eyes and make us an example for the righteous.\""], [103, 2, "إِنَّ ٱلۡإِنسَٰنَ لَفِي خُسۡرٍ", "Sesungguhnya manusia itu dalam kerugian.", "Indeed, mankind is in loss."], [35, 29, "إِنَّ ٱلَّذِينَ يَتۡلُونَ كِتَٰبَ ٱللَّهِ وَأَقَامُواْ ٱلصَّلَوٰةَ وَأَنفَقُواْ مِمَّا رَزَقۡنَٰهُمۡ سِرّٗا وَعَلَانِيَةٗ يَرۡجُونَ تِجَٰرَةٗ لَّن تَبُورَ", "Sesungguhnya orang-orang yang selalu membaca Kitab Allah dan tetap mendirikan sembahyang serta mendermakan dari apa yang Kami kurniakan kepada mereka, secara bersembunyi atau secara terbuka, mereka (dengan amalan yang demikian) mengharapkan sejenis perniagaan yang tidak akan mengalami kerugian.", "Indeed, those who recite the Book of Allah and establish prayer and spend [in His cause] out of what We have provided them, secretly and publicly, [can] expect a profit that will never perish."], [103, 3, "إِلَّا ٱلَّذِينَ ءَامَنُواْ وَعَمِلُواْ ٱلصَّـٰلِحَٰتِ وَتَوَاصَوۡاْ بِٱلۡحَقِّ وَتَوَاصَوۡاْ بِٱلصَّبۡرِ", "Kecuali orang-orang yang beriman dan beramal soleh, dan mereka pula berpesan-pesan dengan kebenaran serta berpesan-pesan dengan sabar.", "Except for those who have believed and done righteous deeds and advised each other to truth and advised each other to patience."], [54, 17, "وَلَقَدۡ يَسَّرۡنَا ٱلۡقُرۡءَانَ لِلذِّكۡرِ فَهَلۡ مِن مُّدَّكِرٖ", "Dan demi sesungguhnya! Kami telah mudahkan Al-Quran untuk menjadi peringatan dan pengajaran, maka adakah sesiapa yang mahu mengambil peringatan dan pelajaran (daripadanya).", "And We have certainly made the Qur'an easy for remembrance, so is there any who will remember."], [12, 86, "قَالَ إِنَّمَآ أَشۡكُواْ بَثِّي وَحُزۡنِيٓ إِلَى ٱللَّهِ وَأَعۡلَمُ مِنَ ٱللَّهِ مَا لَا تَعۡلَمُونَ", "(Nabi Yaakub) menjawab: \"Sesungguhnya aku hanyalah mengadukan kesusahan dan dukacitaku kepada Allah dan aku mengetahui (dengan perantaraan wahyu) dari Allah, apa yang kamu tidak mengetahuinya.\"", "He said, \"I only complain of my suffering and my grief to Allah, and I know from Allah that which you do not know.\""], [39, 53, "۞قُلۡ يَٰعِبَادِيَ ٱلَّذِينَ أَسۡرَفُواْ عَلَىٰٓ أَنفُسِهِمۡ لَا تَقۡنَطُواْ مِن رَّحۡمَةِ ٱللَّهِۚ إِنَّ ٱللَّهَ يَغۡفِرُ ٱلذُّنُوبَ جَمِيعًاۚ إِنَّهُۥ هُوَ ٱلۡغَفُورُ ٱلرَّحِيمُ", "Katakanlah (wahai Muhammad): \"Wahai hamba-hambaKu yang telah melampaui batas terhadap diri mereka sendiri (dengan perbuatan-perbuatan maksiat), janganlah kamu berputus asa dari rahmat Allah, kerana sesungguhnya Allah mengampunkan segala dosa; sesungguhnya Dia lah jua Yang Maha Pengampun, lagi Maha Mengasihani.\"", "Say, \"O My servants who have transgressed against themselves [by sinning], do not despair of the mercy of Allah. Indeed, Allah forgives all sins. Indeed, it is He who is the Forgiving, the Merciful.\""], [20, 132, "وَأۡمُرۡ أَهۡلَكَ بِٱلصَّلَوٰةِ وَٱصۡطَبِرۡ عَلَيۡهَاۖ لَا نَسۡـَٔلُكَ رِزۡقٗاۖ نَّحۡنُ نَرۡزُقُكَۗ وَٱلۡعَٰقِبَةُ لِلتَّقۡوَىٰ", "Dan perintahkanlah keluargamu serta umatmu mengerjakan sembahyang, dan hendaklah engkau tekun bersabar menunaikannya. Kami tidak meminta rezeki kepadamu, (bahkan) Kamilah yang memberi rezeki kepadamu. Dan (ingatlah) kesudahan yang baik adalah bagi orang-orang yang bertaqwa.", "And enjoin prayer upon your family [and people] and be steadfast therein. We ask you not for provision; We provide for you, and the [best] outcome is for [those of] righteousness."], [3, 134, "ٱلَّذِينَ يُنفِقُونَ فِي ٱلسَّرَّآءِ وَٱلضَّرَّآءِ وَٱلۡكَٰظِمِينَ ٱلۡغَيۡظَ وَٱلۡعَافِينَ عَنِ ٱلنَّاسِۗ وَٱللَّهُ يُحِبُّ ٱلۡمُحۡسِنِينَ", "Iaitu orang-orang yang mendermakan hartanya pada masa senang dan susah, dan orang-orang yang menahan kemarahannya, dan orang-orang yang memaafkan kesalahan orang. Dan (ingatlah), Allah mengasihi orang-orang yang berbuat perkara-perkara yang baik.", "Who spend [in the cause of Allah] during ease and hardship and who restrain anger and who pardon the people - and Allah loves the doers of good."], [94, 7, "فَإِذَا فَرَغۡتَ فَٱنصَبۡ", "Kemudian apabila engkau telah selesai (daripada sesuatu amal soleh), maka bersungguh-sungguhlah engkau berusaha (mengerjakan amal soleh yang lain).", "So when you have finished [your duties], then stand up [for worship]."], [16, 128, "إِنَّ ٱللَّهَ مَعَ ٱلَّذِينَ ٱتَّقَواْ وَّٱلَّذِينَ هُم مُّحۡسِنُونَ", "Sesungguhnya Allah beserta orang-orang yang bertaqwa, dan orang-orang yang berusaha memperbaiki amalannya.", "Indeed, Allah is with those who fear Him and those who are doers of good."], [64, 16, "فَٱتَّقُواْ ٱللَّهَ مَا ٱسۡتَطَعۡتُمۡ وَٱسۡمَعُواْ وَأَطِيعُواْ وَأَنفِقُواْ خَيۡرٗا لِّأَنفُسِكُمۡۗ وَمَن يُوقَ شُحَّ نَفۡسِهِۦ فَأُوْلَـٰٓئِكَ هُمُ ٱلۡمُفۡلِحُونَ", "Oleh itu bertaqwalah kamu kepada Allah sedaya supaya kamu; dan dengarlah (akan pengajaran-pengajaranNya) serta taatlah (akan perintah-perintahNya); dan belanjakanlah harta kamu (serta buatlah) kebajikan untuk diri kamu. Dan (ingatlah), sesiapa yang menjaga serta memelihara dirinya daripada dipengaruhi oleh tabiat bakhilnya, maka merekalah orang-orang yang berjaya.", "So fear Allah as much as you are able and listen and obey and spend [in the way of Allah]; it is better for your selves. And whoever is protected from the stinginess of his soul - it is those who will be the successful."], [89, 28, "ٱرۡجِعِيٓ إِلَىٰ رَبِّكِ رَاضِيَةٗ مَّرۡضِيَّةٗ", "Kembalilah kepada Tuhanmu dengan keadaan engkau berpuas hati (dengan segala nikmat yang diberikan) lagi diredhai (di sisi Tuhanmu).", "Return to your Lord, well-pleased and pleasing [to Him]."], [2, 155, "وَلَنَبۡلُوَنَّكُم بِشَيۡءٖ مِّنَ ٱلۡخَوۡفِ وَٱلۡجُوعِ وَنَقۡصٖ مِّنَ ٱلۡأَمۡوَٰلِ وَٱلۡأَنفُسِ وَٱلثَّمَرَٰتِۗ وَبَشِّرِ ٱلصَّـٰبِرِينَ", "Demi sesungguhnya! Kami akan menguji kamu dengan sedikit perasaan takut (kepada musuh) dan (dengan merasai) kelaparan, dan (dengan berlakunya) kekurangan dari harta benda dan jiwa serta hasil tanaman. Dan berilah khabar gembira kepada orang-orang yang sabar.", "And We will surely test you with something of fear and hunger and a loss of wealth and lives and fruits, but give good tidings to the patient."], [93, 4, "وَلَلۡأٓخِرَةُ خَيۡرٞ لَّكَ مِنَ ٱلۡأُولَىٰ", "Dan sesungguhnya kesudahan keaadaanmu adalah lebih baik bagimu daripada permulaannya.", "And the Hereafter is better for you than the first [life]."], [2, 110, "وَأَقِيمُواْ ٱلصَّلَوٰةَ وَءَاتُواْ ٱلزَّكَوٰةَۚ وَمَا تُقَدِّمُواْ لِأَنفُسِكُم مِّنۡ خَيۡرٖ تَجِدُوهُ عِندَ ٱللَّهِۗ إِنَّ ٱللَّهَ بِمَا تَعۡمَلُونَ بَصِيرٞ", "Dan dirikanlah oleh kamu akan sembahyang dan tunaikanlah zakat dan apa jua yang kamu dahulukan dari kebaikan untuk diri kamu, tentulah kamu akan mendapat balasan pahalanya di sisi Allah. Sesungguhnya Allah sentiasa Melihat segala yang kamu kerjakan.", "And establish prayer and give zakah, and whatever good you put forward for yourselves - you will find it with Allah. Indeed, Allah of what you do, is Seeing."], [10, 57, "يَـٰٓأَيُّهَا ٱلنَّاسُ قَدۡ جَآءَتۡكُم مَّوۡعِظَةٞ مِّن رَّبِّكُمۡ وَشِفَآءٞ لِّمَا فِي ٱلصُّدُورِ وَهُدٗى وَرَحۡمَةٞ لِّلۡمُؤۡمِنِينَ", "Wahai umat manusia! Sesungguhnya telah datang kepada kamu Al-Quran yang menjadi nasihat pengajaran dari Tuhan kamu, dan yang menjadi penawar bagi penyakit-penyakit batin yang ada di dalam dada kamu, dan juga menjadi hidayah petunjuk untuk keselamatan, serta membawa rahmat bagi orang-orang yang beriman.", "O mankind, there has to come to you instruction from your Lord and healing for what is in the breasts and guidance and mercy for the believers."], [47, 24, "أَفَلَا يَتَدَبَّرُونَ ٱلۡقُرۡءَانَ أَمۡ عَلَىٰ قُلُوبٍ أَقۡفَالُهَآ", "(Setelah diterangkan yang demikian) maka adakah mereka sengaja tidak berusaha memahami serta memikirkan isi Al-Quran? Atau telah ada di atas hati mereka kunci penutup (yang menghalangnya daripada menerima ajaran Al-Quran).", "Then do they not reflect upon the Qur'an, or are there locks upon [their] hearts."], [13, 28, "ٱلَّذِينَ ءَامَنُواْ وَتَطۡمَئِنُّ قُلُوبُهُم بِذِكۡرِ ٱللَّهِۗ أَلَا بِذِكۡرِ ٱللَّهِ تَطۡمَئِنُّ ٱلۡقُلُوبُ", "(Iaitu) orang-orang yang beriman dan tenang tenteram hati mereka dengan zikrullah. Ketahuilah dengan \"zikrullah\" itu, tenang tenteramlah hati manusia.", "Those who have believed and whose hearts are assured by the remembrance of Allah. Unquestionably, by the remembrance of Allah hearts are assured."], [67, 2, "ٱلَّذِي خَلَقَ ٱلۡمَوۡتَ وَٱلۡحَيَوٰةَ لِيَبۡلُوَكُمۡ أَيُّكُمۡ أَحۡسَنُ عَمَلٗاۚ وَهُوَ ٱلۡعَزِيزُ ٱلۡغَفُورُ", "Dia lah yang telah mentakdirkan adanya mati dan hidup (kamu) - untuk menguji dan menzahirkan keadaan kamu: siapakah di antara kamu yang lebih baik amalnya; dan Ia Maha Kuasa (membalas amal kamu), lagi Maha Pengampun, (bagi orang-orang yang bertaubat).", "[He] who created death and life to test you [as to] which of you is best in deed - and He is the Exalted in Might, the Forgiving."], [14, 7, "وَإِذۡ تَأَذَّنَ رَبُّكُمۡ لَئِن شَكَرۡتُمۡ لَأَزِيدَنَّكُمۡۖ وَلَئِن كَفَرۡتُمۡ إِنَّ عَذَابِي لَشَدِيدٞ", "Dan (ingatlah) ketika Tuhan kamu memberitahu: \"Demi sesungguhnya! Jika kamu bersyukur nescaya Aku akan tambahi nikmatKu kepada kamu, dan demi sesungguhnya, jika kamu kufur ingkar sesungguhnya azabKu amatlah keras.\"", "And [remember] when your Lord proclaimed, 'If you are grateful, I will surely increase you [in favor]; but if you deny, indeed, My punishment is severe.'"], [18, 46, "ٱلۡمَالُ وَٱلۡبَنُونَ زِينَةُ ٱلۡحَيَوٰةِ ٱلدُّنۡيَاۖ وَٱلۡبَٰقِيَٰتُ ٱلصَّـٰلِحَٰتُ خَيۡرٌ عِندَ رَبِّكَ ثَوَابٗا وَخَيۡرٌ أَمَلٗا", "Harta benda dan anak pinak itu, ialah perhiasan hidup di dunia; dan amal-amal soleh yang kekal faedahnya itu lebih baik pada sisi Tuhanmu sebagai pahala balasan, dan lebih baik sebagai asas yang memberi harapan.", "Wealth and children are [but] adornment of the worldly life. But the enduring good deeds are better to your Lord for reward and better for [one's] hope."], [7, 23, "قَالَا رَبَّنَا ظَلَمۡنَآ أَنفُسَنَا وَإِن لَّمۡ تَغۡفِرۡ لَنَا وَتَرۡحَمۡنَا لَنَكُونَنَّ مِنَ ٱلۡخَٰسِرِينَ", "Mereka berdua merayu: \"Wahai Tuhan kami, kami telah menganiaya diri kami sendiri, dan kalau Engkau tidak mengampunkan kami dan memberi rahmat kepada kami, nescaya menjadilah kami dari orang-orang yang rugi.\"", "They said, \"Our Lord, we have wronged ourselves, and if You do not forgive us and have mercy upon us, we will surely be among the losers.\""], [2, 152, "فَٱذۡكُرُونِيٓ أَذۡكُرۡكُمۡ وَٱشۡكُرُواْ لِي وَلَا تَكۡفُرُونِ", "Oleh itu ingatlah kamu kepadaKu (dengan mematuhi hukum dan undang-undangKu), supaya Aku membalas kamu dengan kebaikan; dan bersyukurlah kamu kepadaKu dan janganlah kamu kufur (akan nikmatKu).", "So remember Me; I will remember you. And be grateful to Me and do not deny Me."], [96, 1, "ٱقۡرَأۡ بِٱسۡمِ رَبِّكَ ٱلَّذِي خَلَقَ", "Bacalah (wahai Muhammad) dengan nama Tuhanmu yang menciptakan (sekalian makhluk).", "Recite in the name of your Lord who created."], [28, 24, "فَسَقَىٰ لَهُمَا ثُمَّ تَوَلَّىٰٓ إِلَى ٱلظِّلِّ فَقَالَ رَبِّ إِنِّي لِمَآ أَنزَلۡتَ إِلَيَّ مِنۡ خَيۡرٖ فَقِيرٞ", "Maka Musa pun memberi minum kepada binatang-binatang ternak mereka, kemudian ia pergi ke tempat teduh lalu berdoa dengan berkata: \"Wahai Tuhanku, sesungguhnya aku sangat berhajat kepada sebarang rezeki pemberian yang Engkau berikan.\"", "So he watered [their flocks] for them; then he went back to the shade and said, \"My Lord, indeed I am, for whatever good You would send down to me, in need.\""], [59, 18, "يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُواْ ٱتَّقُواْ ٱللَّهَ وَلۡتَنظُرۡ نَفۡسٞ مَّا قَدَّمَتۡ لِغَدٖۖ وَٱتَّقُواْ ٱللَّهَۚ إِنَّ ٱللَّهَ خَبِيرُۢ بِمَا تَعۡمَلُونَ", "Wahai orang-orang yang beriman! Bertaqwalah kepada Allah (dengan mengerjakan suruhanNya dan meninggalkan laranganNya); dan hendaklah tiap-tiap diri melihat dan memerhatikan apa yang ia telah sediakan (dari amal-amalnya) untuk hari esok (hari akhirat). Dan (sekali lagi diingatkan): Bertaqwalah kepada Allah, sesungguhnya Allah Amat Meliputi PengetahuanNya akan segala yang kamu kerjakan.", "O you who have believed, fear Allah. And let every soul look to what it has put forth for tomorrow - and fear Allah. Indeed, Allah is Acquainted with what you do."], [6, 162, "قُلۡ إِنَّ صَلَاتِي وَنُسُكِي وَمَحۡيَايَ وَمَمَاتِي لِلَّهِ رَبِّ ٱلۡعَٰلَمِينَ", "Katakanlah: \"Sesungguhnya sembahyangku dan ibadatku, hidupku dan matiku, hanyalah untuk Allah Tuhan yang memelihara dan mentadbirkan sekalian alam.\"", "Say, \"Indeed, my prayer, my rites of sacrifice, my living and my dying are for Allah, Lord of the worlds.\""], [17, 9, "إِنَّ هَٰذَا ٱلۡقُرۡءَانَ يَهۡدِي لِلَّتِي هِيَ أَقۡوَمُ وَيُبَشِّرُ ٱلۡمُؤۡمِنِينَ ٱلَّذِينَ يَعۡمَلُونَ ٱلصَّـٰلِحَٰتِ أَنَّ لَهُمۡ أَجۡرٗا كَبِيرٗا", "Sesungguhnya Al-Quran ini memberi petunjuk ke jalan yang amat betul (ugama Islam), dan memberikan berita yang mengembirakan orang-orang yang beriman yang mengerjakan amal-amal soleh, bahawa mereka beroleh pahala yang besar.", "Indeed, this Qur'an guides to that which is most suitable and gives good tidings to the believers who do righteous deeds that they will have a great reward."], [94, 8, "وَإِلَىٰ رَبِّكَ فَٱرۡغَب", "Dan kepada Tuhanmu sahaja hendaklah engkau memohon (apa yang engkau gemar dan ingini).", "And to your Lord direct [your] longing."], [31, 17, "يَٰبُنَيَّ أَقِمِ ٱلصَّلَوٰةَ وَأۡمُرۡ بِٱلۡمَعۡرُوفِ وَٱنۡهَ عَنِ ٱلۡمُنكَرِ وَٱصۡبِرۡ عَلَىٰ مَآ أَصَابَكَۖ إِنَّ ذَٰلِكَ مِنۡ عَزۡمِ ٱلۡأُمُورِ", "Wahai anak kesayanganku, dirikanlah sembahyang, dan suruhlah berbuat kebaikan, serta laranglah daripada melakukan perbuatan yang mungkar, dan bersabarlah atas segala bala bencana yang menimpamu. Sesungguhnya yang demikian itu adalah dari perkara-perkara yang dikehendaki diambil berat melakukannya.", "O my son, establish prayer, enjoin what is right, forbid what is wrong, and be patient over what befalls you. Indeed, [all] that is of the matters [requiring] determination."], [38, 29, "كِتَٰبٌ أَنزَلۡنَٰهُ إِلَيۡكَ مُبَٰرَكٞ لِّيَدَّبَّرُوٓاْ ءَايَٰتِهِۦ وَلِيَتَذَكَّرَ أُوْلُواْ ٱلۡأَلۡبَٰبِ", "(Al-Quran ini) sebuah Kitab yang Kami turunkan kepadamu (dan umatmu wahai Muhammad), -Kitab yang banyak faedah-faedah dan manfaatnya, untuk mereka memahami dengan teliti kandungan ayat-ayatnya, dan untuk orang-orang yang berakal sempurna beringat mengambil iktibar.", "[This is] a blessed Book which We have revealed to you, [O Muhammad], that they might reflect upon its verses and that those of understanding would be reminded."], [71, 10, "فَقُلۡتُ ٱسۡتَغۡفِرُواْ رَبَّكُمۡ إِنَّهُۥ كَانَ غَفَّارٗا", "Sehingga aku berkata (kepada mereka): \"Pohonkanlah ampun kepada Tuhan kamu, sesungguhnya adalah Ia Maha Pengampun.\"", "And said, 'Ask forgiveness of your Lord. Indeed, He is ever a Perpetual Forgiver.'"], [40, 60, "وَقَالَ رَبُّكُمُ ٱدۡعُونِيٓ أَسۡتَجِبۡ لَكُمۡۚ إِنَّ ٱلَّذِينَ يَسۡتَكۡبِرُونَ عَنۡ عِبَادَتِي سَيَدۡخُلُونَ جَهَنَّمَ دَاخِرِينَ", "Dan Tuhan kamu berfirman: \"Berdoalah kamu kepadaKu nescaya Aku perkenankan doa permohonan kamu. Sesungguhnya orang-orang yang sombong takbur daripada beribadat dan berdoa kepadaKu, akan masuk neraka Jahannam dalam keadaan hina.\"", "And your Lord says, \"Call upon Me; I will respond to you.\" Indeed, those who disdain My worship will enter Hell [rendered] contemptible."], [2, 45, "وَٱسۡتَعِينُواْ بِٱلصَّبۡرِ وَٱلصَّلَوٰةِۚ وَإِنَّهَا لَكَبِيرَةٌ إِلَّا عَلَى ٱلۡخَٰشِعِينَ", "Dan mintalah pertolongan (kepada Allah) dengan jalan sabar dan mengerjakan sembahyang; dan sesungguhnya sembahyang itu amatlah berat kecuali kepada orang-orang yang khusyuk.", "And seek help through patience and prayer, and indeed, it is difficult except for the humbly submissive [to Allah]."], [9, 51, "قُل لَّن يُصِيبَنَآ إِلَّا مَا كَتَبَ ٱللَّهُ لَنَا هُوَ مَوۡلَىٰنَاۚ وَعَلَى ٱللَّهِ فَلۡيَتَوَكَّلِ ٱلۡمُؤۡمِنُونَ", "Katakanlah (wahai Muhammad): \"Tidak sekali-kali akan menimpa kami sesuatu pun melainkan apa yang telah ditetapkan Allah bagi kami. Dia lah Pelindung yang menyelamatkan kami, dan (dengan kepercayaan itu) maka kepada Allah jualah hendaknya orang-orang yang beriman bertawakal.\"", "Say, \"Never will we be struck except by what Allah has decreed for us; He is our protector.\" And upon Allah let the believers rely."], [20, 114, "فَتَعَٰلَى ٱللَّهُ ٱلۡمَلِكُ ٱلۡحَقُّۗ وَلَا تَعۡجَلۡ بِٱلۡقُرۡءَانِ مِن قَبۡلِ أَن يُقۡضَىٰٓ إِلَيۡكَ وَحۡيُهُۥۖ وَقُل رَّبِّ زِدۡنِي عِلۡمٗا", "Maka Maha Tinggilah Allah, yang Menguasai seluruh alam, lagi Yang Benar (pada segala-galanya). Dan janganlah engkau (wahai Muhammad) tergesa-gesa membaca Al-Quran sebelum selesai dibacakan oleh Jibril kepadamu, dan berdoalah dengan berkata: \"Wahai Tuhanku, tambahilah ilmuku.\"", "So high [above all] is Allah, the Sovereign, the Truth. And, [O Muhammad], do not hasten with [recitation of] the Qur'an before its revelation is completed to you, and say, \"My Lord, increase me in knowledge.\""], [2, 186, "وَإِذَا سَأَلَكَ عِبَادِي عَنِّي فَإِنِّي قَرِيبٌۖ أُجِيبُ دَعۡوَةَ ٱلدَّاعِ إِذَا دَعَانِۖ فَلۡيَسۡتَجِيبُواْ لِي وَلۡيُؤۡمِنُواْ بِي لَعَلَّهُمۡ يَرۡشُدُونَ", "Dan apabila hamba-hambaKu bertanya kepadamu mengenai Aku maka (beritahu kepada mereka): sesungguhnya Aku (Allah) sentiasa hampir (kepada mereka); Aku perkenankan permohonan orang yang berdoa apabila ia berdoa kepadaKu. Maka hendaklah mereka menyahut seruanku (dengan mematuhi perintahKu), dan hendaklah mereka beriman kepadaKu supaya mereka menjadi baik serta betul.", "And when My servants ask you, [O Muhammad], concerning Me - indeed I am near. I respond to the invocation of the supplicant when he calls upon Me. So let them respond to Me [by obedience] and believe in Me that they may be [rightly] guided."], [3, 190, "إِنَّ فِي خَلۡقِ ٱلسَّمَٰوَٰتِ وَٱلۡأَرۡضِ وَٱخۡتِلَٰفِ ٱلَّيۡلِ وَٱلنَّهَارِ لَأٓيَٰتٖ لِّأُوْلِي ٱلۡأَلۡبَٰبِ", "Sesungguhnya pada kejadian langit dan bumi, dan pada pertukaran malam dan siang, ada tanda-tanda (kekuasaan, kebijaksanaan, dan keluasan rahmat Allah) bagi orang-orang yang berakal.", "Indeed, in the creation of the heavens and the earth and the alternation of the night and the day are signs for those of understanding."], [14, 40, "رَبِّ ٱجۡعَلۡنِي مُقِيمَ ٱلصَّلَوٰةِ وَمِن ذُرِّيَّتِيۚ رَبَّنَا وَتَقَبَّلۡ دُعَآءِ", "Wahai Tuhanku! Jadikanlah daku orang yang mendirikan sembahyang dan demikianlah juga zuriat keturunanku. Wahai Tuhan kami, perkenankanlah doa permohonanku.", "My Lord, make me an establisher of prayer, and [many] from my descendants. Our Lord, and accept my supplication."], [55, 13, "فَبِأَيِّ ءَالَآءِ رَبِّكُمَا تُكَذِّبَانِ", "Maka yang mana satu di antara nikmat-nikmat Tuhan kamu, yang kamu hendak dustakan (wahai umat manusia dan jin).", "So which of the favors of your Lord would you deny."], [26, 62, "قَالَ كَلَّآۖ إِنَّ مَعِيَ رَبِّي سَيَهۡدِينِ", "Nabi Musa menjawab: \"Tidak! Jangan fikir (akan berlaku yang demikian)! Sesungguhnya aku sentiasa disertai oleh Tuhanku (dengan pemuliharaan dan pertolonganNya), Ia akan menunjuk jalan kepadaku.\"", "[Moses] said, \"No! Indeed, with me is my Lord; He will guide me.\""], [93, 5, "وَلَسَوۡفَ يُعۡطِيكَ رَبُّكَ فَتَرۡضَىٰٓ", "Dan sesungguhnya Tuhanmu akan memberikanmu (kejayaan dan kebahagiaan di dunia dan di akhirat) sehingga engkau reda - berpuas hati.", "And your Lord is going to give you, and you will be satisfied."], [7, 56, "وَلَا تُفۡسِدُواْ فِي ٱلۡأَرۡضِ بَعۡدَ إِصۡلَٰحِهَا وَٱدۡعُوهُ خَوۡفٗا وَطَمَعًاۚ إِنَّ رَحۡمَتَ ٱللَّهِ قَرِيبٞ مِّنَ ٱلۡمُحۡسِنِينَ", "Dan janganlah kamu berbuat kerosakan di bumi sesudah Allah menyediakan segala yang membawa kebaikan padanya, dan berdoalah kepadaNya dengan perasaan bimbang (kalau-kalau tidak diterima) dan juga dengan perasaan terlalu mengharapkan (supaya makbul). Sesungguhnya rahmat Allah itu dekat kepada orang-orang yang memperbaiki amalannya.", "And cause not corruption upon the earth after its reformation. And invoke Him in fear and aspiration. Indeed, the mercy of Allah is near to the doers of good."], [93, 3, "مَا وَدَّعَكَ رَبُّكَ وَمَا قَلَىٰ", "(Bahawa) Tuhanmu (wahai Muhammad) tidak meninggalkanmu, dan Ia tidak benci (kepadamu, sebagaimana yang dituduh oleh kaum musyrik).", "Your Lord has not taken leave of you, [O Muhammad], nor has He detested [you]."], [29, 69, "وَٱلَّذِينَ جَٰهَدُواْ فِينَا لَنَهۡدِيَنَّهُمۡ سُبُلَنَاۚ وَإِنَّ ٱللَّهَ لَمَعَ ٱلۡمُحۡسِنِينَ", "Dan orang-orang yang berusaha dengan bersungguh-sungguh kerana memenuhi kehendak ugama Kami, sesungguhnya Kami akan memimpin mereka ke jalan-jalan Kami (yang menjadikan mereka bergembira serta beroleh keredaan); dan sesungguhnya (pertolongan dan bantuan) Allah adalah berserta orang-orang yang berusaha membaiki amalannya.", "And those who strive for Us - We will surely guide them to Our ways. And indeed, Allah is with the doers of good."], [3, 139, "وَلَا تَهِنُواْ وَلَا تَحۡزَنُواْ وَأَنتُمُ ٱلۡأَعۡلَوۡنَ إِن كُنتُم مُّؤۡمِنِينَ", "Dan janganlah kamu merasa lemah (dalam perjuangan mempertahan dan menegakkan Islam), dan janganlah kamu berdukacita (terhadap apa yang akan menimpa kamu), padahal kamulah orang-orang yang tertinggi (mengatasi musuh dengan mencapai kemenangan) jika kamu orang-orang yang (sungguh-sungguh) beriman.", "So do not weaken and do not grieve, and you will be superior if you are [true] believers."], [23, 1, "قَدۡ أَفۡلَحَ ٱلۡمُؤۡمِنُونَ", "Sesungguhnya berjayalah orang-orang yang beriman.", "Certainly will the believers have succeeded."], [94, 6, "إِنَّ مَعَ ٱلۡعُسۡرِ يُسۡرٗا", "(Sekali lagi ditegaskan): bahawa sesungguhnya tiap-tiap kesukaran disertai kemudahan.", "Indeed, with hardship [will be] ease."], [42, 19, "ٱللَّهُ لَطِيفُۢ بِعِبَادِهِۦ يَرۡزُقُ مَن يَشَآءُۖ وَهُوَ ٱلۡقَوِيُّ ٱلۡعَزِيزُ", "Allah Maha Lembut tadbirNya (serta melimpah-limpah kebaikan dan belas kasihanNya) kepada hamba-hambaNya; Ia memberi rezeki kepada sesiapa yang dikehendakiNya (menurut peraturan yang telah ditetapkan), dan Dia lah Yang Maha Kuat, lagi Maha Kuasa.", "Allah is Subtle with His servants; He gives provisions to whom He wills. And He is the Powerful, the Exalted in Might."], [87, 14, "قَدۡ أَفۡلَحَ مَن تَزَكَّىٰ", "Sesungguhnya berjayalah orang yang - setelah menerima peringatan itu - berusaha membersihkan dirinya (dengan taat dan amal yang soleh).", "He has certainly succeeded who purifies himself."], [20, 25, "قَالَ رَبِّ ٱشۡرَحۡ لِي صَدۡرِي", "Nabi Musa berdoa dengan berkata: \"Wahai Tuhanku, lapangkanlah bagiku, dadaku.\"", "[Moses] said, \"My Lord, expand for me my breast [with assurance].\""], [18, 10, "إِذۡ أَوَى ٱلۡفِتۡيَةُ إِلَى ٱلۡكَهۡفِ فَقَالُواْ رَبَّنَآ ءَاتِنَا مِن لَّدُنكَ رَحۡمَةٗ وَهَيِّئۡ لَنَا مِنۡ أَمۡرِنَا رَشَدٗا", "(Ingatkanlah peristiwa) ketika serombongan orang-orang muda pergi ke gua, lalu mereka berdoa: \"Wahai Tuhan kami! Kurniakanlah kami rahmat dari sisiMu, dan berilah kemudahan-kemudahan serta pimpinan kepada kami untuk keselamatan ugama kami.\"", "[Mention] when the youths retreated to the cave and said, \"Our Lord, grant us from Yourself mercy and prepare for us from our affair right guidance.\""], [33, 41, "يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُواْ ٱذۡكُرُواْ ٱللَّهَ ذِكۡرٗا كَثِيرٗا", "Wahai orang-orang yang beriman, (untuk bersyukur kepada Allah) ingatlah serta sebutlah nama Allah dengan ingatan serta sebutan yang sebanyak-banyaknya.", "O you who have believed, remember Allah with much remembrance."], [51, 56, "وَمَا خَلَقۡتُ ٱلۡجِنَّ وَٱلۡإِنسَ إِلَّا لِيَعۡبُدُونِ", "Dan (ingatlah) Aku tidak menciptakan jin dan manusia melainkan untuk mereka menyembah dan beribadat kepadaKu.", "And I did not create the jinn and mankind except to worship Me."], [17, 82, "وَنُنَزِّلُ مِنَ ٱلۡقُرۡءَانِ مَا هُوَ شِفَآءٞ وَرَحۡمَةٞ لِّلۡمُؤۡمِنِينَ وَلَا يَزِيدُ ٱلظَّـٰلِمِينَ إِلَّا خَسَارٗا", "Dan Kami turunkan dengan beransur-ansur dari Al-Quran Aya-ayat Suci yang menjadi ubat penawar dan rahmat bagi orang-orang yang beriman kepadanya; dan (sebaliknya) Al-Quran tidak menambahkan orang-orang yang zalim (disebabkan keingkaran mereka) melainkan kerugian jua.", "And We send down of the Qur'an that which is healing and mercy for the believers, but it does not increase the wrongdoers except in loss."], [94, 5, "فَإِنَّ مَعَ ٱلۡعُسۡرِ يُسۡرًا", "Oleh itu, maka (tetapkanlah kepercayaanmu) bahawa sesungguhnya tiap-tiap kesukaran disertai kemudahan.", "For indeed, with hardship [will be] ease."], [11, 6, "۞وَمَا مِن دَآبَّةٖ فِي ٱلۡأَرۡضِ إِلَّا عَلَى ٱللَّهِ رِزۡقُهَا وَيَعۡلَمُ مُسۡتَقَرَّهَا وَمُسۡتَوۡدَعَهَاۚ كُلّٞ فِي كِتَٰبٖ مُّبِينٖ", "Dan tiadalah sesuatupun dari makhluk-makhluk yang bergerak di bumi melainkan Allah jualah yang menanggung rezekinya dan mengetahui tempat kediamannya dan tempat ia disimpan. Semuanya itu tersurat di dalam Kitab (Lauh mahfuz) yang nyata (kepada malaikat-malaikat yang berkenaan).", "And there is no creature on earth but that upon Allah is its provision, and He knows its place of dwelling and place of storage. All is in a clear register."], [12, 87, "يَٰبَنِيَّ ٱذۡهَبُواْ فَتَحَسَّسُواْ مِن يُوسُفَ وَأَخِيهِ وَلَا تَاْيۡـَٔسُواْ مِن رَّوۡحِ ٱللَّهِۖ إِنَّهُۥ لَا يَاْيۡـَٔسُ مِن رَّوۡحِ ٱللَّهِ إِلَّا ٱلۡقَوۡمُ ٱلۡكَٰفِرُونَ", "Wahai anak-anakku! Pergilah dan intiplah khabar berita mengenai Yusuf dan saudaranya (Bunyamin), dan janganlah kamu berputus asa dari rahmat serta pertolongan Allah. Sesungguhnya tidak berputus asa dari rahmat dan pertolongan Allah itu melainkan kaum yang kafir.", "O my sons, go and find out about Joseph and his brother and despair not of relief from Allah. Indeed, no one despairs of relief from Allah except the disbelieving people."], [3, 92, "لَن تَنَالُواْ ٱلۡبِرَّ حَتَّىٰ تُنفِقُواْ مِمَّا تُحِبُّونَۚ وَمَا تُنفِقُواْ مِن شَيۡءٖ فَإِنَّ ٱللَّهَ بِهِۦ عَلِيمٞ", "Kamu tidak sekali-kali akan dapat mencapai (hakikat) kebajikan dan kebaktian (yang sempurna) sebelum kamu dermakan sebahagian dari apa yang kamu sayangi. Dan sesuatu apa jua yang kamu dermakan maka sesungguhnya Allah mengetahuinya.", "Never will you attain the good [reward] until you spend [in the way of Allah] from that which you love. And whatever you spend - indeed, Allah is Knowing of it."], [49, 10, "إِنَّمَا ٱلۡمُؤۡمِنُونَ إِخۡوَةٞ فَأَصۡلِحُواْ بَيۡنَ أَخَوَيۡكُمۡۚ وَٱتَّقُواْ ٱللَّهَ لَعَلَّكُمۡ تُرۡحَمُونَ", "Sebenarnya orang-orang yang beriman itu adalah bersaudara, maka damaikanlah di antara dua saudara kamu (yang bertelingkah) itu; dan bertaqwalah kepada Allah supaya kamu beroleh rahmat.", "The believers are but brothers, so make settlement between your brothers. And fear Allah that you may receive mercy."], [4, 28, "يُرِيدُ ٱللَّهُ أَن يُخَفِّفَ عَنكُمۡۚ وَخُلِقَ ٱلۡإِنسَٰنُ ضَعِيفٗا", "Allah (sentiasa) hendak meringankan (beban hukumnya) daripada kamu, kerana manusia itu dijadikan berkeadaan lemah.", "And Allah wants to lighten for you [your difficulties]; and mankind was created weak."], [3, 8, "رَبَّنَا لَا تُزِغۡ قُلُوبَنَا بَعۡدَ إِذۡ هَدَيۡتَنَا وَهَبۡ لَنَا مِن لَّدُنكَ رَحۡمَةًۚ إِنَّكَ أَنتَ ٱلۡوَهَّابُ", "(Mereka berdoa dengan berkata): \"Wahai Tuhan kami! Janganlah Engkau memesongkan hati kami sesudah Engkau beri petunjuk kepada kami, dan kurniakanlah kepada kami limpah rahmat dari sisiMu; sesungguhnya Engkau jualah Tuhan Yang melimpah-limpah pemberianNya.\"", "[Who say], \"Our Lord, let not our hearts deviate after You have guided us and grant us from Yourself mercy. Indeed, You are the Bestower.\""], [2, 153, "يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُواْ ٱسۡتَعِينُواْ بِٱلصَّبۡرِ وَٱلصَّلَوٰةِۚ إِنَّ ٱللَّهَ مَعَ ٱلصَّـٰبِرِينَ", "Wahai sekalian orang-orang yang beriman! Mintalah pertolongan (untuk menghadapi susah payah dalam menyempurnakan sesuatu perintah Tuhan) dengan bersabar dan dengan (mengerjakan) sembahyang; kerana sesungguhnya Allah menyertai (menolong) orang-orang yang sabar.", "O you who have believed, seek help through patience and prayer. Indeed, Allah is with the patient."], [50, 16, "وَلَقَدۡ خَلَقۡنَا ٱلۡإِنسَٰنَ وَنَعۡلَمُ مَا تُوَسۡوِسُ بِهِۦ نَفۡسُهُۥۖ وَنَحۡنُ أَقۡرَبُ إِلَيۡهِ مِنۡ حَبۡلِ ٱلۡوَرِيدِ", "Dan demi sesungguhnya, Kami telah mencipta manusia dan Kami sedia mengetahui apa yang dibisikkan oleh hatinya, sedang (pengetahuan) Kami lebih dekat kepadanya daripada urat lehernya.", "And We have already created man and know what his soul whispers to him, and We are closer to him than [his] jugular vein."], [3, 200, "يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُواْ ٱصۡبِرُواْ وَصَابِرُواْ وَرَابِطُواْ وَٱتَّقُواْ ٱللَّهَ لَعَلَّكُمۡ تُفۡلِحُونَ", "Wahai orang-orang yang beriman! Bersabarlah kamu (menghadapi segala kesukaran dalam mengerjakan perkara-perkara yang berkebajikan), dan kuatkanlah kesabaran kamu lebih daripada kesabaran musuh, di medan perjuangan), dan bersedialah (dengan kekuatan pertahanan di daerah-daerah sempadan) serta bertaqwalah kamu kepada Allah supaya, kamu berjaya (mencapai kemenangan).", "O you who have believed, persevere and endure and remain stationed and fear Allah that you may be successful."], [8, 2, "إِنَّمَا ٱلۡمُؤۡمِنُونَ ٱلَّذِينَ إِذَا ذُكِرَ ٱللَّهُ وَجِلَتۡ قُلُوبُهُمۡ وَإِذَا تُلِيَتۡ عَلَيۡهِمۡ ءَايَٰتُهُۥ زَادَتۡهُمۡ إِيمَٰنٗا وَعَلَىٰ رَبِّهِمۡ يَتَوَكَّلُونَ", "Sesungguhnya orang-orang yang beriman itu (yang sempurna imannya) ialah mereka yang apabila disebut nama Allah (dan sifat-sifatNya) gementarlah hati mereka; dan apabila dibacakan kepada mereka ayat-ayatNya, menjadikan mereka bertambah iman, dan kepada Tuhan mereka jualah mereka berserah.", "The believers are only those who, when Allah is mentioned, their hearts become fearful, and when His verses are recited to them, it increases them in faith; and upon their Lord they rely."], [20, 46, "قَالَ لَا تَخَافَآۖ إِنَّنِي مَعَكُمَآ أَسۡمَعُ وَأَرَىٰ", "Allah berfirman: \"Janganlah kamu takut, sesungguhnya Aku ada bersama-sama kamu; Aku mendengar dan melihat segala-galanya.\"", "[Allah] said, \"Fear not. Indeed, I am with you both; I hear and I see.\""], [2, 201, "وَمِنۡهُم مَّن يَقُولُ رَبَّنَآ ءَاتِنَا فِي ٱلدُّنۡيَا حَسَنَةٗ وَفِي ٱلۡأٓخِرَةِ حَسَنَةٗ وَقِنَا عَذَابَ ٱلنَّارِ", "Dan di antara mereka pula ada yang (berdoa dengan) berkata: \"Wahai Tuhan kami, berilah kami kebaikan di dunia dan kebaikan di akhirat, dan peliharalah kami dari azab neraka.\"", "But among them is he who says, \"Our Lord, give us in this world [that which is] good and in the Hereafter [that which is] good and protect us from the punishment of the Fire.\""], [16, 97, "مَنۡ عَمِلَ صَٰلِحٗا مِّن ذَكَرٍ أَوۡ أُنثَىٰ وَهُوَ مُؤۡمِنٞ فَلَنُحۡيِيَنَّهُۥ حَيَوٰةٗ طَيِّبَةٗۖ وَلَنَجۡزِيَنَّهُمۡ أَجۡرَهُم بِأَحۡسَنِ مَا كَانُواْ يَعۡمَلُونَ", "Sesiapa yang beramal soleh, dari lelaki atau perempuan, sedang ia beriman, maka sesungguhnya Kami akan menghidupkan dia dengan kehidupan yang baik; dan sesungguhnya kami akan membalas mereka, dengan memberikan pahala yang lebih dari apa yang mereka telah kerjakan.", "Whoever does righteousness, whether male or female, while he is a believer - We will surely cause him to live a good life, and We will surely give them their reward [in the Hereafter] according to the best of what they used to do."], [65, 3, "وَيَرۡزُقۡهُ مِنۡ حَيۡثُ لَا يَحۡتَسِبُۚ وَمَن يَتَوَكَّلۡ عَلَى ٱللَّهِ فَهُوَ حَسۡبُهُۥٓۚ إِنَّ ٱللَّهَ بَٰلِغُ أَمۡرِهِۦۚ قَدۡ جَعَلَ ٱللَّهُ لِكُلِّ شَيۡءٖ قَدۡرٗا", "Serta memberinya rezeki dari jalan yang tidak terlintas di hatinya. Dan (Ingatlah), sesiapa berserah diri bulat-bulat kepada Allah, maka Allah cukuplah baginya (untuk menolong dan menyelamatkannya). Sesungguhnya Allah tetap melakukan segala perkara yang dikehendakiNya. Allah telahpun menentukan kadar dan masa bagi berlakunya tiap-tiap sesuatu.", "And will provide for him from where he does not expect. And whoever relies upon Allah - then He is sufficient for him. Indeed, Allah will accomplish His purpose. Allah has already set for everything a [decreed] extent."]];

// Life events a reading can be tagged with. Custom tags are stored as "~text".
const EVENT_TAGS = [
  ["exam", "📝", "Peperiksaan", "Exams"], ["sick", "🤒", "Sakit", "Illness"], ["baby", "👶", "Kelahiran", "New baby"],
  ["loss", "🕊️", "Kehilangan", "Loss"], ["travel", "✈️", "Musafir", "Travel"], ["wed", "💍", "Perkahwinan", "Wedding"],
  ["work", "💼", "Kerja baharu", "New job"], ["trial", "🤲", "Ujian hidup", "Hard times"],
];
function tagInfo(tag, lang) {
  if (!tag) return null;
  const t = EVENT_TAGS.find((x) => x[0] === tag);
  if (t) return { emoji: t[1], label: lang === "en" ? t[3] : t[2] };
  return { emoji: "🏷️", label: String(tag).replace(/^~/, "") };
}
// Quiz: Arabic text per page, split into files of 20 pages (/quran/p-00.json … p-30.json)
const quranFiles = new Map();
function loadQuranPages(page) {
  const f = String(Math.floor((page - 1) / 20)).padStart(2, "0");
  if (!quranFiles.has(f)) {
    quranFiles.set(f, fetch(`/quran/p-${f}.json`).then((r) => { if (!r.ok) throw new Error("quran"); return r.json(); })
      .catch((e) => { quranFiles.delete(f); throw e; }));
  }
  return quranFiles.get(f);
}
async function makeQuiz(a, b) {
  const page = a + Math.floor(Math.random() * (b - a + 1));
  const pages = await loadQuranPages(page);
  const list = pages[page] || [];
  if (!list.length) return null;
  const good = list.filter((x) => x[2].length >= 25 && x[2].length <= 190);
  const [s, ay, ar] = (good.length ? good : list)[Math.floor(Math.random() * (good.length ? good.length : list.length))];
  // distractors: other surahs in what was read, then neighbours
  const pool = [];
  for (let p = a; p <= b && pool.length < 12; p++) {
    const name = surahForPage(p), idx = SURAH_NAMES.indexOf(name) + 1;
    if (idx !== s && !pool.includes(idx)) pool.push(idx);
  }
  for (const d of [1, -1, 2, -2, 3, -3, 4]) { const n = s + d; if (n >= 1 && n <= 114 && n !== s && !pool.includes(n)) pool.push(n); }
  const others = pool.sort(() => Math.random() - 0.5).slice(0, 2);
  const options = [s, ...others].sort(() => Math.random() - 0.5);
  return { s, a: ay, ar, page, options, id: Date.now() };
}
const REPAIR_PER_MONTH = 2;
function ayatForDay(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return AYAT[Math.floor(Date.UTC(y, m - 1, d) / 86400000) % AYAT.length];
}

function juzForPage(page) {
  let j = 1;
  for (let i = 0; i < JUZ_START_PAGES.length; i++) if (page >= JUZ_START_PAGES[i]) j = i + 1;
  return j;
}
function surahForPage(page) {
  let s = 0;
  for (let i = 0; i < SURAH_START_PAGES.length; i++) if (page >= SURAH_START_PAGES[i]) s = i;
  return SURAH_NAMES[s];
}
function juzRange(j) {
  return [JUZ_START_PAGES[j - 1], j === 30 ? TOTAL_PAGES : JUZ_START_PAGES[j] - 1];
}

/* ---------- Dates (always the device's local calendar day) ---------- */
function isoOf(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function todayStr() { return isoOf(new Date()); }
function parseIso(iso) { return new Date(iso + "T00:00:00"); }
function addDays(iso, n) { const d = parseIso(iso); d.setDate(d.getDate() + n); return isoOf(d); }
function daysBetween(a, b) { return Math.round((parseIso(b) - parseIso(a)) / 86400000); }
function addMonths(key, n) { const [y, m] = key.split("-").map(Number); const d = new Date(y, m - 1 + n, 1); return isoOf(d).slice(0, 7); }

function readJson(key, fallback) {
  try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; } catch (e) { return fallback; }
}
function writeJson(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch (e) { return false; }
}
function readStr(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
function writeStr(key, v) { try { v == null ? localStorage.removeItem(key) : localStorage.setItem(key, v); } catch (e) {} }

function sortKhatams(list) {
  return [...list].sort((a, b) => (a.date === b.date ? a.ts - b.ts : a.date.localeCompare(b.date)));
}
function isAfterKhatam(entry, k) {
  if (!k) return true;
  if (entry.date !== k.date) return entry.date > k.date;
  return entry.ts > k.ts;
}
function cmpEntryAsc(a, b) { return a.date === b.date ? a.ts - b.ts : a.date.localeCompare(b.date); }

// Pages each entry covers. With "from": from–to. Without: continues from the previous entry's last page.
// Each khatam starts a fresh round.
function computeCoverage(entries, khatamsAsc) {
  const asc = [...entries].sort(cmpEntryAsc);
  const spans = {};
  let kIdx = 0, prevEnd = 0;
  for (const en of asc) {
    while (kIdx < khatamsAsc.length && isAfterKhatam(en, khatamsAsc[kIdx])) { kIdx++; prevEnd = 0; }
    let start, end = en.page;
    if (en.from) start = en.from;
    else if (prevEnd + 1 <= en.page) start = prevEnd + 1;
    else start = en.page;
    if (start > end) [start, end] = [end, start];
    spans[en.id] = [start, end];
    prevEnd = Math.max(start, end);
  }
  return spans;
}

async function api(path, opts = {}, token) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 9000);
  try {
    const res = await fetch("/api/" + path, {
      ...opts, signal: ctrl.signal, cache: "no-store",
      headers: { "content-type": "application/json", ...(token ? { authorization: "Bearer " + token } : {}) },
    });
    const ct = res.headers.get("content-type") || "";
    const body = ct.includes("application/json") ? await res.json() : null;
    return { ok: res.ok, status: res.status, body };
  } finally { clearTimeout(timer); }
}

function mergeStates(local, remote) {
  const deleted = {
    entries: uniq([...local.deleted.entries, ...remote.deleted.entries]),
    khatams: uniq([...local.deleted.khatams, ...remote.deleted.khatams]),
  };
  const byId = (mine, theirs, dead) => {
    const m = new Map();
    for (const x of theirs) m.set(x.id, x);
    for (const x of mine) m.set(x.id, x);
    return [...m.values()].filter((x) => !dead.has(x.id));
  };
  return {
    entries: byId(local.entries, remote.entries, new Set(deleted.entries)),
    khatams: byId(local.khatams, remote.khatams, new Set(deleted.khatams)),
    deleted,
    targetDate: local.targetDate || remote.targetDate || "",
    reminderMode: local.reminderMode || remote.reminderMode || "smart",

}

  const pad = "=".repeat((4 - (b64.length % 4)) % 4);

  const targetNeed = target && targetDaysLeft > 0 ? Math.ceil(remaining / targetDaysLeft) : null;

  const notesList = useMemo(() => sorted.filter((e) => e.note), [sorted]);
  // Search by surah name, note text, page number ("220" or "p.220") or date text
  const episodes = useMemo(() => {
    const tagged = entries.filter((e) => e.tag).sort((x, y) => x.date.localeCompare(y.date) || (x.ts || 0) - (y.ts || 0));
    const byTag = {};
    for (const e of tagged) (byTag[e.tag] = byTag[e.tag] || []).push(e);
    const eps = [];
    for (const [tg, list] of Object.entries(byTag)) {
      let cur = null;
      for (const e of list) {
        if (cur && daysBetween(cur.end, e.date) <= 7) { cur.items.push(e); cur.end = e.date; }
        else { cur = { tag: tg, start: e.date, end: e.date, items: [e] }; eps.push(cur); }
      }
    }
    return eps.map((ep) => {
      let pages = 0; const surahs = [];
      for (const e of ep.items) {
        const [a, b] = spans[e.id] || [e.page, e.page];
        pages += b - a + 1;
        for (let p = a; p <= b; p++) { const n = surahForPage(p); if (!surahs.includes(n)) surahs.push(n); }
      }
      return { ...ep, key: ep.tag + ep.start, pages, surahs, items: [...ep.items].reverse() };
    }).sort((x, y) => y.end.localeCompare(x.end));
  }, [entries, spans]);

  const searchResults = useMemo(() => {
    const q = query.trim().toLowerCase().replace(/^p\.?\s*/, "");
    if (!q) return [];
    const norm = (x) => x.toLowerCase().replace(/['’`-]/g, "");
    const qn = norm(q);
    return sorted.filter((en) => {
      const [a, b] = spans[en.id] || [en.page, en.page];
      if (/^\d+$/.test(q)) { const n = +q; return n >= a && n <= b; }
      const surahs = new Set([surahForPage(a), surahForPage(b), surahForPage(en.page)]);
      for (const sname of surahs) if (norm(sname).includes(qn)) return true;
      if (en.note && norm(en.note).includes(qn)) return true;
      if (en.tag && norm(tagInfo(en.tag, settings.lang).label).includes(qn)) return true;
      return norm(fmtLong(en.date)).includes(qn);
    });
  }, [query, sorted, spans, settings.lang]);
  const ayahsTotal = useMemo(() => entries.reduce((n, en) => { const [a, b] = spans[en.id] || [en.page, en.page]; return n + ayahsInSpan(a, b); }, 0), [entries, spans]);
  const hOff = settings.hijriOffset || 0;
  const ramadan = useMemo(() => ramadanInfo(today, hOff), [today, hOff]);
  const events = useMemo(() => upcomingEvents(today, hOff, 3), [today, hOff]);
  const smartHour = useMemo(() => smartHourOf(entries), [entries]);
  const fmtHijriShort = (iso) => { const h = hijriOf(iso, hOff); return h ? `${h.d} ${(HIJRI_MONTHS[settings.lang] || HIJRI_MONTHS.ms)[h.m - 1]}` : ""; };

  const badges = useMemo(() => {
    const k = khatamCount;
    const b = (id, icon, have, need) => ({ id, icon, have: Math.min(have, need), need, done: have >= need });
    return [
      b("first", "🌱", entries.length, 1),
      b("s7", "🔥", bestStreak, 7), b("s30", "🌙", bestStreak, 30), b("s100", "💎", bestStreak, 100),
      b("p100", "📖", totalPages, 100), b("p300", "📚", totalPages, 300),
      b("j1", "🕌", k > 0 ? 1 : juzDone, 1), b("j10", "⭐", k > 0 ? 10 : juzDone, 10), b("half", "🌗", k > 0 ? 15 : juzDone, 15),
      b("k1", "🏆", k, 1), b("k3", "👑", k, 3), b("n10", "✍️", notesList.length, 10),
      b("subuh", "🌅", timeStats.subuhRun, 7), b("maghrib", "🌆", timeStats.maghrib, 10), b("qiam", "🌌", timeStats.qiam, 3),
      b("jumaat", "📿", timeStats.fridays, 4), b("kahf", "⛰️", timeStats.kahf, 1), b("ganti", "🩹", repair.total, 1),
    ];
  }, [entries.length, bestStreak, totalPages, juzDone, khatamCount, notesList.length, timeStats, repair.total]);
  const badgesDone = badges.filter((x) => x.done).length;

  // Celebrations: only right after the owner logs or edits a reading on this device.
  const [celebration, setCelebration] = useState(null);
  const celebrateArmed = useRef(false);
  const prevSnap = useRef(null);
  function celebrate(msgs) {
    setCelebration({ msgs, id: Date.now() });
    try { if (navigator.vibrate) navigator.vibrate([40, 60, 40, 60, 80]); } catch (e) {}
    setTimeout(() => setCelebration((c) => (c && Date.now() - c.id >= 3100 ? null : c)), 3300);
  }
  useEffect(() => {
    const snap = { juz: juzFill.map((f) => f >= 1), streak, best: bestStreak, khatam: khatamCount, rep: repair.total, badges: badges.filter((b) => b.done).map((b) => b.id) };
    const prev = prevSnap.current;
    prevSnap.current = snap;
    if (!prev || !celebrateArmed.current) return;
    celebrateArmed.current = false;
    const msgs = [];
    if (snap.khatam > prev.khatam) msgs.push(T.celebrateKhatam);
    if (snap.rep > prev.rep) msgs.push(T.celebrateRepair);
    snap.juz.forEach((done, i) => { if (done && !prev.juz[i] && snap.khatam === prev.khatam) msgs.push(T.celebrateJuz(i + 1)); });
    const MILESTONES = [3, 7, 14, 21, 30, 40, 50, 60, 70, 80, 90, 100, 150, 200, 250, 300, 365];
    if (snap.streak > prev.streak && MILESTONES.includes(snap.streak)) msgs.push(T.celebrateStreak(snap.streak));
    else if (snap.best > prev.best && prev.best >= 3 && snap.best === prev.best + 1) msgs.push(T.celebrateBest(snap.best));
    snap.badges.filter((id) => !prev.badges.includes(id)).forEach((id) => msgs.push(T.celebrateBadge(T.badges[id][0])));
    if (msgs.length) celebrate(msgs.slice(0, 3));
  }, [juzFill, streak, bestStreak, khatamCount, badges, repair.total]);

  useEffect(() => {
    if (!quizPending || celebration || sheetOpen || doa || letterFor) return;
    const t = setTimeout(() => { setQuiz(quizPending); setQuizPending(null); }, 700);
    return () => clearTimeout(t);
  }, [quizPending, celebration, sheetOpen, doa, letterFor]);

  /* ----- actions ----- */
  function addKhatam(kDate, kNote, ts) {
    const k = { id: makeId("k"), date: kDate, note: (kNote || "").trim(), ts };
    const next = [...khatams, k];
    persistKhatams(next);
    const n = sortKhatams(next).findIndex((x) => x.id === k.id) + 1;
    setKhatamFlash(T.flash(n, fmtLong(kDate)));
    setKhatamOpen(true);
    setDoa({ n });
  }
  function parsePageInput(v) {
    if (v === "" || v == null) return null;
    const n = parseInt(v, 10);
    return Number.isInteger(n) && n >= 1 && n <= TOTAL_PAGES ? n : NaN;
  }
  function addEntry(e) {
    e.preventDefault();
    const to = parsePageInput(page);
    const from = parsePageInput(fromPage);
    if (to == null || Number.isNaN(to) || Number.isNaN(from)) { setFormError(T.invalidPage); return; }
    setFormError("");
    const entry = { id: makeId("e"), page: to, from: from && from !== to ? from : null, note: note.trim(), date, ts: Date.now(), ...(tag ? { tag } : {}) };
    celebrateArmed.current = true;
    const prevPage = lastEntry ? lastEntry.page : 0;
    persist([entry, ...entries]);
    if (settings.quiz !== false && readStr("qn-quiz-day") !== todayStr()) {
      writeStr("qn-quiz-day", todayStr());
      const qa = from || (prevPage && prevPage < to ? prevPage + 1 : to), qb = to;
      makeQuiz(Math.min(qa, qb), Math.max(qa, qb)).then((q) => q && setQuizPending(q)).catch(() => {});
    }
    if (to === TOTAL_PAGES) addKhatam(date, "", entry.ts + 1);
    setPage(""); setFromPage(""); setNote(""); setTag(""); setTagCarried(false);
    closeLog();
    haptic(15);
    showToast(T.savedToast(rangeLabel(entry)));
  }
  function deleteEntry(id) {
    const gone = entries.find((en) => en.id === id);
    if (!gone) return;
    haptic([12, 40, 12]);
    persistDeleted({ ...stateRef.current.deleted, entries: [...stateRef.current.deleted.entries, id] });
    persist(stateRef.current.entries.filter((en) => en.id !== id));
    setConfirmDeleteId(null); setEditId(null); setEditDraft(null);
    showToast(T.deletedToast(rangeLabel(gone)), 6000, { label: T.undo, fn: () => {
      const cur = stateRef.current;
      persistDeleted({ ...cur.deleted, entries: cur.deleted.entries.filter((x) => x !== id) });
      persist([gone, ...cur.entries.filter((en) => en.id !== id)]);
      haptic(10);
    } });
  }
  function startEdit(en) {
    setConfirmDeleteId(null);
    setEditId(en.id);
    setEditDraft({ from: en.from ? String(en.from) : "", page: String(en.page), date: en.date, note: en.note || "", tag: en.tag || "", err: "" });
  }
  function saveEdit(e) {
    e.preventDefault();
    const to = parsePageInput(editDraft.page);
    const from = parsePageInput(editDraft.from);
    if (to == null || Number.isNaN(to) || Number.isNaN(from)) { setEditDraft({ ...editDraft, err: T.invalidPage }); return; }
    celebrateArmed.current = true;
    persist(entries.map((en) => en.id === editId
      ? (({ tag: _t, ...rest }) => ({ ...rest, page: to, from: from && from !== to ? from : null, date: editDraft.date, note: editDraft.note.trim(), ...(editDraft.tag ? { tag: editDraft.tag } : {}) }))(en)
      : en));
    setEditId(null); setEditDraft(null);
  }
  function submitKhatam(e) {
    e.preventDefault();
    if (!khatamDate) return;
    addKhatam(khatamDate, khatamNote, Date.now());
    setKhatamNote("");
    setShowKhatamForm(false);
  }
  function deleteKhatam(id) {
    const gone = khatams.find((k) => k.id === id);
    if (!gone) return;
    haptic([12, 40, 12]);
    persistDeleted({ ...stateRef.current.deleted, khatams: [...stateRef.current.deleted.khatams, id] });
    persistKhatams(stateRef.current.khatams.filter((k) => k.id !== id));
    setConfirmKhatamId(null); setEditKhatamId(null); setKhatamDraft(null);
    setKhatamFlash("");
    showToast(T.deletedToast("khatam"), 6000, { label: T.undo, fn: () => {
      const cur = stateRef.current;
      persistDeleted({ ...cur.deleted, khatams: cur.deleted.khatams.filter((x) => x !== id) });
      persistKhatams([...cur.khatams.filter((k) => k.id !== id), gone]);
    } });
  }
  function startEditKhatam(k) {
    setConfirmKhatamId(null);
    setEditKhatamId(k.id);
    setKhatamDraft({ date: k.date, note: k.note || "" });
  }
  function saveEditKhatam(e) {
    e.preventDefault();
    if (!khatamDraft.date) return;
    persistKhatams(khatams.map((k) => k.id === editKhatamId ? { ...k, date: khatamDraft.date, note: khatamDraft.note.trim() } : k));
    setEditKhatamId(null); setKhatamDraft(null); setKhatamFlash("");
  }

  function backupPayload() {
    return { app: "quran-journal", version: 3, exportedAt: new Date().toISOString(), entries, khatams, settings: { targetDate: settings.targetDate } };
  }
  function exportBackup() {
    try {
      const blob = new Blob([JSON.stringify(backupPayload(), null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = `quran-note-backup-${today}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    } catch (e) { setBackupMsg(T.copyFail); }
  }
  async function copyBackup() {
    try { await navigator.clipboard.writeText(JSON.stringify(backupPayload())); setBackupMsg(T.copied); }
    catch (e) { setBackupMsg(T.copyFail); }
  }
  function onImportFile(ev) {
    const file = ev.target.files && ev.target.files[0];
    ev.target.value = "";
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(String(reader.result));
        const list = Array.isArray(data) ? data : data.entries;
        const ks = Array.isArray(data) ? [] : (data.khatams || []);
        if (!Array.isArray(list) || !list.every(validEntry) || !Array.isArray(ks) || !ks.every(validKhatam)) throw new Error("bad");
        setPendingImport({ entries: list, khatams: ks, settings: data.settings || null });
        setBackupMsg("");
      } catch (e) { setPendingImport(null); setBackupMsg(T.importBad); }
    };
    reader.readAsText(file);
  }
  function confirmImport() {
    const keepIds = new Set([...pendingImport.entries.map((x) => x.id), ...pendingImport.khatams.map((x) => x.id)]);
    persistDeleted({
      entries: uniq([...deleted.entries, ...entries.map((x) => x.id)]).filter((id) => !keepIds.has(id)),
      khatams: uniq([...deleted.khatams, ...khatams.map((x) => x.id)]).filter((id) => !keepIds.has(id)),
    });
    stateRef.current = { ...stateRef.current, entries: pendingImport.entries, khatams: pendingImport.khatams };
    setEntries(pendingImport.entries); writeJson(STORAGE_KEY, pendingImport.entries);
    persistKhatams(pendingImport.khatams);
    if (pendingImport.settings) persistSettings({ targetDate: pendingImport.settings.targetDate || "" });
    setPendingImport(null);
    setBackupMsg(T.importOk);
  }
  async function doInstall() {
    if (!installEvt) return;
    try { installEvt.prompt(); const res = await installEvt.userChoice; if (res && res.outcome === "accepted") setIsStandalone(true); } catch (e) {}
    setInstallEvt(null);
  }

  /* ----- pieces ----- */
  const rangeLabel = (en) => {
    const [a, b] = en.from ? [Math.min(en.from, en.page), Math.max(en.from, en.page)] : [en.page, en.page];
    return a === b ? `p.${b}` : `p.${a}–${b}`;
  };

  function EntryEditor() {
    return (
      <form onSubmit={saveEdit} style={{ marginTop: 2 }}>
        <div style={styles.formRow3}>
          <label style={styles.label}>{T.from}
            <input className="qt-input" type="number" min="1" max={TOTAL_PAGES} value={editDraft.from} placeholder="—"
              onChange={(e) => setEditDraft({ ...editDraft, from: e.target.value })} style={styles.input} />
          </label>
          <label style={styles.label}>{T.to}
            <input className="qt-input" type="number" min="1" max={TOTAL_PAGES} value={editDraft.page} required
              onChange={(e) => setEditDraft({ ...editDraft, page: e.target.value })} style={styles.input} />
          </label>
          <label style={{ ...styles.label, flex: 1.6 }}>{T.date}
            <input className="qt-input" type="date" value={editDraft.date} max={today} required
              onChange={(e) => setEditDraft({ ...editDraft, date: e.target.value })} style={styles.input} />
          </label>
        </div>
        <label style={styles.label}>{T.note}
          <textarea className="qt-textarea" rows={2} value={editDraft.note}
            onChange={(e) => setEditDraft({ ...editDraft, note: e.target.value })} style={styles.textarea} />
        </label>
        <div style={{ ...styles.label, marginBottom: 10 }}>{T.tagLabel}
          <TagPicker value={editDraft.tag} onChange={(v) => setEditDraft({ ...editDraft, tag: v })} T={T} lang={settings.lang} />
        </div>
        {editDraft.err && <div style={{ ...styles.errorText, marginTop: -6, marginBottom: 8 }}>{editDraft.err}</div>}
        <div style={{ display: "flex", gap: 8 }}>
          <button className="qt-btn" type="submit" style={styles.smallPrimary}>{T.save}</button>
          <button className="qt-btn" type="button" onClick={() => { setEditId(null); setEditDraft(null); }} style={styles.cancelBtn}>{T.cancel}</button>
          <button className="qt-btn" type="button" onClick={() => deleteEntry(editId)} style={{ ...styles.cancelBtn, marginLeft: "auto", color: "var(--danger)", display: "inline-flex", alignItems: "center", gap: 4 }}
            aria-label={T.del}><Icon name="trash" size={15} />{T.del}</button>
        </div>
      </form>
    );
  }

  function EntryCard({ en, showDate }) {
    if (editId === en.id) return <div style={styles.entryRow}>{EntryEditor()}</div>;
    const body = (
      <>
        <div style={styles.entryPage}>
          <span style={styles.mono}>{rangeLabel(en)}</span>
          <span style={styles.entryJuz}>{surahForPage(en.page)} · Juz' {juzForPage(en.page)}</span>
        </div>
        {showDate && <div style={styles.entryDate}>{fmtLong(en.date)}</div>}
        {en.tag && (() => { const ti = tagInfo(en.tag, settings.lang); return <div style={{ marginTop: 5 }}><span style={styles.tagPill}>{ti.emoji} {ti.label}</span></div>; })()}
        {en.note && <div style={styles.entryNote}>{en.note}</div>}
      </>
    );
    if (!canEdit) return <div style={styles.entryRow}>{body}</div>;
    return (
      <SwipeRow onTap={() => { haptic(8); startEdit(en); }} onSwipe={() => deleteEntry(en.id)} label={`${T.edit} ${rangeLabel(en)}`} delLabel={T.del}>
        {body}
      </SwipeRow>
    );
  }

  const syncLabel = { saved: T.syncSaved, saving: T.syncSaving, offline: T.syncOffline, error: T.syncError }[syncState];

  /* ----- settings rows ----- */
  const notifValue = !serverMode ? "" : role !== "owner" ? "" : notif === "on" ? (settings.reminderMode === "fixed" ? T.remindFixed : T.remindSmart) : notif === "denied" ? "✕" : T.soundOff;
  const settingRows = [
    ...(canEdit ? [{ key: "name", icon: "idcard", title: T.nameTitle, value: jname || T.nameNone, body: (
      <form onSubmit={(e) => { e.preventDefault(); const v = e.currentTarget.elements.qnname.value; saveName(v); haptic(8); showToast(cleanName(v) ? T.nameSaved(cleanName(v)) : T.nameCleared); }}>
        <div style={{ display: "flex", gap: 8 }}>
          <input key={jname} name="qnname" defaultValue={jname} maxLength={30} autoComplete="nickname" placeholder={T.namePh} aria-label={T.nameTitle}
            style={{ ...styles.input, fontFamily: "'Lora', serif", fontSize: 15, flex: 1 }} />
          <button className="qt-btn" type="submit" style={{ ...styles.smallPrimary, padding: "0 16px" }}>{T.nameSave}</button>
        </div>
        <div style={{ ...styles.hint, marginTop: 8, marginBottom: 0 }}>{PERSONAL || role === "local" ? T.nameHintLocal : T.nameHintOwner}</div>
      </form>
    ) }] : []),
    { key: "theme", icon: "moon", title: T.theme, value: { auto: T.themeAuto, light: T.themeLight, dark: T.themeDark }[settings.theme], body: (
      <div style={styles.segment}>
        {[["auto", T.themeAuto], ["light", T.themeLight], ["dark", T.themeDark]].map(([k, l]) => (
          <button key={k} className="qt-btn" type="button" onClick={() => persistSettings({ theme: k })}
            aria-pressed={settings.theme === k} style={{ ...styles.segBtn, ...(settings.theme === k ? styles.segBtnOn : {}) }}>{l}</button>
        ))}
      </div>
    ) },
    { key: "accent", icon: "palette", title: T.accent, value: (ACCENTS[settings.accent] || ACCENTS.zamrud)[settings.lang === "en" ? "en" : "ms"], body: (
      <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 8 }}>
        {Object.entries(ACCENTS).map(([k, a]) => {
          const on = (settings.accent || "zamrud") === k;
          return (
            <button key={k} className="qt-btn" type="button" onClick={() => { haptic(8); persistSettings({ accent: k }); }} aria-pressed={on}
              style={{ background: "transparent", border: "none", padding: 0, cursor: "pointer", color: "var(--ink)", fontFamily: "'Lora', serif" }}>
              <span style={{ display: "block", height: 44, borderRadius: 12, background: `linear-gradient(135deg, ${a.hex}, ${a.hex}cc 60%, #C9A94F)`,
                boxShadow: on ? "0 0 0 2px var(--card), 0 0 0 4px var(--gold)" : "none", marginBottom: 6 }} />
              <span style={{ fontSize: 11.5, fontWeight: on ? 700 : 400 }}>{a[settings.lang === "en" ? "en" : "ms"]}</span>
            </button>
          );
        })}
      </div>
    ) },
    ...(canEdit ? [{ key: "quiz", icon: "bulb", title: T.quizSetting, value: settings.quiz === false ? T.soundOff : T.soundOn, body: (
      <div>
        <div style={styles.segment}>
          {[[true, T.soundOn], [false, T.soundOff]].map(([v, l]) => (
            <button key={l} className="qt-btn" type="button" onClick={() => persistSettings({ quiz: v })} aria-pressed={(settings.quiz !== false) === v}
              style={{ ...styles.segBtn, ...((settings.quiz !== false) === v ? styles.segBtnOn : {}) }}>{l}</button>
          ))}
        </div>
        <div style={{ ...styles.hint, marginBottom: 0 }}>{T.quizSettingHint(quizScore())}</div>
      </div>
    ) }] : []),
    { key: "shareapp", icon: "share", title: T.shareApp, value: "", body: <ShareApp T={T} name={canEdit ? jname : ""} canJournal={role === "owner" && !PERSONAL} onCopied={() => showToast(T.shareCopied)} /> },
    { key: "lang", icon: "globe", title: T.language, value: settings.lang === "en" ? "English" : "Bahasa Melayu", body: (
      <div style={styles.segment}>
        {[["ms", "Bahasa Melayu"], ["en", "English"]].map(([k, l]) => (
          <button key={k} className="qt-btn" type="button" onClick={() => persistSettings({ lang: k })}
            aria-pressed={settings.lang === k} style={{ ...styles.segBtn, ...(settings.lang === k ? styles.segBtnOn : {}) }}>{l}</button>
        ))}
      </div>
    ) },
    { key: "font", icon: "text", title: T.fontSize, value: { 1: T.fontNormal, 1.12: T.fontLarge, 1.25: T.fontXL }[settings.fontScale || 1] || T.fontNormal, body: (
      <div style={styles.segment}>
        {[[1, T.fontNormal], [1.12, T.fontLarge], [1.25, T.fontXL]].map(([k, l]) => (
          <button key={k} className="qt-btn" type="button" onClick={() => persistSettings({ fontScale: k })}
            aria-pressed={(settings.fontScale || 1) === k} style={{ ...styles.segBtn, ...((settings.fontScale || 1) === k ? styles.segBtnOn : {}) }}>{l}</button>
        ))}
      </div>
    ) },
    { key: "sound", icon: "volume", title: T.sound, value: settings.sound ? T.soundOn : T.soundOff, body: (
      <>
        <div style={styles.hint}>{T.soundHint}</div>
        <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
          <div style={styles.segment}>
            {[[true, T.soundOn], [false, T.soundOff]].map(([v, l]) => (
              <button key={l} className="qt-btn" type="button" onClick={() => persistSettings({ sound: v })}
                aria-pressed={settings.sound === v} style={{ ...styles.segBtn, ...(settings.sound === v ? styles.segBtnOn : {}) }}>{l}</button>

/* ---------- Row you can tap (edit) or swipe left (delete) ---------- */
function SwipeRow({ children, onTap, onSwipe, label, delLabel, flat }) {
  const [dx, setDx] = useState(0);
  const st = useRef(null);
  const moved = useRef(false);
  const onStart = (e) => { const t = e.touches[0]; st.current = { x: t.clientX, y: t.clientY, lock: null }; moved.current = false; };
  const onMove = (e) => {
    if (!st.current) return;
    const t = e.touches[0], ddx = t.clientX - st.current.x, ddy = t.clientY - st.current.y;
    if (st.current.lock == null && (Math.abs(ddx) > 8 || Math.abs(ddy) > 8)) st.current.lock = Math.abs(ddx) > Math.abs(ddy) ? "x" : "y";
    if (st.current.lock === "x") { moved.current = true; setDx(Math.max(-140, Math.min(0, ddx))); }
  };
  const onEnd = () => { if (dx < -90) onSwipe(); setDx(0); st.current = null; };
  const inner = flat ? { padding: "10px 4px", borderTop: "1px solid var(--line)", background: "var(--card)" } : { ...styles.entryRow, marginBottom: 0 };
  return (
    <div style={flat ? { position: "relative", overflow: "hidden" } : styles.swipeWrap}>

/* ---------- Calendar heatmap ---------- */
function Heatmap({ pagesByDate, covered, today, T, fmtLong }) {
  const [sel, setSel] = useState(null);
  const scrollRef = useRef(null);
  const WEEKS = 26;
  const todayDow = (parseIso(today).getDay() + 6) % 7; // 0 = Monday
  const start = addDays(today, -(todayDow + (WEEKS - 1) * 7));
  const weeks = [];
  for (let w = 0; w < WEEKS; w++) {
    const col = [];
    for (let d = 0; d < 7; d++) col.push(addDays(start, w * 7 + d));
    weeks.push(col);
  }
  useEffect(() => { if (scrollRef.current) scrollRef.current.scrollLeft = scrollRef.current.scrollWidth; }, []);
  const level = (n) => (!n ? 0 : n <= 2 ? 1 : n <= 5 ? 2 : n <= 10 ? 3 : 4);
  const colors = ["var(--h0)", "var(--h1)", "var(--h2)", "var(--h3)", "var(--h4)"];
  const monthLabel = (iso) => parseIso(iso).toLocaleDateString(T.locale, { month: "short" });
  const readDays = Object.keys(pagesByDate).filter((d) => d >= start && d <= today).length;

  return (
    <div style={styles.historySection}>
      <div ref={scrollRef} className="qt-heat" style={styles.heatScroll}>
        <div style={{ display: "flex", gap: 3 }}>
          {weeks.map((col, wi) => {
            const first = col[0];
            const showMonth = wi === 0 || parseIso(first).getMonth() !== parseIso(weeks[wi - 1][0]).getMonth();
            return (
              <div key={wi} style={{ display: "flex", flexDirection: "column", gap: 3 }}>
                <div style={styles.heatMonth}>{showMonth ? monthLabel(first) : ""}</div>
                {col.map((d) => {
                  const future = d > today;
                  const n = pagesByDate[d] || 0;
                  const cov = !n && covered && covered.has(d);
                  return (
                    <button key={d} className="qt-btn" disabled={future} onClick={() => setSel(d)}
                      aria-label={cov ? T.calCovered(fmtLong(d)) : T.calDay(fmtLong(d), n)}
                      style={{ ...styles.heatCell, background: future || cov ? "transparent" : colors[level(n)], boxShadow: cov ? "inset 0 0 0 1.5px var(--gold)" : "none",
                        outline: sel === d ? "2px solid var(--gold)" : "none", cursor: future ? "default" : "pointer" }} />
                  );
                })}
              </div>
            );
          })}
        </div>
      </div>
      <div style={styles.heatLegend}>
        <span>{T.calLegend}</span>
        {colors.map((c) => <span key={c} style={{ ...styles.heatCell, width: 11, height: 11, background: c, display: "inline-block" }} />)}
        <span>{T.calMore}</span>
        <span style={{ marginLeft: "auto" }}><span style={styles.mono}>{readDays}</span>/{WEEKS * 7 - (6 - todayDow)}</span>
      </div>
      <div style={styles.heatInfo}>{sel ? (!pagesByDate[sel] && covered && covered.has(sel) ? T.calCovered(fmtLong(sel)) : T.calDay(fmtLong(sel), pagesByDate[sel] || 0)) : T.calTap}</div>
    </div>
  );
}

/* ---------- Confetti (respects reduced motion) ---------- */
function Confetti() {
  const ref = useRef(null);
  useEffect(() => {
    try { if (matchMedia("(prefers-reduced-motion: reduce)").matches) return; } catch (e) {}
    const c = ref.current; if (!c) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const W = (c.width = innerWidth * dpr), H = (c.height = innerHeight * dpr);
    const ctx = c.getContext("2d");
    const colors = ["#D9BC7A", "#C9A94F", "#F3ECD8", "#13664D", "#2E9E74"];
    const parts = Array.from({ length: 140 }, () => ({
      x: W / 2 + (Math.random() - 0.5) * W * 0.3, y: H * 0.18, vx: (Math.random() - 0.5) * 14 * dpr, vy: (-Math.random() * 12 - 4) * dpr,
      s: (Math.random() * 6 + 4) * dpr, r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.3, c: colors[(Math.random() * colors.length) | 0],
    }));
    let raf, t0 = performance.now();
    const tick = (t) => {
      ctx.clearRect(0, 0, W, H);
      for (const p of parts) { p.vy += 0.35 * dpr; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); }
      if (t - t0 < 2800) raf = requestAnimationFrame(tick); else ctx.clearRect(0, 0, W, H);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, []);
  return <canvas ref={ref} aria-hidden="true" style={{ position: "fixed", inset: 0, width: "100vw", height: "100vh", pointerEvents: "none", zIndex: 79 }} />;
}

let qrLib = null;
function loadQr() {
  if (window.qrcode) return Promise.resolve(window.qrcode);
  if (!qrLib) qrLib = new Promise((res, rej) => {
    const sc = document.createElement("script");
    sc.src = "https://unpkg.com/qrcode-generator@1.4.4/qrcode.js"; sc.crossOrigin = "anonymous";
    sc.onload = () => (window.qrcode ? res(window.qrcode) : rej(new Error("qr")));
    sc.onerror = () => { qrLib = null; rej(new Error("qr")); };
    document.head.appendChild(sc);
  });
  return qrLib;
}
