<script>
  // Apply the saved theme before anything paints (avoids a light flash in dark mode).
  (function () {
    try {
      var s = JSON.parse(localStorage.getItem("quran-journal-settings") || "{}");
      var t = s.theme || "auto";
      if (t === "auto") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) { document.documentElement.setAttribute("data-theme", "light"); }
  })();

<script>
  // Show the opening scene for 1.5 s (1.2 s + 0.3 s fade); if the app is still loading, wait for it.
  (function () {
    var el = document.getElementById("splash"), minDone = false, ready = false, gone = false;
    function hide() {
      if (gone || !minDone || !ready) return;
      gone = true; el.classList.add("out");
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 320);
    }
    setTimeout(function () { minDone = true; hide(); }, 1200);
    window.addEventListener("app-ready", function () { ready = true; hide(); });
    setTimeout(function () { ready = true; minDone = true; hide(); }, 8000);
  })();
</script>

function juzForPage(page) {
  let j = 1;
  for (let i = 0; i < JUZ_START_PAGES.length; i++) if (page >= JUZ_START_PAGES[i]) j = i + 1;
  return j;
}
function surahForPage(page) {
  let s = 0;
  for (let i = 0; i < SURAH_START_PAGES.length; i++) if (page >= SURAH_START_PAGES[i]) s = i;
  return SURAH_NAMES[s];
}
function juzRange(j) {
  return [JUZ_START_PAGES[j - 1], j === 30 ? TOTAL_PAGES : JUZ_START_PAGES[j] - 1];

/* ---------- Dates (always the device's local calendar day) ---------- */
function isoOf(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function todayStr() { return isoOf(new Date()); }
function parseIso(iso) { return new Date(iso + "T00:00:00"); }
function addDays(iso, n) { const d = parseIso(iso); d.setDate(d.getDate() + n); return isoOf(d); }
function daysBetween(a, b) { return Math.round((parseIso(b) - parseIso(a)) / 86400000); }
function addMonths(key, n) { const [y, m] = key.split("-").map(Number); const d = new Date(y, m - 1 + n, 1); return isoOf(d).slice(0, 7); }

function readJson(key, fallback) {
  try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; } catch (e) { return fallback; }
}
function writeJson(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch (e) { return false; }
}
function readStr(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
function writeStr(key, v) { try { v == null ? localStorage.removeItem(key) : localStorage.setItem(key, v); } catch (e) {} }

function sortKhatams(list) {
  return [...list].sort((a, b) => (a.date === b.date ? a.ts - b.ts : a.date.localeCompare(b.date)));
}
function isAfterKhatam(entry, k) {
  if (!k) return true;
  if (entry.date !== k.date) return entry.date > k.date;
  return entry.ts > k.ts;
}
function cmpEntryAsc(a, b) { return a.date === b.date ? a.ts - b.ts : a.date.localeCompare(b.date); }

// Pages each entry covers. With "from": from–to. Without: continues from the previous entry's last page.
// Each khatam starts a fresh round.
function computeCoverage(entries, khatamsAsc) {
  const asc = [...entries].sort(cmpEntryAsc);
  const spans = {};
  let kIdx = 0, prevEnd = 0;
  for (const en of asc) {
    while (kIdx < khatamsAsc.length && isAfterKhatam(en, khatamsAsc[kIdx])) { kIdx++; prevEnd = 0; }
    let start, end = en.page;
    if (en.from) start = en.from;
    else if (prevEnd + 1 <= en.page) start = prevEnd + 1;
    else start = en.page;
    if (start > end) [start, end] = [end, start];
    spans[en.id] = [start, end];
    prevEnd = Math.max(start, end);
  }
  return spans;
}

function makeId(prefix) { return `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`; }

function validEntry(e) {
  return e && typeof e.id === "string" && Number.isInteger(e.page) && e.page >= 1 && e.page <= TOTAL_PAGES &&
    typeof e.date === "string" && /^\d{4}-\d{2}-\d{2}$/.test(e.date) && typeof e.ts === "number" &&
    (e.from == null || (Number.isInteger(e.from) && e.from >= 1 && e.from <= TOTAL_PAGES));
}
function validKhatam(k) {
  return k && typeof k.id === "string" && typeof k.date === "string" && /^\d{4}-\d{2}-\d{2}$/.test(k.date) && typeof k.ts === "number";
}

async function api(path, opts = {}, token) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 9000);
  try {
    const res = await fetch("/api/" + path, {
      ...opts, signal: ctrl.signal, cache: "no-store",
      headers: { "content-type": "application/json", ...(token ? { authorization: "Bearer " + token } : {}) },
    });
    const ct = res.headers.get("content-type") || "";
    const body = ct.includes("application/json") ? await res.json() : null;
    return { ok: res.ok, status: res.status, body };
  } finally { clearTimeout(timer); }
}

function docToState(doc) {
  return {
    entries: Array.isArray(doc?.entries) ? doc.entries : [],
    khatams: Array.isArray(doc?.khatams) ? doc.khatams : [],
    deleted: { entries: doc?.deleted?.entries || [], khatams: doc?.deleted?.khatams || [] },
    targetDate: doc?.settings?.targetDate || "",
  };
}
function stateToDoc(s) {
  let tz = "Asia/Kuala_Lumpur";

  return { entries: s.entries, khatams: s.khatams, deleted: s.deleted, settings: { targetDate: s.targetDate || "", tz } };
}
// Union by id (this device wins on the same id), minus anything deleted on either side.
function mergeStates(local, remote) {
  const deleted = {
    entries: uniq([...local.deleted.entries, ...remote.deleted.entries]),
    khatams: uniq([...local.deleted.khatams, ...remote.deleted.khatams]),
  };
  const byId = (mine, theirs, dead) => {
    const m = new Map();
    for (const x of theirs) m.set(x.id, x);
    for (const x of mine) m.set(x.id, x);
    return [...m.values()].filter((x) => !dead.has(x.id));
  };
  return {
    entries: byId(local.entries, remote.entries, new Set(deleted.entries)),
    khatams: byId(local.khatams, remote.khatams, new Set(deleted.khatams)),
    deleted,
    targetDate: local.targetDate || remote.targetDate || "",
  };
}

  const pad = "=".repeat((4 - (b64.length % 4)) % 4);

  return Uint8Array.from([...raw].map((c) => c.charCodeAt(0)));

    try { setIsStandalone(window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true); } catch (e) {}
    return () => window.removeEventListener("beforeinstallprompt", onPrompt);
  }, []);

  /* ----- persistence ----- */
  function flagSave(ok) { setSaveError(ok ? "" : T.saveErr); }
  function applyState(s) {
    setEntries(s.entries); setKhatams(s.khatams); setDeleted(s.deleted);
    writeJson(STORAGE_KEY, s.entries); writeJson(KHATAM_KEY, s.khatams); writeJson(DELETED_KEY, s.deleted);
    setSettings((prev) => { const next = { ...prev, targetDate: s.targetDate || "" }; writeJson(SETTINGS_KEY, next); return next; });
    stateRef.current = { entries: s.entries, khatams: s.khatams, deleted: s.deleted, targetDate: s.targetDate || "" };
  }
  function persist(next) { setEntries(next); stateRef.current = { ...stateRef.current, entries: next }; flagSave(writeJson(STORAGE_KEY, next)); queueSync(); }
  function persistKhatams(next) { setKhatams(next); stateRef.current = { ...stateRef.current, khatams: next }; flagSave(writeJson(KHATAM_KEY, next)); queueSync(); }
  function persistDeleted(next) { setDeleted(next); stateRef.current = { ...stateRef.current, deleted: next }; writeJson(DELETED_KEY, next); }
  function persistSettings(patch) {
    const next = { ...settings, ...patch };
    setSettings(next);
    flagSave(writeJson(SETTINGS_KEY, next));
    if ("targetDate" in patch) { stateRef.current = { ...stateRef.current, targetDate: next.targetDate }; queueSync(); }
  }

  /* ----- sync ----- */
  function queueSync() {
    if (roleRef.current !== "owner") return;
    writeStr(DIRTY_KEY, "1");
    setSyncState("saving");
    clearTimeout(syncTimer.current);
    syncTimer.current = setTimeout(() => doSync(0), 700);
  }
  async function doSync(attempt) {
    if (roleRef.current !== "owner") return;
    if (syncing.current) { clearTimeout(syncTimer.current); syncTimer.current = setTimeout(() => doSync(attempt), 500); return; }
    syncing.current = true;
    let retry = false;
    try {
      const r = await api("journal", { method: "PUT", body: JSON.stringify({ doc: stateToDoc(stateRef.current), baseVersion: versionRef.current }) }, tokenRef.current);
      if (r.ok && r.body) { setVersion(r.body.version); writeStr(DIRTY_KEY, null); setSyncState("saved"); }
      else if (r.status === 409 && r.body && attempt < 3) {
        applyState(mergeStates(stateRef.current, docToState(r.body.doc)));
        setVersion(r.body.version);
        retry = true;
      } else if (r.status === 401) { signOut(); }
      else setSyncState("error");
    } catch (e) {
      setSyncState("offline");
    } finally {
      syncing.current = false;
    }
    if (retry) doSync(attempt + 1);
  }
  async function pullFromServer() {
    try {
      const r = await api("journal");
      if (!r.ok || !r.body || typeof r.body.version !== "number") return;
      setHasOwner(!!r.body.hasOwner);
      if (r.body.doc && r.body.version > versionRef.current && !readStr(DIRTY_KEY)) {
        applyState(docToState(r.body.doc)); setVersion(r.body.version);
      }
    } catch (e) {}
  }

  // Start-up: find out whether a server is available and who this device is.
  useEffect(() => {
    let cancelled = false;
    (async () => {
      let r = null;
      if (/^https?:$/.test(location.protocol)) { try { r = await api("journal"); } catch (e) { r = null; } }
      if (cancelled) return;
      if (!r || !r.body || typeof r.body.version !== "number") {
        if (readStr(MODE_KEY) === "server" && /^https?:$/.test(location.protocol)) {
          setRole(tokenRef.current ? "owner" : "viewer");
          setSyncState(readStr(DIRTY_KEY) ? "offline" : "saved");
        } else setRole("local");
        return;
      }
      writeStr(MODE_KEY, "server");
      setHasOwner(!!r.body.hasOwner);
      let next = "viewer";
      if (tokenRef.current) {
        try {
          const a = await api("auth", {}, tokenRef.current);
          if (a.body && a.body.valid) next = "owner";
          else if (a.body) { tokenRef.current = null; writeStr(TOKEN_KEY, null); }
        } catch (e) { next = "owner"; }
      }
      if (cancelled) return;
      const remote = r.body.doc;
      roleRef.current = next;
      if (remote) {
        if (next === "owner" && readStr(DIRTY_KEY)) {
          applyState(mergeStates(stateRef.current, docToState(remote)));
          setVersion(r.body.version);
          setRole(next);
          queueSync();
        } else {
          applyState(docToState(remote));
          setVersion(r.body.version);
          setRole(next);
        }
      } else {
        setVersion(0);
        setRole(next);
        if (next === "owner") queueSync();
      }
    })();
    return () => { cancelled = true; };
  }, []);

  // Refresh when the app comes back to the foreground; retry pending sync when back online.
  useEffect(() => {
    const onVis = () => {
      if (document.visibilityState !== "visible") return;
      if (roleRef.current === "owner" && readStr(DIRTY_KEY)) doSync(0);
      else if (roleRef.current === "owner" || roleRef.current === "viewer") pullFromServer();
    };
    const onOnline = () => { if (roleRef.current === "owner" && readStr(DIRTY_KEY)) doSync(0); };
    document.addEventListener("visibilitychange", onVis);
    window.addEventListener("online", onOnline);
    const id = setInterval(() => { if (roleRef.current === "viewer" && document.visibilityState === "visible") pullFromServer(); }, 60000);
    return () => { document.removeEventListener("visibilitychange", onVis); window.removeEventListener("online", onOnline); clearInterval(id); };
  }, []);

  /* ----- owner sign-in ----- */
  async function submitLogin(e) {
    e.preventDefault();
    setLoginErr("");
    const claim = !hasOwner;
    if (pin.length < 6) { setLoginErr(T.pinShort); return; }
    if (claim && pin !== pin2) { setLoginErr(T.pinMismatch); return; }
    setLoginBusy(true);
    try {
      const r = await api("auth", { method: "POST", body: JSON.stringify({ mode: claim ? "claim" : "login", pin }) });
      if (r.ok && r.body && r.body.token) {
        tokenRef.current = r.body.token; writeStr(TOKEN_KEY, r.body.token);
        setHasOwner(true);
        setLoginOpen(false); setPin(""); setPin2("");
        const j = await api("journal");
        if (j.ok && j.body && j.body.doc) {
          applyState(docToState(j.body.doc)); setVersion(j.body.version); setRole("owner"); setSyncState("saved");
        } else {
          setVersion(j.body ? j.body.version : 0); setRole("owner"); queueSync();
        }
      } else if (r.status === 401) setLoginErr(T.wrongPin(r.body ? r.body.left : 0));
      else if (r.status === 429) setLoginErr(T.tooMany);
      else if (r.status === 409) { setHasOwner(true); setLoginErr(""); }
      else if (r.body && r.body.error === "pin_too_short") setLoginErr(T.pinShort);
      else setLoginErr(T.netErr);
    } catch (err) { setLoginErr(T.netErr); }
    setLoginBusy(false);
  }
  function signOut() {
    tokenRef.current = null; writeStr(TOKEN_KEY, null); writeStr(DIRTY_KEY, null);
    setRole("viewer"); setSyncState("saved");
    pullFromServer();
  }

  /* ----- notifications ----- */
  useEffect(() => {
    if (!PUSH_OK || role !== "owner") return;
    let done = false;
    const t = setTimeout(() => { if (!done) setNotif(Notification.permission === "denied" ? "denied" : "off"); }, 4000);
    navigator.serviceWorker.ready.then((reg) => reg.pushManager.getSubscription()).then((sub) => {
      done = true; clearTimeout(t);
      setNotif(sub ? "on" : (Notification.permission === "denied" ? "denied" : "off"));
    }).catch(() => { done = true; setNotif("off"); });
    return () => clearTimeout(t);
  }, [role]);
  async function enableNotif() {
    setNotifMsg(""); setNotif("busy");
    try {
      const perm = await Notification.requestPermission();
      if (perm !== "granted") { setNotif(perm === "denied" ? "denied" : "off"); return; }
      const reg = await navigator.serviceWorker.ready;
      const k = await api("push");
      if (!k.ok || !k.body) throw new Error("key");
      let sub = await reg.pushManager.getSubscription();
      if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64ToUint8Array(k.body.publicKey) });
      const r = await api("push", { method: "POST", body: JSON.stringify({ subscription: sub.toJSON() }) }, tokenRef.current);
      if (!r.ok) throw new Error("save");
      setNotif("on");
    } catch (e) { setNotif("off"); setNotifMsg(T.netErr); }
  }
  async function disableNotif() {
    setNotifMsg(""); setNotif("busy");
    try {
      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.getSubscription();
      if (sub) {
        await api("push", { method: "DELETE", body: JSON.stringify({ endpoint: sub.endpoint }) }, tokenRef.current).catch(() => {});
        await sub.unsubscribe();
      }
      setNotif("off");
    } catch (e) { setNotif("on"); setNotifMsg(T.netErr); }
  }
  async function testNotif() {
    setNotifMsg("");
    try {
      const r = await api("push", { method: "POST", body: JSON.stringify({ action: "test" }) }, tokenRef.current);
      setNotifMsg(r.ok && r.body ? T.notifSent(r.body.sent) : T.netErr);
    } catch (e) { setNotifMsg(T.netErr); }
  }

  const fmtDate = (iso) => parseIso(iso).toLocaleDateString(T.locale, { weekday: "short", day: "numeric", month: "short" });
  const fmtLong = (iso) => parseIso(iso).toLocaleDateString(T.locale, { weekday: "short", day: "numeric", month: "short", year: "numeric" });
  const fmtMonth = (key) => parseIso(key + "-01").toLocaleDateString(T.locale, { month: "long", year: "numeric" });

  /* ----- derived ----- */
  const khatamsAsc = useMemo(() => sortKhatams(khatams), [khatams]);
  const khatamCount = khatamsAsc.length;
  const lastKhatam = khatamsAsc[khatamCount - 1] || null;
  const spans = useMemo(() => computeCoverage(entries, khatamsAsc), [entries, khatamsAsc]);

  const sorted = useMemo(() => [...entries].sort((a, b) => -cmpEntryAsc(a, b)), [entries]);
  const grouped = useMemo(() => {
    const map = new Map();
    for (const en of sorted) {
      if (!map.has(en.date)) map.set(en.date, []);
      map.get(en.date).push(en);
    }
    return [...map.entries()];
  }, [sorted]);

  const months = useMemo(() => {
    const out = [];
    for (const [d, list] of grouped) {
      const key = d.slice(0, 7);
      let m = out[out.length - 1];
      if (!m || m.key !== key) { m = { key, days: [], pages: 0, minP: Infinity, maxP: 0 }; out.push(m); }
      m.days.push([d, list]);
      for (const en of list) {
        const [a, b] = spans[en.id] || [en.page, en.page];
        m.pages += b - a + 1;
        m.minP = Math.min(m.minP, a);
        m.maxP = Math.max(m.maxP, b);
      }
    }
    return out;
  }, [grouped, spans]);
  const [openMonths, setOpenMonths] = useState(() => new Set());
  function toggleMonth(key) {
    setOpenMonths((prev) => { const next = new Set(prev); next.has(key) ? next.delete(key) : next.add(key); return next; });
  }

  const coveredPages = useMemo(() => {
    const s = new Set();
    for (const en of entries) {
      if (!isAfterKhatam(en, lastKhatam)) continue;
      const [a, b] = spans[en.id] || [en.page, en.page];
      for (let p = a; p <= b; p++) s.add(p);
    }
    return s;
  }, [entries, spans, lastKhatam]);
  const coveredCount = coveredPages.size;
  const progressPct = Math.min(100, Math.round((coveredCount / TOTAL_PAGES) * 100));
  const remaining = TOTAL_PAGES - coveredCount;

  const juzFill = useMemo(() => JUZ_START_PAGES.map((_, i) => {
    const [a, b] = juzRange(i + 1);
    let c = 0;
    for (let p = a; p <= b; p++) if (coveredPages.has(p)) c++;
    return c / (b - a + 1);
  }), [coveredPages]);
  const juzDone = juzFill.filter((f) => f >= 1).length;

  const lastEntry = sorted[0] || null;

  const pagesByDate = useMemo(() => {
    const m = {};
    for (const en of entries) {
      const [a, b] = spans[en.id] || [en.page, en.page];
      m[en.date] = (m[en.date] || 0) + (b - a + 1);
    }
    return m;
  }, [entries, spans]);

  const streak = useMemo(() => {
    const days = new Set(entries.map((e) => e.date));
    let count = 0;
    let cursor = days.has(today) ? today : addDays(today, -1);
    while (days.has(cursor)) { count++; cursor = addDays(cursor, -1); }
    return count;
  }, [entries, today]);

  const bestStreak = useMemo(() => {
    const days = [...new Set(entries.map((e) => e.date))].sort();
    let best = 0, run = 0, prev = null;
    for (const d of days) { run = prev && addDays(prev, 1) === d ? run + 1 : 1; best = Math.max(best, run); prev = d; }
    return best;
  }, [entries]);
  const totalPages = useMemo(() => Object.values(pagesByDate).reduce((a, b) => a + b, 0), [pagesByDate]);
  const readingDays = Object.keys(pagesByDate).length;

  const pace = useMemo(() => {
    const start = addDays(today, -29);
    let sum = 0;
    for (const [d, n] of Object.entries(pagesByDate)) if (d >= start && d <= today) sum += n;
    return sum / 30;
  }, [pagesByDate, today]);
  const etaIso = pace > 0 && remaining > 0 ? addDays(today, Math.ceil(remaining / pace)) : null;

  const target = settings.targetDate;
  const targetDaysLeft = target ? daysBetween(today, target) + 1 : null;
  const targetNeed = target && targetDaysLeft > 0 ? Math.ceil(remaining / targetDaysLeft) : null;

  const notesList = useMemo(() => sorted.filter((e) => e.note), [sorted]);

  const badges = useMemo(() => {
    const k = khatamCount;
    const b = (id, icon, have, need) => ({ id, icon, have: Math.min(have, need), need, done: have >= need });
    return [
      b("first", "🌱", entries.length, 1),
      b("s7", "🔥", bestStreak, 7), b("s30", "🌙", bestStreak, 30), b("s100", "💎", bestStreak, 100),
      b("p100", "📖", totalPages, 100), b("p300", "📚", totalPages, 300),
      b("j1", "🕌", k > 0 ? 1 : juzDone, 1), b("j10", "⭐", k > 0 ? 10 : juzDone, 10), b("half", "🌗", k > 0 ? 15 : juzDone, 15),
      b("k1", "🏆", k, 1), b("k3", "👑", k, 3), b("n10", "✍️", notesList.length, 10),
    ];
  }, [entries.length, bestStreak, totalPages, juzDone, khatamCount, notesList.length]);
  const badgesDone = badges.filter((x) => x.done).length;

  /* ----- actions ----- */
  function addKhatam(kDate, kNote, ts) {
    const k = { id: makeId("k"), date: kDate, note: (kNote || "").trim(), ts };
    const next = [...khatams, k];
    persistKhatams(next);
    const n = sortKhatams(next).findIndex((x) => x.id === k.id) + 1;
    setKhatamFlash(T.flash(n, fmtLong(kDate)));
    setKhatamOpen(true);
  }
  function parsePageInput(v) {
    if (v === "" || v == null) return null;
    const n = parseInt(v, 10);
    return Number.isInteger(n) && n >= 1 && n <= TOTAL_PAGES ? n : NaN;
  }
  function addEntry(e) {
    e.preventDefault();
    const to = parsePageInput(page);
    const from = parsePageInput(fromPage);
    if (to == null || Number.isNaN(to) || Number.isNaN(from)) { setFormError(T.invalidPage); return; }
    setFormError("");
    const entry = { id: makeId("e"), page: to, from: from && from !== to ? from : null, note: note.trim(), date, ts: Date.now() };
    persist([entry, ...entries]);
    if (to === TOTAL_PAGES) addKhatam(date, "", entry.ts + 1);
    setPage(""); setFromPage(""); setNote("");
  }
  function deleteEntry(id) {
    persistDeleted({ ...deleted, entries: [...deleted.entries, id] });
    persist(entries.filter((en) => en.id !== id));
    setConfirmDeleteId(null);
  }
  function startEdit(en) {
    setConfirmDeleteId(null);
    setEditId(en.id);
    setEditDraft({ from: en.from ? String(en.from) : "", page: String(en.page), date: en.date, note: en.note || "", err: "" });
  }
  function saveEdit(e) {
    e.preventDefault();
    const to = parsePageInput(editDraft.page);
    const from = parsePageInput(editDraft.from);
    if (to == null || Number.isNaN(to) || Number.isNaN(from)) { setEditDraft({ ...editDraft, err: T.invalidPage }); return; }
    persist(entries.map((en) => en.id === editId
      ? { ...en, page: to, from: from && from !== to ? from : null, date: editDraft.date, note: editDraft.note.trim() }
      : en));
    setEditId(null); setEditDraft(null);
  }
  function submitKhatam(e) {
    e.preventDefault();
    if (!khatamDate) return;
    addKhatam(khatamDate, khatamNote, Date.now());
    setKhatamNote("");
    setShowKhatamForm(false);
  }
  function deleteKhatam(id) {
    persistDeleted({ ...deleted, khatams: [...deleted.khatams, id] });
    persistKhatams(khatams.filter((k) => k.id !== id));
    setConfirmKhatamId(null);
    setKhatamFlash("");
  }
  function startEditKhatam(k) {
    setConfirmKhatamId(null);
    setEditKhatamId(k.id);
    setKhatamDraft({ date: k.date, note: k.note || "" });
  }
  function saveEditKhatam(e) {
    e.preventDefault();
    if (!khatamDraft.date) return;
    persistKhatams(khatams.map((k) => k.id === editKhatamId ? { ...k, date: khatamDraft.date, note: khatamDraft.note.trim() } : k));
    setEditKhatamId(null); setKhatamDraft(null); setKhatamFlash("");
  }

  function backupPayload() {
    return { app: "quran-journal", version: 3, exportedAt: new Date().toISOString(), entries, khatams, settings: { targetDate: settings.targetDate } };
  }
  function exportBackup() {
    try {
      const blob = new Blob([JSON.stringify(backupPayload(), null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = `quran-journal-backup-${today}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    } catch (e) { setBackupMsg(T.copyFail); }
  }
  async function copyBackup() {
    try { await navigator.clipboard.writeText(JSON.stringify(backupPayload())); setBackupMsg(T.copied); }
    catch (e) { setBackupMsg(T.copyFail); }
  }
  function onImportFile(ev) {
    const file = ev.target.files && ev.target.files[0];
    ev.target.value = "";
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(String(reader.result));
        const list = Array.isArray(data) ? data : data.entries;
        const ks = Array.isArray(data) ? [] : (data.khatams || []);
        if (!Array.isArray(list) || !list.every(validEntry) || !Array.isArray(ks) || !ks.every(validKhatam)) throw new Error("bad");
        setPendingImport({ entries: list, khatams: ks, settings: data.settings || null });
        setBackupMsg("");
      } catch (e) { setPendingImport(null); setBackupMsg(T.importBad); }
    };
    reader.readAsText(file);
  }
  function confirmImport() {
    const keepIds = new Set([...pendingImport.entries.map((x) => x.id), ...pendingImport.khatams.map((x) => x.id)]);
    persistDeleted({
      entries: uniq([...deleted.entries, ...entries.map((x) => x.id)]).filter((id) => !keepIds.has(id)),
      khatams: uniq([...deleted.khatams, ...khatams.map((x) => x.id)]).filter((id) => !keepIds.has(id)),
    });
    stateRef.current = { ...stateRef.current, entries: pendingImport.entries, khatams: pendingImport.khatams };
    setEntries(pendingImport.entries); writeJson(STORAGE_KEY, pendingImport.entries);
    persistKhatams(pendingImport.khatams);
    if (pendingImport.settings) persistSettings({ targetDate: pendingImport.settings.targetDate || "" });
    setPendingImport(null);
    setBackupMsg(T.importOk);
  }
  async function doInstall() {
    if (!installEvt) return;
    try { installEvt.prompt(); const res = await installEvt.userChoice; if (res && res.outcome === "accepted") setIsStandalone(true); } catch (e) {}
    setInstallEvt(null);
  }

  /* ----- pieces ----- */
  const rangeLabel = (en) => {
    const [a, b] = en.from ? [Math.min(en.from, en.page), Math.max(en.from, en.page)] : [en.page, en.page];
    return a === b ? `p.${b}` : `p.${a}–${b}`;
  };

  function EntryEditor() {
    return (
      <form onSubmit={saveEdit} style={{ marginTop: 2 }}>
        <div style={styles.formRow3}>
          <label style={styles.label}>{T.from}
            <input className="qt-input" type="number" min="1" max={TOTAL_PAGES} value={editDraft.from} placeholder="—"
              onChange={(e) => setEditDraft({ ...editDraft, from: e.target.value })} style={styles.input} />
          </label>
          <label style={styles.label}>{T.to}
            <input className="qt-input" type="number" min="1" max={TOTAL_PAGES} value={editDraft.page} required
              onChange={(e) => setEditDraft({ ...editDraft, page: e.target.value })} style={styles.input} />
          </label>
          <label style={{ ...styles.label, flex: 1.6 }}>{T.date}
            <input className="qt-input" type="date" value={editDraft.date} max={today} required
              onChange={(e) => setEditDraft({ ...editDraft, date: e.target.value })} style={styles.input} />
          </label>
        </div>
        <label style={styles.label}>{T.note}
          <textarea className="qt-textarea" rows={2} value={editDraft.note}
            onChange={(e) => setEditDraft({ ...editDraft, note: e.target.value })} style={styles.textarea} />
        </label>
        {editDraft.err && <div style={{ ...styles.errorText, marginTop: -6, marginBottom: 8 }}>{editDraft.err}</div>}
        <div style={{ display: "flex", gap: 8 }}>
          <button className="qt-btn" type="submit" style={styles.smallPrimary}>{T.save}</button>
          <button className="qt-btn" type="button" onClick={() => { setEditId(null); setEditDraft(null); }} style={styles.cancelBtn}>{T.cancel}</button>
        </div>
      </form>
    );
  }

  function EntryCard({ en, showDate }) {
    if (editId === en.id) return <div style={styles.entryRow}>{EntryEditor()}</div>;
    return (
      <div style={{ ...styles.entryRow, ...(canEdit ? {} : { paddingRight: 12 }) }}>
        <div style={styles.entryPage}>
          <span style={styles.mono}>{rangeLabel(en)}</span>
          <span style={styles.entryJuz}>{surahForPage(en.page)} · Juz' {juzForPage(en.page)}</span>
        </div>
        {showDate && <div style={styles.entryDate}>{fmtLong(en.date)}</div>}
        {en.note && <div style={styles.entryNote}>{en.note}</div>}
        {canEdit && (confirmDeleteId === en.id ? (
          <div style={styles.confirmRow}>
            <span style={{ fontSize: 12, opacity: 0.75 }}>{T.removeEntryQ}</span>
            <button className="qt-btn" onClick={() => deleteEntry(en.id)} style={styles.confirmBtn}>{T.yesRemove}</button>

      <div style={styles.container}>

            {["ms", "en"].map((l) => (
              <button key={l} className="qt-btn" onClick={() => persistSettings({ lang: l })}

        {role === "viewer" && (
          <div style={styles.viewerBanner}>
            <span style={{ flex: 1 }}>👁 {T.viewerBanner}</span>

          </div>

        <header style={styles.header}>

        </header>

        <div style={styles.mihrabWrap}>
          <div style={styles.mihrab}>
            <div style={styles.mihrabInner}>
              {lastEntry ? (
                <>
                  <div style={styles.mihrabLabel}>{T.lastRead}</div>
                  <a href={`https://quran.com/page/${lastEntry.page}`} target="_blank" rel="noopener noreferrer"
                    style={styles.mihrabLink} aria-label={T.openQuran(lastEntry.page)}>
                    <span style={styles.mihrabPage}><span style={styles.mono}>p. {lastEntry.page}</span></span>
                    <span style={styles.openHint}>{T.openQuranShort} ↗</span>

                  <div style={styles.mihrabSurah}>{surahForPage(lastEntry.page)}</div>
                  <div style={styles.mihrabMeta}>Juz' {juzForPage(lastEntry.page)} · {fmtDate(lastEntry.date)}</div>
                </>
              ) : (
                <>
                  <div style={styles.mihrabLabel}>{T.noEntries}</div>
                  <div style={styles.mihrabMeta}>{T.startHint}</div>
                </>
              )}
              <div style={styles.streakRow}>
                <div style={styles.streakChip}><span style={styles.mono}>{streak}</span> {T.streak(streak)}</div>
                <div style={styles.streakChip}><span style={styles.mono}>{coveredCount}</span>/{TOTAL_PAGES} {T.pages}</div>
                <div style={styles.streakChip}><span style={styles.mono}>{khatamCount}</span>{T.khatamChip}</div>
              </div>
            </div>
          </div>
        </div>

        <div style={styles.progressSection}>
          <div style={styles.progressTrack}>
            <div style={{ ...styles.progressFill, width: `${progressPct}%` }} />

          <div style={styles.progressLabel}>
            {T.through(progressPct)}{khatamCount > 0 ? ` · ${T.round(khatamCount + 1)}` : ""}
          </div>
        </div>

        <div style={styles.juzGrid}>
          {juzFill.map((f, i) => {
            const num = i + 1;
            const pct = Math.round(f * 100);
            const fillStyle = f >= 1 ? styles.juzMarkFilled
              : f > 0 ? { background: `linear-gradient(0deg, #C9A94F ${pct}%, var(--muted) ${pct}%)`, color: "#16342B" } : {};
            return (
              <div key={num} title={`Juz' ${num} · ${pct}%`} style={{ ...styles.juzMark, ...fillStyle }}>
                <span style={{ ...styles.mono, fontSize: 10 }}>{num}</span>
              </div>
            );
          })}
        </div>

        <section style={styles.estCard}>
          <div style={styles.estRow}>
            <div style={{ flex: 1 }}>
              <div style={styles.estLabel}>{T.estTitle}</div>
              {etaIso ? (
                <>
                  <div style={styles.estValue}>{fmtLong(etaIso)}</div>
                  <div style={styles.estSub}>{T.estPace(pace.toFixed(1))} · {T.estLeft(remaining)}</div>
                </>
              ) : (

          </div>
          <div style={styles.estDivider} />
          {editingTarget ? (

            <div style={styles.estRow}>
              <div style={{ flex: 1 }}>
                <div style={styles.estLabel}>{T.target}</div>

                  <>

                    <div style={styles.estSub}>
                      {targetDaysLeft > 0 ? `${T.targetNeed(targetNeed)} · ${T.targetDays(targetDaysLeft)}` : T.targetPast}

                  <div style={styles.estSub}>{T.targetNone}</div>

              </div>
              {canEdit && (
                <div style={{ display: "flex", gap: 6 }}>
                  <button className="qt-btn" type="button" onClick={() => { setTargetDraft(target || addDays(today, 90)); setEditingTarget(true); }}

                  {target && <button className="qt-btn" type="button" onClick={() => persistSettings({ targetDate: "" })} style={styles.cancelBtn}>{T.clear}</button>}

            </div>

        {canEdit && (

            <label style={styles.label}>

                <div style={{ ...styles.emptyState, padding: "4px 4px 8px" }}>{T.khatamEmpty(TOTAL_PAGES)}</div>

                <div>
                  {[...khatamsAsc].reverse().map((k) => {
                    const n = khatamsAsc.indexOf(k) + 1;

                        <form key={k.id} onSubmit={saveEditKhatam} style={{ ...styles.khatamRow, display: "block" }}>

                          <label style={styles.label}>{T.note}
                            <input className="qt-input" type="text" value={khatamDraft.note} placeholder={T.khatamNotePh}
                              onChange={(e) => setKhatamDraft({ ...khatamDraft, note: e.target.value })}
                              style={{ ...styles.input, fontFamily: "'Lora', serif" }} />
                          </label>
                          <div style={{ display: "flex", gap: 8 }}>
                            <button className="qt-btn" type="submit" style={styles.smallPrimary}>{T.save}</button>
                            <button className="qt-btn" type="button" onClick={() => { setEditKhatamId(null); setKhatamDraft(null); }} style={styles.cancelBtn}>{T.cancel}</button>
                          </div>
                        </form>
                      );

                    return (
                      <div key={k.id} style={styles.khatamRow}>

                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div style={styles.khatamDate}>{T.khatamN(n)} · {fmtLong(k.date)}</div>
                          {k.note && <div style={styles.entryNote}>{k.note}</div>}
                          {confirmKhatamId === k.id && (
                            <div style={styles.confirmRow}>
                              <span style={{ fontSize: 12, opacity: 0.75 }}>{T.removeKhatamQ}</span>
                              <button className="qt-btn" type="button" onClick={() => deleteKhatam(k.id)} style={styles.confirmBtn}>{T.yesRemove}</button>
                              <button className="qt-btn" type="button" onClick={() => setConfirmKhatamId(null)} style={styles.cancelBtn}>{T.cancel}</button>
                            </div>
                          )}
                        </div>
                        {canEdit && confirmKhatamId !== k.id && (
                          <div style={{ display: "flex", gap: 2 }}>
                            <button className="qt-btn" type="button" onClick={() => startEditKhatam(k)} style={styles.iconBtn}

                            <button className="qt-btn" type="button" onClick={() => setConfirmKhatamId(k.id)} style={{ ...styles.iconBtn, color: "var(--danger)" }}
                              aria-label={`${T.del} ${T.khatamN(n)}`} title={T.del}>×</button>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}

              {canEdit && (showKhatamForm ? (
                <form onSubmit={submitKhatam} style={{ marginTop: 14 }}>
                  <label style={styles.label}>
                    {T.dateDone}
                    <input className="qt-input" type="date" value={khatamDate} max={today} required
                      onChange={(e) => setKhatamDate(e.target.value)} style={styles.input} />
                  </label>
                  <label style={styles.label}>
                    <span>{T.note} <span style={{ fontWeight: 400, opacity: 0.6 }}>{T.optional}</span></span>
                    <input className="qt-input" type="text" value={khatamNote} onChange={(e) => setKhatamNote(e.target.value)}
                      placeholder={T.khatamNotePh} style={{ ...styles.input, fontFamily: "'Lora', serif" }} />
                  </label>
                  <div style={{ display: "flex", gap: 8 }}>
                    <button className="qt-btn" type="submit" style={{ ...styles.submitBtn, flex: 1 }}>{T.saveKhatam}</button>
                    <button className="qt-btn" type="button" onClick={() => setShowKhatamForm(false)} style={{ ...styles.cancelBtn, padding: "0 14px", fontSize: 13.5 }}>{T.cancel}</button>
                  </div>
                </form>
              ) : (
                <button className="qt-btn" type="button" onClick={() => { setShowKhatamForm(true); setKhatamDate(today); }}
                  style={styles.khatamAddBtn}>{T.addKhatam}</button>
              ))}
            </div>
          )}
        </section>

        {/* ----- Achievements (collapsible) ----- */}
        <section style={styles.collapseCard}>
          <button className="qt-btn" type="button" onClick={() => setBadgesOpen(!badgesOpen)} aria-expanded={badgesOpen} style={styles.collapseHead}>
            <span style={styles.collapseTitle}>{T.achievements}</span>

              <span style={styles.khatamNum}>{badgesDone}</span>
              <span style={styles.khatamCountLabel}>/ {badges.length}</span>

            <span style={{ ...styles.chev, transform: badgesOpen ? "rotate(90deg)" : "none" }}>›</span>

          {badgesOpen && (
            <div className="qt-fade" style={{ ...styles.collapseBody, display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 8 }}>
              {badges.map((b) => {

                return (
                  <div key={b.id} style={{ ...styles.badge, ...(b.done ? styles.badgeDone : {}) }} title={`${name} — ${sub}`}>
                    <div style={{ fontSize: 24, filter: b.done ? "none" : "grayscale(1)", opacity: b.done ? 1 : 0.45 }}>{b.icon}</div>
                    <div style={styles.badgeName}>{name}</div>
                    <div style={styles.badgeSub}>{b.done ? sub : `${b.have}/${b.need}`}</div>
                    {!b.done && <div style={styles.badgeTrack}><div style={{ ...styles.badgeFill, width: `${Math.round((b.have / b.need) * 100)}%` }} /></div>}
                  </div>

        <div style={styles.tabs} role="tablist">
          {[["history", T.tabHistory], ["reflect", `${T.tabReflect} (${notesList.length})`], ["calendar", T.tabCal], ["stats", T.tabStats]].map(([key, label]) => (
            <button key={key} role="tab" aria-selected={tab === key} className="qt-btn" onClick={() => setTab(key)}
              style={{ ...styles.tab, ...(tab === key ? styles.tabOn : {}) }}>{label}</button>
          ))}
        </div>

        {tab === "history" && (
          <div style={styles.historySection}>
            {months.length === 0 ? (
              <div style={styles.emptyState}>{T.emptyHistory}</div>
            ) : (
              months.map((m) => {
                const open = openMonths.has(m.key);
                return (
                  <div key={m.key} style={styles.monthBlock}>
                    <button className="qt-btn" type="button" onClick={() => toggleMonth(m.key)} aria-expanded={open}
                      style={{ ...styles.monthHead, ...(open ? styles.monthHeadOpen : {}) }}>
                      <div style={{ flex: 1, minWidth: 0, textAlign: "left" }}>
                        <div style={styles.monthName}>{fmtMonth(m.key)}</div>
                        <div style={styles.monthMeta}>
                          {T.monthSummary(m.days.length, m.pages)} · <span style={styles.mono}>{m.minP === m.maxP ? `p.${m.maxP}` : `p.${m.minP}–${m.maxP}`}</span>
                        </div>
                      </div>
                      <span style={{ ...styles.chev, transform: open ? "rotate(90deg)" : "none" }}>›</span>
                    </button>
                    {open && (
                      <div className="qt-fade" style={styles.monthBody}>
                        {m.days.map(([d, list]) => (
                          <div key={d} style={styles.dayGroup}>
                            <div style={styles.dayHeader}>{fmtDate(d)}</div>
                            {list.map((en) => <React.Fragment key={en.id}>{EntryCard({ en, showDate: false })}</React.Fragment>)}
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                );
              })
            )}
          </div>
        )}

        {tab === "reflect" && (
          <div style={styles.historySection}>
            {notesList.length === 0 ? (
              <div style={styles.emptyState}>{T.emptyReflect}</div>
            ) : (
              notesList.map((en) => <React.Fragment key={en.id}>{EntryCard({ en, showDate: true })}</React.Fragment>)
            )}
          </div>
        )}

        {tab === "calendar" && <Heatmap pagesByDate={pagesByDate} today={today} T={T} fmtLong={fmtLong} />}

        {tab === "stats" && (

            totalPages={totalPages} bestStreak={bestStreak} readingDays={readingDays} />

        <section style={{ ...styles.form, marginTop: 8 }}>

          <div style={styles.settingBlock}>
            <div style={styles.settingTitle}>{T.theme}</div>
            <div style={styles.segment}>
              {[["auto", T.themeAuto], ["light", T.themeLight], ["dark", T.themeDark]].map(([k, l]) => (
                <button key={k} className="qt-btn" type="button" onClick={() => persistSettings({ theme: k })}
                  aria-pressed={settings.theme === k} style={{ ...styles.segBtn, ...(settings.theme === k ? styles.segBtnOn : {}) }}>{l}</button>
              ))}
            </div>
          </div>

          {serverMode && (
            <div style={styles.settingBlock}>
              <div style={styles.settingTitle}>{T.notif}</div>
              <div style={styles.hint}>{T.notifHint}</div>
              {role !== "owner" ? (
                <div style={styles.hint}>{T.notifOwnerOnly}</div>
              ) : notif === "unsupported" ? (
                <div style={styles.hint}>{IS_IOS && !isStandalone ? T.notifIOS : T.notifUnsupported}</div>
              ) : notif === "denied" ? (
                <div style={{ ...styles.hint, color: "var(--danger)", opacity: 1 }}>{T.notifDenied}</div>
              ) : notif === "on" ? (
                <>
                  <div style={{ fontSize: 13, color: "var(--title)", fontWeight: 600, marginBottom: 8 }}>{T.notifStateOn}</div>
                  <div style={styles.btnRow}>
                    <button className="qt-btn" type="button" onClick={testNotif} style={styles.smallPrimary}>{T.notifTest}</button>
                    <button className="qt-btn" type="button" onClick={disableNotif} style={styles.cancelBtn}>{T.notifOff}</button>
                  </div>

                <>
                  <button className="qt-btn" type="button" disabled={notif === "busy" || notif === "unknown"} onClick={enableNotif}
                    style={{ ...styles.smallPrimary, opacity: notif === "busy" ? 0.6 : 1 }}>{T.notifOn}</button>
                  {IS_IOS && !isStandalone && <div style={{ ...styles.hint, marginTop: 8 }}>{T.notifIOS}</div>}

          {role === "local" && (

              <div style={styles.settingTitle}>{T.notif}</div>
              <div style={styles.hint}>{T.notifServerOnly}</div>

              <div style={styles.settingTitle}>{T.account}</div>
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <span style={{ fontSize: 13, flex: 1 }}>{T.ownerOn}</span>
                <button className="qt-btn" type="button" onClick={signOut} style={styles.cancelBtn}>{T.logout}</button>
              </div>
            </div>

          <div style={styles.settingBlock}>
            <div style={styles.settingTitle}>{T.backup}</div>

              <button className="qt-btn" type="button" onClick={exportBackup} style={styles.smallPrimary}>{T.exportBtn}</button>
              <button className="qt-btn" type="button" onClick={copyBackup} style={styles.cancelBtn}>{T.copyBtn}</button>
              {canEdit && <button className="qt-btn" type="button" onClick={() => fileRef.current && fileRef.current.click()} style={styles.cancelBtn}>{T.importBtn}</button>}
              <input ref={fileRef} type="file" accept="application/json,.json" onChange={onImportFile} style={{ display: "none" }} />
            </div>
            {pendingImport && (
              <div style={{ ...styles.confirmRow, marginTop: 10 }}>
                <span style={{ fontSize: 12.5 }}>{T.importQ(pendingImport.entries.length, pendingImport.khatams.length)}</span>
                <button className="qt-btn" type="button" onClick={confirmImport} style={styles.confirmBtn}>{T.save}</button>
                <button className="qt-btn" type="button" onClick={() => setPendingImport(null)} style={styles.cancelBtn}>{T.cancel}</button>
              </div>

            {backupMsg && <div style={{ fontSize: 12.5, marginTop: 8, color: backupMsg === T.importBad || backupMsg === T.copyFail ? "var(--danger)" : "var(--title)" }}>{backupMsg}</div>}

          <div style={{ ...styles.settingBlock, borderBottom: "none", paddingBottom: 0, marginBottom: 0 }}>
            <div style={styles.settingTitle}>{T.install}</div>
            {isStandalone ? (

              <>
                {installEvt && <button className="qt-btn" type="button" onClick={doInstall} style={{ ...styles.smallPrimary, marginBottom: 8 }}>{T.installBtn}</button>}

            <h2 id="owner-title" style={styles.formTitle}>{hasOwner ? T.ownerTitleLogin : T.ownerTitleClaim}</h2>

            <label style={styles.label}>{T.pin}
              <input className="qt-input" type="password" autoComplete={hasOwner ? "current-password" : "new-password"} value={pin}
                onChange={(e) => setPin(e.target.value)} style={styles.input} autoFocus required />
            </label>
            {!hasOwner && (
              <label style={styles.label}>{T.pin2}
                <input className="qt-input" type="password" autoComplete="new-password" value={pin2}
                  onChange={(e) => setPin2(e.target.value)} style={styles.input} required />
              </label>
            )}
            {loginErr && <div style={{ ...styles.errorText, marginTop: -4, marginBottom: 10 }}>{loginErr}</div>}
            <div style={{ display: "flex", gap: 8 }}>
              <button className="qt-btn" type="submit" disabled={loginBusy} style={{ ...styles.submitBtn, flex: 1, opacity: loginBusy ? 0.6 : 1 }}>{hasOwner ? T.enter : T.create}</button>
              <button className="qt-btn" type="button" onClick={() => setLoginOpen(false)} style={{ ...styles.cancelBtn, padding: "0 14px" }}>{T.cancel}</button>
            </div>
          </form>
        </div>
      )}
    </div>
  );
}

/* ---------- Calendar heatmap ---------- */
function Heatmap({ pagesByDate, today, T, fmtLong }) {
  const [sel, setSel] = useState(null);
  const scrollRef = useRef(null);
  const WEEKS = 26;
  const todayDow = (parseIso(today).getDay() + 6) % 7; // 0 = Monday
  const start = addDays(today, -(todayDow + (WEEKS - 1) * 7));
  const weeks = [];
  for (let w = 0; w < WEEKS; w++) {
    const col = [];
    for (let d = 0; d < 7; d++) col.push(addDays(start, w * 7 + d));
    weeks.push(col);
  }
  useEffect(() => { if (scrollRef.current) scrollRef.current.scrollLeft = scrollRef.current.scrollWidth; }, []);
  const level = (n) => (!n ? 0 : n <= 2 ? 1 : n <= 5 ? 2 : n <= 10 ? 3 : 4);
  const colors = ["var(--h0)", "var(--h1)", "var(--h2)", "var(--h3)", "var(--h4)"];
  const monthLabel = (iso) => parseIso(iso).toLocaleDateString(T.locale, { month: "short" });
  const readDays = Object.keys(pagesByDate).filter((d) => d >= start && d <= today).length;

  return (
    <div style={styles.historySection}>
      <div ref={scrollRef} className="qt-heat" style={styles.heatScroll}>
        <div style={{ display: "flex", gap: 3 }}>
          {weeks.map((col, wi) => {
            const first = col[0];
            const showMonth = wi === 0 || parseIso(first).getMonth() !== parseIso(weeks[wi - 1][0]).getMonth();
            return (
              <div key={wi} style={{ display: "flex", flexDirection: "column", gap: 3 }}>
                <div style={styles.heatMonth}>{showMonth ? monthLabel(first) : ""}</div>
                {col.map((d) => {
                  const future = d > today;
                  const n = pagesByDate[d] || 0;
                  return (
                    <button key={d} className="qt-btn" disabled={future} onClick={() => setSel(d)}
                      aria-label={T.calDay(fmtLong(d), n)}
                      style={{ ...styles.heatCell, background: future ? "transparent" : colors[level(n)],
                        outline: sel === d ? "2px solid var(--gold)" : "none", cursor: future ? "default" : "pointer" }} />
                  );
                })}
              </div>
            );
          })}
        </div>
      </div>
      <div style={styles.heatLegend}>
        <span>{T.calLegend}</span>
        {colors.map((c) => <span key={c} style={{ ...styles.heatCell, width: 11, height: 11, background: c, display: "inline-block" }} />)}
        <span>{T.calMore}</span>
        <span style={{ marginLeft: "auto" }}><span style={styles.mono}>{readDays}</span>/{WEEKS * 7 - (6 - todayDow)}</span>
      </div>
      <div style={styles.heatInfo}>{sel ? T.calDay(fmtLong(sel), pagesByDate[sel] || 0) : T.calTap}</div>
    </div>
  );
}

/* ---------- Statistics: tiles + pages-per-month bars ---------- */
function Stats({ pagesByDate, today, T, fmtMonth, totalPages, bestStreak, readingDays }) {
  const thisMonth = today.slice(0, 7);
  const keys = [];
  for (let i = 11; i >= 0; i--) keys.push(addMonths(thisMonth, -i));
  const data = keys.map((k) => {
    let pages = 0, days = 0;
    for (const [d, n] of Object.entries(pagesByDate)) if (d.slice(0, 7) === k) { pages += n; days++; }
    return { k, pages, days };
  });
  const [sel, setSel] = useState(data.length - 1);
  const max = Math.max(1, ...data.map((d) => d.pages));
  const step = max <= 20 ? 5 : max <= 50 ? 10 : max <= 100 ? 25 : max <= 250 ? 50 : 100;
  const top = Math.ceil(max / step) * step;
  const ticks = [];
  for (let v = 0; v <= top; v += step) ticks.push(v);
  const W = 340, H = 190, L = 30, R = 6, TOP = 20, B = 24;
  const pw = W - L - R, ph = H - TOP - B;
  const band = pw / data.length, bw = Math.max(6, band - 4);
  const y = (v) => TOP + ph - (v / top) * ph;
  const best = data.reduce((a, b) => (b.pages > a.pages ? b : a), data[0]);
  const labelIdx = new Set([data.length - 1, data.indexOf(best)]);
  const shortMonth = (k) => parseIso(k + "-01").toLocaleDateString(T.locale, { month: "short" }).replace(".", "");
  const bar = (x, yTop, w, h) => {
    if (h <= 0) return "";
    const r = Math.min(4, h, w / 2);
    const yb = yTop + h;
    return `M${x},${yb} V${yTop + r} Q${x},${yTop} ${x + r},${yTop} H${x + w - r} Q${x + w},${yTop} ${x + w},${yTop + r} V${yb} Z`;
  };
  const avg = readingDays ? (totalPages / readingDays).toFixed(1) : "0";
  const tiles = [
    [T.statTotal, totalPages, ""], [T.statBest, bestStreak, T.statDaysUnit],
    [T.statDays, readingDays, ""], [T.statAvg, avg, ""],
  ];
  const s = data[sel];
  return (
    <div style={styles.historySection}>
      <div style={styles.statGrid}>
        {tiles.map(([label, val, unit]) => (
          <div key={label} style={styles.statTile}>
            <div style={styles.statLabel}>{label}</div>
            <div style={styles.statValue}><span style={styles.mono}>{val}</span>{unit && <span style={styles.statUnit}> {unit}</span>}</div>
          </div>
        ))}
      </div>
      <div style={styles.chartCard}>
        <div style={styles.chartTitle}>{T.statChart}</div>
        <svg viewBox={`0 0 ${W} ${H}`} width="100%" role="img" aria-label={T.statChart} style={{ display: "block", overflow: "visible" }}>
          {ticks.map((v) => (
            <g key={v}>
              <line x1={L} x2={W - R} y1={y(v)} y2={y(v)} stroke="var(--grid)" strokeWidth="1" />
              <text x={L - 6} y={y(v) + 3.5} textAnchor="end" fontSize="9.5" fill="var(--muted-ink)" fontFamily="IBM Plex Mono, monospace">{v}</text>
            </g>
          ))}
          {data.map((d, i) => {
            const x = L + i * band + (band - bw) / 2;
            const h = (d.pages / top) * ph;
            return (
              <g key={d.k}>
                <path d={bar(x, y(d.pages), bw, h)} fill="var(--bar)" opacity={sel === i ? 1 : 0.82} />
                {labelIdx.has(i) && d.pages > 0 && (
                  <text x={x + bw / 2} y={y(d.pages) - 5} textAnchor="middle" fontSize="10" fontWeight="600" fill="var(--ink)" fontFamily="IBM Plex Mono, monospace">{d.pages}</text>
                )}
                <text x={x + bw / 2} y={H - 8} textAnchor="middle" fontSize="9" fill={sel === i ? "var(--ink)" : "var(--muted-ink)"} fontWeight={sel === i ? 700 : 400}>{shortMonth(d.k)}</text>
                <rect x={L + i * band} y={TOP - 10} width={band} height={ph + 10 + B} fill="transparent" style={{ cursor: "pointer" }}
                  onClick={() => setSel(i)} onMouseEnter={() => setSel(i)}>
                  <title>{T.statTip(fmtMonth(d.k), d.pages, d.days)}</title>
                </rect>
              </g>
            );
          })}
          {sel != null && (
            <line x1={L + sel * band + band / 2} x2={L + sel * band + band / 2} y1={TOP - 6} y2={TOP + ph} stroke="var(--line3)" strokeWidth="1" strokeDasharray="2 3" pointerEvents="none" />
          )}
        </svg>
        <div style={styles.heatInfo} aria-live="polite">{T.statTip(fmtMonth(s.k), s.pages, s.days)}</div>
        {best.pages > 0 && <div style={{ ...styles.hint, marginTop: 8, marginBottom: 0 }}>{T.statBestMonth(fmtMonth(best.k), best.pages)} · {T.statTapHint}</div>}
      </div>
    </div>
  );
}
