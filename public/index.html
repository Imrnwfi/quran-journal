r-samar dengan bibir dirapatkan perlahan, berserta dengung kira-kira 2 harakat.","A silent meem followed by \u0628 is hidden, with the lips closing lightly, and ghunnah of about 2 counts."]},idghaam_shafawi:{c:1,quiz:1,ms:"Idgham Mithlain",en:"Idgham Shafawi",ar:"\u0625\u062F\u063A\u0627\u0645 \u0645\u062A\u0645\u0627\u062B\u0644\u064A\u0646",letters:"\u0645",len:["Dengung 2 harakat","Ghunnah 2 counts"],s:["Mim sakinah bertemu \u0645: dimasukkan dengan dengung.","Meem sakinah before \u0645: merged, with ghunnah."],b:["Mim mati bertemu mim berbaris. Mim pertama dimasukkan ke dalam mim kedua sehingga menjadi satu mim bersabdu, berserta dengung kira-kira 2 harakat. Juga dikenali sebagai Idgham Syafawi.","A silent meem followed by a voweled meem merges into one doubled meem, with ghunnah of about 2 counts. Also called Idgham Mithlain."]},ghunnah:{c:1,quiz:1,ms:"Ghunnah Musyaddadah",en:"Ghunnah",ar:"\u063A\u0646\u0629 \u0645\u0634\u062F\u062F\u0629",letters:"\u0646\u0651 \u0645\u0651",len:["Dengung 2 harakat","Ghunnah 2 counts"],s:["Nun atau mim bersabdu: wajib didengungkan.","Noon or meem with shaddah: always read with ghunnah."],b:["Setiap nun atau mim yang bersabdu (bertasydid) wajib dibaca dengan dengung yang sempurna kira-kira 2 harakat.","Every noon or meem carrying a shaddah is read with a full ghunnah of about 2 counts."]},madd_2:{c:1,quiz:1,ms:"Mad Asli (Tabi'i)",en:"Natural Madd",ar:"\u0645\u062F \u0637\u0628\u064A\u0639\u064A",letters:"\u0627 \u0648 \u064A",len:["2 harakat","2 counts"],s:["Huruf mad tanpa sebab lain: dipanjangkan 2 harakat.","A madd letter with no other cause: 2 counts."],b:["Alif selepas baris atas, wau mati selepas baris hadapan, atau ya mati selepas baris bawah, tanpa hamzah atau sukun selepasnya. Dipanjangkan 2 harakat. Warna ini juga meliputi mad lain yang sama panjang seperti Mad Badal, Mad 'Iwad dan Mad Silah Sughra.","Alif after fathah, silent waw after dammah, or silent ya after kasrah, with no hamzah or sukun after it. Stretched 2 counts. This colour also covers other 2-count madds such as Badal, 'Iwad and short Silah."]},madd_muttasil:{c:1,quiz:1,ms:"Mad Wajib Muttasil",en:"Madd Muttasil",ar:"\u0645\u062F \u0648\u0627\u062C\u0628 \u0645\u062A\u0635\u0644",letters:["Huruf mad + \u0621 dalam satu kalimah","Madd letter + \u0621 in one word"],len:["4 atau 5 harakat","4 or 5 counts"],s:["Huruf mad bertemu hamzah dalam satu kalimah: 4 atau 5 harakat.","Madd letter followed by hamzah in the same word: 4 or 5 counts."],b:["Huruf mad diikuti hamzah dalam kalimah yang sama, contohnya \u062C\u064E\u0622\u0621\u064E dan \u0671\u0644\u0633\u064E\u0651\u0645\u064E\u0622\u0621\u0650. Wajib dipanjangkan 4 atau 5 harakat (riwayat Hafs, tariq Syatibiyyah).","A madd letter followed by hamzah in the same word, e.g. \u062C\u064E\u0622\u0621\u064E and \u0671\u0644\u0633\u064E\u0651\u0645\u064E\u0622\u0621\u0650. It must be stretched 4 or 5 counts (Hafs, via ash-Shatibiyyah)."]},madd_munfasil:{c:1,quiz:1,ms:"Mad Jaiz Munfasil",en:"Madd Munfasil",ar:"\u0645\u062F \u062C\u0627\u0626\u0632 \u0645\u0646\u0641\u0635\u0644",letters:["Huruf mad + \u0621 pada kalimah berikutnya","Madd letter + \u0621 in the next word"],len:["4 atau 5 harakat","4 or 5 counts"],s:["Huruf mad di hujung kalimah, hamzah di awal kalimah berikutnya: 4 atau 5 harakat.","Madd letter at the end of a word, hamzah starting the next: 4 or 5 counts."],b:["Huruf mad di hujung satu kalimah dan hamzah di awal kalimah berikutnya, contohnya \u0625\u0650\u0646\u064E\u0651\u0622 \u0623\u064E\u0639\u0652\u0637\u064E\u064A\u0652\u0646\u064E\u0670\u0643\u064E. Dipanjangkan 4 atau 5 harakat (riwayat Hafs, tariq Syatibiyyah).","A madd letter ends one word and a hamzah starts the next, e.g. \u0625\u0650\u0646\u064E\u0651\u0622 \u0623\u064E\u0639\u0652\u0637\u064E\u064A\u0652\u0646\u064E\u0670\u0643\u064E. Stretched 4 or 5 counts (Hafs, via ash-Shatibiyyah)."]},madd_246:{c:1,quiz:1,ms:"Mad 'Arid Lissukun / Mad Lin",en:"Madd 'Arid / Leen",ar:"\u0645\u062F \u0639\u0627\u0631\u0636 \u0644\u0644\u0633\u0643\u0648\u0646",letters:"\u0627 \u0648 \u064A",len:["2, 4 atau 6 harakat (ketika waqaf)","2, 4 or 6 counts (when stopping)"],s:["Huruf mad sebelum huruf terakhir yang diwaqafkan: 2, 4 atau 6 harakat.","Madd letter before the last letter when stopping: 2, 4 or 6 counts."],b:["Apabila berhenti (waqaf) di hujung kalimah dan sebelum huruf terakhir itu ada huruf mad, contohnya \u0671\u0644\u0652\u0639\u064E\u0670\u0644\u064E\u0645\u0650\u064A\u0646\u064E, boleh dipanjangkan 2, 4 atau 6 harakat. Begitu juga Mad Lin, iaitu wau atau ya mati selepas baris atas (contohnya \u062E\u064E\u0648\u0652\u0641\u064D) ketika waqaf. Jika bacaan disambung, hukum ini tidak berlaku.","When stopping at the end of a word with a madd letter just before the last letter, e.g. \u0671\u0644\u0652\u0639\u064E\u0670\u0644\u064E\u0645\u0650\u064A\u0646\u064E, it may be stretched 2, 4 or 6 counts. The same applies to Madd Leen, a silent waw or ya after fathah (e.g. \u062E\u064E\u0648\u0652\u0641\u064D), when stopping. If you continue reading, this rule does not apply."]},madd_6:{c:1,quiz:1,ms:"Mad Lazim",en:"Madd Lazim",ar:"\u0645\u062F \u0644\u0627\u0632\u0645",letters:["Huruf mad + sukun asli / syaddah","Madd letter + original sukun / shaddah"],len:["6 harakat","6 counts"],s:["Huruf mad bertemu sukun asli atau syaddah: wajib 6 harakat.","Madd letter followed by an original sukun or shaddah: 6 counts."],b:["Huruf mad diikuti huruf bersukun asli atau bersabdu dalam kalimah yang sama, contohnya \u0671\u0644\u0636\u064E\u0651\u0622\u0644\u0650\u0651\u064A\u0646\u064E, atau pada sesetengah huruf pembuka surah seperti \u0627\u0644\u0653\u0645\u0653. Wajib dipanjangkan 6 harakat.","A madd letter followed by a letter with an original sukun or shaddah in the same word, e.g. \u0671\u0644\u0636\u064E\u0651\u0622\u0644\u0650\u0651\u064A\u0646\u064E, or in some opening letters of surahs such as \u0627\u0644\u0653\u0645\u0653. It must be stretched 6 counts."]},qalqalah:{c:1,quiz:1,ms:"Qalqalah",en:"Qalqalah",ar:"\u0642\u0644\u0642\u0644\u0629",letters:"\u0642 \u0637 \u0628 \u062C \u062F",len:["Lantunan","Echo"],s:["Huruf \u0642 \u0637 \u0628 \u062C \u062F bersukun: dibaca melantun.","\u0642 \u0637 \u0628 \u062C \u062F with sukun: read with an echoing bounce."],b:["Lima huruf qalqalah (\u0642\u064F\u0637\u0652\u0628\u064F \u062C\u064E\u062F\u064D\u0651) apabila mati dibaca dengan lantunan suara. Qalqalah Sughra berlaku di tengah kalimah, manakala Qalqalah Kubra berlaku ketika berhenti di hujung kalimah dan lantunannya lebih kuat.","The five qalqalah letters (\u0642\u064F\u0637\u0652\u0628\u064F \u062C\u064E\u062F\u064D\u0651) are read with a bouncing echo when they carry sukun. Minor qalqalah is in the middle of a word; major qalqalah happens when stopping at the end of a word and is stronger."]},lam_qamariah:{c:0,quiz:0,ms:"Alif Lam Qamariah",en:"Lam Qamariyyah",ar:"\u0627\u0644\u0644\u0627\u0645 \u0627\u0644\u0642\u0645\u0631\u064A\u0629",letters:"\u0627 \u0628 \u063A \u062D \u062C \u0643 \u0648 \u062E \u0641 \u0639 \u0642 \u064A \u0645 \u0647",len:["Lam dibaca jelas","Lam pronounced"],s:["Alif lam bertemu 14 huruf qamariah: lam dibaca jelas.","Alif lam before one of 14 moon letters: the lam is pronounced."],b:["Alif lam (\u0627\u0644) yang bertemu salah satu daripada 14 huruf qamariah dibaca jelas, ditandai dengan sukun pada lam, contohnya \u0671\u0644\u0652\u0642\u064E\u0645\u064E\u0631\u064F.","Alif lam (\u0627\u0644) before one of the 14 moon letters is pronounced clearly; the lam carries a sukun, e.g. \u0671\u0644\u0652\u0642\u064E\u0645\u064E\u0631\u064F."]},lam_shamsiyyah:{c:1,quiz:1,ms:"Alif Lam Syamsiah",en:"Lam Shamsiyyah",ar:"\u0627\u0644\u0644\u0627\u0645 \u0627\u0644\u0634\u0645\u0633\u064A\u0629",letters:"\u062A \u062B \u062F \u0630 \u0631 \u0632 \u0633 \u0634 \u0635 \u0636 \u0637 \u0638 \u0644 \u0646",len:["Lam tidak dibaca","Lam not pronounced"],s:["Alif lam bertemu 14 huruf syamsiah: lam tidak dibaca.","Alif lam before one of 14 sun letters: the lam is silent."],b:["Alif lam yang bertemu salah satu daripada 14 huruf syamsiah tidak dibaca. Bunyi lam dimasukkan ke dalam huruf selepasnya yang bertanda sabdu, contohnya \u0671\u0644\u0634\u064E\u0651\u0645\u0652\u0633\u064F.","Alif lam before one of the 14 sun letters is not pronounced; it merges into the next letter, which carries a shaddah, e.g. \u0671\u0644\u0634\u064E\u0651\u0645\u0652\u0633\u064F."]},hamzat_wasl:{c:1,quiz:1,ms:"Hamzah Wasal",en:"Hamzat al-Wasl",ar:"\u0647\u0645\u0632\u0629 \u0627\u0644\u0648\u0635\u0644",letters:"\u0671",len:["Gugur bila disambung","Dropped when joined"],s:["Hamzah yang dibaca ketika memulakan bacaan, tetapi gugur apabila disambung.","A hamzah read only when starting, dropped when joined."],b:["Hamzah wasal (\u0671) hanya dibunyikan apabila memulakan bacaan pada kalimah itu. Apabila bacaan disambung dari kalimah sebelumnya, ia tidak dibaca.","Hamzat al-wasl (\u0671) is only pronounced when you start reading from that word. When joined to the previous word, it is not read."]},nun_wiqayah:{c:0,quiz:0,ms:"Nun Wiqayah",en:"Nun Wiqayah",ar:"\u0646\u0648\u0646 \u0627\u0644\u0648\u0642\u0627\u064A\u0629",letters:"\u062A\u0646\u0648\u064A\u0646 + \u0671",len:["Nun berbaris bawah","Noon with kasrah"],s:["Tanwin bertemu hamzah wasal: nun tanwin dibaca berbaris bawah (\u0646\u0650).","Tanween before hamzat al-wasl: the tanween's noon is read with kasrah (\u0646\u0650)."],b:[`Tanwin sebenarnya ialah bunyi nun mati. Apabila tanwin bertemu hamzah wasal (\u0671), huruf selepasnya juga mati, dan dua huruf mati tidak boleh bertemu. Maka nun tanwin dibaca berbaris bawah (\u0646\u0650) untuk menyambung bacaan. Dalam Mushaf Rasm Uthmani terbitan Malaysia, ia ditanda dengan nun kecil di antara dua kalimah.

Contoh:
\u2022 \u0646\u064F\u0648\u062D\u064C \u0671\u0628\u0652\u0646\u064E\u0647\u064F\u06E5 \u2192 \u201CNuhunibnahu\u201D (Hud 11:42)
\u2022 \u062E\u064E\u064A\u0652\u0631\u064B\u0627 \u0671\u0644\u0652\u0648\u064E\u0635\u0650\u064A\u064E\u0651\u0629\u064F \u2192 \u201Ckhairanil wasiyyah\u201D (Al-Baqarah 2:180)
\u2022 \u0623\u064E\u062D\u064E\u062F\u064C \u0671\u0644\u0644\u064E\u0651\u0647\u064F \u0671\u0644\u0635\u064E\u0651\u0645\u064E\u062F\u064F \u2192 \u201Cahadunillahus samad\u201D (Al-Ikhlas 1\u20132, apabila disambung)
\u2022 \u0644\u064F\u0651\u0645\u064E\u0632\u064E\u0629\u064D \u0671\u0644\u064E\u0651\u0630\u0650\u0649 \u2192 \u201Clumazatinil lazi\u201D (Al-Humazah 1\u20132, apabila disambung)

Jika berhenti pada kalimah bertanwin itu, hukum ini tidak berlaku. Istilah ini berbeza dengan nun wiqayah dalam ilmu nahu, iaitu nun sebelum ya' mutakallim seperti dalam \u0625\u0650\u0646\u064E\u0651\u0646\u0650\u064A.`,`Tanween is really a silent noon sound. When tanween meets hamzat al-wasl (\u0671), the letter after it is also silent, and two silent letters cannot meet. So the tanween's noon is read with kasrah (\u0646\u0650) to join the words. Mushafs printed in Malaysia mark it with a small noon between the two words.

Examples:
\u2022 \u0646\u064F\u0648\u062D\u064C \u0671\u0628\u0652\u0646\u064E\u0647\u064F\u06E5 \u2192 \u201CNuhunibnahu\u201D (Hud 11:42)
\u2022 \u062E\u064E\u064A\u0652\u0631\u064B\u0627 \u0671\u0644\u0652\u0648\u064E\u0635\u0650\u064A\u064E\u0651\u0629\u064F \u2192 \u201Ckhairanil wasiyyah\u201D (Al-Baqarah 2:180)
\u2022 \u0623\u064E\u062D\u064E\u062F\u064C \u0671\u0644\u0644\u064E\u0651\u0647\u064F \u0671\u0644\u0635\u064E\u0651\u0645\u064E\u062F\u064F \u2192 \u201Cahadunillahus samad\u201D (Al-Ikhlas 1\u20132, when joined)
\u2022 \u0644\u064F\u0651\u0645\u064E\u0632\u064E\u0629\u064D \u0671\u0644\u064E\u0651\u0630\u0650\u0649 \u2192 \u201Clumazatinil ladhi\u201D (Al-Humazah 1\u20132, when joined)

If you stop on the word with tanween, the rule does not apply. This is not the grammar term nun al-wiqayah, the noon before the first-person ya' as in \u0625\u0650\u0646\u064E\u0651\u0646\u0650\u064A.`]},idghaam_mutajanisayn:{c:1,quiz:1,ms:"Idgham Mutajanisain",en:"Idgham Mutajanisayn",ar:"\u0625\u062F\u063A\u0627\u0645 \u0645\u062A\u062C\u0627\u0646\u0633\u064A\u0646",letters:"\u062A \u062F \u0637 \xB7 \u0630 \u062B \u0638 \xB7 \u0628 \u0645",len:["Huruf pertama dimasukkan","First letter merged"],s:["Dua huruf sama makhraj tetapi berbeza sifat: huruf pertama dimasukkan.","Two letters from the same place but different qualities: the first is merged."],b:["Huruf pertama yang mati bertemu huruf yang sama makhraj (tempat keluar) tetapi berbeza sifat, contohnya \u062F bertemu \u062A dalam \u0639\u064E\u0628\u064E\u062F\u062A\u064F\u0651\u0645\u0652. Huruf pertama dimasukkan ke dalam huruf kedua.","A silent letter followed by a letter from the same articulation point but with different qualities, e.g. \u062F before \u062A in \u0639\u064E\u0628\u064E\u062F\u062A\u064F\u0651\u0645\u0652. The first letter merges into the second."]},idghaam_mutaqaribayn:{c:1,quiz:1,ms:"Idgham Mutaqaribain",en:"Idgham Mutaqaribayn",ar:"\u0625\u062F\u063A\u0627\u0645 \u0645\u062A\u0642\u0627\u0631\u0628\u064A\u0646",letters:"\u0644 \u0631 \xB7 \u0642 \u0643",len:["Huruf pertama dimasukkan","First letter merged"],s:["Dua huruf yang hampir makhrajnya: huruf pertama dimasukkan.","Two letters with close articulation points: the first is merged."],b:["Huruf pertama yang mati bertemu huruf yang makhraj dan sifatnya hampir sama, contohnya \u0642 bertemu \u0643 dalam \u0646\u064E\u062E\u0652\u0644\u064F\u0642\u0643\u064F\u0651\u0645. Huruf pertama dimasukkan sepenuhnya ke dalam huruf kedua.","A silent letter followed by a letter with a close articulation point and qualities, e.g. \u0642 before \u0643 in \u0646\u064E\u062E\u0652\u0644\u064F\u0642\u0643\u064F\u0651\u0645. The first letter fully merges i i dan aku hidup.","In Your name, O Allah, I die and I live."],["bangun","Bangun tidur","On waking up","\u0627\u0644\u0652\u062D\u064E\u0645\u0652\u062F\u064F \u0644\u0650\u0644\u064E\u0651\u0647\u0650 \u0627\u0644\u064E\u0651\u0630\u0650\u064A \u0623\u064E\u062D\u0652\u064A\u064E\u0627\u0646\u064E\u0627 \u0628\u064E\u0639\u0652\u062F\u064E \u0645\u064E\u0627 \u0623\u064E\u0645\u064E\u0627\u062A\u064E\u0646\u064E\u0627 \u0648\u064E\u0625\u0650\u0644\u064E\u064A\u0652\u0647\u0650 \u0627\u0644\u0646\u064F\u0651\u0634\u064F\u0648\u0631\u064F","Segala puji bagi Allah yang menghidupkan kami setelah mematikan kami, dan kepada-Nya kami dibangkitkan.","All praise is for Allah who gave us life after causing us to die, and to Him is the return."],["tandas","Masuk tandas","Entering the toilet","\u0627\u0644\u0644\u064E\u0651\u0647\u064F\u0645\u064E\u0651 \u0625\u0650\u0646\u0650\u0651\u064A \u0623\u064E\u0639\u064F\u0648\u0630\u064F \u0628\u0650\u0643\u064E \u0645\u0650\u0646\u064E \u0627\u0644\u0652\u062E\u064F\u0628\u064F\u062B\u0650 \u0648\u064E\u0627\u0644\u0652\u062E\u064E\u0628\u064E\u0627\u0626\u0650\u062B\u0650","Ya Allah, aku berlindung dengan-Mu daripada syaitan jantan dan syaitan betina.","O Allah, I seek refuge in You from the male and female devils."],["keluartandas","Keluar tandas","Leaving the toilet","\u063A\u064F\u0641\u0652\u0631\u064E\u0627\u0646\u064E\u0643\u064E\u060C \u0627\u0644\u0652\u062D\u064E\u0645\u0652\u062F\u064F \u0644\u0650\u0644\u064E\u0651\u0647\u0650 \u0627\u0644\u064E\u0651\u0630\u0650\u064A \u0623\u064E\u0630\u0652\u0647\u064E\u0628\u064E \u0639\u064E\u0646\u0650\u0651\u064A \u0627\u0644\u0652\u0623\u064E\u0630\u064E\u0649 \u0648\u064E\u0639\u064E\u0627\u0641\u064E\u0627\u0646\u0650\u064A","Aku memohon keampunan-Mu. Segala puji bagi Allah yang menghilangkan kesakitan daripadaku dan menyejahterakan aku.","I ask Your forgiveness. All praise is for Allah who removed the harm from me and gave me well-being."],["keluarrumah","Keluar rumah","Leaving home","\u0628\u0650\u0633\u0652\u0645\u0650 \u0627\u0644\u0644\u064E\u0651\u0647\u0650 \u062A\u064E\u0648\u064E\u0643\u064E\u0651\u0644\u0652\u062A\u064F \u0639\u064E\u0644\u064E\u0649 \u0627\u0644\u0644\u064E\u0651\u0647\u0650\u060C \u0644\u064E\u0627 \u062D\u064E\u0648\u0652\u0644\u064E \u0648\u064E\u0644\u064E\u0627 \u0642\u064F\u0648\u064E\u0651\u0629\u064E \u0625\u0650\u0644\u064E\u0651\u0627 \u0628\u0650\u0627\u0644\u0644\u064E\u0651\u0647\u0650","Dengan nama Allah, aku bertawakal kepada Allah. Tiada daya dan kekuatan melainkan dengan Allah.","In the name of Allah, I rely on Allah. There is no power and no strength except with Allah."],["masukrumah","Masuk rumah","Entering home","\u0627\u0644\u0644\u064E\u0651\u0647\u064F\u0645\u064E\u0651 \u0625\u0650\u0646\u0650\u0651\u064A \u0623\u064E\u0633\u0652\u0623\u064E\u0644\u064F\u0643\u064E \u062E\u064E\u064A\u0652\u0631\u064E \u0627\u0644\u0652\u0645\u064E\u0648\u0652\u0644\u064E\u062C\u0650 \u0648\u064E\u062E\u064E\u064A\u0652\u0631\u064E \u0627\u0644\u0652\u0645\u064E\u062E\u0652\u0631\u064E\u062C\u0650\u060C \u0628\u0650\u0633\u0652\u0645\u0650 \u0627\u0644\u0644\u064E\u0651\u0647\u0650 \u0648\u064E\u0644\u064E\u062C\u0652\u0646\u064E\u0627\u060C \u0648\u064E\u0628\u0650\u0633\u0652\u0645\u0650 \u0627\u0644\u0644\u064E\u0651\u0647\u0650 \u062E\u064E\u0631\u064E\u062C\u0652\u0646\u064E\u0627\u060C \u0648\u064E\u0639\u064E\u0644\u064E\u0649 \u0627\u0644\u0644\u064E\u0651\u0647\u0650 \u0631\u064E\u0628\u0650\u0651\u0646\u064E\u0627 \u062A\u064E\u0648\u064E\u0643\u064E\u0651\u0644\u0652\u0646\u064E\u0627","Ya Allah, aku memohon kebaikan tempat masuk dan tempat keluar. Dengan nama Allah kami masuk, dengan nama Allah kami keluar, dan kepada Allah Tuhan kami, kami bertawakal.","O Allah, I ask You for the good of entering and the good of leaving. In the name of Allah we enter, in the name of Allah we leave, and upon Allah our Lord we rely."],["kenderaan","Naik kenderaan","Riding a vehicle","\u0633\u064F\u0628\u0652\
