:{c:1,quiz:1,ms:"Idgham Bila Ghunnah",en:"Idgham without Ghunnah",ar:"\u0625\u062F\u063A\u0627\u0645 \u0628\u0644\u0627 \u063A\u0646\u0629",letters:"\u0644 \u0631",len:["Tiada dengung","No ghunnah"],s:["Nun sakinah atau tanwin bertemu \u0644 atau \u0631: dimasukkan tanpa dengung.","Noon sakinah or tanween before \u0644 or \u0631: merged without ghunnah."],b:["Nun mati atau tanwin bertemu huruf \u0644 atau \u0631. Bunyi nun dimasukkan sepenuhnya ke dalam huruf berikutnya tanpa dengung, dan huruf \u0644 atau \u0631 itu dibaca bersabdu.","A silent noon or tanween followed by \u0644 or \u0631 is fully merged into that letter without ghunnah, and the \u0644 or \u0631 is read with shaddah."]},iqlab:{c:1,quiz:1,ms:"Iqlab",en:"Iqlab",ar:"\u0625\u0642\u0644\u0627\u0628",letters:"\u0628",len:["Dengung 2 harakat","Ghunnah 2 counts"],s:["Nun sakinah atau tanwin bertemu \u0628: bunyi nun ditukar kepada mim dengan dengung.","Noon sakinah or tanween before \u0628: the noon becomes a meem sound with ghunnah."],b:["Apabila nun mati atau tanwin bertemu huruf \u0628, bunyi nun ditukar menjadi bunyi mim yang samar, berserta dengung kira-kira 2 harakat. Dalam mushaf ia ditandakan dengan mim kecil (\u06E2).","When a silent noon or tanween is followed by \u0628, the noon changes into a hidden meem sound with ghunnah of about 2 counts. The mushaf marks it with a small meem (\u06E2)."]},ikhfa:{c:1,quiz:1,ms:"Ikhfa' Haqiqi",en:"Ikhfa",ar:"\u0625\u062E\u0641\u0627\u0621 \u062D\u0642\u064A\u0642\u064A",letters:"\u062A \u062B \u062C \u062F \u0630 \u0632 \u0633 \u0634 \u0635 \u0636 \u0637 \u0638 \u0641 \u0642 \u0643",len:["Dengung 2 harakat","Ghunnah 2 counts"],s:["Nun sakinah atau tanwin bertemu 15 huruf ikhfa': disebut samar dengan dengung.","Noon sakinah or tanween before one of 15 letters: hidden, with ghunnah."],b:["Nun mati atau tanwin bertemu salah satu daripada 15 huruf ikhfa'. Bunyi nun disebut samar-samar (antara jelas dan masuk) berserta dengung kira-kira 2 harakat, sambil lidah bersedia untuk huruf berikutnya.","A silent noon or tanween followed by one of the 15 ikhfa letters is pronounced in a hidden way (between clear and merged) with ghunnah of about 2 counts, while the tongue prepares for the next letter."]},izhar_syafawi:{c:0,quiz:0,ms:"Izhar Syafawi",en:"Izhar Shafawi",ar:"\u0625\u0638\u0647\u0627\u0631 \u0634\u0641\u0648\u064A",letters:["Semua huruf selain \u0645 dan \u0628","All letters except \u0645 and \u0628"],len:["Tiada dengung","No ghunnah"],s:["Mim sakinah bertemu huruf selain \u0645 dan \u0628: dibaca jelas di bibir.","Meem sakinah before any letter except \u0645 and \u0628: read clearly."],b:["Mim mati (\u0645\u0652) bertemu mana-mana huruf selain \u0645 dan \u0628. Mim disebut dengan jelas pada dua bibir tanpa dengung. Lebih berhati-hati apabila bertemu \u0648 dan \u0641 supaya mim tidak disamarkan.","A silent meem (\u0645\u0652) followed by any letter other than \u0645 and \u0628 is pronounced clearly with both lips, without ghunnah. Take extra care before \u0648 and \u0641 so it isn't hidden."]},ikhfa_shafawi:{c:1,quiz:1,ms:"Ikhfa' Syafawi",en:"Ikhfa Shafawi",ar:"\u0625\u062E\u0641\u0627\u0621 \u0634\u0641\u0648\u064A",letters:"\u0628",len:["Dengung 2 harakat","Ghunnah 2 counts"],s:["Mim sakinah bertemu \u0628: disebut samar dengan dengung.","Meem sakinah before \u0628: hidden, with ghunnah."],b:["Mim mati bertemu huruf \u0628. Mim disebut samar-samar dengan bibir dirapatkan perlahan, berserta dengung kira-kira 2 harakat.","A silent meem followed by \u0628 is hidden, with the lips closing lightly, and ghunnah of about 2 counts."]},idghaam_shafawi:{c:1,quiz:1,ms:"Idgham Mithlain",en:"Idgham Shafawi",ar:"\u0625\u062F\u063A\u0627\u0645 \u0645\u062A\u0645\u0627\u062B\u0644\u064A\u0646",letters:"\u0645",len:["Dengung 2 harakat","Ghunnah 2 counts"],s:["Mim sakinah bertemu \u0645: dimasukkan dengan dengung.","Meem sakinah before \u0645: merged, with ghunnah."],b:["Mim mati bertemu mim berbaris. Mim pertama dimasukkan ke dalam mim kedua sehingga menjadi satu mim bersabdu, berserta dengung kira-kira 2 harakat. Juga dikenali sebagai Idgham Syafawi.","A silent meem followed by a voweled meem merges into one doubled meem, with ghunnah of about 2 counts. Also called Idgham Mithlain."]},ghunnah:{c:1,quiz:1,ms:"Ghunnah Musyaddadah",en:"Ghunnah",ar:"\u063A\u0646\u0629 \u0645\u0634\u062F\u062F\u0629",letters:"\u0646\u0651 \u0645\u0651",len:["Dengung 2 harakat","Ghunnah 2 counts"],s:["Nun atau mim bersabdu: wajib didengungkan.","Noon or meem with shaddah: always read with ghunnah."],b:["Setiap nun atau mim yang bersabdu (bertasydid) wajib dibaca dengan dengung yang sempurna kira-kira 2 harakat.","Every noon or meem carrying a shaddah is read with a full ghunnah of about 2 counts."]},madd_2:{c:1,quiz:1,ms:"Mad Asli (Tabi'i)",en:"Natural Madd",ar:"\u0645\u062F \u0637\u0628\u064A\u0639\u064A",letters:"\u0627 \u0648 \u064A",len:["2 harakat","2 counts"],s:["Huruf mad tanpa sebab lain: dipanjangkan 2 harakat.","A madd letter with no other cause: 2 counts."],b:["Alif selepas baris atas, wau mati selepas baris hadapan, atau ya mati selepas baris bawah, tanpa hamzah atau sukun selepasnya. Dipanjangkan 2 harakat. Warna ini juga meliputi mad lain yang sama panjang seperti Mad Badal, Mad 'Iwad dan Mad Silah Sughra.","Alif after fathah, silent waw after dammah, or silent ya after kasrah, with no hamzah or sukun after it. Stretched 2 counts. This colour also covers other 2-count madds such as Badal, 'Iwad and short Silah."]},madd_muttasil:{c:1,quiz:1,ms:"Mad Wajib Muttasil",en:"Madd Muttasil",ar:"\u0645\u062F \u0648\u0627\u062C\u0628 \u0645\u062A\u0635\u0644",letters:["Huruf mad + \u0621 dalam satu kalimah","Madd letter + \u0621 in one word"],len:["4 atau 5 harakat","4 or 5 counts"],s:["Huruf mad bertemu hamzah dalam satu kalimah: 4 atau 5 harakat.","Madd letter followed by hamzah in the same word: 4 or 5 counts."],b:["Huruf mad diikuti hamzah dalam kalimah yang sama, contohnya \u062C\u064E\u0622\u0621\u064E dan \u0671\u0644\u0633\u064E\u0651\u0645\u064E\u0622\u0621\u0650. Wajib dipanjangkan 4 atau 5 harakat (riwayat Hafs, tariq Syatibiyyah).","A madd letter followed by hamzah in the same word, e.g. \u062C\u064E\u0622\u0621\u064E and \u0671\u0644\u0633\u064E\u0651\u0645\u064E\u0622\u0621\u0650. It must be stretched 4 or 5 counts (Hafs, via ash-Shatibiyyah)."]},madd_munfasil:{c:1,quiz:1,ms:"Mad Jaiz Munfasil",en:"Madd Munfasil",ar:"\u0645\u062F \u062C\u0627\u0626\u0632 \u0645\u0646\u0641\u0635\u0644",letters:["Huruf mad + \u0621 pada kalimah berikutnya","Madd letter + \u0621 in the next word"],len:["4 atau 5 harakat","4 or 5 counts"],s:["Huruf mad di hujung kalimah, hamzah di awal kalimah berikutnya: 4 atau 5 harakat.","Madd letter at the end of a word, hamzah starting the next: 4 or 5 counts."],b:["Huruf mad di hujung satu kalimah dan hamzah di awal kalimah berikutnya, contohnya \u0625\u0650\u0646\u064E\u0651\u0622 \u0623\u064E\u0639\u0652\u0637\u064E\u064A\u0652\u0646\u064E\u0670\u0643\u064E. Dipanjangkan 4 atau 5 harakat (riwayat Hafs, tariq Syatibiyyah).","A madd letter ends one word and a hamzah starts the next, e.g. \u0625\u0650\u0646\u064E\u0651\u0622 \u0623\u064E\u0639\u0652\u0637\u064E\u064A\u0652\u0646\u064E\u0670\u0643\u064E. Stretched 4 or 5 counts (Hafs, via ash-Shatibiyyah)."]},madd_246:{c:1,quiz:1,ms:"Mad 'Arid Lissukun / Mad Lin",en:"Madd 'Arid / Leen",ar:"\u0645\u062F \u0639\u0627\u0631\u0636 \u0644\u0644\u0633\u0643\u0648\u0646",letters:"\u0627 \u0648 \u064A",len:["2, 4 atau 6 harakat (ketika waqaf)","2, 4 or 6 counts (when stopping)"],s:["Huruf mad sebelum huruf terakhir yang diwaqafkan: 2, 4 atau 6 harakat.","Madd letter before the last letter when stopping: 2, 4 or 6 counts."],b:["Apabila berhenti (waqaf) di hujung kalimah dan sebelum huruf terakhir itu ada huruf mad, contohnya \u0671\u0644\u0652\u0639\u064E\u0670\u0644\u064E\u0645\u0650\u064A\u0646\u064E, boleh dipanjangkan 2, 4 atau 6 harakat. Begitu juga Mad Lin, iaitu wau atau ya mati selepas baris atas (contohnya \u062E\u064E\u0648\u0652\u0641\u064D) ketika waqaf. Jika bacaan disambung, hukum ini tidak berlaku.","When stopping at the end of a word with a madd letter just before the last letter, e.g. \u0671\u0644\u0652\u0639\u064E\u0670\u0644\u064E\u0645\u0650\u064A\u0646\u064E, it may be stretched 2, 4 or 6 counts. The same applies to Madd Leen, a silent waw or ya after fathah (e.g. \u062E\u064E\u0648\u0652\u0641\u064D), when stopping. If you continue reading, this rule does not apply."]},madd_6:{c:1,quiz:1,ms:"Mad Lazim",en:"Madd Lazim",ar:"\u0645\u062F \u0644\u0627\u0632\u0645",letters:["Huruf mad + sukun asli / syaddah","Madd letter + original sukun / shaddah"],len:["6 harakat","6 counts"],s:["Huruf mad bertemu sukun asli atau syaddah: wajib 6 harakat.","Madd letter followed by an original sukun or shaddah: 6 counts."],b:["Huruf mad diikuti huruf bersukun asli atau bersabdu dalam kalimah yang sama, contohnya \u0671\u0644\u0636\u064E\u0651\u0622\u0644\u0650\u0651\u064A\u0646\u064E, atau pada sesetengah huruf pembuka surah seperti \u0627\u0644\u0653\u0645\u0653. Wajib dipanjangkan 6 harakat.","A madd letter followed by a letter with an original sukun or shaddah in the same word, e.g. \u0671\u0644\u0636\u064E\u0651\u0622\u0644\u0650\u0651\u064A\u0646\u064E, or in some opening letters of surahs such as \u0627\u0644\u0653\u0645\u0653. It must be stretched 6 counts."]},qalqalah:{c:1,quiz:1,ms:"Qalqalah",en:"Qalqalah",ar:"\u0642\u0644\u0642\u0644\u0629",letters:"\u0642 \u0637 \u0628 \u062C \u062F",len:["Lantunan","Echo"],s:["Huruf \u0642 \u0637 \u0628 \u062C \u062F bersukun: dibaca melantun.","\u0642 \u0637 \u0628 \u062C \u062F with sukun: read with an echoing bounce."],b:["Lima huruf qalqalah (\u0642\u064F\u0637\u0652\u0628\u064F \u062C\u064E\u062F\u064D\u0651) apabila mati dibaca dengan lantunan suara. Qalqalah Sughra berlaku di tengah kalimah, manakala Qalqalah Kubra berlaku ketika berhenti di hujung kalimah dan lantunannya lebih kuat.","The five qalqalah letters (\u0642\u064F\u0637\u0652\u0628\u064F \u062C\u064E\u062F\u064D\u0651) are read with a bouncing echo when they carry sukun. Minor qalqalah is in the middle of a word; major qalqalah happens when stopping at the end of a word and is stronger."]},lam_qamariah:{c:0,quiz:0,ms:"Alif Lam Qamariah",en:"Lam Qamariyyah",ar:"\u0627\u0644\u0644\u0627\u0645 \u0627\u0644\u0642\u0645\u0631\u064A\u0629",letters:"\u0627 \u0628 \u063A \u062D \u062C \u0643 \u0648 \u062E \u0641 \u0639 \u0642 \u064A \u0645 \u0647",len:["Lam dibaca jelas","Lam pronounced"],s:["Alif lam bertemu 14 huruf qamariah: lam dibaca jelas.","Alif lam before one of 14 moon letters: the lam is pronounced."],b:["Alif lam (\u0627\u0644) yang bertemu salah satu daripada 14 huruf qamariah dibaca jelas, ditandai dengan sukun pada lam, contohnya \u0671\u0644\u0652\u0642\u064E\u0645\u064E\u0631\u064F.","Alif lam (\u0627\u0644) before one of the 14 moon letters is pronounced clearly; the lam carries a sukun, e.g. \u0671\u0644\u0652\u0642\u064E\u0645\u064E\u0631\u064F."]},lam_shamsiyyah:{c:1,quiz:1,ms:"Alif Lam Syamsiah",en:"Lam Shamsiyyah",ar:"\u0627\u0644\u0644\u0627\u0645 \u0627\u0644\u0634\u0645\u0633\u064A\u0629",letters:"\u062A \u062B \u062F \u0630 \u0631 \u0632 \u0633 \u0634 \u0635 \u0636 \u0637 \u0638 \u0644 \u0646",len:["Lam tidak dibaca","Lam not pronounced"],s:["Alif lam bertemu 14 huruf syamsiah: lam tidak dibaca.","Alif lam before one of 14 sun letters: the lam is silent."],b:["Alif lam yang bertemu salah satu daripada 14 huruf syamsiah tidak dibaca. Bunyi lam dimasukkan ke dalam huruf selepasnya yang bertanda sabdu, contohnya \u0671\u0644\u0634\u064E\u0651\u0645\u0652\u0633\u064F.","Alif lam before one of the 14 sun letters is not pronounced; it merges into the next letter, which carries a shaddah, e.g. \u0671\u0644\u0634\u064E\u0651\u0645\u0652\u0633\u064F."]},hamzat_wasl:{c:1,quiz:1,ms:"Hamzah Wasal",en:"Hamzat al-Wasl",ar:"\u0647\u0645\u0632\u0629 \u0627\u0644\u0648\u0635\u0644",letters:"\u0671",len:["Gugur bila disambung","Dropped when joined"],s:["Hamzah yang dibaca ketika memulakan bacaan, tetapi gugur apabila disambung.","A hamzah read only when starting, dropped when joined."],b:["Hamzah wasal (\u0671) hanya dibunyikan apabila memulakan bacaan pada kalimah itu. Apabila bacaan disambung dari kalimah sebelumnya, ia tidak dibaca.","Hamzat al-wasl (\u0671) is only pronounced when you start reading from that word. When joined to the previous word, it is not read."]},idghaam_mutajanisayn:{c:1,quiz:1,ms:"Idgham Mutajanisain",en:"Idgham Mutajanisayn",ar:"\u0625\u062F\u063A\u0627\u0645 \u0645\u062A\u062C\u0627\u0646\u0633\u064A\u0646",letters:"\u062A \u062F \u0637 \xB7 \u0630 \u062B \u0638 \xB7 \u0628 \u0645",len:["Huruf pertama dimasukkan","First letter merged"],s:["Dua huruf sama makhraj tetapi berbeza sifat: huruf pertama dimasukkan.","Two letters from the same place but different qualities: the first is merged."],b:["Huruf pertama yang mati bertemu huruf yang sama makhraj (tempat keluar) tetapi berbeza sifat, contohnya \u062F bertemu \u062A dalam \u0639\u064E\u0628\u064E\u062F\u062A\u064F\u0651\u0645\u0652. Huruf pertama dimasukkan ke dalam huruf kedua.","A silent letter followed by a letter from the same articulation point but with different qualities, e.g. \u062F before \u062A in \u0639\u064E\u0628\u064E\u062F\u062A\u064F\u0651\u0645\u0652. The first letter merges into the second."]},idghaam_mutaqaribayn:{c:1,quiz:1,ms:"Idgham Mutaqaribain",en:"Idgham Mutaqaribayn",ar:"\u0625\u062F\u063A\u0627\u0645 \u0645\u062A\u0642\u0627\u0631\u0628\u064A\u0646",letters:"\u0644 \u0631 \xB7 \u0642 \u0643",len:["Huruf pertama dimasukkan","First letter merged"],s:["Dua huruf yang hampir makhrajnya: huruf pertama dimasukkan.","Two letters with close articulation points: the first is merged."],b:["Huruf pertama yang mati bertemu huruf yang makhraj dan sifatnya hampir sama, contohnya \u0642 bertemu \u0643 dalam \u0646\u064E\u062E\u0652\u0644\u064F\u0642\u0643\u064F\u0651\u0645. Huruf per -Mu ya Allah, aku mati dan aku hidup.","In Your name, O Allah, I die and I live."],["bangun","Bangun tidur","On waking up","\u0627\u0644\u0652\u062D\u064E\u0645\u0652\u062F\u064F \u0644\u0650\u0644\u064E\u0651\u0647\u0650 \u0627\u0644\u064E\u0651\u0630\u0650\u064A \u0623\u064E\u062D\u0652\u064A\u064E\u0627\u0646\u064E\u0627 \u0628\u064E\u0639\u0652\u062F\u064E \u0645\u064E\u0627 \u0623\u064E\u0645\u064E\u0627\u062A\u064E\u0646\u064E\u0627 \u0648\u064E\u0625\u0650\u0644\u064E\u064A\u0652\u0647\u0650 \u0627\u0644\u0646\u064F\u0651\u0634\u064F\u0648\u0631\u064F","Segala puji bagi Allah yang menghidupkan kami setelah mematikan kami, dan kepada-Nya kami dibangkitkan.","All praise is for Allah who gave us life after causing us to die, and to Him is the return."],["tandas","Masuk tandas","Entering the toilet","\u0627\u0644\u0644\u064E\u0651\u0647\u064F\u0645\u064E\u0651 \u0625\u0650\u0646\u0650\u0651\u064A \u0623\u064E\u0639\u064F\u0648\u0630\u064F \u0628\u0650\u0643\u064E \u0645\u0650\u0646\u064E \u0627\u0644\u0652\u062E\u064F\u0628\u064F\u062B\u0650 \u0648\u064E\u0627\u0644\u0652\u062E\u064E\u0628\u064E\u0627\u0626\u0650\u062B\u0650","Ya Allah, aku berlindung dengan-Mu daripada syaitan jantan dan syaitan betina.","O Allah, I seek refuge in You from the male and female devils."],["keluartandas","Keluar tandas","Leaving the toilet","\u063A\u064F\u0641\u0652\u0631\u064E\u0627\u0646\u064E\u0643\u064E\u060C \u0627\u0644\u0652\u062D\u064E\u0645\u0652\u062F\u064F \u0644\u0650\u0644\u064E\u0651\u0647\u0650 \u0627\u0644\u064E\u0651\u0630\u0650\u064A \u0623\u064E\u0630\u0652\u0647\u064E\u0628\u064E \u0639\u064E\u0646\u0650\u0651\u064A \u0627\u0644\u0652\u0623\u064E\u0630\u064E\u0649 \u0648\u064E\u0639\u064E\u0627\u0641\u064E\u0627\u0646\u0650\u064A","Aku memohon keampunan-Mu. Segala puji bagi Allah yang menghilangkan kesakitan daripadaku dan menyejahterakan aku.","I ask Your forgiveness. All praise is for Allah who removed the harm from me and gave me well-being."],["keluarrumah","Keluar rumah","Leaving home","\u0628\u0650\u0633\u0652\u0645\u0650 \u0627\u0644\u0644\u064E\u0651\u0647\u0650 \u062A\u064E\u0648\u064E\u0643\u064E\u0651\u0644\u0652\u062A\u064F \u0639\u064E\u0644\u064E\u0649 \u0627\u0644\u0644\u064E\u0651\u0647\u0650\u060C \u0644\u064E\u0627 \u062D\u064E\u0648\u0652\u0644\u064E \u0648\u064E\u0644\u064E\u0627 \u0642\u064F\u0648\u064E\u0651\u0629\u064E \u0625\u0650\u0644\u064E\u0651\u0627 \u0628\u0650\u0627\u0644\u0644\u064E\u0651\u0647\u0650","Dengan nama Allah, aku bertawakal kepada Allah. Tiada daya dan kekuatan melainkan dengan Allah.","In the name of Allah, I rely on Allah. There is no power and no strength except with Allah."],["masukrumah","Masuk rumah","Entering home","\u0627\u0644\u0644\u064E\u0651\u0647\u064F\u0645\u064E\u0651 \u0625\u0650\u0646\u0650\u0651\u064A \u0623\u064E\u0633\u0652\u0623\u064E\u0644\u064F\u0643\u064E \u062E\u064E\u064A\u0652\u0631\u064E \u0627\u0644\u0652\u0645\u064E\u0648\u0652\u0644\u064E\u062C\u0650 \u0648\u064E\u062E\u064E\u064A\u0652\u0631\u064E \u0627\u0644\u0652\u0645\u064E\u062E\u0652\u0631\u064E\u062C\u0650\u060C \u0628\u0650\u0633\u0652\u0645\u0650 \u0627\u0644\u0644\u064E\u0651\u0647\u0650 \u0648\u064E\u0644\u064E\u062C\u0652\u0646\u064E\u0627\u060C \u0648\u064E\u0628\u0650\u0633\u0652\u0645\u0650 \u0627\u0644\u0644\u064E\u0651\u0647\u0650 \u062E\u064E\u0631\u064E\u062C\u0652\u0646\u064E\u0627\u060C \u0648\u064E\u0639\u064E\u0644\u064E\u0649 \u0627\u0644\u0644\u064E\u0651\u0647\u0650 \u0631\u064E\u0628\u0650\u0651\u0646\u064E\u0627 \u062A\u064E\u0648\u064E\u0643\u064E\u0651\u0644\u0652\u0646\u064E\u0627","Ya Allah, aku memohon kebaikan tempat masuk dan tempat keluar. Dengan nama Allah kami masuk, dengan nama Allah kami keluar, dan kepada Allah Tuhan kami, kami bertawakal.","O Allah, I ask You for the good of entering and the good of leaving. In the name of Allah we enter, in the name of Allah we leave, and upon Allah our Lord we rely."],["kenderaan","Naik kenderaan","Riding a vehicle","\u0633\u064F\u0628\u0652\u062D\u064E\u0627\u0646\u064E \u0627\u0644\u064E\u0651\u0630\u0650\u064A \u0633\u064E\u062E\u064E\u0651\u0631\u064E \u0644\u064E\u0646\u064E\u0627 \u0647\u064E\u0670\u0630\u064E\u0627 \u0648\u064E\u0645\u064E\u0627 \u0643\u064F\u0646\u064E\u0651\u0627 \u0644\u064E\u0647\u064F \u0645\u064F\u0642\u0652\u0631\u0650\u0646\u0650\u064A\u0646\u064E\u060C \u0648\u064E\u0625\u0650\u0646\u064E\u0651\u0627 \u0625\u0650\u0644\u064E\u0649\u0670 \u0631\u064E\u0628\u0650\u0651\u0646\u064E\u0627 \u0644\u064E\u0645\u064F\u0646\u0652\u0642\u064E\u0644\u0650\u0628\u064F\u0648\u0646\u064E","Maha Suci Allah yang memudahkan kenderaan ini bagi kami, sedangkan kami tidak mampu menguasainya, dan sesungguhnya kepada Tuhan kamilah kami akan kembali.","Glory be to Him who has subjected this to us, for we could never have done it ourselves, and to our Lord we will surely return.","Az-Zukhruf 43:13\u201314"],["pakaian","Memakai pakaian","Getting dressed","\u0627\u0644\u0652\u062D\u064E\u0645\u0652\u062F\u064F \u0644\u0650\u0644\u064E\u0651\u0647\u0650 \u0627\u0644\u064E\u0651\u0630\u0650\u064A \u0643\u064E\u0633\u064E\u0627\u0646\u0650\u064A \u0647\u064E\u0670\u0630\u064E\u0627 \u0648\u064E\u0631\u064E\u0632\u064E\u0642\u064E\u0646\u0650\u064A\u0647\u0650 \u0645\u0650\u0646\u0652 \u063A\u064E\u064A\u0652\u0631\u0650 \u062D\u064E\u0648\u0652\u0644\u064D \u0645\u0650\u0646\u0650\u0651\u064A \u0648\u064E\u0644\u064E\u0627 \u0642\u064F\u0648\u064E\u0651\u0629\u064D","Segala puji bagi Allah yang memakaikan aku pakaian ini dan mengurniakannya kepadaku tanpa daya dan kekuatan daripadaku.","All praise is for Allah who clothed me with this and provided it for me without any power or strength from me."],["hujan","Ketika hujan","When it rains","\u0627\u0644\u0644\u064E\u0651\u0647\u064F\u0645\u064E\u0651 \u0635\u064E\u064A\u0650\u0651\u0628\u064B\u0627 \u0646\u064E\u0627\u0641\u0650\u0639\u064B\u0627","Ya Allah, turunkanlah hujan yang bermanfaat.","O Allah, (make it) a beneficial rain."],["ibubapa","Untuk ibu bapa","For parents","\u0631\u064E\u0628\u0650\u0651 \u0627\u063A\u0652\u0641\u0650\u0631\u0652 \u0644\u0650\u064A \u0648\u064E\u0644\u0650\u0648\u064E\u0627\u0644\u0650\u062F\u064E\u064A\u064E\u0651 \u0648\u064E\u0627\u0631\u0652\u062D\u064E\u0645\u0652\u0647\u064F\u0645\u064E\u0627 \u0643\u064E\u0645\u064E\u0627 \u0631\u064E\u0628\u064E\u0651\u064A\u064E\u0627\u0646\u0650\u064A \u0635\u064E\u063A\u0650\u064A\u0631\u064B\u0627","Wahai Tuhanku, ampunilah aku dan kedua ibu bapaku, dan kasihanilah mereka sebagaimana mereka mendidikku semasa kecil.","My Lord, forgive me and my parents, and have mercy on them as they raised me when I was small."],["dunia","Kebaikan dunia & akhirat","Good in this life & the next","\u0631\u064E\u0628\u064E\u0651\u0646\u064E\u0627 \u0622\u062A\u0650\u0646\u064E\u0627 \u0641\u0650\u064A \u0627\u0644\u062F\u064F\u0651\u0646\u0652\u064A\u064E\u0627 \u062D\u064E\u0633\u064E\u0646\u064E\u0629\u064B \u0648\u064E\u0641\u0650\u064A \u0627\u0644\u0652\u0622\u062E\u0650\u0631\u064E\u0629\u0650 \u062D\u064E\u0633\u064E\u0646\u064E\u0629\u064B \u0648\u064E\u0642\u0650\u0646\u064E\u0627 \u0639\u064E\u0630\u064E\u0627\u0628\u064E \u0627\u0644\u0646\u064E\u0651\u0627\u0631\u0650","Wahai Tuhan kami, berilah kami kebaikan di dunia dan kebaikan di akhirat, dan peliharalah kami daripada azab neraka.","Our Lord, give us good in this world and good in the Hereafter, and protect us from the punishment of the Fire.","Al-Baqarah 2:201"],["ilmu","Tambah ilmu","Increase in knowledge","\u0631\u064E\u0628\u0650\u0651 \u0632\u0650\u062F\u0652\u0646\u0650\u064A \u0639\u0650\u0644\u0652\u0645\u064B\u0627","Wahai Tuhanku, tambahkanlah ilmuku.","My Lord, increase me in knowledge.","Ta-Ha 20:114"],["belajar","Sebelum belajar","Before studying","\u0631\u064E\u0628\u0650\u0651 \u0627\u0634\u0652\u0631\u064E\u062D\u0652 \u0644\u0650\u064A \u0635\u064E\u062F\u0652\u0631\u0650\u064A\u060C \u0648\u064E\u064A\u064E\u0633\u0650\u0651\u0631\u0652 \u0644\u0650\u064A \u0623\u064E\u0645\u0652\u0631\u0650\u064A\u060C \u0648\u064E\u0627\u062D\u0652\u0644\u064F\u0644\u0652 \u0639\u064F\u0642\u0652\u062F\u064E\u0629\u064B \u0645\u0650\u0646\u0652 \u0644\u0650\u0633\u064E\u0627\u0646\u0650\u064A\u060C \u064A\u064E\u0641\u0652\u0642\u064E\u0647\u064F\u0648\u0627 \u0642\u064E\u0648\u0652\u0644\u0650\u064A","Wahai Tuhanku, lapangkanlah dadaku, mudahkanlah urusanku, dan lepaskanlah kekakuan lidahku supaya mereka faham perkataanku.","My Lord, expand my chest for me, ease my task for me, and untie the knot from my tongue so they may understand my speech.","Ta-Ha 20:25\u201328"],["cermin","Melihat cermin","Looking in the mirror","\u0627\u0644\u0644\u064E\u0651\u0647\u064F\u0645\u064E\u0651 \u0623\u064E\u0646\u0652\u062A\u064E \u062D\u064E\u0633\u064E\u0651\u0646\u0652\u062A\u064E \u062E\u064E\u0644\u0652\u0642\u0650\u064A \u0641\u064E\u062D\u064E\u0633\u0650\u0651\u0646\u0652 \u062E\u064F\u0644\u064F\u0642\u0650\u064A","Ya Allah, Engkau telah memperelokkan kejadianku, maka perelokkanlah akhlakku.","O Allah, You have made my appearance beautiful, so make my character beautiful.","Riwayat Ahmad|Ahmad"],["wuduk","Sebelum wuduk","Before wudu'","\u0628\u0650\u0633\u0652\u0645\u0650 \u0627\u0644\u0644\u064E\u0651\u0647\u0650","Dengan nama Allah.","In the name of Allah.","Riwayat Abu Daud|Abu Dawud"],["lepaswuduk","Selepas wuduk","After wudu'","\u0623\u064E\u0634\u0652\u0647\u064E\u062F\u064F \u0623\u064E\u0646\u0652 \u0644\u064E\u0627 \u0625\u0650\u0644\u064E\u0670\u0647\u064E \u0625\u0650\u0644\u064E\u0651\u0627 \u0627\u0644\u0644\u064E\u0651\u0647\u064F \u0648\u064E\u062D\u0652\u062F\u064E\u0647\u064F \u0644\u064E\u0627 \u0634\u064E\u0631\u0650\u064A\u0643\u064E \u0644\u064E\u0647\u064F\u060C \u0648\u064E\u0623\u064E\u0634\u0652\u0647\u064E\u062F\u064F \u0623\u064E\u0646\u064E\u0651 \u0645\u064F\u062D\u064E\u0645\u064E\u0651\u062F\u064B\u0627 \u0639\u064E\u0628\u0652\u062F\u064F\u0647\u064F \u0648\u064E\u0631\u064E\u0633\u064F\u0648\u0644\u064F\u0647\u064F\u060C \u0627\u0644\u0644\u064E\u0651\u0647\u064F\u0645\u064E\u0651 \u0627\u062C\u0652\u0639\u064E\u0644\u0652\u0646\u0650\u064A \u0645\u0650\u0646\u064E \u0627\u0644\u062A\u064E\u0651\u0648\u064E\u0651\u0627\u0628\u0650\u064A\u0646\u064E \u0648\u064E\u0627\u062C\u0652\u0639\u064E\u0644\u0652\u0646\u0650\u064A \u0645\u0650\u0646\u064E \u0627\u0644\u0652\u0645\u064F\u062A\u064E\u0637\u064E\u0647\u0650\u0651\u0631\u0650\u064A\u0646\u064E","Aku bersaksi bahawa tiada Tuhan melainkan Allah, Yang Esa, tiada sekutu bagi-Nya, dan aku bersaksi bahawa Muhammad itu hamba dan pesuruh-Nya. Ya Allah, jadikanlah aku daripada golongan yang bertaubat dan jadikanlah aku daripada golongan yang menyucikan diri.","I bear witness that there is no god but Allah alone, with no partner, and that Muhammad is His servant and Messenger. O Allah, make me among those who repent and make me among those who purify themselves.","Riwayat Muslim & at-Tirmizi|Muslim & At-Tirmidhi"],["masjid","Masuk masjid","Entering the mosque","\u0627\u0644\u0644\u064E\u0651\u0647\u064F\u0645\u064E\u0651 \u0627\u0641\u0652\u062A\u064E\u062D\u0652 \u0644\u0650\u064A \u0623\u064E\u0628\u0652\u0648\u064E\u0627\u0628\u064E \u0631\u064E\u062D\u0652\u0645\u064E\u062A\u0650\u0643\u064E","Ya Allah, bukakanlah untukku pintu-pintu rahmat-Mu.","O Allah, open for me the doors of Your mercy.","Riwayat Muslim|Muslim"],["keluarmasjid","Keluar masjid","Leaving the mosque","\u0627\u0644\u0644\u064E\u0651\u0647\u064F\u0645\u064E\u0651 \u0625\u0650\u0646\u0650\u0651\u064A \u0623\u064E\u0633\u0652\u0623\u064E\u0644\u064F\u0643\u064E \u0645\u0650\u0646\u0652 \u0641\u064E\u0636\u0652\u0644\u0650\u0643\u064E","Ya Allah, aku memohon kurniaan-Mu.","O Allah, I ask You of Your bounty.","Riwayat Muslim|Muslim"],["azan","Selepas azan","After the adhan","\u0627\u0644\u0644\u064E\u0651\u0647\u064F\u0645\u064E\u0651 \u0631\u064E\u0628\u064E\u0651 \u0647\u064E\u0670\u0630\u0650\u0647\u0650 \u0627\u0644\u062F\u064E\u0651\u0639\u0652\u0648\u064E\u0629\u0650 \u0627\u0644\u062A\u064E\u0651\u0627\u0645\u064E\u0651\u0629\u0650\u060C \u0648\u064E\u0627\u0644\u0635\u064E\u0651\u0644\u064E\u0627\u0629\u0650 \u0627\u0644\u0652\u0642\u064E\u0627\u0626\u0650\u0645\u064E\u0629\u0650\u060C \u0622\u062A\u0650 \u0645\u064F\u062D\u064E\u0645\u064E\u0651\u062F\u064B\u0627 \u0627\u0644\u0652\u0648\u064E\u0633\u0650\u064A\u0644\u064E\u0629\u064E \u0648\u064E\u0627\u0644\u0652\u0641\u064E\u0636\u0650\u064A\u0644\u064E\u0629\u064E\u060C \u0648\u064E\u0627\u0628\u0652\u0639\u064E\u062B\u0652\u0647\u064F \u0645\u064E\u0642\u064E\u0627\u0645\u064B\u0627 \u0645\u064E\u062D\u0652\u0645\u064F\u0648\u062F\u064B\u0627 \u0627\u0644\u064E\u0651\u0630\u0650\u064A \u0648\u064E\u0639\u064E\u062F\u0652\u062A\u064E\u0647\u064F","Ya Allah, Tuhan bagi seruan yang sempurna ini dan solat yang akan didirikan, kurniakanlah kepada Muhammad al-wasilah dan kelebihan, dan bangkitkanlah baginda di tempat terpuji yang telah Engkau janjikan.","O Allah, Lord of this perfect call and the prayer about to be established, grant Muhammad al-wasilah and excellence, and raise him to the praised station You promised him.","Riwayat al-Bukhari|Al-Bukhari"],["berbuka","Berbuka puasa","Breaking the fast","\u0630\u064E\u0647\u064E\u0628\u064E \u0627\u0644\u0638\u064E\u0651\u0645\u064E\u0623\u064F \u0648\u064E\u0627\u0628\u0652\u062A\u064E\u0644\u064E\u0651\u062A\u0650 \u0627\u0644\u0652\u0639\u064F\u0631\u064F\u0648\u0642\u064F\u060C \u0648\u064E\u062B\u064E\u0628\u064E\u062A\u064E \u0627\u0644\u0652\u0623\u064E\u062C\u0652\u0631\u064F \u0625\u0650\u0646\u0652 \u0634\u064E\u0627\u0621\u064E \u0627\u0644\u0644\u064E\u0651\u0647\u064F","Telah hilang dahaga, urat-urat telah basah, dan telah tetap pahala, insya-Allah.","The thirst has gone, the veins are moistened, and the reward is certain, if Allah wills.","Riwayat Abu Daud|Abu Dawud"],["pagi","Pagi hari","In the morning","\u0623\u064E\u0635\u0652\u0628\u064E\u062D\u0652\u0646\u064E\u0627 \u0648\u064E\u0623\u064E\u0635\u0652\u0628\u064E\u062D\u064E \u0627\u0644\u0652\u0645\u064F\u0644\u0652\u0643\u064F \u0644\u0650\u0644\u064E\u0651\u0647\u0650\u060C \u0648\u064E\u0627\u0644\u0652\u062D\u064E\u0645\u0652\u062F\u064F \u0644\u0650\u0644\u064E\u0651\u0647\u0650\u060C \u0644\u064E\u0627 \u0625\u0650\u0644\u064E\u0670\u0647\u064E \u0625\u0650\u0644\u064E\u0651\u0627 \u0627\u0644\u0644\u064E\u0651\u0647\u064F \u0648\u064E\u062D\u0652\u062F\u064E\u0647\u064F \u0644\u064E\u0627 \u0634\u064E\u0631\u0650\u064A\u0643\u064E \u0644\u064E\u0647\u064F","Kami berada di waktu pagi dan kerajaan milik Allah. Segala puji bagi Allah. Tiada Tuhan melainkan Allah, Yang Esa, tiada sekutu bagi-Nya.","We have reached the morning and the dominion belongs to Allah. All praise is for Allah. There is no god but Allah alone, with no partner.","Riwayat Muslim|Muslim"],["petang","Petang hari","In the evening","\u0623\u064E\u0645\u0652\u0633\u064E\u064A\u0652\u0646\u064E\u0627 \u0648\u064E\u0623\u064E\u0645\u0652\u0633\u064E\u0649 \u0627\u0644\u0652\u0645\u064F\u0644\u0652\u0643\u064F \u0644\u0650\u0644\u064E\u0651\u0647\u0650\u060C \u0648\u064E\u0627\u0644\u0652\u062D\u064E\u0645\u0652\u062F\u064F \u0644\u0650\u0644\u064E\u0651\u0647\u0650\u060C \u0644\u064E\u0627 \u0625\u0650\u0644\u064E\u0670\u0647\u064E \u0625\u0650\u0644\u064E\u0651\u0627 \u0627\u0644\u0644\u064E\u0651\u0647\u064F \u0648\u064E\u062D\u0652\u062F\u064E\u0647\u064F \u0644\u064E\u0627 \u0634\u064E\u0631\u0650\u064A\u0643\u064E \u0644\u064E\u0647\u064F","Kami berada di waktu petang dan kerajaan milik Allah. Segala puji bagi Allah. Tiada Tuhan melainkan Allah, Yang Esa, tiada sekutu bagi-Nya.","We have reached the evening and the dominion belongs to Allah. All praise is for Allah. There is no god but Allah alone, with no partner.","Riwayat Muslim|Muslim"],["perlindungan","Perlindungan pagi & petang","Protection, morning & evening","\u0628\u0650\u0633\u0652\u0645\u0650 \u0627\u0644\u0644\u064E\u0651\u0647\u0650 \u0627\u0644\u064E\u0651\u0630\u0650\u064A \u0644\u064E\u0627 \u064A\u064E\u0636\u064F\u0631\u064F\u0651 \u0645\u064E\u0639\u064E \u0627\u0633\u0652\u0645\u0650\u0647\u0650 \u0634\u064E\u064A\u0652\u0621\u064C \u0641\u0650\u064A \u0627\u0644\u0652\u0623\u064E\u0631\u0652\u0636\u0650 \u0648\u064E\u0644\u064E\u0627 \u0641\u0650\u064A \u0627\u0644\u0633\u064E\u0651\u0645\u064E\u0627\u0621\u0650 \u0648\u064E\u0647\u064F\u0648\u064E \u0627\u0644\u0633\u064E\u0651\u0645\u0650\u064A\u0639\u064F \u0627\u0644\u0652\u0639\u064E\u0644\u0650\u064A\u0645\u064F","Dengan nama Allah yang tidak ada sesuatu pun di bumi dan di langit dapat memudaratkan bersama nama-Nya, dan Dia Maha Mendengar lagi Maha Mengetahui.","In the name of Allah, with whose name nothing on earth or in the heavens can cause harm, and He is the All-Hearing, the All-Knowing.","Riwayat Abu Daud & at-Tirmizi|Abu Dawud & At-Tirmidhi",3],["sayyidul","Penghulu istighfar","The master of seeking forgiveness","\u0627\u0644\u0644\u064E\u0651\u0647\u064F\u0645\u064E\u0651 \u0623\u064E\u0646\u0652\u062A\u064E \u0631\u064E\u0628\u0650\u0651\u064A \u0644\u064E\u0627 \u0625\u0650\u0644\u064E\u0670\u0647\u064E \u0625\u0650\u0644\u064E\u0651\u0627 \u0623\u064E\u0646\u0652\u062A\u064E\u060C \u062E\u064E\u0644\u064E\u0642\u0652\u062A\u064E\u0646\u0650\u064A \u0648\u064E\u0623\u064E\u0646\u064E\u0627 \u0639\u064E\u0628\u0652\u062F\u064F\u0643\u064E\u060C \u0648\u064E\u0623\u064E\u0646\u064E\u0627 \u0639\u064E\u0644\u064E\u0649\u0670 \u0639\u064E\u0647\u0652\u062F\u0650\u0643\u064E \u0648\u064E\u0648\u064E\u0639\u0652\u062F\u0650\u0643\u064E \u0645\u064E\u0627 \u0627\u0633\u0652\u062A\u064E\u0637\u064E\u0639\u0652\u062A\u064F\u060C \u0623\u064E\u0639\u064F\u0648\u0630\u064F \u0628\u0650\u0643\u064E \u0645\u0650\u0646\u0652 \u0634\u064E\u0631\u0650\u0651 \u0645\u064E\u0627 \u0635\u064E\u0646\u064E\u0639\u0652\u062A\u064F\u060C \u0623\u064E\u0628\u064F\u0648\u0621\u064F \u0644\u064E\u0643\u064E \u0628\u0650\u0646\u0650\u0639\u0652\u0645\u064E\u062A\u0650\u0643\u064E \u0639\u064E\u0644\u064E\u064A\u064E\u0651\u060C \u0648\u064E\u0623\u064E\u0628\u064F\u0648\u0621\u064F \u0628\u0650\u0630\u064E\u0646\u0652\u0628\u0650\u064A \u0641\u064E\u0627\u063A\u0652\u0641\u0650\u0631\u0652 \u0644\u0650\u064A\u060C \u0641\u064E\u0625\u0650\u0646\u064E\u0651\u0647\u064F \u0644\u064E\u0627 \u064A\u064E\u063A\u0652\u0641\u0650\u0631\u064F \u0627\u0644\u0630\u064F\u0651\u0646\u064F\u0648\u0628\u064E \u0625\u0650\u0644\u064E\u0651\u0627 \u0623\u064E\u0646\u0652\u062A\u064E","Ya Allah, Engkau Tuhanku, tiada Tuhan melainkan Engkau. Engkau menciptakan aku dan aku hamba-Mu. Aku berpegang pada janji-Mu sedaya upayaku. Aku berlindung dengan-Mu daripada keburukan perbuatanku. Aku mengakui nikmat-Mu kepadaku dan aku mengakui dosaku, maka ampunilah aku, kerana tiada yang mengampunkan dosa melainkan Engkau.","O Allah, You are my Lord; there is no god but You. You created me and I am Your servant, and I keep Your covenant and promise as best I can. I seek refuge in You from the evil of what I have done. I acknowledge Your favour upon me and I acknowledge my sin, so forgive me, for none forgives sins but You.","Riwayat al-Bukhari|Al-Bukhari"],["majlis","Penutup majlis","Closing a gathering","\u0633\u064F\u0628\u0652\u062D\u064E\u0627\u0646\u064E\u0643\u064E \u0627\u0644\u0644\u064E\u0651\u0647\u064F\u0645\u064E\u0651 \u0648\u064E\u0628\u0650\u062D\u064E\u0645\u0652\u062F\u0650\u0643\u064E\u060C \u0623\u064E\u0634\u0652\u0647\u064E\u062F\u064F \u0623\u064E\u0646\u0652 \u0644\u064E\u0627 \u0625\u0650\u0644\u064E\u0670\u0647\u064E \u0625\u0650\u0644\u064E\u0651\u0627 \u0623\u064E\u0646\u0652\u062A\u064E\u060C \u0623\u064E\u0633\u0652\u062A\u064E\u063A\u0652\u0641\u0650\u0631\u064F\u0643\u064E \u0648\u064E\u0623\u064E\u062A\u064F\u0648\u0628\u064F \u0625\u0650\u0644\u064E\u064A\u0652\u0643\u064E","Maha Suci Engkau ya Allah dan dengan memuji-Mu. Aku bersaksi bahawa tiada Tuhan melainkan Engkau. Aku memohon keampunan-Mu dan bertaubat kepada-Mu.","Glory be to You, O Allah, and with Your praise. I bear witness that there is no god but You. I seek Your forgiveness and repent to You.","Riwayat at-Tirmizi|At-Tirmidhi"],["musafir","Ketika bermusafir","When travelling","\u0627\u0644\u0644\u064E\u0651\u0647\u064F\u0645\u064E\u0651 \u0625\u0650\u0646\u064E\u0651\u0627 \u0646\u064E\u0633\u0652\u0623\u064E\u0644\u064F\u0643\u064E \u0641\u0650\u064A \u0633\u064E\u0641\u064E\u0631\u0650\u0646\u064E\u0627 \u0647\u064E\u0670\u0630\u064E\u0627 \u0627\u0644\u0652\u0628\u0650\u0631\u064E\u0651 \u0648\u064E\u0627\u0644\u062A\u064E\u0651\u0642\u0652\u0648\u064E\u0649\u0670\u060C \u0648\u064E\u0645\u0650\u0646\u064E \u0627\u0644\u0652\u0639\u064E\u0645\u064E\u0644\u0650 \u0645\u064E\u0627 \u062A\u064E\u0631\u0652\u0636\u064E\u0649\u0670\u060C \u0627\u0644\u0644\u064E\u0651\u0647\u064F\u0645\u064E\u0651 \u0647\u064E\u0648\u0650\u0651\u0646\u0652 \u0639\u064E\u0644\u064E\u064A\u0652\u0646\u064E\u0627 \u0633\u064E\u0641\u064E\u0631\u064E\u0646\u064E\u0627 \u0647\u064E\u0670\u0630\u064E\u0627 \u0648\u064E\u0627\u0637\u0652\u0648\u0650 \u0639\u064E\u0646\u064E\u0651\u0627 \u0628\u064F\u0639\u0652\u062F\u064E\u0647\u064F","Ya Allah, kami memohon dalam perjalanan kami ini kebaikan, takwa dan amalan yang Engkau redai. Ya Allah, mudahkanlah perjalanan kami ini dan dekatkanlah jaraknya bagi kami.","O Allah, we ask You on this journey of ours for righteousness, piety and deeds that please You. O Allah, make this journey easy for us and shorten its distance for us.","Riwayat Muslim|Muslim"],["guruh","Mendengar guruh","Hearing thunder","\u0633\u064F\u0628\u0652\u062D\u064E\u0627\u0646\u064E \u0627\u0644\u064E\u0651\u0630\u0650\u064A \u064A\u064F\u0633\u064E\u0628\u0650\u0651\u062D\u064F \u0627\u0644\u0631\u064E\u0651\u0639\u0652\u062F\u064F \u0628\u0650\u062D\u064E\u0645\u0652\u062F\u0650\u0647\u0650 \u0648\u064E\u0627\u0644\u0652\u0645\u064E\u0644\u064E\u0627\u0626\u0650\u0643\u064E\u0629\u064F \u0645\u0650\u0646\u0652 \u062E\u0650\u064A\u0641\u064E\u062A\u0650\u0647\u0650","Maha Suci Allah yang guruh bertasbih dengan memuji-Nya, demikian juga para malaikat kerana takut kepada-Nya.","Glory be to Him whom the thunder glorifies with His praise, as do the angels in awe of Him.","Riwayat Malik (al-Muwatta')|Malik (Al-Muwatta')"],["angin","Ketika angin kencang","In strong wind","\u0627\u0644\u0644\u064E\u0651\u0647\u064F\u0645\u064E\u0651 \u0625\u0650\u0646\u0650\u0651\u064A \u0623\u064E\u0633\u0652\u0623\u064E\u0644\u064F\u0643\u064E \u062E\u064E\u064A\u0652\u0631\u064E\u0647\u064E\u0627\u060C \u0648\u064E\u0623\u064E\u0639\u064F\u0648\u0630\u064F \u0628\u0650\u0643\u064E \u0645\u0650\u0646\u0652 \u0634\u064E\u0631\u0650\u0651\u0647\u064E\u0627","Ya Allah, aku memohon kebaikannya dan aku berlindung dengan-Mu daripada keburukannya.","O Allah, I ask You for its good and I seek refuge in You from its harm.","Riwayat Abu Daud|Abu Dawud"],["lepashujan","Selepas hujan","After rain","\u0645\u064F\u0637\u0650\u0631\u0652\u0646\u064E\u0627 \u0628\u0650\u0641\u064E\u0636\u0652\u0644\u0650 \u0627\u0644\u0644\u064E\u0651\u0647\u0650 \u0648\u064E\u0631\u064E\u062D\u0652\u0645\u064E\u062A\u0650\u0647\u0650","Kami diberi hujan dengan kurnia dan rahmat Allah.","We have been given rain by the grace and mercy of Allah.","Riwayat al-Bukhari & Muslim|Al-Bukhari & Muslim"],["anakbulan","Melihat anak bulan","Seeing the new moon","\u0627\u0644\u0644\u064E\u0651\u0647\u064F\u0645\u064E\u0651 \u0623\u064E\u0647\u0650\u0644\u064E\u0651\u0647\u064F \u0639\u064E\u0644\u064E\u064A\u0652\u0646\u064E\u0627 \u0628\u0650\u0627\u0644\u0652\u064A\u064F\u0645\u0652\u0646\u0650 \u0648\u064E\u0627\u0644\u0652\u0625\u0650\u064A\u0645\u064E\u0627\u0646\u0650\u060C \u0648\u064E\u0627\u0644\u0633\u064E\u0651\u0644\u064E\u0627\u0645\u064E\u0629\u0650 \u0648\u064E\u0627\u0644\u0652\u0625\u0650\u0633\u0652\u0644\u064E\u0627\u0645\u0650\u060C \u0631\u064E\u0628\u0650\u0651\u064A \u0648\u064E\u0631\u064E\u0628\u064F\u0651\u0643\u064E \u0627\u0644\u0644\u064E\u0651\u0647\u064F","Ya Allah, terbitkanlah anak bulan ini kepada kami dengan keberkatan dan iman, keselamatan dan Islam. Tuhanku dan Tuhanmu ialah Allah.","O Allah, bring this new moon over us with blessing and faith, safety and Islam. My Lord and your Lord is Allah.","Riwayat at-Tirmizi|At-Tirmidhi"],["musibah","Ditimpa musibah","When afflicted","\u0625\u0650\u0646\u064E\u0651\u0627 \u0644\u0650\u0644\u064E\u0651\u0647\u0650 \u0648\u064E\u0625\u0650\u0646\u064E\u0651\u0627 \u0625\u0650\u0644\u064E\u064A\u0652\u0647\u0650 \u0631\u064E\u0627\u062C\u0650\u0639\u064F\u0648\u0646\u064E\u060C \u0627\u0644\u0644\u064E\u0651\u0647\u064F\u0645\u064E\u0651 \u0623\u0652\u062C\u064F\u0631\u0652\u0646\u0650\u064A \u0641\u0650\u064A \u0645\u064F\u0635\u0650\u064A\u0628\u064E\u062A\u0650\u064A \u0648\u064E\u0623\u064E\u062E\u0652\u0644\u0650\u0641\u0652 \u0644\u0650\u064A \u062E\u064E\u064A\u0652\u0631\u064B\u0627 \u0645\u0650\u0646\u0652\u0647\u064E\u0627","Sesungguhnya kami milik Allah dan kepada-Nya kami kembali. Ya Allah, berilah aku pahala dalam musibahku ini dan gantikanlah untukku yang lebih baik daripadanya.","We belong to Allah and to Him we return. O Allah, reward me in my affliction and replace it for me with something better.","Riwayat Muslim|Muslim"],["gelisah","Ketika gelisah & dukacita","When anxious or sad","\u0627\u0644\u0644\u064E\u0651\u0647\u064F\u0645\u064E\u0651 \u0625\u0650\u0646\u0650\u0651\u064A \u0623\u064E\u0639\u064F\u0648\u0630\u064F \u0628\u0650\u0643\u064E \u0645\u0650\u0646\u064E \u0627\u0644\u0652\u0647\u064E\u0645\u0650\u0651 \u0648\u064E\u0627\u0644\u0652\u062D\u064E\u0632\u064E\u0646\u0650\u060C \u0648\u064E\u0627\u0644\u0652\u0639\u064E\u062C\u0652\u0632\u0650 \u0648\u064E\u0627\u0644\u0652\u0643\u064E\u0633\u064E\u0644\u0650\u060C \u0648\u064E\u0627\u0644\u0652\u0628\u064F\u062E\u0652\u0644\u0650 \u0648\u064E\u0627\u0644\u0652\u062C\u064F\u0628\u0652\u0646\u0650\u060C \u0648\u064E\u0636\u064E\u0644\u064E\u0639\u0650 \u0627\u0644\u062F\u064E\u0651\u064A\u0652\u0646\u0650 \u0648\u064E\u063A\u064E\u0644\u064E\u0628\u064E\u0629\u0650 \u0627\u0644\u0631\u0650\u0651\u062C\u064E\u0627\u0644\u0650","Ya Allah, aku berlindung dengan-Mu daripada rasa gelisah dan sedih, lemah dan malas, bakhil dan pengecut, bebanan hutang dan dikuasai orang lain.","O Allah, I seek refuge in You from worry and grief, weakness and laziness, miserliness and cowardice, the burden of debt and being overpowered by others.","Riwayat al-Bukhari|Al-Bukhari"],["yunus","Doa Nabi Yunus (ketika susah)","Prophet Yunus' dua (in hardship)","\u0644\u064E\u0627 \u0625\u0650\u0644\u064E\u0670\u0647\u064E \u0625\u0650\u0644\u064E\u0651\u0627 \u0623\u064E\u0646\u0652\u062A\u064E \u0633\u064F\u0628\u0652\u062D\u064E\u0627\u0646\u064E\u0643\u064E \u0625\u0650\u0646\u0650\u0651\u064A \u0643\u064F\u0646\u0652\u062A\u064F \u0645\u0650\u0646\u064E \u0627\u0644\u0638\u064E\u0651\u0627\u0644\u0650\u0645\u0650\u064A\u0646\u064E","Tiada Tuhan melainkan Engkau, Maha Suci Engkau, sesungguhnya aku termasuk orang yang zalim.","There is no god but You, glory be to You; I have indeed been among the wrongdoers.","Al-Anbiya' 21:87"],["hasbunallah","Bertawakal kepada Allah","Relying on Allah","\u062D\u064E\u0633\u0652\u0628\u064F\u0646\u064E\u0627 \u0627\u0644\u0644\u064E\u0651\u0647\u064F \u0648\u064E\u0646\u0650\u0639\u0652\u0645\u064E \u0627\u0644\u0652\u0648\u064E\u0643\u0650\u064A\u0644\u064F","Cukuplah Allah bagi kami, dan Dia sebaik-baik pelindung.","Allah is sufficient for us, and He is the best disposer of affairs.","Ali 'Imran 3:173"],["tetaphati","Tetapkan hati","Keep my heart firm","\u064A\u064E\u0627 \u0645\u064F\u0642\u064E\u0644\u0650\u0651\u0628\u064E \u0627\u0644\u0652\u0642\u064F\u0644\u064F\u0648\u0628\u0650 \u062B\u064E\u0628\u0650\u0651\u062A\u0652 \u0642\u064E\u0644\u0652\u0628\u0650\u064A \u0639\u064E\u0644\u064E\u0649\u0670 \u062F\u0650\u064A\u0646\u0650\u0643\u064E","Wahai Tuhan yang membolak-balikkan hati, tetapkanlah hatiku di atas agama-Mu.","O Turner of hearts, keep my heart firm upon Your religion.","Riwayat at-Tirmizi|At-Tirmidhi"],["marah","Ketika marah","When angry","\u0623\u064E\u0639\u064F\u0648\u0630\u064F \u0628\u0650\u0627\u0644\u0644\u064E\u0651\u0647\u0650 \u0645\u0650\u0646\u064E \u0627\u0644\u0634\u064E\u0651\u064A\u0652\u0637\u064E\u0627\u0646\u0650 \u0627\u0644\u0631\u064E\u0651\u062C\u0650\u064A\u0645\u0650","Aku berlindung dengan Allah daripada syaitan yang direjam.","I seek refuge in Allah from Satan, the accursed.","Riwayat al-Bukhari & Muslim|Al-Bukhari & Muslim"],["sakit","Mendoakan orang sakit","Praying for the sick","\u0627\u0644\u0644\u064E\u0651\u0647\u064F\u0645\u064E\u0651 \u0631\u064E\u0628\u064E\u0651 \u0627\u0644\u0646\u064E\u0651\u0627\u0633\u0650\u060C \u0623\u064E\u0630\u0652\u0647\u0650\u0628\u0650 \u0627\u0644\u0652\u0628\u064E\u0623\u0652\u0633\u064E\u060C \u0627\u0634\u0652\u0641\u0650 \u0623\u064E\u0646\u0652\u062A\u064E \u0627\u0644\u0634\u064E\u0651\u0627\u0641\u0650\u064A\u060C \u0644\u064E\u0627 \u0634\u0650\u0641\u064E\u0627\u0621\u064E \u0625\u0650\u0644\u064E\u0651\u0627 \u0634\u0650\u0641\u064E\u0627\u0624\u064F\u0643\u064E\u060C \u0634\u0650\u0641\u064E\u0627\u0621\u064B \u0644\u064E\u0627 \u064A\u064F\u063A\u064E\u0627\u062F\u0650\u0631\u064F \u0633\u064E\u0642\u064E\u0645\u064B\u0627","Ya Allah, Tuhan sekalian manusia, hilangkanlah penyakit ini. Sembuhkanlah, Engkaulah Yang Maha Menyembuhkan. Tiada kesembuhan melainkan kesembuhan daripada-Mu, kesembuhan yang tidak meninggalkan sebarang penyakit.","O Allah, Lord of mankind, remove the illness and heal, for You are the Healer. There is no healing but Your healing, a healing that leaves no illness behind.","Riwayat al-Bukhari & Muslim|Al-Bukhari & Muslim"],["ziarah","Menziarahi orang sakit","Visiting the sick","\u0644\u064E\u0627 \u0628\u064E\u0623\u0652\u0633\u064E\u060C \u0637\u064E\u0647\u064F\u0648\u0631\u064C \u0625\u0650\u0646\u0652 \u0634\u064E\u0627\u0621\u064E \u0627\u0644\u0644\u064E\u0651\u0647\u064F","Tidak mengapa, (sakit ini) menyucikan (dosa), insya-Allah.","No harm; it is a purification, if Allah wills.","Riwayat al-Bukhari|Al-Bukhari"],["bersin","Bersin & menjawabnya","Sneezing & replying","\u0627\u0644\u0652\u062D\u064E\u0645\u0652\u062F\u064F \u0644\u0650\u0644\u064E\u0651\u0647\u0650 \u30FB \u064A\u064E\u0631\u0652\u062D\u064E\u0645\u064F\u0643\u064E \u0627\u0644\u0644\u064E\u0651\u0647\u064F \u30FB \u064A\u064E\u0647\u0652\u062F\u0650\u064A\u0643\u064F\u0645\u064F \u0627\u0644\u0644\u064E\u0651\u0647\u064F \u0648\u064E\u064A\u064F\u0635\u0652\u0644\u0650\u062D\u064F \u0628\u064E\u0627\u0644\u064E\u0643\u064F\u0645\u0652","Yang bersin: Segala puji bagi Allah. Yang mendengar: Semoga Allah merahmatimu. Yang bersin membalas: Semoga Allah memberi kamu petunjuk dan memperbaiki keadaanmu.","The sneezer: All praise is for Allah. The listener: May Allah have mercy on you. The sneezer replies: May Allah guide you and set your affairs right.","Riwayat al-Bukhari|Al-Bukhari"],["tuanrumah","Untuk tuan rumah (selepas jamuan)","For the host (after a meal)","\u0627\u0644\u0644\u064E\u0651\u0647\u064F\u0645\u064E\u0651 \u0628\u064E\u0627\u0631\u0650\u0643\u0652 \u0644\u064E\u0647\u064F\u0645\u0652 \u0641\u0650\u064A\u0645\u064E\u0627 \u0631\u064E\u0632\u064E\u0642\u0652\u062A\u064E\u0647\u064F\u0645\u0652\u060C \u0648\u064E\u0627\u063A\u0652\u0641\u0650\u0631\u0652 \u0644\u064E\u0647\u064F\u0645\u0652 \u0648\u064E\u0627\u0631\u0652\u062D\u064E\u0645\u0652\u0647\u064F\u0645\u0652","Ya Allah, berkatilah rezeki yang Engkau kurniakan kepada mereka, ampunilah mereka dan rahmatilah mereka.","O Allah, bless them in what You have provided them, forgive them and have mercy on them.","Riwayat Muslim|Muslim"],["pengantin","Ucapan kepada pengantin","For newlyweds","\u0628\u064E\u0627\u0631\u064E\u0643\u064E \u0627\u0644\u0644\u064E\u0651\u0647\u064F \u0644\u064E\u0643\u064E\u060C \u0648\u064E\u0628\u064E\u0627\u0631\u064E\u0643\u064E \u0639\u064E\u0644\u064E\u064A\u0652\u0643\u064E\u060C \u0648\u064E\u062C\u064E\u0645\u064E\u0639\u064E \u0628\u064E\u064A\u0652\u0646\u064E\u0643\u064F\u0645\u064E\u0627 \u0641\u0650\u064A \u062E\u064E\u064A\u0652\u0631\u064D","Semoga Allah memberkatimu, melimpahkan keberkatan ke atasmu, dan menghimpunkan kamu berdua dalam kebaikan.","May Allah bless you, shower blessings upon you, and bring you both together in goodness.","Riwayat Abu Daud & at-Tirmizi|Abu Dawud & At-Tirmidhi"],["zuriat","Untuk pasangan & zuriat","For spouse & children","\u0631\u064E\u0628\u064E\u0651\u0646\u064E\u0627 \u0647\u064E\u0628\u0652 \u0644\u064E\u0646\u064E\u0627 \u0645\u0650\u0646\u0652 \u0623\u064E\u0632\u0652\u0648\u064E\u0627\u062C\u0650\u0646\u064E\u0627 \u0648\u064E\u0630\u064F\u0631\u0650\u0651\u064A\u064E\u0651\u0627\u062A\u0650\u0646\u064E\u0627 \u0642\u064F\u0631\u064E\u0651\u0629\u064E \u0623\u064E\u0639\u0652\u064A\u064F\u0646\u064D \u0648\u064E\u0627\u062C\u0652\u0639\u064E\u0644\u0652\u0646\u064E\u0627 \u0644\u0650\u0644\u0652\u0645\u064F\u062A\u064E\u0651\u0642\u0650\u064A\u0646\u064E \u0625\u0650\u0645\u064E\u0627\u0645\u064B\u0627","Wahai Tuhan kami, kurniakanlah kepada kami daripada pasangan dan zuriat kami penyejuk mata, dan jadikanlah kami ikutan bagi orang bertakwa.","Our Lord, grant us from our spouses and offspring comfort to our eyes, and make us leaders of the righteous.","Al-Furqan 25:74"],["quran","Sebelum membaca Al-Quran","Before reciting the Quran","\u0623\u064E\u0639\u064F\u0648\u0630\u064F \u0628\u0650\u0627\u0644\u0644\u064E\u0651\u0647\u0650 \u0645\u0650\u0646\u064E \u0627\u0644\u0634\u064E\u0651\u064A\u0652\u0637\u064E\u0627\u0646\u0650 \u0627\u0644\u0631\u064E\u0651\u062C\u0650\u064A\u0645\u0650","Aku berlindung dengan Allah daripada syaitan yang direjam.","I seek refuge in Allah from Satan, the accursed."]],solat:[["takbir","Takbiratul ihram","Opening takbir","\u0627\u0644\u0644\u064E\u0651\u0647\u064F \u0623\u064E\u0643\u0652\u0628\u064E\u0631\u064F","Allah Maha Besar.","Allah is the Greatest."],["iftitah","Doa iftitah","Opening supplication","\u0627\u0644\u0644\u064E\u0651\u0647\u064F \u0623\u064E\u0643\u0652\u0628\u064E\u0631\u064F \u0643\u064E\u0628\u0650\u064A\u0631\u064B\u0627\u060C \u0648\u064E\u0627\u0644\u0652\u062D\u064E\u0645\u0652\u062F\u064F \u0644\u0650\u0644\u064E\u0651\u0647\u0650 \u0643\u064E\u062B\u0650\u064A\u0631\u064B\u0627\u060C \u0648\u064E\u0633\u064F\u0628\u0652\u062D\u064E\u0627\u0646\u064E \u0627\u0644\u0644\u064E\u0651\u0647\u0650 \u0628\u064F\u0643\u0652\u0631\u064E\u0629\u064B \u0648\u064E\u0623\u064E\u0635\u0650\u064A\u0644\u064B\u0627. \u0648\u064E\u062C\u064E\u0651\u0647\u0652\u062A\u064F \u0648\u064E\u062C\u0652\u0647\u0650\u064A\u064E \u0644\u0650\u0644\u064E\u0651\u0630\u0650\u064A \u0641\u064E\u0637\u064E\u0631\u064E \u0627\u0644\u0633\u064E\u0651\u0645\u064E\u0627\u0648\u064E\u0627\u062A\u0650 \u0648\u064E\u0627\u0644\u0652\u0623\u064E\u0631\u0652\u0636\u064E \u062D\u064E\u0646\u0650\u064A\u0641\u064B\u0627 \u0645\u064F\u0633\u0652\u0644\u0650\u0645\u064B\u0627 \u0648\u064E\u0645\u064E\u0627 \u0623\u064E\u0646\u064E\u0627 \u0645\u0650\u0646\u064E \u0627\u0644\u0652\u0645\u064F\u0634\u0652\u0631\u0650\u0643\u0650\u064A\u0646\u064E. \u0625\u0650\u0646\u064E\u0651 \u0635\u064E\u0644\u064E\u0627\u062A\u0650\u064A \u0648\u064E\u0646\u064F\u0633\u064F\u0643\u0650\u064A \u0648\u064E\u0645\u064E\u062D\u0652\u064A\u064E\u0627\u064A\u064E \u0648\u064E\u0645\u064E\u0645\u064E\u0627\u062A\u0650\u064A \u0644\u0650\u0644\u064E\u0651\u0647\u0650 \u0631\u064E\u0628\u0650\u0651 \u0627\u0644\u0652\u0639\u064E\u0627\u0644\u064E\u0645\u0650\u064A\u0646\u064E\u060C \u0644\u064E\u0627 \u0634\u064E\u0631\u0650\u064A\u0643\u064E \u0644\u064E\u0647\u064F\u060C \u0648\u064E\u0628\u0650\u0630\u064E\u0670\u0644\u0650\u0643\u064E \u0623\u064F\u0645\u0650\u0631\u0652\u062A\u064F \u0648\u064E\u0623\u064E\u0646\u064E\u0627 \u0645\u0650\u0646\u064E \u0627\u0644\u0652\u0645\u064F\u0633\u0652\u0644\u0650\u0645\u0650\u064A\u0646\u064E","Allah Maha Besar dengan sebesar-besarnya, segala puji bagi Allah sebanyak-banyaknya, dan Maha Suci Allah pagi dan petang. Aku hadapkan wajahku kepada Tuhan yang mencipta langit dan bumi dalam keadaan lurus dan berserah diri, dan aku bukanlah daripada golongan musyrikin. Sesungguhnya solatku, ibadahku, hidupku dan matiku hanya untuk Allah Tuhan sekalian alam. Tiada sekutu bagi-Nya; dengan itu aku diperintahkan, dan aku daripada golongan Muslimin.","Allah is the Greatest, truly great; much praise is for Allah; glory be to Allah morning and evening. I have turned my face to the One who created the heavens and the earth, upright and submitting, and I am not of those who associate others with Him. My prayer, my worship, my living and my dying are for Allah, Lord of the worlds. He has no partner; this I have been commanded, and I am of the Muslims."],["rukuk","Rukuk","Bowing (ruku')","\u0633\u064F\u0628\u0652\u062D\u064E\u0627\u0646\u064E \u0631\u064E\u0628\u0650\u0651\u064A\u064E \u0627\u0644\u0652\u0639\u064E\u0638\u0650\u064A\u0645\u0650 \u0648\u064E\u0628\u0650\u062D\u064E\u0645\u0652\u062F\u0650\u0647\u0650","Maha Suci Tuhanku Yang Maha Agung dan dengan memuji-Nya.","Glory be to my Lord, the Most Great, and with His praise.","",3],["iktidal","Iktidal","Rising from bowing","\u0633\u064E\u0645\u0650\u0639\u064E \u0627\u0644\u0644\u064E\u0651\u0647\u064F \u0644\u0650\u0645\u064E\u0646\u0652 \u062D\u064E\u0645\u0650\u062F\u064E\u0647\u064F\u060C \u0631\u064E\u0628\u064E\u0651\u0646\u064E\u0627 \u0644\u064E\u0643\u064E \u0627\u0644\u0652\u062D\u064E\u0645\u0652\u062F\u064F \u0645\u0650\u0644\u0652\u0621\u064E \u0627\u0644\u0633\u064E\u0651\u0645\u064E\u0627\u0648\u064E\u0627\u062A\u0650 \u0648\u064E\u0645\u0650\u0644\u0652\u0621\u064E \u0627\u0644\u0652\u0623\u064E\u0631\u0652\u0636\u0650 \u0648\u064E\u0645\u0650\u0644\u0652\u0621\u064E \u0645\u064E\u0627 \u0634\u0650\u0626\u0652\u062A\u064E \u0645\u0650\u0646\u0652 \u0634\u064E\u064A\u0652\u0621\u064D \u0628\u064E\u0639\u0652\u062F\u064F","Allah mendengar orang yang memuji-Nya. Wahai Tuhan kami, bagi-Mu segala pujian sepenuh langit, sepenuh bumi dan sepenuh apa jua yang Engkau kehendaki selepas itu.","Allah hears the one who praises Him. Our Lord, to You is all praise, filling the heavens, filling the earth, and filling whatever else You will."],["sujud","Sujud","Prostration (sujud)","\u0633\u064F\u0628\u0652\u062D\u064E\u0627\u0646\u064E \u0631\u064E\u0628\u0650\u0651\u064A\u064E \u0627\u0644\u0652\u0623\u064E\u0639\u0652\u0644\u064E\u0649\u0670 \u0648\u064E\u0628\u0650\u062D\u064E\u0645\u0652\u062F\u0650\u0647\u0650","Maha Suci Tuhanku Yang Maha Tinggi dan dengan memuji-Nya.","Glory be to my Lord, the Most High, and with His praise.","",3],["duduk","Duduk antara dua sujud","Sitting between the two prostrations","\u0631\u064E\u0628\u0650\u0651 \u0627\u063A\u0652\u0641\u0650\u0631\u0652 \u0644\u0650\u064A \u0648\u064E\u0627\u0631\u0652\u062D\u064E\u0645\u0652\u0646\u0650\u064A \u0648\u064E\u0627\u062C\u0652\u0628\u064F\u0631\u0652\u0646\u0650\u064A \u0648\u064E\u0627\u0631\u0652\u0641\u064E\u0639\u0652\u0646\u0650\u064A \u0648\u064E\u0627\u0631\u0652\u0632\u064F\u0642\u0652\u0646\u0650\u064A \u0648\u064E\u0627\u0647\u0652\u062F\u0650\u0646\u0650\u064A \u0648\u064E\u0639\u064E\u0627\u0641\u0650\u0646\u0650\u064A \u0648\u064E\u0627\u0639\u0652\u0641\u064F \u0639\u064E\u0646\u0650\u0651\u064A","Wahai Tuhanku, ampunilah aku, rahmatilah aku, cukupkanlah kekuranganku, angkatlah darjatku, berilah aku rezeki, berilah aku petunjuk, sihatkanlah aku dan maafkanlah aku.","My Lord, forgive me, have mercy on me, mend me, raise me, provide for me, guide me, grant me well-being and pardon me."],["tahiyat","Tahiyat","Tashahhud","\u0627\u0644\u062A\u064E\u0651\u062D\u0650\u064A\u064E\u0651\u0627\u062A\u064F \u0627\u0644\u0652\u0645\u064F\u0628\u064E\u0627\u0631\u064E\u0643\u064E\u0627\u062A\u064F \u0627\u0644\u0635\u064E\u0651\u0644\u064E\u0648\u064E\u0627\u062A\u064F \u0627\u0644\u0637\u064E\u0651\u064A\u0650\u0651\u0628\u064E\u0627\u062A\u064F \u0644\u0650\u0644\u064E\u0651\u0647\u0650\u060C \u0627\u0644\u0633\u064E\u0651\u0644\u064E\u0627\u0645\u064F \u0639\u064E\u0644\u064E\u064A\u0652\u0643\u064E \u0623\u064E\u064A\u064F\u0651\u0647\u064E\u0627 \u0627\u0644\u0646\u064E\u0651\u0628\u0650\u064A\u064F\u0651 \u0648\u064E\u0631\u064E\u062D\u0652\u0645\u064E\u0629\u064F \u0627\u0644\u0644\u064E\u0651\u0647\u0650 \u0648\u064E\u0628\u064E\u0631\u064E\u0643\u064E\u0627\u062A\u064F\u0647\u064F\u060C \u0627\u0644\u0633\u064E\u0651\u0644\u064E\u0627\u0645\u064F \u0639\u064E\u0644\u064E\u064A\u0652\u0646\u064E\u0627 \u0648\u064E\u0639\u064E\u0644\u064E\u0649\u0670 \u0639\u0650\u0628\u064E\u0627\u062F\u0650 \u0627\u0644\u0644\u064E\u0651\u0647\u0650 \u0627\u0644\u0635\u064E\u0651\u0627\u0644\u0650\u062D\u0650\u064A\u0646\u064E\u060C \u0623\u064E\u0634\u0652\u0647\u064E\u062F\u064F \u0623\u064E\u0646\u0652 \u0644\u064E\u0627 \u0625\u0650\u0644\u064E\u0670\u0647\u064E \u0625\u0650\u0644\u064E\u0651\u0627 \u0627\u0644\u0644\u064E\u0651\u0647\u064F\u060C \u0648\u064E\u0623\u064E\u0634\u0652\u0647\u064E\u062F\u064F \u0623\u064E\u0646\u064E\u0651 \u0645\u064F\u062D\u064E\u0645\u064E\u0651\u062F\u064B\u0627 \u0631\u064E\u0633\u064F\u0648\u0644\u064F \u0627\u0644\u0644\u064E\u0651\u0647\u0650","Segala penghormatan, keberkatan, selawat dan kebaikan adalah bagi Allah. Salam sejahtera ke atasmu wahai Nabi, serta rahmat Allah dan keberkatan-Nya. Salam sejahtera ke atas kami dan ke atas hamba-hamba Allah yang soleh. Aku bersaksi bahawa tiada Tuhan melainkan Allah, dan aku bersaksi bahawa Muhammad itu pesuruh Allah.","All greetings, blessings, prayers and good things are for Allah. Peace be upon you, O Prophet, and the mercy of Allah and His blessings. Peace be upon us and upon the righteous servants of Allah. I bear witness that there is no god but Allah, and I bear witness that Muhammad is the Messenger of Allah."],["selawat","Selawat (tahiyat akhir)","Salawat (final sitting)","\u0627\u0644\u0644\u064E\u0651\u0647\u064F\u0645\u064E\u0651 \u0635\u064E\u0644\u0650\u0651 \u0639\u064E\u0644\u064E\u0649\u0670 \u0645\u064F\u062D\u064E\u0645\u064E\u0651\u062F\u064D \u0648\u064E\u0639\u064E\u0644\u064E\u0649\u0670 \u0622\u0644\u0650 \u0645\u064F\u062D\u064E\u0645\u064E\u0651\u062F\u064D\u060C \u0643\u064E\u0645\u064E\u0627 \u0635\u064E\u0644\u064E\u0651\u064A\u0652\u062A\u064E \u0639\u064E\u0644\u064E\u0649\u0670 \u0625\u0650\u0628\u0652\u0631\u064E\u0627\u0647\u0650\u064A\u0645\u064E \u0648\u064E\u0639\u064E\u0644\u064E\u0649\u0670 \u0622\u0644\u0650 \u0625\u0650\u0628\u0652\u0631\u064E\u0627\u0647\u0650\u064A\u0645\u064E\u060C \u0648\u064E\u0628\u064E\u0627\u0631\u0650\u0643\u0652 \u0639\u064E\u0644\u064E\u0649\u0670 \u0645\u064F\u062D\u064E\u0645\u064E\u0651\u062F\u064D \u0648\u064E\u0639\u064E\u0644\u064E\u0649\u0670 \u0622\u0644\u0650 \u0645\u064F\u062D\u064E\u0645\u064E\u0651\u062F\u064D\u060C \u0643\u064E\u0645\u064E\u0627 \u0628\u064E\u0627\u0631\u064E\u0643\u0652\u062A\u064E \u0639\u064E\u0644\u064E\u0649\u0670 \u0625\u0650\u0628\u0652\u0631\u064E\u0627\u0647\u0650\u064A\u0645\u064E \u0648\u064E\u0639\u064E\u0644\u064E\u0649\u0670 \u0622\u0644\u0650 \u0625\u0650\u0628\u0652\u0631\u064E\u0627\u0647\u0650\u064A\u0645\u064E\u060C \u0641\u0650\u064A \u0627\u0644\u0652\u0639\u064E\u0627\u0644\u064E\u0645\u0650\u064A\u0646\u064E \u0625\u0650\u0646\u064E\u0651\u0643\u064E \u062D\u064E\u0645\u0650\u064A\u062F\u064C \u0645\u064E\u062C\u0650\u064A\u062F\u064C","Ya Allah, limpahkanlah selawat ke atas Muhammad dan keluarga Muhammad, sebagaimana Engkau limpahkan ke atas Ibrahim dan keluarga Ibrahim. Berkatilah Muhammad dan keluarga Muhammad, sebagaimana Engkau berkati Ibrahim dan keluarga Ibrahim. Di seluruh alam, sesungguhnya Engkau Maha Terpuji lagi Maha Mulia.","O Allah, send prayers upon Muhammad and the family of Muhammad as You sent prayers upon Ibrahim and the family of Ibrahim, and bless Muhammad and the family of Muhammad as You blessed Ibrahim and the family of Ibrahim. In all the worlds, You are Praiseworthy and Glorious."],["salam","Salam","Closing salam","\u0627\u0644\u0633\u064E\u0651\u0644\u064E\u0627\u0645\u064F \u0639\u064E\u0644\u064E\u064A\u0652\u0643\u064F\u0645\u0652 \u0648\u064E\u0631\u064E\u062D\u0652\u0645\u064E\u0629\u064F \u0627\u0644\u0644\u064E\u0651\u0647\u0650","Salam sejahtera ke atas kamu dan rahmat Allah.","Peace be upon you and the mercy of Allah.","",2]],selepas:[["istighfar","Istighfar","Seeking forgiveness","\u0623\u064E\u0633\u0652\u062A\u064E\u063A\u0652\u0641\u0650\u0631\u064F \u0627\u0644\u0644\u064E\u0651\u0647\u064E","Aku memohon keampunan Allah.","I seek Allah's forgiveness.","",3],["assalam","Allahumma antas-salam","Allahumma antas-salam","\u0627\u0644\u0644\u064E\u0651\u0647\u064F\u0645\u064E\u0651 \u0623\u064E\u0646\u0652\u062A\u064E \u0627\u0644\u0633\u064E\u0651\u0644\u064E\u0627\u0645\u064F \u0648\u064E\u0645\u0650\u0646\u0652\u0643\u064E \u0627\u0644\u0633\u064E\u0651\u0644\u064E\u0627\u0645\u064F\u060C \u062A\u064E\u0628\u064E\u0627\u0631\u064E\u0643\u0652\u062A\u064E \u064A\u064E\u0627 \u0630\u064E\u0627 \u0627\u0644\u0652\u062C\u064E\u0644\u064E\u0627\u0644\u0650 \u0648\u064E\u0627\u0644\u0652\u0625\u0650\u0643\u0652\u0631\u064E\u0627\u0645\u0650","Ya Allah, Engkaulah As-Salam dan daripada-Mu kesejahteraan. Maha Berkat Engkau wahai Tuhan yang memiliki keagungan dan kemuliaan.","O Allah, You are Peace and from You is peace. Blessed are You, O Owner of majesty and honour."],["lamani","Tiada penghalang pemberian-Mu","None can withhold what You give","\u0644\u064E\u0627 \u0625\u0650\u0644\u064E\u0670\u0647\u064E \u0625\u0650\u0644\u064E\u0651\u0627 \u0627\u0644\u0644\u064E\u0651\u0647\u064F \u0648\u064E\u062D\u0652\u062F\u064E\u0647\u064F \u0644\u064E\u0627 \u0634\u064E\u0631\u0650\u064A\u0643\u064E \u0644\u064E\u0647\u064F\u060C \u0644\u064E\u0647\u064F \u0627\u0644\u0652\u0645\u064F\u0644\u0652\u0643\u064F \u0648\u064E\u0644\u064E\u0647\u064F \u0627\u0644\u0652\u062D\u064E\u0645\u0652\u062F\u064F \u0648\u064E\u0647\u064F\u0648\u064E \u0639\u064E\u0644\u064E\u0649\u0670 \u0643\u064F\u0644\u0650\u0651 \u0634\u064E\u064A\u0652\u0621\u064D \u0642\u064E\u062F\u0650\u064A\u0631\u064C\u060C \u0627\u0644\u0644\u064E\u0651\u0647\u064F\u0645\u064E\u0651 \u0644\u064E\u0627 \u0645\u064E\u0627\u0646\u0650\u0639\u064E \u0644\u0650\u0645\u064E\u0627 \u0623\u064E\u0639\u0652\u0637\u064E\u064A\u0652\u062A\u064E\u060C \u0648\u064E\u0644\u064E\u0627 \u0645\u064F\u0639\u0652\u0637\u0650\u064A\u064E \u0644\u0650\u0645\u064E\u0627 \u0645\u064E\u0646\u064E\u0639\u0652\u062A\u064E\u060C \u0648\u064E\u0644\u064E\u0627 \u064A\u064E\u0646\u0652\u0641\u064E\u0639\u064F \u0630\u064E\u0627 \u0627\u0644\u0652\u062C\u064E\u062F\u0650\u0651 \u0645\u0650\u0646\u0652\u0643\u064E \u0627\u0644\u0652\u062C\u064E\u062F\u064F\u0651","Tiada Tuhan melainkan Allah, Yang Esa, tiada sekutu bagi-Nya. Bagi-Nya kerajaan dan segala pujian, dan Dia Maha Berkuasa atas segala sesuatu. Ya Allah, tiada yang dapat menghalang apa yang Engkau berikan, tiada yang dapat memberi apa yang Engkau halang, dan kekayaan tidak memberi manfaat kepada pemiliknya di sisi-Mu.","There is no god but Allah alone, with no partner. His is the dominion and His is the praise, and He has power over all things. O Allah, none can withhold what You give, none can give what You withhold, and the wealth of the wealthy cannot avail him against You."],["kursi","Ayat Kursi","Ayat al-Kursi","\u0671\u0644\u0644\u0651\u064E\u0647\u064F \u0644\u064E\u0627\u0653 \u0625\u0650\u0644\u064E\u0670\u0647\u064E \u0625\u0650\u0644\u0651\u064E\u0627 \u0647\u064F\u0648\u064E \u0671\u0644\u0652\u062D\u064E\u0649\u0651\u064F \u0671\u0644\u0652\u0642\u064E\u064A\u0651\u064F\u0648\u0645\u064F \u0644\u064E\u0627 \u062A\u064E\u0623\u0652\u062E\u064F\u0630\u064F\u0647\u064F\u06E5 \u0633\u0650\u0646\u064E\u0629\u064C \u0648\u064E\u0644\u064E\u0627 \u0646\u064E\u0648\u0652\u0645\u064C \u0644\u0651\u064E\u0647\u064F\u06E5 \u0645\u064E\u0627 \u0641 0652 \u0648\u064E\u0623\u064E\u0639\u0652\u0645\u064E\u0627\u0644\u0650\u0643\u064F\u0645\u0652","Sesungguhnya Allah tidak melihat kepada rupa dan harta kamu, tetapi Dia melihat kepada hati dan amalan kamu.","Allah does not look at your appearance or your wealth, but He looks at your hearts and your deeds.","Riwayat Muslim","Muslim"],["kasih","akhlak","\u0644\u064E\u0627 \u064A\u064F\u0624\u0652\u0645\u0650\u0646\u064F \u0623\u064E\u062D\u064E\u062F\u064F\u0643\u064F\u0645\u0652 \u062D\u064E\u062A\u064E\u0651\u0649\u0670 \u064A\u064F\u062D\u0650\u0628\u064E\u0651 \u0644\u0650\u0623\u064E\u062E\u0650\u064A\u0647\u0650 \u0645\u064E\u0627 \u064A\u064F\u062D\u0650\u0628\u064F\u0651 \u0644\u0650\u0646\u064E\u0641\u0652\u0633\u0650\u0647\u0650","Tidak sempurna iman seseorang daripada kamu sehingga dia mengasihi saudaranya sebagaimana dia mengasihi dirinya sendiri.","None of you truly believes until he loves for his brother what he loves for himself.","Riwayat al-Bukhari & Muslim","Al-Bukhari & Muslim"],["katabaik","akhlak","\u0645\u064E\u0646\u0652 \u0643\u064E\u0627\u0646\u064E \u064A\u064F\u0624\u0652\u0645\u0650\u0646\u064F \u0628\u0650\u0627\u0644\u0644\u064E\u0651\u0647\u0650 \u0648\u064E\u0627\u0644\u0652\u064A\u064E\u0648\u0652\u0645\u0650 \u0627\u0644\u0652\u0622\u062E\u0650\u0631\u0650 \u0641\u064E\u0644\u0652\u064A\u064E\u0642\u064F\u0644\u0652 \u062E\u064E\u064A\u0652\u0631\u064B\u0627 \u0623\u064E\u0648\u0652 \u0644\u0650\u064A\u064E\u0635\u0652\u0645\u064F\u062A\u0652","Sesiapa yang beriman kepada Allah dan hari akhirat, hendaklah dia berkata yang baik atau diam.","Whoever believes in Allah and the Last Day, let him speak good or keep silent.","Riwayat al-Bukhari & Muslim","Al-Bukhari & Muslim"],["marah","akhlak","\u0644\u064E\u0627 \u062A\u064E\u063A\u0652\u0636\u064E\u0628\u0652","Jangan marah.","Do not get angry.","Riwayat al-Bukhari","Al-Bukhari"],["senyum","akhlak","\u062A\u064E\u0628\u064E\u0633\u064F\u0651\u0645\u064F\u0643\u064E \u0641\u0650\u064A \u0648\u064E\u062C\u0652\u0647\u0650 \u0623\u064E\u062E\u0650\u064A\u0643\u064E \u0644\u064E\u0643\u064E \u0635\u064E\u062F\u064E\u0642\u064E\u0629\u064C","Senyumanmu di hadapan saudaramu adalah sedekah.","Your smile in the face of your brother is charity.","Riwayat at-Tirmizi","At-Tirmidhi"],["kalimah","akhlak","\u0627\u0644\u0652\u0643\u064E\u0644\u0650\u0645\u064E\u0629\u064F \u0627\u0644\u0637\u064E\u0651\u064A\u0650\u0651\u0628\u064E\u0629\u064F \u0635\u064E\u062F\u064E\u0642\u064E\u0629\u064C","Kata-kata yang baik itu sedekah.","A good word is charity.","Riwayat al-Bukhari & Muslim","Al-Bukhari & Muslim"],["muslim","akhlak","\u0627\u0644\u0652\u0645\u064F\u0633\u0652\u0644\u0650\u0645\u064F \u0645\u064E\u0646\u0652 \u0633\u064E\u0644\u0650\u0645\u064E \u0627\u0644\u0652\u0645\u064F\u0633\u0652\u0644\u0650\u0645\u064F\u0648\u0646\u064E \u0645\u0650\u0646\u0652 \u0644\u0650\u0633\u064E\u0627\u0646\u0650\u0647\u0650 \u0648\u064E\u064A\u064E\u062F\u0650\u0647\u0650","Seorang Muslim ialah orang yang Muslim lain selamat daripada (gangguan) lidah dan tangannya.","A Muslim is one from whose tongue and hand other Muslims are safe.","Riwayat al-Bukhari & Muslim","Al-Bukhari & Muslim"],["takwa","akhlak","\u0627\u062A\u064E\u0651\u0642\u0650 \u0627\u0644\u0644\u064E\u0651\u0647\u064E \u062D\u064E\u064A\u0652\u062B\u064F\u0645\u064E\u0627 \u0643\u064F\u0646\u0652\u062A\u064E\u060C \u0648\u064E\u0623\u064E\u062A\u0652\u0628\u0650\u0639\u0650 \u0627\u0644\u0633\u064E\u0651\u064A\u0650\u0651\u0626\u064E\u0629\u064E \u0627\u0644\u0652\u062D\u064E\u0633\u064E\u0646\u064E\u0629\u064E \u062A\u064E\u0645\u0652\u062D\u064F\u0647\u064E\u0627\u060C \u0648\u064E\u062E\u064E\u0627\u0644\u0650\u0642\u0650 \u0627\u0644\u0646\u064E\u0651\u0627\u0633\u064E \u0628\u0650\u062E\u064F\u0644\u064F\u0642\u064D \u062D\u064E\u0633\u064E\u0646\u064D","Bertakwalah kepada Allah di mana sahaja kamu berada, ikutilah keburukan dengan kebaikan nescaya ia menghapuskannya, dan bergaullah dengan manusia dengan akhlak yang baik.","Fear Allah wherever you are, follow a bad deed with a good one and it will erase it, and treat people with good character.","Riwayat at-Tirmizi","At-Tirmidhi"],["taksia","akhlak","\u0645\u0650\u0646\u0652 \u062D\u064F\u0633\u0652\u0646\u0650 \u0625\u0650\u0633\u0652\u0644\u064E\u0627\u0645\u0650 \u0627\u0644\u0652\u0645\u064E\u0631\u0652\u0621\u0650 \u062A\u064E\u0631\u0652\u0643\u064F\u0647\u064F \u0645\u064E\u0627 \u0644\u064E\u0627 \u064A\u064E\u0639\u0652\u0646\u0650\u064A\u0647\u0650","Antara tanda baiknya Islam seseorang ialah dia meninggalkan perkara yang tidak berfaedah baginya.","Part of a person's good Islam is leaving what does not concern him.","Riwayat at-Tirmizi","At-Tirmidhi"],["nasihat","akhlak","\u0627\u0644\u062F\u0650\u0651\u064A\u0646\u064F \u0627\u0644\u0646\u064E\u0651\u0635\u0650\u064A\u062D\u064E\u0629\u064F","Agama itu nasihat.","The religion is sincere advice.","Riwayat Muslim","Muslim"]],QMARKS=[["mim","waqf","\u0640\u06D8","Mim (waqaf lazim)","Mim (compulsory stop)","Mesti berhenti. Jika diteruskan, maksud ayat boleh berubah.","Must stop here. Carrying on can change the meaning.",[36,76,"\u0641\u064E\u0644\u064E\u0627 \u064A\u064E\u062D\u0652\u0632\u064F\u0646\u0643\u064E \u0642\u064E\u0648\u0652\u0644\u064F\u0647\u064F\u0645\u0652 \u06D8 \u0625\u0650\u0646\u064E\u0651\u0627 \u0646\u064E\u0639\u0652\u0644\u064E\u0645\u064F"]],["la","waqf","\u0640\u06D9","L\u0101 (jangan berhenti)","L\u0101 (do not stop)","Jangan berhenti di sini. Jika terberhenti, ulang dari kalimah sebelumnya.","Do not stop here. If you do, go back and repeat the previous word.",[16,32,"\u0671\u0644\u0652\u0645\u064E\u0644\u064E\u0670\u0653\u0626\u0650\u0643\u064E\u0629\u064F \u0637\u064E\u064A\u0650\u0651\u0628\u0650\u064A\u0646\u064E \u06D9 \u064A\u064E\u0642\u064F\u0648\u0644\u064F\u0648\u0646\u064E"]],["jim","waqf","\u0640\u06DA","Jim (waqaf jaiz)","J\u012Bm (stop or go)","Boleh berhenti atau teruskan; kedua-duanya sama baik.","You may stop or ca
